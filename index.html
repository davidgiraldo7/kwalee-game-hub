<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1a1a1a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Kwalee Game Hub</title>
<meta name="referrer" content="strict-origin-when-cross-origin" />
<!-- Hub UI is hosted on GameVault. Mini games + catalog live on GitHub Pages. -->
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="assets/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face {
    font-family: Inter;
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("assets/fonts/inter-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: Inter;
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("assets/fonts/inter-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: Unbounded;
    font-style: normal;
    font-weight: 200 900;
    font-display: swap;
    src: url("assets/fonts/unbounded-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: Unbounded;
    font-style: normal;
    font-weight: 200 900;
    font-display: swap;
    src: url("assets/fonts/unbounded-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  /* Palette sampled from kwalee.com: brand yellow #FFCB05 on near-black
     #1A1A1A, with the site's blue, teal and mint as secondary accents. */
  :root {
    --bg: #1a1a1a;
    --surface: #262626;
    --surface-2: #323232;
    --surface-3: #3d3d3d;
    --line: #424242;
    --text: #fbfbfb;
    --text-2: #cecece;
    --text-3: #8a8a8a;
    --accent: #ffcb05;
    --on-accent: #1e1505;
    --accent-soft: #ffe27a;
    --good: #05bb8c;
    --bad: #ff5a5a;
    --blue: #2a4eef;
    --blue-deep: #1032cf;
    --mint: #9ff0db;
    --teal: #038160;
    --radius: 18px;

    --font-display: Unbounded, "Arial Black", ui-rounded, "SF Pro Rounded",
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-body: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.45;
    overscroll-behavior-y: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(251, 251, 251, .18) transparent;
  }

  html::-webkit-scrollbar,
  body::-webkit-scrollbar {
    width: 4px;
    height: 4px;
  }
  html::-webkit-scrollbar-track,
  body::-webkit-scrollbar-track { background: transparent; }
  html::-webkit-scrollbar-thumb,
  body::-webkit-scrollbar-thumb {
    background: rgba(251, 251, 251, .18);
    border-radius: 99px;
  }
  html::-webkit-scrollbar-thumb:hover,
  body::-webkit-scrollbar-thumb:hover { background: rgba(251, 251, 251, .32); }

  body { min-height: 100vh; min-height: 100dvh; }

  #app {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 92px);
    background: var(--bg);
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 800;
    margin: 0;
  }

  /* Unbounded runs roughly 40% wider than a system sans at the same size,
     so the display scale is tuned down to keep headings on one or two lines. */
  h1, h2, h3 { font-family: var(--font-display); }
  h1 { font-size: 24px; line-height: 1.14; margin: 5px 0 0; letter-spacing: -0.03em; }
  h2 { font-size: 15px; margin: 0; letter-spacing: -0.02em; }
  h3 { font-size: 15px; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; }

  .sub { color: var(--text-2); font-size: 13px; }
  .muted { color: var(--text-3); font-size: 12px; }

  .section { margin-top: 28px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .section-head h2 { color: var(--text); font-size: 19px; font-weight: 850; }
  .section-head h2::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px; margin-right: 8px;
    border-radius: 2px;
    background: var(--accent);
    transform: rotate(12deg);
    vertical-align: 1px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }
  .card + .card { margin-top: 8px; }
  .card.featured {
    border: 2px solid var(--accent);
    background: rgba(38, 38, 38, .92);
    padding: 0; overflow: hidden;
    border-radius: 22px;
    position: relative;
  }

  .featured-ribbon {
    position: absolute; top: 12px; right: 12px; z-index: 3;
    padding: 5px 9px;
    border-radius: 999px;
    background: var(--accent); color: var(--on-accent);
    font-size: 10px; font-weight: 900; letter-spacing: .08em;
    text-transform: uppercase;
  }

  .card-top { display: flex; align-items: center; gap: 10px; }
  .card-top h3 { flex: 1; min-width: 0; }

  .pill {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 750;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text-2);
    background: transparent;
  }
  .pill.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .stats { display: flex; gap: 18px; align-items: flex-end; }
  .stat-v { font-size: 21px; font-weight: 850; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
  .stat-v.good { color: var(--good); }
  .stat-v.bad { color: var(--bad); }
  .stat-v.info { color: var(--accent); }
  .stat-l { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }

  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }

  button {
    font: inherit;
    color: inherit;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button[disabled] { opacity: 0.45; cursor: default; transform: none; }

  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.ghost { background: transparent; border-color: transparent; color: var(--text-2); padding-left: 0; }
  button.block { width: 100%; padding: 13px; font-size: 15px; }

  .rank {
    width: 28px; height: 28px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: var(--surface-3);
    border: 1px solid var(--line);
    font-size: 13px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .topbar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
    padding: 8px 10px;
    background: rgba(26, 26, 26, .78);
    border: 1px solid var(--line);
    border-radius: 18px;
  }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 50%;
    display: block; padding: 0; overflow: hidden; flex-shrink: 0;
    background: #fff4dc; border: 2px solid var(--accent);
  }
  .brand-mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
  button.brand-mark:active { transform: scale(.96); }
  .brand-copy { flex: 1; min-width: 0; }
  .brand-name {
    display: block; width: 100%;
    margin: 0; padding: 0 2px;
    border: 0; border-radius: 6px;
    background: transparent; color: inherit;
    font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 16px;
    letter-spacing: -0.02em; line-height: 1.2;
    cursor: text;
  }
  .brand-name:focus {
    outline: none;
    background: rgba(255, 203, 5, .14);
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .player-level { color: var(--text-3); font-size: 11px; font-weight: 700; }
  .coin-bank {
    position: relative;
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px; border: 1.5px solid var(--accent);
    border-radius: 999px; background: #2a2208;
    color: var(--accent); font-weight: 850; font-size: 13px;
  }
  .coin-bank.is-spending { animation: reward-chrome-pop .45s ease; }
  .coin-spend {
    position: absolute; right: 8px; top: -14px;
    color: #ff5a5a; font-size: 12px; font-weight: 850;
    pointer-events: none;
    animation: coin-spend-up .7s ease forwards;
  }
  @keyframes coin-spend-up {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-12px); }
  }
  .coin-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 2px solid var(--accent-soft); }

  .hero-copy { max-width: 330px; }
  .hero-copy h1 { text-shadow: 0 2px 16px rgba(26,26,26,.95); }
  .hero-copy .sub { margin-top: 10px; line-height: 1.5; text-shadow: 0 1px 10px rgba(26,26,26,.9); }

  .player-progress {
    margin-top: 18px; display: flex; align-items: center; gap: 10px;
    padding: 11px 12px;
    background: rgba(42, 78, 239, .22);
    border: 1.5px solid #4d6bf5;
    border-radius: 16px;
  }
  .level-badge {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: var(--blue); display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 800; color: #fff;
  }
  .progress-copy { flex: 1; min-width: 0; }
  .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-2); font-weight: 700; margin-bottom: 6px; }
  .progress-track { height: 6px; border-radius: 99px; background: #141414; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); }

  .game-art { position: relative; overflow: hidden; background: var(--game); }
  .game-art svg, .game-art img { width: 100%; height: 100%; display: block; }
  .game-art img { object-fit: cover; object-position: center center; }
  .game-art.hero-art { height: 190px; }
  .game-art.tile-art { height: 112px; }
  .game-art.trend-art { height: 108px; border-radius: 15px 15px 0 0; }

  .game-frame {
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 0;
    background: var(--game, #141414);
    display: block;
  }

  .tap-rush { --game: #ffcb05; }
  .reaction-lab { --game: #05bb8c; }
  .snake-sprint { --game: #2a4eef; }
  .bubble-pop { --game: #9ff0db; }
  .memory-match { --game: #1c1c1c; }
  .orbit-dodge { --game: #1032cf; }
  .star-tap { --game: #ffcb05; }
  .hexiword { --game: #38bdf8; }
  .stretch-block { --game: #7c3aed; }
  .grid-filler { --game: #1d4ed8; }
  .pixel-blocks { --game: #38bdf8; }
  .link-flow { --game: #34d399; }
  .blade-flow { --game: #818cf8; }
  .colour-smash { --game: #fb7185; }
  .sausage-sort { --game: #fb7185; }
  .aqua-block-jam { --game: #22d3ee; }
  .claw-sort { --game: #fb923c; }
  .flock-feast { --game: #4ade80; }
  .game-frame.hexiword { background: #38bdf8; }

  .featured-body { padding: 16px; background: rgba(26,26,26,.55); }
  .featured-kicker { display: flex; align-items: center; gap: 7px; color: var(--accent); font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
  .featured-kicker::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .featured-title { display: flex; align-items: flex-start; gap: 8px; margin-top: 7px; }
  .featured-title h3 { font-size: 19px; font-weight: 800; flex: 1; }
  .featured-tagline { color: var(--text-2); font-size: 13px; margin-top: 5px; }
  .featured-actions { display: flex; align-items: center; gap: 14px; margin-top: 15px; }
  .featured-actions button { margin-left: auto; padding: 11px 18px; min-width: 108px; border-radius: 14px; }

  .trending-strip {
    display: grid; grid-auto-flow: column; grid-auto-columns: 152px;
    gap: 10px; overflow-x: auto; padding: 0 1px 6px;
    scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .trending-strip::-webkit-scrollbar { display: none; }
  .trend-card {
    position: relative; scroll-snap-align: start;
    background: rgba(38, 38, 38, .9);
    border: 2px solid color-mix(in srgb, var(--game) 70%, #424242);
    border-radius: 16px; overflow: hidden; cursor: pointer;
  }
  .trend-card:active { transform: scale(.98); }
  .trend-info { padding: 10px; }
  .trend-info strong { display: block; font-size: 14px; }
  .trend-meta { color: var(--text-3); font-size: 10px; margin-top: 2px; }
  .trend-rank {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    width: 26px; height: 26px; border-radius: 9px;
    display: grid; place-items: center; background: var(--accent);
    color: var(--on-accent); font-weight: 950; font-size: 12px;
    border: 0;
  }

  .game-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .game-tile {
    min-width: 0;
    background: rgba(38, 38, 38, .9);
    border: 2px solid color-mix(in srgb, var(--game) 70%, #424242);
    border-radius: 17px; overflow: hidden; cursor: pointer;
  }
  .game-tile:active { transform: scale(.98); }
  .tile-info { padding: 11px; }
  .tile-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; color: var(--text-3); font-size: 10px; }
  .mini-play {
    width: 25px; height: 25px; padding: 0; border: 0; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: var(--on-accent);
    font-size: 10px;
  }

  .bottom-nav {
    position: fixed; z-index: 10; left: 50%; bottom: 10px;
    transform: translateX(-50%); width: calc(100% - 24px); max-width: 416px;
    padding: 6px; display: grid; grid-template-columns: repeat(3, 1fr);
    background: rgba(18, 18, 18, .94);
    border: 2px solid var(--accent); border-radius: 20px;
  }
  .nav-item {
    border: 0; background: transparent; padding: 8px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--text-2); font-size: 10px; font-weight: 750;
  }
  .nav-item svg { width: 20px; height: 20px; }
  .nav-item.active {
    color: var(--on-accent);
    background: var(--accent);
    border-radius: 14px;
  }

  .shop-hero { margin-bottom: 8px; }
  .shop-hero .sub { margin-top: 8px; line-height: 1.5; }
  .shop-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .shop-item {
    min-width: 0; padding: 14px 12px 12px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px;
    container-type: inline-size;
  }
  .shop-item.is-equipped { border-color: var(--accent); }
  .shop-icon-art {
    height: 84px; margin-bottom: 8px;
    display: grid; place-items: center;
  }
  .shop-icon-art img { width: 72px; height: 72px; display: block; border-radius: 50%; object-fit: cover; }
  .shop-item h3 { font-size: 13px; }
  .shop-item p { color: var(--text-3); font-size: 11px; margin-top: 3px; line-height: 1.4; }
  .shop-grid .shop-item { display: flex; flex-direction: column; }
  .shop-item-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; gap: 8px; min-width: 0;
  }
  .shop-grid .shop-item-row {
    flex-direction: column; align-items: stretch;
    margin-top: auto; padding-top: 10px; gap: 8px;
  }
  .shop-price { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--accent); font-weight: 850; font-size: 13px; }
  .shop-price .coin-dot { width: 9px; height: 9px; flex-shrink: 0; }
  .shop-item button {
    flex: 0 0 auto;
    width: auto;
    margin: 0;
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.15;
    text-align: center;
    white-space: nowrap;
  }
  .shop-grid .shop-item button { width: 100%; }
  @container (max-width: 168px) {
    .shop-item { padding: 10px 8px 8px; }
    .shop-icon-art { height: 64px; margin-bottom: 6px; }
    .shop-icon-art img { width: 56px; height: 56px; }
    .shop-item h3 { font-size: 12px; }
    .shop-price { font-size: 12px; }
    .shop-item button { font-size: 11px; padding: 6px 8px; }
  }
  .shop-shirt { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  .shop-shirt-art {
    width: 84px; height: 72px; flex-shrink: 0;
    display: grid; place-items: center;
  }
  .shop-shirt-art img { width: 72px; height: 64px; display: block; object-fit: contain; }
  .shop-shirt-copy { flex: 1; min-width: 0; }
  .shop-shirt-copy h3 { font-size: 15px; }
  .shop-shirt .shop-item-row { margin-top: 8px; }

  .unlock-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: rgba(10, 10, 10, .72);
  }
  .unlock-card {
    width: 100%; max-width: 320px;
    padding: 22px 18px 16px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  .unlock-lock {
    width: 56px; height: 56px; margin: 0 auto 12px;
    border-radius: 16px;
    display: grid; place-items: center;
    background: var(--surface-3); color: var(--accent);
  }
  .unlock-lock svg { width: 26px; height: 26px; }
  .unlock-card h2 { font-size: 18px; line-height: 1.25; }
  .unlock-card .sub { margin: 8px 0 16px; line-height: 1.5; }

  body:has(#app.game-page) {
    overflow: hidden;
    height: 100dvh;
  }
  #app.game-page {
    --play-chrome-h: calc(env(safe-area-inset-top, 0px) + 47.6px);
    max-width: none;
    width: 100%;
    height: 100dvh;
    min-height: 100dvh;
    padding: 0 !important;
    overflow: hidden;
  }
  .play-shell,
  .play-stage {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
    height: 100%;
  }
  .play-shell {
    background: #141414;
  }
  .play-chrome {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
    height: var(--play-chrome-h);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 5px) 10px 5px;
    box-sizing: border-box;
  }
  .play-chrome-stats {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    margin-left: 0;
  }
  .play-chrome-level,
  .play-chrome-coins {
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 0;
    padding: 7px 11px;
    border-radius: 999px;
    background: rgba(26, 26, 26, .82);
    color: #fbfbfb;
    font-size: 9.9px;
    font-weight: 800;
    line-height: 1;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    white-space: nowrap;
  }
  .play-chrome-level {
    border: 1px solid rgba(77, 107, 245, .7);
  }
  .play-chrome-coins {
    border: 1px solid rgba(255, 203, 5, .55);
    color: var(--accent);
  }
  .play-chrome-coins .coin-dot {
    width: 8.8px;
    height: 8.8px;
    border-width: 1.5px;
    flex-shrink: 0;
  }
  .play-chrome-level.reward-pop,
  .play-chrome-coins.reward-pop {
    animation: reward-chrome-pop .45s ease;
  }
  @keyframes reward-chrome-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  .reward-fly {
    position: fixed;
    z-index: 80;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 7px 11px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;
    transform: translate(-50%, -50%) scale(1);
    transition: transform .7s cubic-bezier(.2, .8, .2, 1), opacity .7s ease;
    will-change: transform, opacity;
  }
  .reward-fly-xp {
    background: rgba(26, 26, 26, .92);
    color: #9ff0db;
    border: 1px solid rgba(77, 107, 245, .8);
  }
  .reward-fly-coin {
    background: rgba(26, 26, 26, .92);
    color: var(--accent);
    border: 1px solid rgba(255, 203, 5, .7);
  }
  .reward-fly-coin .coin-dot {
    width: 9px;
    height: 9px;
    border-width: 1.5px;
  }
  @media (prefers-reduced-motion: reduce) {
    .reward-fly { display: none; }
    .play-chrome-level.reward-pop,
    .play-chrome-coins.reward-pop { animation: none; }
  }
  .play-stage {
    overflow: auto;
    background: #141414;
  }
  .play-stage.is-booting::after {
    content: "Loading";
    position: absolute;
    top: var(--play-chrome-h);
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 4;
    display: grid;
    place-items: center;
    background: #141414;
    color: #cecece;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .play-stage:has(.game-frame) { overflow: hidden; }
  .play-stage .game-frame {
    position: absolute;
    top: var(--play-chrome-h);
    left: 0;
    width: 100%;
    height: calc(100% - var(--play-chrome-h));
    border: 0;
  }
  .play-stage:not(:has(.game-frame)) {
    padding: var(--play-chrome-h) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .play-back {
    position: relative;
    z-index: 50;
    margin: 0 0 0 10%;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid rgba(255, 203, 5, .55);
    background: rgba(26, 26, 26, .82);
    color: #fbfbfb;
    font-size: 11.4px;
    font-weight: 800;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: play-back-pulse 1.6s ease-in-out infinite;
    flex-shrink: 0;
  }
  .play-back:active {
    animation: none;
    transform: scale(.96);
  }
  @keyframes play-back-pulse {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 0 0 0 rgba(255, 203, 5, .55);
    }
    50% {
      transform: scale(1.06);
      box-shadow: 0 0 0 8px rgba(255, 203, 5, 0);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .play-back { animation: none; }
  }
  .play-status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .menu-page {
    position: relative;
    overflow: hidden;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(env(safe-area-inset-bottom) + 24px) !important;
  }


  .hub-page { position: relative; overflow-x: hidden; }
  .hub-page > :not(.menu-bg):not(.bottom-nav):not(.unlock-overlay) { position: relative; z-index: 1; }
  .hub-page .menu-bg::after {
    background:
      linear-gradient(to bottom, rgba(26,26,26,.88) 0%, rgba(26,26,26,.74) 32%, rgba(26,26,26,.9) 100%);
  }
  .hub-page .section-head h2 { font-size: 18px; }
  .hub-page .shop-item {
    background: rgba(38, 38, 38, .92);
    border: 2px solid var(--line);
  }
  .hub-page .shop-item.is-equipped { border-color: var(--accent); }
  .hub-page .shop-hero h1 { text-shadow: 0 2px 16px rgba(26,26,26,.95); }

  /* Animated wall of game covers behind the menu. Each band holds two copies
     of a seamlessly tileable strip, so sliding the track by -50% loops. */
  .menu-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .menu-bands {
    position: absolute; inset: -14%;
    display: flex; flex-direction: column; justify-content: center; gap: 10px;
    transform: rotate(-4deg) scale(1.06);
  }
  .menu-band { overflow: hidden; }
  .menu-band-track {
    display: flex; width: max-content;
    animation: menu-scroll 42s linear infinite;
    will-change: transform;
  }

  /* Dark halo behind the wordmark so the copy stays legible, with a much
     lighter overall dim so the game art still reads as game art. */
  .menu-bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(88% 38% at 50% 37%, rgba(26,26,26,.9) 0%, rgba(26,26,26,.52) 58%, rgba(26,26,26,0) 100%),
      linear-gradient(to bottom, var(--bg) 0%, rgba(26,26,26,.3) 15%, rgba(26,26,26,.3) 60%, rgba(26,26,26,.86) 83%, var(--bg) 100%);
  }
  @keyframes menu-scroll {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(-50%, 0, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .menu-band-track { animation: none; }
    .menu-page.is-loading .menu-load-fill {
      animation: none;
      transform: scaleX(1);
    }
  }

  .menu-brand, .menu-actions, .menu-version { position: relative; z-index: 1; }

  .menu-brand h1 { font-size: 27px; line-height: 1.15; text-shadow: 0 2px 18px rgba(26,26,26,.95); }
  .menu-brand .eyebrow { margin-top: 10px; }
  .menu-actions { margin-top: 170px; display: grid; gap: 10px; }
  .menu-actions button { min-height: 54px; font-size: 16px; }
  .menu-actions .secondary-action { background: var(--surface-2); color: var(--text); }
  .menu-page.is-loading .menu-actions button {
    visibility: hidden;
    pointer-events: none;
  }
  .menu-page.is-loading .menu-actions button[disabled] { opacity: 1; }
  .menu-version { margin-top: 18px; text-align: center; color: var(--text-3); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .menu-load {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    padding: 0 4px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .menu-page.is-loading .menu-load {
    opacity: 1;
    visibility: visible;
  }
  .menu-load-track {
    position: relative;
    width: 100%;
    height: 42px;
    border-radius: 12px;
    background: #141414;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .menu-load-fill {
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
  }
  .menu-load-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--text);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .85);
    pointer-events: none;
  }
  .menu-page.is-loading .menu-load-fill {
    animation: menu-load-fill 2s linear forwards;
  }
  @keyframes menu-load-fill {
    from { transform: scaleX(0.06); }
    to { transform: scaleX(1); }
  }

  .howto-page { padding-bottom: calc(env(safe-area-inset-bottom) + 28px) !important; }
  .howto-hero { margin: 18px 0 22px; }
  .howto-hero h1 {
    font-size: 20px;
    line-height: 1.24;
    letter-spacing: -0.03em;
    text-shadow: 0 2px 18px rgba(26,26,26,.95);
  }
  .howto-pitch {
    margin-top: 14px;
    color: var(--text-2);
    font-size: 14px;
    line-height: 1.55;
  }
  .howto-hook {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    font-weight: 600;
  }
  .howto-list { display: grid; gap: 10px; }
  .howto-step {
    display: grid; grid-template-columns: 42px 1fr; gap: 12px;
    padding: 14px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .howto-icon {
    width: 42px; height: 42px; border-radius: 13px;
    display: grid; place-items: center; background: var(--surface-3);
    color: var(--accent); font-size: 20px; font-weight: 900;
  }
  .howto-step strong { display: block; font-size: 15px; margin-bottom: 3px; }
  .howto-step p { color: var(--text-2); font-size: 12px; line-height: 1.45; }

  .stage {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #141414;
    display: block;
    touch-action: none;
  }

  .pad {
    width: 100%;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .pad.live { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .pad.warn { background: #3a2020; border-color: #5a2c2c; color: var(--bad); }

  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dpad button { padding: 14px 0; }
  .dpad .up { grid-column: 2; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }

  .memory { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .memory button { padding: 0; height: 62px; font-size: 17px; font-weight: 700; background: var(--surface-2); }
  .memory button.open { background: var(--surface); border-color: var(--accent); color: var(--text); }
  .memory button.done { opacity: 0.35; border-color: var(--line); }

  .stack-8 > * + * { margin-top: 8px; }
  .stack-12 > * + * { margin-top: 12px; }
  .stack-14 > * + * { margin-top: 14px; }
</style>

  function game(id) {
    for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id) return GAMES[i];
    return null;
  }

  function isLocalDevHost() {
    var host = location.hostname;
    return host === "localhost" || host === "127.0.0.1" || host === "[::1]";
  }

  function isLiveAssetUrl(url, base) {
    try {
      var parsed = new URL(url, base || location.href);
      if (parsed.protocol === "https:") return true;
      return parsed.protocol === "http:" && location.protocol === "http:";
    } catch (err) {
      return false;
    }
  }

  function isAllowedCatalogUrl(url) {
    try {
      var abs = new URL(url, location.href);
      if (!isLiveAssetUrl(abs.href, location.href)) return false;
      if (abs.origin === location.origin) return true;
      if (abs.origin === "https://davidgiraldo7.github.io") return true;
      if (abs.origin === "https://cdn.jsdelivr.net") return true;
      return false;
    } catch (err) {
      return false;
    }
  }

  function catalogCandidates() {
    var urls = [];
    var seen = {};
    function add(url) {
      if (!url || seen[url] || !isAllowedCatalogUrl(url)) return;
      seen[url] = true;
      urls.push(url);
    }

    var deployOverride = typeof window.KWALEE_CATALOG_URL === "string" ? window.KWALEE_CATALOG_URL : "";
    if (deployOverride) add(deployOverride);

    try {
      var query = new URLSearchParams(location.search).get("catalog");
      if (query) add(query);
    } catch (err) { /* ignore */ }

    add(GAMES_CATALOG_URL);
    return urls;
  }

  function withCacheBust(url) {
    try {
      var u = new URL(url, location.href);
      u.searchParams.set("v", String(Date.now()));
      return u.href;
    } catch (err) {
      return url;
    }
  }

  function gameFrameSrc(url) {
    try {
      var u = new URL(url, location.href);
      u.searchParams.set("v", GAMES_ASSET_V);
      return u.href;
    } catch (err) {
      return url;
    }
  }

  function catalogAssetBase(fetchedFrom) {
    try {
      var u = new URL(fetchedFrom);
      if (u.origin === location.origin && isLocalDevHost()) return u.href;
    } catch (err) { /* ignore */ }
    return GAMES_CATALOG_URL;
  }

  function applyCatalog(data, baseUrl) {
    var list = Array.isArray(data) ? data : (data && data.games);
    if (!list || !list.length) return false;
    var base = catalogAssetBase(baseUrl);
    var cleaned = [];
    for (var i = 0; i < list.length; i++) {
      var raw = list[i];
      if (!raw || !raw.id || !raw.title) continue;
      var entry = {
        id: String(raw.id),
        title: String(raw.title),
        genre: raw.genre ? String(raw.genre) : "Arcade",
        heat: Number(raw.heat) || 0,
        tagline: String(raw.description || raw.tagline || ""),
        lowerIsBetter: !!raw.lowerIsBetter,
        unit: raw.unit ? String(raw.unit) : "",
        src: "",
        cover: ""
      };
      if (raw.src && isLiveAssetUrl(raw.src, base)) entry.src = new URL(raw.src, base).href;
      var art = raw.cover || raw.icon;
      if (art && isLiveAssetUrl(art, base)) entry.cover = new URL(art, base).href;
      cleaned.push(entry);
    }
    if (!cleaned.length) return false;
    GAMES = cleaned;
    progress = loadProgress();
    return true;
  }

  function fetchWithTimeout(url, ms) {
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms);
    var opts = { credentials: "omit", cache: "no-store", mode: "cors" };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (res) {
      clearTimeout(timer);
      return res;
    }, function (err) {
      clearTimeout(timer);
      throw err;
    });
  }

  function loadCatalogViaBridge() {
    return new Promise(function (resolve) {
      var settled = false;
      var frame = null;
      function finish(ok) {
        if (settled) return;
        settled = true;
        window.removeEventListener("message", onMsg);
        if (frame && frame.parentNode) frame.parentNode.removeChild(frame);
        resolve(!!ok);
      }
      function onMsg(ev) {
        if (ev.origin !== GAMES_ORIGIN) return;
        var payload = ev.data;
        if (!payload || payload.type !== "kwalee.catalog") return;
        finish(payload.data && applyCatalog(payload.data, GAMES_CATALOG_URL));
      }
      window.addEventListener("message", onMsg);
      frame = document.createElement("iframe");
      frame.title = "catalog";
      frame.setAttribute("aria-hidden", "true");
      frame.style.cssText = "position:absolute;width:0;height:0;border:0;visibility:hidden";
      frame.src = withCacheBust(GAMES_BRIDGE_URL);
      (document.body || document.documentElement).appendChild(frame);
      setTimeout(function () { finish(false); }, CATALOG_TIMEOUT_MS);
    });
  }

  function catalogFetchSupported() {
    return location.protocol === "http:" || location.protocol === "https:";
  }

  function loadCatalog() {
    var urls = catalogFetchSupported() ? catalogCandidates() : [];
    function next(i) {
      if (i >= urls.length) return loadCatalogViaBridge();
      return fetchWithTimeout(withCacheBust(urls[i]), CATALOG_TIMEOUT_MS).then(function (res) {
        if (!res.ok) throw new Error("catalog " + res.status);
        var base = res.url || urls[i];
        return res.json().then(function (data) {
          if (applyCatalog(data, base)) return true;
          throw new Error("empty catalog");
        });
      }).catch(function () { return next(i + 1); });
    }
    return next(0);
  }

  function refreshFromCatalog() {
    if (currentView === "menu" || currentView === "hub" || currentView === "howto") show(currentView);
  }

  function normalizeWallet(saved) {
    saved = saved || {};
    var owned = [];
    var rawOwned = Array.isArray(saved.owned) ? saved.owned : [];
    rawOwned.forEach(function (id) {
      if (iconById(id) && owned.indexOf(id) === -1) owned.push(id);
    });
    PLAYER_ICONS.forEach(function (icon) {
      if (icon.price === 0 && owned.indexOf(icon.id) === -1) owned.push(icon.id);
    });
    var icon = owned.indexOf(saved.icon) !== -1 ? saved.icon : DEFAULT_ICON;
    return {
      xp: Math.max(0, Number(saved.xp) || 0),
      coins: Math.max(0, Number(saved.coins) || 0),
      icon: icon,
      owned: owned,
      shirt: !!saved.shirt,
      name: cleanName(saved.name)
    };
  }

  function cleanName(value) {
    var name = String(value == null ? "" : value).replace(/[\u0000-\u001F]/g, "").replace(/\s+/g, " ").trim();
    if (name.length > 16) name = name.slice(0, 16).trim();
    return name || DEFAULT_NAME;
  }

  function blankWallet() {
    return normalizeWallet({ xp: 0, coins: STARTING_COINS });
  }

  function loadProgress() {
    var out = {};
    GAMES.forEach(function (g) { out[g.id] = blankEntry(); });
    var raw = storage.getItem(STORAGE_KEY);
    if (!raw) return out;
    try {
      var saved = JSON.parse(raw);
      Object.keys(out).forEach(function (id) {
        var entry = saved && saved[id];
        if (!entry || typeof entry !== "object") return;
        out[id] = {
          highScore: Number(entry.highScore) || 0,
          plays: Number(entry.plays) || 0,
          bestStreak: Number(entry.bestStreak) || 0,
          lastPlayedAt: Number(entry.lastPlayedAt) || null
        };
      });
    } catch (err) { /* corrupt payload — keep defaults */ }
    return out;
  }

  var progress = loadProgress();

  function loadWallet() {
    try {
      var raw = storage.getItem(WALLET_KEY);
      if (raw) return normalizeWallet(JSON.parse(raw));
    } catch (err) { /* corrupt payload */ }
    var plays = 0;
    Object.keys(progress).forEach(function (id) {
      if (id.charAt(0) === "_") return;
      plays += (progress[id] && progress[id].plays) || 0;
    });
    if (plays > 0) return normalizeWallet({ xp: plays * 25, coins: plays * 25 + STARTING_COINS });
    return blankWallet();
  }

  var wallet = loadWallet();

  function saveWallet() {
    try { storage.setItem(WALLET_KEY, JSON.stringify(wallet)); } catch (err) { /* quota/private mode */ }
  }
  try { if (!storage.getItem(WALLET_KEY)) saveWallet(); } catch (err) { /* ignore */ }

  function saveProgress() {
    try { storage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (err) { /* quota/private mode */ }
  }

  function recordResult(id, score, streak) {

    entry.lastPlayedAt = Date.now();
    if (isBest) entry.highScore = score;

  /* Canvas sized in logical units, backed by a device-pixel-ratio buffer. */
  function makeStage(logicalW, logicalH) {
    var canvas = el("canvas", { className: "stage" });
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(logicalW * dpr);
    canvas.height = Math.round(logicalH * dpr);
    canvas.style.aspectRatio = logicalW + " / " + logicalH;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return {
      canvas: canvas,
      ctx: ctx,
      w: logicalW,
      h: logicalH,
      point: function (clientX, clientY) {
        var r = canvas.getBoundingClientRect();
        return {
          x: (clientX - r.left) / r.width * logicalW,
          y: (clientY - r.top) / r.height * logicalH

      },
      clear: function () {
        ctx.fillStyle = "#141414";

  function gameTile(meta) {
    var entry = progress[meta.id] || blankEntry();
    var node = el("div", { className: "game-tile " + meta.id }, [
      artwork(meta, "tile-art"),
      el("div", { className: "tile-info" }, [
        el("div", { className: "tile-title", text: meta.title }),
        el("div", { className: "tile-meta" }, [
          el("span", { text: entry.plays ? "Best " + bestLabel(meta.id) : meta.genre }),

        ])
      ])
    ]);
    node.addEventListener("click", function () { openGame(meta.id); });
    return node;
  }

  function playerStats() {
    var totalPlays = 0;
    var scored = 0;
    GAMES.forEach(function (g) {
      var entry = progress[g.id] || blankEntry();
      totalPlays += entry.plays;
      if (entry.highScore) scored += 1;
    });
    var xp = wallet.xp;
    var playerLevel = Math.max(1, Math.floor(xp / XP_PER_LEVEL) + 1);
    var xpInLevel = xp % XP_PER_LEVEL;
    var xpToNext = xpInLevel === 0 && xp > 0 ? XP_PER_LEVEL : XP_PER_LEVEL - xpInLevel;
    return {
      totalPlays: totalPlays,
      scored: scored,
      playerLevel: playerLevel,
      coins: wallet.coins,
      xp: xp,
      xpInLevel: xpInLevel,
      levelProgress: (xpInLevel / XP_PER_LEVEL) * 100,
      xpToNext: xpToNext,
      nextLevel: playerLevel + 1
    };
  }

  function avatarMark() {
    return el("button", {
      className: "brand-mark",
      attrs: { type: "button", "aria-label": "Player avatar" },
      html: iconMarkup(iconById(wallet.icon) || iconById(DEFAULT_ICON)),
      onClick: showUnlockPopup
    });
  }

  function closeUnlockPopup() {
    var overlay = document.querySelector(".unlock-overlay");
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
  }

  function showUnlockPopup(kind) {
    closeUnlockPopup();
    var isShop = kind === "shop";
    var level = isShop ? SHOP_UNLOCK_LEVEL : PLAYER_UNLOCK_LEVEL;
    var section = isShop ? "Shop" : "Player section";
    var overlay = el("div", {
      className: "unlock-overlay",
      attrs: { role: "dialog", "aria-modal": "true", "aria-labelledby": "unlock-title" }
    }, [
      el("div", { className: "unlock-card" }, [
        el("div", {
          className: "unlock-lock",
          html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
        }),
        el("h2", { attrs: { id: "unlock-title" }, text: "Reach level " + level + " to unlock" }),
        el("p", { className: "sub", text: "Keep playing to raise your player level and open the " + section + "." }),
        el("button", { className: "primary block", text: "Got it", onClick: closeUnlockPopup })
      ])
    ]);
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeUnlockPopup();
    });
    document.body.appendChild(overlay);
  }

  function commitName(input) {
    var name = cleanName(input.value);
    input.value = name;
    if (wallet.name === name) return;
    wallet.name = name;
    saveWallet();
  }

  function hubTopbar() {
    var stats = playerStats();
    var nameInput = el("input", {
      className: "brand-name",
      attrs: {
        type: "text",
        value: wallet.name,
        maxlength: "16",
        "aria-label": "Player name",
        autocomplete: "off",
        spellcheck: "false"
      }
    });
    nameInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") nameInput.blur();
    });
    nameInput.addEventListener("blur", function () { commitName(nameInput); });
    return el("div", { className: "topbar" }, [
      avatarMark(),
      el("div", { className: "brand-copy" }, [
        nameInput,
        el("div", { className: "player-level", text: "PLAYER LEVEL " + stats.playerLevel })
      ]),
      el("div", { className: "coin-bank" }, [

        el("span", { text: String(stats.coins) })

    ]);

  function priceLabel(amount) {
    return el("span", { className: "shop-price" }, [
      el("span", { className: "coin-dot" }),
      el("span", { text: amount ? String(amount) : "Free" })
    ]);
  }

  function flashCoinSpend(amount) {
    var bank = document.querySelector(".coin-bank");
    if (!bank || !amount) return;
    var tag = document.createElement("span");
    tag.className = "coin-spend";
    tag.textContent = "-" + amount;
    bank.appendChild(tag);
    bank.classList.remove("is-spending");
    void bank.offsetWidth;
    bank.classList.add("is-spending");
    setTimeout(function () {
      bank.classList.remove("is-spending");
      if (tag.parentNode) tag.parentNode.removeChild(tag);
    }, 700);
  }

  function buyIcon(id) {
    var icon = iconById(id);
    if (!icon) return;
    var owned = wallet.owned.indexOf(id) !== -1;
    var spent = 0;
    if (!owned) {
      if (icon.price > 0 && wallet.coins < icon.price) return;
      spent = icon.price;
      wallet.coins -= spent;
      wallet.owned = wallet.owned.concat(id);
    }
    wallet.icon = id;
    saveWallet();
    openHub();
    flashCoinSpend(spent);
  }

  function buyShirt() {
    if (wallet.shirt || wallet.coins < SHIRT_PRICE) return;
    wallet.coins -= SHIRT_PRICE;
    wallet.shirt = true;
    saveWallet();
    openHub();
    flashCoinSpend(SHIRT_PRICE);
  }

  function iconCard(icon) {
    var owned = wallet.owned.indexOf(icon.id) !== -1;
    var equipped = wallet.icon === icon.id;
    var canBuy = owned || wallet.coins >= icon.price;
    var label = equipped ? "Equipped" : (owned ? "Wear" : "Buy");
    return el("div", { className: "shop-item" + (equipped ? " is-equipped" : "") }, [
      el("div", { className: "shop-icon-art", html: iconMarkup(icon) }),
      el("h3", { text: icon.title }),
      el("div", { className: "shop-item-row" }, [
        priceLabel(icon.price),
        el("button", {
          className: "primary",
          text: label,
          disabled: equipped || !canBuy,
          onClick: function () { buyIcon(icon.id); }
        })
      ])
    ]);
  }

    var owned = !!wallet.shirt;
    return el("div", { className: "shop-item shop-shirt" + (owned ? " is-equipped" : "") }, [
      el("div", { className: "shop-shirt-art", html: shirtSvg() }),

        el("button", {

          text: "Return To Hub",
          attrs: { type: "button", "aria-label": "Return To Hub" },
          onClick: openHub
        }),
        el("div", { className: "play-chrome-stats" }, [chromeLevel, chromeCoins])
      ])
    ]);
    var mount = el("div", { className: "play-stage stack-14" });
    var status = el("p", { className: "play-status", attrs: { "aria-live": "polite" }, text: "" });
    shell.appendChild(mount);
    shell.appendChild(status);
    app.appendChild(shell);

    function refreshPlayChrome() {
      var next = playerStats();
      chromeLevel.textContent = "Lv " + next.playerLevel;
      chromeLevel.setAttribute("aria-label", "Player level " + next.playerLevel);
      chromeCoinsN.textContent = String(next.coins);
      chromeCoins.setAttribute("aria-label", next.coins + " coins");
    }

    function popChrome(node) {
      node.classList.remove("reward-pop");
      void node.offsetWidth;
      node.classList.add("reward-pop");
    }

    function flyRewardChip(target, className, kids) {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!target) return;
      if (reduce) {
        popChrome(target);
        return;
      }
      var origin = document.querySelector(".play-stage") || app;
      var from = origin.getBoundingClientRect();
      var to = target.getBoundingClientRect();
      var node = el("div", { className: "reward-fly " + className }, kids);
      document.body.appendChild(node);
      var startX = from.left + from.width / 2;
      var startY = from.top + from.height * 0.42;
      var endX = to.left + to.width / 2;
      var endY = to.top + to.height / 2;
      node.style.left = startX + "px";
      node.style.top = startY + "px";
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          node.style.transform = "translate(calc(-50% + " + (endX - startX) + "px), calc(-50% + " + (endY - startY) + "px)) scale(.55)";
          node.style.opacity = "0.15";
        });
      });
      setTimeout(function () {
        if (node.parentNode) node.parentNode.removeChild(node);
        popChrome(target);
      }, 720);
    }

    function grantClear(score, streak) {
      var now = Date.now();
      if (now - lastClearAt < 1200) return;
      lastClearAt = now;
      var isBest = recordResult(id, score, streak || 0);
      wallet.xp += XP_PER_CLEAR;
      wallet.coins += COINS_PER_CLEAR;
      saveWallet();
      refreshPlayChrome();
      flyRewardChip(chromeLevel, "reward-fly-xp", [
        el("span", { text: "+" + XP_PER_CLEAR + " XP" })
      ]);
      flyRewardChip(chromeCoins, "reward-fly-coin", [
        el("span", { className: "coin-dot" }),
        el("span", { text: "+" + COINS_PER_CLEAR })
      ]);
      var shown = meta.unit ? score + " " + meta.unit : score;
      if (score) {
        status.textContent = isBest
          ? "New personal best: " + shown + " · saved"
          : "Run saved: " + shown + " · best " + bestLabel(id);
      }
    }

    var api = {
      /** Persist a finished run and surface whether it beat the record. */
      submit: function (score, streak) {
        grantClear(score, streak || 0);
      },
      note: function (text) { status.textContent = text; }
    };

    if (meta.src) {
      teardown = mountRemoteGame(mount, meta, api) || null;
      return;
    }
    if (!BUILDERS[id]) {
      api.note("This title is in the catalog but has no game file yet.");
      return;
    }
    teardown = BUILDERS[id](mount, api) || null;
  }

  function loadGameSrcdoc(meta, frame) {
    frame.src = gameFrameSrc(meta.src);
  }

  function mountRemoteGame(root, meta, api) {
    var frame = el("iframe", {
      className: "game-frame " + meta.id,
      attrs: {
        title: meta.title,
        sandbox: "allow-scripts allow-same-origin",
        allow: "autoplay *; fullscreen *",
        loading: "eager"
      }
    });
    var html = EMBEDDED_GAMES[meta.id];
    var clearBoot = function () { root.classList.remove("is-booting"); };
    root.classList.add("is-booting");
    if (html) frame.setAttribute("srcdoc", html);
    else loadGameSrcdoc(meta, frame);
    var bootTimer = setTimeout(clearBoot, 12000);
    frame.addEventListener("error", function () {
      clearTimeout(bootTimer);
      clearBoot();
      api.note("This game did not load. Check your connection and try again.");
    });
    function rewardPayload(data) {
      if (!data) return null;
      if (typeof data === "string") {
        try { data = JSON.parse(data); } catch (err) { return null; }
      }
      if (!data || typeof data !== "object") return null;
      if (data.type !== "kwalee.reward" && data.type !== "kwalee.score") return null;
      return data;
    }

    function fromGameFrame(e) {
      try {
        if (frame.contentWindow && e.source === frame.contentWindow) return true;
      } catch (err) { /* cross-origin */ }
      try {
        var win = e.source;
        var hops = 0;
        while (win && hops < 5) {
          if (frame.contentWindow && win === frame.contentWindow) return true;
          if (win === window) break;
          win = win.parent;
          hops += 1;
        }
      } catch (err) { /* nested / opaque origin */ }
      if (e.origin === GAMES_ORIGIN || e.origin === location.origin || e.origin === "null") return true;
      return false;
    }

    function onMsg(e) {
      var data = rewardPayload(e.data);
      if (!data || !fromGameFrame(e)) return;
      api.submit(Number(data.score) || Number(data.xp) || 0, Number(data.streak) || 0);
    }
    window.addEventListener("message", onMsg);
    var alive = true;
    var unlockTimers = [];
    function pingUnlock() {
      if (!alive) return;
      HubAudio.unlockIframe(frame);
    }
    frame.addEventListener("load", function () {
      clearTimeout(bootTimer);
      clearBoot();
      if (!alive) return;
      if ((frame.getAttribute("src") || "") === "about:blank") return;
      pingUnlock();
      unlockTimers.push(setTimeout(pingUnlock, 200));
      unlockTimers.push(setTimeout(pingUnlock, 800));
      unlockTimers.push(setTimeout(pingUnlock, 2400));
      unlockTimers.push(setTimeout(pingUnlock, 4000));
    });
    root.appendChild(frame);
    pingUnlock();
    return function () {
      alive = false;
      unlockTimers.forEach(function (id) { clearTimeout(id); });
      HubAudio.silenceFrame(frame);
      window.removeEventListener("message", onMsg);
    };
  }

  /* ------------------------------------------------------------------ *
   * Tap Rush
   * ------------------------------------------------------------------ */

  BUILDERS["tap-rush"] = function (root, api) {
    var DURATION = 10;
    var score = 0;
    var left = DURATION;
    var running = false;
    var timer = null;

    var stats = statsStrip([
      { key: "score", label: "Taps", value: "0", tone: "info" },
      { key: "time", label: "Time left", value: DURATION + "s" }
    ]);

    var pad = el("div", { className: "pad", style: { height: "230px" }, text: "Press start" });
    var startBtn = el("button", { className: "primary block", text: "Start round" });

      clearInterval(timer);

      pad.className = "pad";
      pad.textContent = "Time!";
      startBtn.disabled = false;
      startBtn.textContent = "Play again";
      api.submit(score);
    }

    pad.addEventListener("pointerdown", function () {
      if (!running) return;
      score += 1;
      stats.set("score", String(score), "info");
    });

    startBtn.addEventListener("click", function () {
      score = 0;
      left = DURATION;

        if (left <= 0) stop();
      }, 1000);
    });

    root.appendChild(stats.el);
    root.appendChild(pad);
    root.appendChild(startBtn);

    return function () { clearInterval(timer); };
  };

  /* ------------------------------------------------------------------ *
   * Reaction Lab
   * ------------------------------------------------------------------ */

  BUILDERS["reaction-lab"] = function (root, api) {
    var phase = "idle"; // idle | wait | go | done
    var armTimer = null;
    var greenAt = 0;

    var stats = statsStrip([
      { key: "last", label: "Last", value: "—" },
      { key: "best", label: "Best", value: bestLabel("reaction-lab") }
    ]);

    var pad = el("div", { className: "pad", style: { height: "250px" }, text: "Arm the timer" });
    var armBtn = el("button", { className: "primary block", text: "Arm timer" });

    function arm() {
      clearTimeout(armTimer);
      phase = "wait";
      pad.className = "pad";
      pad.textContent = "Wait for green\u2026";
      armBtn.disabled = true;
      api.note("");
      armTimer = setTimeout(function () {
        phase = "go";
        greenAt = performance.now();
        pad.className = "pad live";
        pad.textContent = "TAP NOW";
      }, 1200 + Math.random() * 2800);
    }

    pad.addEventListener("pointerdown", function () {
      if (phase === "wait") {
        clearTimeout(armTimer);
        phase = "done";
        pad.className = "pad warn";
        pad.textContent = "Too early";
        armBtn.disabled = false;
        armBtn.textContent = "Try again";
        api.note("Early tap — run voided, nothing saved.");
        return;
      }
      if (phase !== "go") return;

      var ms = Math.round(performance.now() - greenAt);
      phase = "done";
      pad.className = "pad";
      pad.textContent = ms + " ms";
      stats.set("last", ms + " ms", "info");
      armBtn.disabled = false;
      armBtn.textContent = "Go again";
      api.submit(ms);
      stats.set("best", bestLabel("reaction-lab"), "good");
    });

    armBtn.addEventListener("click", arm);

    root.appendChild(stats.el);
    root.appendChild(pad);
    root.appendChild(armBtn);

    return function () { clearTimeout(armTimer); };
  };

  /* ------------------------------------------------------------------ *
   * Snake Sprint
   * ------------------------------------------------------------------ */

  BUILDERS["snake-sprint"] = function (root, api) {
    var CELLS = 20;
    var CELL = 16;
    var stage = makeStage(CELLS * CELL, CELLS * CELL);

    var snake, dir, queued, food, score, running, loop;

    var stats = statsStrip([
      { key: "score", label: "Eaten", value: "0", tone: "info" },
      { key: "state", label: "Status", value: "Ready" }
    ]);

    function spawnFood() {
      var spot;
      do {
        spot = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
      } while (snake.some(function (p) { return p.x === spot.x && p.y === spot.y; }));
      return spot;
    }

    function draw() {
      stage.clear();
      var ctx = stage.ctx;
      ctx.fillStyle = css("--accent");
      ctx.fillRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6);
      snake.forEach(function (part, i) {
        ctx.fillStyle = i === 0 ? css("--text") : "#6e6e6e";
        ctx.fillRect(part.x * CELL + 1, part.y * CELL + 1, CELL - 2, CELL - 2);
      });
    }

    function die() {
      running = false;
      clearInterval(loop);
      loop = null;
      stats.set("state", "Crashed", "bad");
      startBtn.disabled = false;
      startBtn.textContent = "Play again";
      api.submit(score);
    }

    function step() {
      dir = queued;
      var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      var hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
      var hitSelf = snake.some(function (p) { return p.x === head.x && p.y === head.y; });
      if (hitWall || hitSelf) { die(); return; }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 1;
        stats.set("score", String(score), "info");
        food = spawnFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function turn(x, y) {
      if (!running) return;
      if (dir.x + x === 0 && dir.y + y === 0) return; // no instant reversal
      queued = { x: x, y: y };
    }

    var startBtn = el("button", { className: "primary block", text: "Start" });
    startBtn.addEventListener("click", function () {
      snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      queued = dir;
      score = 0;
      running = true;
      food = spawnFood();
      stats.set("score", "0", "info");
      stats.set("state", "Live", "good");
      startBtn.disabled = true;
      api.note("");
      clearInterval(loop);
      loop = setInterval(step, 120);
      draw();
    });

    var dpad = el("div", { className: "dpad" }, [
      el("button", { className: "up", text: "\u2191", onClick: function () { turn(0, -1); } }),
      el("button", { className: "left", text: "\u2190", onClick: function () { turn(-1, 0); } }),
      el("button", { className: "down", text: "\u2193", onClick: function () { turn(0, 1); } }),
      el("button", { className: "right", text: "\u2192", onClick: function () { turn(1, 0); } })
    ]);

    /* Swipe anywhere on the board as an alternative to the d-pad. */
    var swipeFrom = null;
    stage.canvas.addEventListener("pointerdown", function (e) { swipeFrom = { x: e.clientX, y: e.clientY }; });
    stage.canvas.addEventListener("pointerup", function (e) {
      if (!swipeFrom) return;
      var dx = e.clientX - swipeFrom.x;
      var dy = e.clientY - swipeFrom.y;
      swipeFrom = null;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
      else turn(0, dy > 0 ? 1 : -1);
    });

    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    queued = dir;
    score = 0;
    running = false;
    food = { x: 13, y: 10 };
    draw();

    root.appendChild(stats.el);
    root.appendChild(stage.canvas);
    root.appendChild(dpad);
    root.appendChild(startBtn);

    return function () { clearInterval(loop); };
  };

  /* ------------------------------------------------------------------ *
   * Bubble Pop
   * ------------------------------------------------------------------ */

  BUILDERS["bubble-pop"] = function (root, api) {
    var stage = makeStage(320, 420);
    var bubbles = [];
    var pops = 0;
    var lives = 3;
    var running = false;
    var frame = null;
    var last = 0;
    var spawnClock = 0;

    var stats = statsStrip([
      { key: "pops", label: "Pops", value: "0", tone: "info" },
      { key: "lives", label: "Lives", value: "3" }
    ]);

    var startBtn = el("button", { className: "primary block", text: "Start" });

    function draw() {
      stage.clear();
      var ctx = stage.ctx;
      bubbles.forEach(function (b) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = css("--accent");
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#1a1a1a";
        ctx.stroke();
      });
    }

    function end() {
      running = false;
      cancelAnimationFrame(frame);
      frame = null;
      startBtn.disabled = false;
      startBtn.textContent = "Play again";
      api.submit(pops);
    }

    function tick(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 16.67, 3);
      last = now;
      spawnClock += dt;

      /* Spawn rate creeps up with score to keep pressure on. */
      var interval = Math.max(14, 34 - pops * 0.4);
      if (spawnClock >= interval) {
        spawnClock = 0;
        var r = 14 + Math.random() * 15;
        bubbles.push({
          x: r + Math.random() * (stage.w - r * 2),
          y: stage.h + r,
          r: r,
          vy: 1.1 + Math.random() * 1.4
        });
      }

      var kept = [];
      for (var i = 0; i < bubbles.length; i++) {
        var b = bubbles[i];
        b.y -= b.vy * dt;
        if (b.y + b.r < 0) {
          lives -= 1;
          stats.set("lives", String(Math.max(lives, 0)), lives <= 1 ? "bad" : null);
        } else {
          kept.push(b);
        }
      }
      bubbles = kept;
      draw();

      if (lives <= 0) { end(); return; }
      frame = requestAnimationFrame(tick);
    }

    stage.canvas.addEventListener("pointerdown", function (e) {
      if (!running) return;
      var p = stage.point(e.clientX, e.clientY);
      var before = bubbles.length;
      bubbles = bubbles.filter(function (b) {
        var dx = b.x - p.x;
        var dy = b.y - p.y;
        return dx * dx + dy * dy > b.r * b.r;
      });
      var hit = before - bubbles.length;
      if (hit > 0) {
        pops += hit;
        stats.set("pops", String(pops), "info");
        draw();
      }
    });

    startBtn.addEventListener("click", function () {
      bubbles = [];
      pops = 0;
      lives = 3;
      spawnClock = 999;
      running = true;
      startBtn.disabled = true;
      stats.set("pops", "0", "info");
      stats.set("lives", "3");
      api.note("");
      last = performance.now();
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(tick);
    });

    stage.clear();

    root.appendChild(stats.el);
    root.appendChild(stage.canvas);
    root.appendChild(startBtn);

    return function () { cancelAnimationFrame(frame); };
  };

  /* ------------------------------------------------------------------ *
   * Memory Match
   * ------------------------------------------------------------------ */

  BUILDERS["memory-match"] = function (root, api) {
    var SYMBOLS = ["A", "B", "C", "D", "E", "F", "G", "H"];
    var deck = [];
    var flipped = [];
    var matched = [];
    var moves = 0;
    var started = false;
    var locked = false;
    var flipTimer = null;

    var stats = statsStrip([
      { key: "moves", label: "Moves", value: "0" },
      { key: "pairs", label: "Pairs", value: "0/8", tone: "info" }
    ]);

    var grid = el("div", { className: "memory" });
    var buttons = [];
    var dealBtn = el("button", { className: "primary block", text: "Deal" });

    function paint() {
      buttons.forEach(function (btn, i) {
        var isMatched = matched.indexOf(i) !== -1;
        var isOpen = isMatched || flipped.indexOf(i) !== -1;
        btn.textContent = started && isOpen ? deck[i] : "";
        btn.className = isMatched ? "done" : (isOpen ? "open" : "");
        btn.disabled = !started || isMatched;
      });
    }

    function pick(i) {
      if (!started || locked) return;
      if (flipped.indexOf(i) !== -1 || matched.indexOf(i) !== -1) return;

      flipped.push(i);
      paint();
      if (flipped.length < 2) return;

      moves += 1;
      stats.set("moves", String(moves));
      var a = flipped[0];
      var b = flipped[1];

      if (deck[a] === deck[b]) {
        matched.push(a, b);
        flipped = [];
        stats.set("pairs", (matched.length / 2) + "/8", "info");
        paint();
        if (matched.length === deck.length) {
          started = false;
          var points = Math.max(1, 100 - moves * 2);
          dealBtn.textContent = "New deal";
          api.submit(points);
        }
        return;
      }

      locked = true;
      flipTimer = setTimeout(function () {
        flipped = [];
        locked = false;
        paint();
      }, 620);
    }

    for (var i = 0; i < 16; i++) {
      (function (index) {
        var btn = el("button", { attrs: { type: "button" } });
        btn.addEventListener("click", function () { pick(index); });
        buttons.push(btn);
        grid.appendChild(btn);
      })(i);
    }

    dealBtn.addEventListener("click", function () {
      clearTimeout(flipTimer);
      deck = SYMBOLS.concat(SYMBOLS).sort(function () { return Math.random() - 0.5; });
      flipped = [];
      matched = [];
      moves = 0;
      started = true;
      locked = false;
      stats.set("moves", "0");
      stats.set("pairs", "0/8", "info");
      api.note("Fewer moves means a higher score.");
      paint();
    });

    paint();

    root.appendChild(stats.el);
    root.appendChild(grid);
    root.appendChild(dealBtn);

    return function () { clearTimeout(flipTimer); };
  };

  /* ------------------------------------------------------------------ *
   * Orbit Dodge
   * ------------------------------------------------------------------ */

  BUILDERS["orbit-dodge"] = function (root, api) {
    var stage = makeStage(320, 420);
    var PLAYER_R = 13;
    var playerX = stage.w / 2;
    var playerY = stage.h - 34;
    var hazards = [];
    var score = 0;
    var running = false;
    var frame = null;
    var last = 0;
    var spawnClock = 0;
    var elapsed = 0;
    var dragging = false;

    var stats = statsStrip([
      { key: "score", label: "Survival", value: "0", tone: "info" },
      { key: "state", label: "Status", value: "Ready" }
    ]);

    var startBtn = el("button", { className: "primary block", text: "Start" });

    function draw() {
      stage.clear();
      var ctx = stage.ctx;
      ctx.fillStyle = css("--accent");
      hazards.forEach(function (h) {
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.beginPath();
      ctx.arc(playerX, playerY, PLAYER_R, 0, Math.PI * 2);
      ctx.fillStyle = css("--text");
      ctx.fill();
    }

    function end() {
      running = false;
      cancelAnimationFrame(frame);
      frame = null;
      stats.set("state", "Hit", "bad");
      startBtn.disabled = false;
      startBtn.textContent = "Play again";
      api.submit(score);
    }

    function tick(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 16.67, 3);
      elapsed += now - last;
      last = now;
      spawnClock += dt;

      /* Difficulty ramps with survival time. */
      var difficulty = Math.min(elapsed / 12000, 1.6);
      if (spawnClock >= Math.max(9, 26 - difficulty * 10)) {
        spawnClock = 0;
        var r = 9 + Math.random() * 14;
        hazards.push({
          x: r + Math.random() * (stage.w - r * 2),
          y: -r,
          r: r,
          vy: 2 + Math.random() * 2 + difficulty * 1.6
        });
      }

      var kept = [];
      for (var i = 0; i < hazards.length; i++) {
        var h = hazards[i];
        h.y += h.vy * dt;
        var dx = h.x - playerX;
        var dy = h.y - playerY;
        var reach = h.r + PLAYER_R;
        if (dx * dx + dy * dy < reach * reach) { draw(); end(); return; }
        if (h.y - h.r < stage.h + 40) kept.push(h);
      }
      hazards = kept;

      score = Math.floor(elapsed / 100);
      stats.set("score", String(score), "info");
      draw();
      frame = requestAnimationFrame(tick);
    }

    function steer(clientX) {
      var p = stage.point(clientX, 0);
      playerX = Math.max(PLAYER_R, Math.min(stage.w - PLAYER_R, p.x));
      if (!running) draw();
    }

    stage.canvas.addEventListener("pointerdown", function (e) {
      dragging = true;
      if (stage.canvas.setPointerCapture) stage.canvas.setPointerCapture(e.pointerId);
      steer(e.clientX);
    });
    stage.canvas.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      e.preventDefault();
      steer(e.clientX);
    });
    stage.canvas.addEventListener("pointerup", function () { dragging = false; });
    stage.canvas.addEventListener("pointercancel", function () { dragging = false; });

    startBtn.addEventListener("click", function () {
      hazards = [];
      score = 0;
      elapsed = 0;
      spawnClock = 999;
      playerX = stage.w / 2;
      running = true;
      startBtn.disabled = true;
      stats.set("score", "0", "info");
      stats.set("state", "Orbiting", "good");
      api.note("Drag anywhere on the board to steer.");
      last = performance.now();
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(tick);
    });

    draw();

    root.appendChild(stats.el);
    root.appendChild(stage.canvas);
    root.appendChild(startBtn);

    return function () { cancelAnimationFrame(frame); };
  };

  app.addEventListener("pointerdown", function () {
    HubAudio.unlock();
  }, true);
  app.addEventListener("click", function (e) {
    var t = e.target.closest("button, .game-tile, .trend-card, .nav-item, .card.featured, .shop-item");
    if (!t || t.disabled) return;
    if (t.classList.contains("primary") || t.classList.contains("play-back") || t.classList.contains("game-tile")) {
      HubAudio.confirm();
    } else {
      HubAudio.click();
    }
  }, true);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      HubAudio.stopBed();
      HubAudio.stopGameplayBed();
      return;
    }
    if (currentView === "game" && FALLBACK_BGM_GAMES[currentGameId]) {
      HubAudio.startGameplayBed();
    } else if (currentView !== "game" && HubAudio.isUnlocked()) {
      HubAudio.startBed();
    }
  });

  openMenu();
  ensureCatalog();
})();
</script>
</body>
</html>
