<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Claw Sort</title>
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
<script src="arcade.js"></script>
<script>
(function () {
  var PAL = { R: "#ef4444", G: "#22c55e", B: "#3b82f6", P: "#a855f7", O: "#f59e0b", W: "#e5e7eb" };
  var CAP = 4;
  var LEVELS = [
    { loop: ["G", "G", "G", "G", "", "", "", ""], bins: ["G"] },
    { loop: ["G", "B", "G", "B", "G", "B", "G", "B", "", ""], bins: ["G", "B"] },
    { loop: ["R", "G", "B", "R", "G", "B", "R", "G", "B", "R", "G", "B", "", ""], bins: ["R", "G", "B"] },
    { loop: ["P", "O", "P", "G", "O", "G", "P", "O", "G", "P", "O", "G", "", ""], bins: ["P", "O", "G"] }
  ];

  Arcade.boot({
    title: "Claw Sort",
    theme: "gold",
    hint: "Rotate the rail, grab a ball, drop it in its cup.",
    levelCount: LEVELS.length,
    start: function (index, api) {
      var L = LEVELS[index];
      var loop = L.loop.slice();
      var bins = L.bins.map(function () { return []; });
      var claw = null;
      var history = [];
      var wrap = Arcade.el("div", { className: "claw-track" });
      api.board.appendChild(wrap);

      function ports() {
        return [0, Math.max(1, Math.floor(loop.length / 2))];
      }

      function solved() {
        return loop.every(function (x) { return !x; }) && !claw && bins.every(function (b) { return b.length === CAP; });
      }

      function paint() {
        wrap.innerHTML = "";
        var pset = ports();
        var rail = Arcade.el("div", { className: "rail" });
        loop.forEach(function (v, i) {
          var slot = Arcade.el("div", {
            className: "slot" + (pset.indexOf(i) >= 0 ? " port" : ""),
            style: { background: v ? PAL[v] : "#4b5563" },
            text: pset.indexOf(i) >= 0 ? "⌄" : ""
          });
          rail.appendChild(slot);
        });
        wrap.appendChild(rail);
        var row = Arcade.el("div", { className: "rotate-row" });
        row.appendChild(Arcade.el("button", { className: "pill", text: "◀", onClick: function () { turn(-1); } }));
        var clawBtn = Arcade.el("button", {
          className: "pill",
          text: claw ? "Claw " + claw : "Grab",
          style: claw ? { background: PAL[claw] } : {},
          onClick: grab
        });
        row.appendChild(clawBtn);
        row.appendChild(Arcade.el("button", { className: "pill", text: "▶", onClick: function () { turn(1); } }));
        wrap.appendChild(row);
        var cups = Arcade.el("div", { className: "tubes", style: { height: "180px", paddingBottom: "0" } });
        bins.forEach(function (b, i) {
          var tube = Arcade.el("div", { className: "tube" });
          b.forEach(function (c) {
            tube.appendChild(Arcade.el("div", { className: "ball", style: { background: PAL[c] } }));
          });
          tube.addEventListener("click", function () { drop(i); });
          cups.appendChild(tube);
        });
        wrap.appendChild(cups);
      }

      function snap() {
        history.push(JSON.stringify({ loop: loop, bins: bins, claw: claw }));
      }

      function turn(dir) {
        snap();
        if (dir > 0) loop.push(loop.shift());
        else loop.unshift(loop.pop());
        paint();
      }

      function grab() {
        if (claw) return;
        var p = ports();
        var i;
        for (i = 0; i < p.length; i++) {
          if (loop[p[i]]) {
            snap();
            claw = loop[p[i]];
            loop[p[i]] = "";
            paint();
            return;
          }
        }
      }

      function drop(i) {
        if (!claw) return;
        var want = L.bins[i];
        if (claw !== want) return;
        if (bins[i].length >= CAP) return;
        snap();
        bins[i].push(claw);
        claw = null;
        paint();
        if (solved()) api.win(140);
      }

      api.onUndo(function () {
        if (!history.length) return;
        var prev = JSON.parse(history.pop());
        loop = prev.loop;
        bins = prev.bins;
        claw = prev.claw;
        paint();
      });
      paint();
    }
  });
})();
</script>
</body>
</html>
