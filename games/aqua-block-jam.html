<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Aqua Block Jam</title>
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
<script src="arcade.js"></script>
<script>
(function () {
  var LEVELS = [
    {
      cols: 6, rows: 6, exitRow: 2,
      pieces: [
        { id: "X", r: 2, c: 0, w: 2, h: 1, goal: true, color: "#e85d6c" }
      ]
    },
    {
      cols: 6, rows: 6, exitRow: 2,
      pieces: [
        { id: "X", r: 2, c: 0, w: 2, h: 1, goal: true, color: "#e85d6c" },
        { id: "B", r: 1, c: 3, w: 1, h: 3, color: "#8b7cff" }
      ]
    },
    {
      cols: 6, rows: 6, exitRow: 2,
      pieces: [
        { id: "X", r: 2, c: 1, w: 2, h: 1, goal: true, color: "#e85d6c" },
        { id: "A", r: 0, c: 1, w: 3, h: 1, color: "#60a5fa" },
        { id: "B", r: 1, c: 4, w: 1, h: 3, color: "#8b7cff" },
        { id: "C", r: 3, c: 0, w: 1, h: 3, color: "#f59e0b" },
        { id: "D", r: 4, c: 2, w: 2, h: 1, color: "#34d399" }
      ]
    },
    {
      cols: 6, rows: 6, exitRow: 2,
      pieces: [
        { id: "X", r: 2, c: 0, w: 2, h: 1, goal: true, color: "#e85d6c" },
        { id: "A", r: 0, c: 0, w: 1, h: 2, color: "#60a5fa" },
        { id: "B", r: 0, c: 2, w: 3, h: 1, color: "#f59e0b" },
        { id: "C", r: 1, c: 2, w: 1, h: 2, color: "#8b7cff" },
        { id: "D", r: 3, c: 2, w: 2, h: 1, color: "#34d399" },
        { id: "E", r: 2, c: 4, w: 1, h: 3, color: "#fb7185" }
      ]
    }
  ];

  Arcade.boot({
    title: "Aqua Block Jam",
    theme: "cream",
    hint: "Slide the blocks. Send the red bar out the gate.",
    levelCount: LEVELS.length,
    start: function (index, api) {
      var L = LEVELS[index];
      var pieces = L.pieces.map(function (p) {
        return { id: p.id, r: p.r, c: p.c, w: p.w, h: p.h, goal: !!p.goal, color: p.color };
      });
      var history = [];
      var drag = null;
      var canvas = Arcade.el("canvas", { className: "stage" });
      api.board.appendChild(canvas);
      var ctx = canvas.getContext("2d");

      function clone() {
        return pieces.map(function (p) { return { id: p.id, r: p.r, c: p.c, w: p.w, h: p.h, goal: p.goal, color: p.color }; });
      }

      function occ(skip) {
        var map = {};
        pieces.forEach(function (p, i) {
          if (i === skip) return;
          var r, c;
          for (r = p.r; r < p.r + p.h; r++) {
            for (c = p.c; c < p.c + p.w; c++) map[r + "," + c] = i;
          }
        });
        return map;
      }

      function canPlace(p, r, c, skip) {
        if (r < 0 || c < 0 || r + p.h > L.rows || c + p.w > L.cols) return false;
        var used = occ(skip);
        var rr, cc;
        for (rr = r; rr < r + p.h; rr++) {
          for (cc = c; cc < c + p.w; cc++) if (used[rr + "," + cc] != null) return false;
        }
        return true;
      }

      function metrics() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = api.board.clientWidth;
        var h = api.board.clientHeight;
        canvas.width = Math.max(1, Math.round(w * dpr));
        canvas.height = Math.max(1, Math.round(h * dpr));
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var size = Math.min((w - 24) / L.cols, (h - 24) / L.rows);
        return { size: size, x: (w - size * L.cols) / 2, y: (h - size * L.rows) / 2, w: w, h: h };
      }

      function at(pt, m) {
        var c = Math.floor((pt.x - m.x) / m.size);
        var r = Math.floor((pt.y - m.y) / m.size);
        if (r < 0 || c < 0 || r >= L.rows || c >= L.cols) return null;
        var used = occ(-1);
        var i = used[r + "," + c];
        return i == null ? null : { i: i, r: r, c: c };
      }

      function draw() {
        var m = metrics();
        ctx.clearRect(0, 0, m.w, m.h);
        Arcade.roundRect(ctx, m.x - 10, m.y - 10, L.cols * m.size + 20, L.rows * m.size + 20, 24);
        ctx.fillStyle = "#efe6da";
        ctx.fill();
        var r, c;
        for (r = 0; r < L.rows; r++) {
          for (c = 0; c < L.cols; c++) {
            Arcade.roundRect(ctx, m.x + c * m.size + 4, m.y + r * m.size + 4, m.size - 8, m.size - 8, 10);
            ctx.fillStyle = "#f7f1ea";
            ctx.fill();
          }
        }
        ctx.fillStyle = "#e85d6c";
        ctx.fillRect(m.x + L.cols * m.size - 6, m.y + L.exitRow * m.size + m.size * 0.2, 14, m.size * 0.6);
        pieces.forEach(function (p) {
          var x = m.x + p.c * m.size + 5;
          var y = m.y + p.r * m.size + 5;
          var w = p.w * m.size - 10;
          var h = p.h * m.size - 10;
          Arcade.roundRect(ctx, x, y + 5, w, h - 5, 14);
          ctx.fillStyle = Arcade.shade(p.color, -40);
          ctx.fill();
          Arcade.roundRect(ctx, x, y, w, h - 6, 14);
          ctx.fillStyle = p.color;
          ctx.fill();
          if (p.goal) {
            ctx.fillStyle = "rgba(255,255,255,.85)";
            ctx.font = "900 18px Trebuchet MS, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("→", x + w / 2, y + (h - 6) / 2);
          }
        });
      }

      Arcade.pointer(canvas, {
        down: function (pt) {
          var hit = at(pt, metrics());
          if (!hit) return;
          history.push(clone());
          drag = { i: hit.i, r: pieces[hit.i].r, c: pieces[hit.i].c, x: pt.x, y: pt.y };
        },
        move: function (pt) {
          if (!drag) return;
          var m = metrics();
          var p = pieces[drag.i];
          var dc = Math.round((pt.x - drag.x) / m.size);
          var dr = Math.round((pt.y - drag.y) / m.size);
          var nr = drag.r;
          var nc = drag.c;
          var step;
          if (p.w >= p.h) {
            step = dc > 0 ? 1 : -1;
            for (var i = 0; i < Math.abs(dc); i++) {
              if (!canPlace(p, nr, nc + step, drag.i)) break;
              nc += step;
            }
          } else {
            step = dr > 0 ? 1 : -1;
            for (var j = 0; j < Math.abs(dr); j++) {
              if (!canPlace(p, nr + step, nc, drag.i)) break;
              nr += step;
            }
          }
          if (p.r !== nr || p.c !== nc) {
            p.r = nr;
            p.c = nc;
            draw();
          }
        },
        up: function () {
          if (!drag) return;
          var p = pieces[drag.i];
          if (p.goal && p.r === L.exitRow && p.c + p.w === L.cols) api.win(150);
          drag = null;
        }
      });

      api.onUndo(function () {
        if (!history.length) return;
        pieces = history.pop();
        drag = null;
        draw();
      });
      window.addEventListener("resize", draw);
      draw();
    }
  });
})();
</script>
</body>
</html>
