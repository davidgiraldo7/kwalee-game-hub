<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Blade Flow</title>
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
<script src="arcade.js"></script>
<script>
(function () {
  function heart(cols, rows) {
    var g = [];
    var r, c, x, y;
    for (r = 0; r < rows; r++) {
      g[r] = [];
      for (c = 0; c < cols; c++) {
        x = (c - (cols - 1) / 2) / (cols / 2);
        y = (r - rows * 0.28) / (rows / 2);
        var inHeart = Math.pow(x * x + y * y - 0.3, 3) - x * x * y * y * y < 0 && r > 1;
        g[r][c] = inHeart ? 2 : 1;
      }
    }
    return g;
  }

  var LEVELS = [
    { cols: 9, rows: 8, fill: 2 },
    { cols: 12, rows: 10, shape: "heart" },
    { cols: 11, rows: 12, fill: 1 }
  ];

  var runId = 0;

  Arcade.boot({
    title: "Blade Flow",
    theme: "slate",
    hint: "Drag the saw. Grind every cube.",
    levelCount: LEVELS.length,
    start: function (index, api) {
      var myRun = ++runId;
      var L = LEVELS[index];
      var grid = [];
      var r, c;
      if (L.shape === "heart") grid = heart(L.cols, L.rows);
      else {
        for (r = 0; r < L.rows; r++) {
          grid[r] = [];
          for (c = 0; c < L.cols; c++) grid[r][c] = L.fill;
        }
      }
      var saw = { x: 0.5, y: 0.92, a: 0 };
      var dragging = false;
      var canvas = Arcade.el("canvas", { className: "stage" });
      api.board.appendChild(canvas);
      var ctx = canvas.getContext("2d");
      var raf = 0;
      var won = false;

      function remaining() {
        var n = 0;
        for (r = 0; r < L.rows; r++) for (c = 0; c < L.cols; c++) if (grid[r][c]) n += 1;
        return n;
      }

      function metrics() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = api.board.clientWidth;
        var h = api.board.clientHeight;
        canvas.width = Math.max(1, Math.round(w * dpr));
        canvas.height = Math.max(1, Math.round(h * dpr));
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var size = Math.min(w / (L.cols + 1.2), (h * 0.72) / L.rows);
        return { size: size, x: (w - size * L.cols) / 2, y: 8, w: w, h: h };
      }

      function grind(m) {
        var sx = saw.x * m.w;
        var sy = saw.y * m.h;
        var rad = m.size * 0.85;
        for (r = 0; r < L.rows; r++) {
          for (c = 0; c < L.cols; c++) {
            if (!grid[r][c]) continue;
            var cx = m.x + (c + 0.5) * m.size;
            var cy = m.y + (r + 0.5) * m.size;
            if (Math.hypot(cx - sx, cy - sy) < rad) grid[r][c] = 0;
          }
        }
      }

      function drawSaw(m) {
        var x = saw.x * m.w;
        var y = saw.y * m.h;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(saw.a);
        ctx.beginPath();
        var i;
        for (i = 0; i < 14; i++) {
          var a = i / 14 * Math.PI * 2;
          var rad = i % 2 ? 22 : 14;
          var px = Math.cos(a) * rad;
          var py = Math.sin(a) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = "#c7cbe3";
        ctx.fill();
        ctx.strokeStyle = "#2a2d45";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fillStyle = "#111";
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "800 11px Trebuchet MS, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.rotate(-saw.a);
        ctx.fillText(String(remaining()), 0, 0);
        ctx.restore();
      }

      function draw() {
        var m = metrics();
        ctx.fillStyle = "#4f5378";
        ctx.fillRect(0, 0, m.w, m.h);
        Arcade.roundRect(ctx, m.x - 8, m.y - 8, L.cols * m.size + 16, L.rows * m.size + 16, 18);
        ctx.fillStyle = "#2f3358";
        ctx.fill();
        for (r = 0; r < L.rows; r++) {
          for (c = 0; c < L.cols; c++) {
            if (!grid[r][c]) continue;
            var x = m.x + c * m.size + 2;
            var y = m.y + r * m.size + 2;
            var s = m.size - 4;
            Arcade.roundRect(ctx, x, y, s, s, 4);
            ctx.fillStyle = grid[r][c] === 2 ? "#e11d48" : "#111827";
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,.16)";
            Arcade.roundRect(ctx, x + 2, y + 2, s * 0.4, s * 0.28, 3);
            ctx.fill();
          }
        }
        drawSaw(m);
      }

      function tick() {
        if (myRun !== runId) return;
        saw.a += 0.28;
        if (dragging) grind(metrics());
        draw();
        if (!won && remaining() === 0) {
          won = true;
          api.win(170);
          return;
        }
        raf = requestAnimationFrame(tick);
      }

      Arcade.pointer(canvas, {
        down: function (pt) {
          dragging = true;
          var m = metrics();
          saw.x = pt.x / m.w;
          saw.y = pt.y / m.h;
        },
        move: function (pt) {
          if (!dragging) return;
          var m = metrics();
          saw.x = pt.x / m.w;
          saw.y = pt.y / m.h;
        },
        up: function () { dragging = false; }
      });

      api.onUndo(function () {});
      window.addEventListener("resize", draw);
      draw();
      raf = requestAnimationFrame(tick);
    }
  });
})();
</script>
</body>
</html>
