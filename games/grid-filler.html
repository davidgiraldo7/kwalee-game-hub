<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Grid Filler</title>
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
<script src="arcade.js"></script>
<script>
Arcade.rectFill({
  title: "Grid Filler",
  theme: "sky",
  board: "#dbe7f6",
  hint: "Each number is the size of its rectangle. Drag to fill.",
  levels: [
    {
      cols: 4, rows: 4,
      pieces: [
        { r: 0, c: 0, n: 4, color: "#7dd3fc" },
        { r: 0, c: 2, n: 2, color: "#f9a8d4" },
        { r: 1, c: 2, n: 2, color: "#86efac" },
        { r: 2, c: 0, n: 2, color: "#fdba74" },
        { r: 2, c: 1, n: 6, color: "#93c5fd" }
      ]
    },
    {
      cols: 5, rows: 5,
      pieces: [
        { r: 0, c: 0, n: 2, color: "#7dd3fc" },
        { r: 0, c: 1, n: 8, color: "#f9a8d4" },
        { r: 2, c: 0, n: 9, color: "#86efac" },
        { r: 2, c: 3, n: 6, color: "#fdba74" }
      ]
    },
    {
      cols: 6, rows: 6,
      pieces: [
        { r: 0, c: 0, n: 4, color: "#7dd3fc" },
        { r: 0, c: 2, n: 2, color: "#f9a8d4" },
        { r: 0, c: 3, n: 6, color: "#fdba74" },
        { r: 2, c: 0, n: 8, color: "#86efac" },
        { r: 2, c: 4, n: 4, color: "#93c5fd" },
        { r: 4, c: 0, n: 4, color: "#c4b5fd" },
        { r: 4, c: 2, n: 4, color: "#fca5a5" },
        { r: 4, c: 4, n: 4, color: "#67e8f9" }
      ]
    },
    {
      cols: 6, rows: 6,
      pieces: [
        { r: 0, c: 0, n: 6, color: "#7dd3fc" },
        { r: 0, c: 3, n: 3, color: "#f9a8d4" },
        { r: 1, c: 3, n: 6, color: "#fdba74" },
        { r: 2, c: 0, n: 2, color: "#86efac" },
        { r: 2, c: 2, n: 1, color: "#c4b5fd" },
        { r: 3, c: 0, n: 6, color: "#fca5a5" },
        { r: 3, c: 2, n: 12, color: "#93c5fd" }
      ]
    }
  ]
});
</script>
</body>
</html>
