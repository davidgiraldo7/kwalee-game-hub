<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Soft 3D Template</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f9f6f0;
            font-family: "Trebuchet MS", system-ui, sans-serif;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
        }
        .badge {
            position: fixed;
            left: 14px;
            top: 14px;
            z-index: 10;
            background: rgba(20, 27, 40, 0.8);
            color: #f6f8fc;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 12px;
            letter-spacing: 0.2px;
            backdrop-filter: blur(4px);
        }
    </style>
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="soft-3d-template-bridge.js"></script>
    <script src="scene-presets/soft-3d-template-preset.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="badge">Soft 3D Template</div>

    <script>
        (function () {
            'use strict';

            window.SOFT_3D_TEMPLATE_PRESET = 'soft-3d-template-v1';
            const container = document.getElementById('canvas-container');

            const sceneRunner = window.Soft3DTemplateBridge
                ? window.Soft3DTemplateBridge.createActive({
                    container: container,
                    THREE: window.THREE,
                    OrbitControls: window.THREE.OrbitControls || window.OrbitControls
                })
                : null;

            if (!sceneRunner) {
                throw new Error('No active scene preset available.');
            }

            let raf = 0;
            let last = performance.now();

            function tick(now) {
                const dt = now - last;
                last = now;
                sceneRunner.step(dt);
                raf = requestAnimationFrame(tick);
            }

            function onResize() {
                sceneRunner.resize();
            }

            window.addEventListener('resize', onResize, false);
            raf = requestAnimationFrame(tick);

            window.addEventListener('beforeunload', function () {
                cancelAnimationFrame(raf);
                window.removeEventListener('resize', onResize, false);
                sceneRunner.destroy();
            });
        })();
    </script>
</body>
</html>
