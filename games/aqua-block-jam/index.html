<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Mobile Game UI</title>
  <style>
    :root {
      color-scheme: only light;
    }

    @font-face {
      font-family: "Fredoka";
      src: url("Fredoka-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fredoka";
      src: url("Fredoka-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fredoka";
      src: url("Fredoka-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      /* Kill browser overscroll/edge-swipe navigation so a device back-swipe
         can't leave the app or freeze the game. */
      overscroll-behavior: none;
    }

    body {
      font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
      font-weight: 600;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #ffffffff;
      overflow: hidden;
    }

    /* App fills the entire viewport on all devices */
    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .app input[type="number"] {
      -webkit-user-select: text;
      user-select: text;
    }

    /* ---------- Screens ---------- */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity .25s ease;
    }

    .screen.active {
      display: flex;
      opacity: 1;
    }

    /* ---------- Start Screen ---------- */
    #startScreen {
      justify-content: center;
      gap: 40px;
      padding: 24px;
      text-align: center;
      background: linear-gradient(180deg, #fbeee8 0%, #f2d9d1 100%);
    }

    /* Tiled scrolling background */
    .bg-scroll {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        radial-gradient(circle at 20px 20px, rgba(255, 133, 169, .16) 6px, transparent 7px),
        radial-gradient(circle at 60px 60px, rgba(255, 202, 77, .14) 6px, transparent 7px);
      background-size: 80px 80px;
      animation: bgScroll 7s linear infinite;
    }

    @keyframes bgScroll {
      from {
        background-position: 0 0, 0 0;
      }

      to {
        background-position: 80px 80px, 80px 80px;
      }
    }

    .game-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
      z-index: 1;
      top: -9%;
    }

    .game-logo .logo-img {
      width: 76.8%;
      max-width: 342px;
      height: auto;
      display: block;
    }

    .playbtn {
      border: none;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(180deg, #38dc85 0%, #28c76f 100%);
      font-family: inherit;
      font-weight: 500;
      width: 180px;
      height: 64px;
      max-width: 100%;
      border-radius: 999px;
      box-shadow: 0 7px 0 #1fa459;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 15%;
      transform: translateX(-50%);
      transition: transform .06s ease, box-shadow .06s ease;
    }

    .playbtn:active {
      transform: translateX(-50%) translateY(4px);
      box-shadow: 0 3px 0 #1fa459;
    }

    .playbtn .play-level {
      font-size: 26px;
      letter-spacing: 1px;
    }

    /* ---------- Home Bar (bottom tabs) ---------- */
    .home-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      background: #fffaf7;
      border-top: 1px solid rgba(90, 58, 52, .10);
      box-shadow: 0 -4px 16px rgba(90, 58, 52, .07);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .home-bar .tab {
      flex: 1;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 0 16px;
      color: #c3aca4;
      transition: transform .06s ease;
    }

    .home-bar .tab:active {
      transform: translateY(1px);
    }

    .home-bar .tab .tab-icon {
      width: 35px;
      height: 35px;
      background-color: currentColor;
      -webkit-mask: var(--icon) no-repeat center / contain;
      mask: var(--icon) no-repeat center / contain;
    }

    .home-bar .tab .tab-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .home-bar .tab.active {
      color: #e8709a;
    }

    .home-bar .tab.locked {
      color: #d0bfb8;
    }

    /* ---------- Game Screen ---------- */
    #gameScreen {
      justify-content: flex-start;
      background: linear-gradient(180deg, #f2d9d1 0%, #fbeee8 100%);
    }

    .header {
      margin-top: calc(18px + env(safe-area-inset-top, 0px));
      color: #5a3a34;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      animation: headerIn .5s cubic-bezier(.2, 1.4, .35, 1) forwards;
      transition: transform .4s cubic-bezier(.4, 0, 1, 1), opacity .3s ease;
    }

    .header.exit-up {
      animation: none;
      transform: translateY(-80px);
      opacity: 0;
    }

    .timer {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #5a3a34;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      transition: transform .4s cubic-bezier(.4, 0, 1, 1), opacity .3s ease, color .2s ease;
    }

    /* Small CSS clock: ring + two hands (no image asset needed). */
    .timer::before {
      content: "";
      width: 15px;
      height: 15px;
      border: 2px solid currentColor;
      border-radius: 50%;
      background:
        linear-gradient(currentColor, currentColor) no-repeat 50% 3px / 1.5px 4px,
        linear-gradient(currentColor, currentColor) no-repeat 8px 50% / 4px 1.5px;
      box-sizing: border-box;
    }

    .timer.low {
      color: #ff5a5f;
    }

    .timer.exit-up {
      transform: translateY(-80px);
      opacity: 0;
    }

    @keyframes headerIn {
      0% {
        opacity: 0;
        transform: translateY(-26px) scale(.8);
      }

      60% {
        opacity: 1;
        transform: translateY(4px) scale(1.05);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ---------- Flavour text (level complete) ---------- */
    .flavour-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 8;
      opacity: 0;
    }

    .flavour-text span {
      font-size: 52px;
      font-weight: 800;
      color: #38dc85;
      text-shadow: 0 4px 12px rgba(56, 220, 133, .4);
      transform: scale(0);
    }

    .flavour-text.show {
      opacity: 1;
    }

    .flavour-text.show span {
      animation: flavourPop .6s cubic-bezier(.2, 1.6, .35, 1) forwards;
    }

    .flavour-text.dismiss span {
      animation: flavourOut .4s ease forwards;
    }

    @keyframes flavourPop {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      50% {
        transform: scale(1.2);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes flavourOut {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 0;
      }
    }

    /* ---------- Colour-cleared cheer (per-colour praise pop) ---------- */
    .color-cheer {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      text-align: center;
    }

    .color-cheer.show {
      opacity: 1;
    }

    .color-cheer.hide {
      opacity: 0;
      transition: opacity .35s ease;
    }

    .color-cheer .cheer-text {
      display: inline-block;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: .5px;
      white-space: nowrap;
      text-shadow: 0 2px 0 rgba(255, 255, 255, .9), 0 0 16px rgba(255, 255, 255, .7), 0 8px 18px rgba(40, 30, 70, .25);
    }

    .color-cheer.show .cheer-text {
      animation: cheerPop .7s cubic-bezier(.2, 1.7, .35, 1) both;
    }

    @keyframes cheerPop {
      0% {
        transform: scale(0) rotate(-8deg);
        opacity: 0;
      }

      45% {
        transform: scale(1.25) rotate(4deg);
        opacity: 1;
      }

      70% {
        transform: scale(.94) rotate(-2deg);
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    /* ---------- Fail text (level failed) ---------- */
    .fail-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 12;
      opacity: 0;
    }

    .fail-text span {
      font-size: 46px;
      font-weight: 800;
      color: #ff6b70;
      text-shadow: 0 4px 12px rgba(255, 90, 95, .35);
      opacity: 0;
      transform: translateY(0);
      transition: transform .5s cubic-bezier(.4, 0, .2, 1), opacity .4s ease;
    }

    .fail-text.show {
      opacity: 1;
    }

    .fail-text.show span {
      opacity: 1;
    }

    .fail-text.settle span {
      transform: translateY(-80px);
    }

    .play-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      color: #a09ab4;
      font-size: 15px;
      font-weight: 600;
    }

    /* ---------- Debug buttons ---------- */
    .debug {
      position: absolute;
      right: 12px;
      bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      display: none !important;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      z-index: 5;
    }

    .debug-label {
      font-size: 10px;
      letter-spacing: 1px;
      color: #a09ab4;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      background: none;
      padding: 4px 8px;
      font-family: inherit;
    }

    .debug-label::after {
      content: "\25B2";
      margin-left: 4px;
      font-size: 8px;
    }

    .debug.collapsed .debug-label::after {
      content: "\25BC";
    }

    .debug.collapsed .debugbtn,
    .debug.collapsed .debug-skip,
    .debug.collapsed .debug-icon-row,
    .debug.collapsed .mixer-panel {
      display: none;
    }

    .debug.hotkey-hidden {
      display: none;
    }

    .debug-skip {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .debug-skip input {
      width: 48px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      text-align: center;
      outline: none;
    }

    .debug-skip input:focus {
      border-color: #4d9bff;
    }

    .debug-reset {
      background: #ff9f43;
    }

    .debugbtn {
      border: none;
      cursor: pointer;
      color: #fff;
      font-family: inherit;
      font-weight: 500;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .35);
      opacity: .85;
      transition: transform .06s ease, opacity .12s ease;
    }

    .debugbtn:active {
      transform: translateY(2px);
    }

    .debugbtn:hover {
      opacity: 1;
    }

    .debug-win {
      background: #28c76f;
    }

    .debug-fail {
      background: #ff5a5f;
    }

    .debug-lang {
      background: #4d9bff;
    }

    /* ---------- Debug Mixer & Meter ---------- */
    .debug-icon-btn {
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, .12);
      font-size: 16px;
      padding: 6px 10px;
      border-radius: 999px;
      opacity: .85;
      transition: opacity .12s;
    }

    .debug-icon-btn:hover {
      opacity: 1;
    }

    .debug-icon-row {
      display: flex;
      gap: 6px;
    }

    .debug.mixer-open .debugbtn,
    .debug.mixer-open .debug-skip,
    .debug.mixer-open .debug-reset,
    .debug.mixer-open .debug-lang,
    .debug.mixer-open .debug-label {
      display: none !important;
    }

    .mixer-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: rgba(0, 180, 80, .15);
      border-radius: 14px;
      padding: 12px;
      width: 220px;
      max-height: 420px;
      font-size: 11px;
      color: #241a44;
    }

    .debug.mixer-open .mixer-panel {
      display: flex;
    }

    .mixer-section-label {
      font-weight: 700;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #6b6684;
      margin: 4px 0 0;
    }

    .mixer-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mixer-row label {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mixer-row input[type="range"] {
      flex: 2;
      height: 6px;
      accent-color: #28c76f;
      cursor: pointer;
    }

    .mixer-row .mixer-val {
      width: 26px;
      text-align: right;
      font-size: 10px;
      color: #6b6684;
    }

    .mixer-toggles {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .mixer-tog {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      background: #e0dce8;
      color: #6b6684;
      transition: background .12s, color .12s;
    }

    .mixer-tog.active {
      background: #4d9bff;
      color: #fff;
    }

    .mixer-tog.mute-active {
      background: #ff5a5f;
      color: #fff;
    }

    .mixer-channel-tag {
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 4px;
      background: #e8e4f0;
      color: #6b6684;
      font-weight: 600;
    }

    .mixer-sounds-scroll {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .mixer-sounds-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .mixer-sounds-scroll::-webkit-scrollbar-thumb {
      background: #c0bcc8;
      border-radius: 2px;
    }

    .mixer-sound-strip {
      background: rgba(255, 255, 255, .6);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mixer-sound-strip .mixer-row input[type="range"] {
      flex: 3;
    }

    .mixer-save-btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      padding: 8px;
      border-radius: 10px;
      background: #28c76f;
      color: #fff;
      text-align: center;
    }

    /* Loudness Meter Panel */
    .meter-panel {
      display: none;
      position: absolute;
      left: 12px;
      bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      flex-direction: column;
      gap: 6px;
      background: rgba(20, 15, 40, .88);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 11px;
      color: #e0dce8;
      z-index: 5;
      min-width: 170px;
    }

    .meter-panel.show {
      display: flex;
    }

    .meter-panel h4 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .meter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meter-row .meter-label {
      color: #a09ab4;
      font-weight: 500;
    }

    .meter-row .meter-value {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .meter-reset-btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 11px;
      padding: 6px;
      border-radius: 8px;
      background: #4d9bff;
      color: #fff;
      text-align: center;
      margin-top: 4px;
    }

    /* ---------- Result Overlay ---------- */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(9, 6, 20, .72);
      backdrop-filter: blur(3px);
      z-index: 10;
      padding: 24px;
      text-align: center;
    }

    .overlay.show {
      display: flex;
      animation: fade .25s ease;
    }

    .overlay.result-locked {
      display: flex !important;
    }

    .overlay.backdrop-only .overlay-card {
      opacity: 0 !important;
      transition: none;
    }

    .overlay.reveal-content .overlay-card {
      opacity: 1 !important;
      transition: opacity .35s ease;
    }

    .overlay .overlay-card .nextbtn.btn-hidden {
      opacity: 0;
      transition: opacity .35s ease;
    }

    .overlay .overlay-card .nextbtn.btn-visible {
      opacity: 1;
      transition: opacity .35s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .overlay-card {
      background: transparent;
      box-shadow: none;
      padding: 24px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      z-index: 2;
      animation: pop .35s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .overlay-card h2 {
      margin: 0 0 4px;
      font-size: 46px;
      font-weight: 800;
      text-align: center;
      line-height: 1.05;
    }

    .overlay-card.win h2 {
      color: #38dc85;
    }

    .overlay-card.fail h2 {
      color: #ff6b70;
    }

    .overlay-card p {
      margin: 0;
      opacity: .85;
      font-size: 22px;
    }

    .nextbtn {
      border: none;
      cursor: pointer;
      color: #fff;
      font-family: inherit;
      font-weight: 500;
      font-size: 18px;
      padding: 12px 34px;
      border-radius: 999px;
      background: #28c76f;
      box-shadow: 0 5px 0 #1fa459;
      margin-top: 36px;
    }

    .nextbtn:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #1fa459;
    }

    .retrybtn {
      background: #ff5a5f;
      box-shadow: 0 5px 0 #c9393e;
    }

    .retrybtn:active {
      box-shadow: 0 3px 0 #c9393e;
    }

    /* ---------- Celebration VFX ---------- */
    /* Per-letter pop-in for the title */
    .overlay-card h2 .ltr {
      display: inline-block;
      white-space: pre;
      opacity: 0;
      transform: translateY(26px) scale(.2) rotate(-15deg);
      animation: letterPop .55s cubic-bezier(.2, 1.6, .35, 1) forwards;
    }

    @keyframes letterPop {
      0% {
        opacity: 0;
        transform: translateY(26px) scale(.2) rotate(-15deg);
      }

      60% {
        opacity: 1;
        transform: translateY(-5px) scale(1.18) rotate(4deg);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    /* Confetti canvas sits above the card */
    .confetti {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    /* Fireworks canvas covers the whole app, above all UI */
    .fireworks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    /* Fade-to-white transition layer */
    .fade-black {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity .4s cubic-bezier(.4, 0, .2, 1);
    }

    .fade-black.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Expanding glow burst behind the card */
    .burst {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 320px;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 220, 133, .55) 0%, rgba(56, 220, 133, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }

    .overlay.celebrate .burst {
      animation: burst .7s ease-out forwards;
    }

    @keyframes burst {
      0% {
        transform: translate(-50%, -50%) scale(0);

      if (this._booted) return; this._booted = true;
      const host = document.querySelector('#gameScreen .play-area') || document.body;
      host.style.position = 'relative';
      host.style.overflow = 'hidden';
      const stage = document.createElement('div');
      stage.id = 'wbjStage';
      stage.style.cssText = 'position:absolute;inset:0;background:transparent;';
      host.innerHTML = ''; host.appendChild(stage);
      this.stage = stage;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      // Soft3DTemplate look: flat (no) tone mapping so the soft low-intensity lights read as-is.
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;';
      stage.appendChild(renderer.domElement);
      this.renderer = renderer;

      const scene = new THREE.Scene();
      this.scene = scene;
      this.pivot = new THREE.Group(); scene.add(this.pivot);   // rotates for the camera sweep
      this.boardGroup = new THREE.Group(); this.pivot.add(this.boardGroup);

      // Orthographic iso camera (direction fixed; the board pivots beneath it).
      this.camera = new THREE.OrthographicCamera(-5, 5, 5, -5, -100, 200);
      this.camDir = new THREE.Vector3(1, 1.18, 1).normalize();

      // Lighting emulated from LightingStyleExamples/Soft3DTemplate.html:
      // low warm ambient + hemisphere, a soft warm key with wide soft shadows, and a subtle cool fill.
      const hemi = new THREE.HemisphereLight(0xfff4e6, 0xc9a77d, 0.30); scene.add(hemi);
      const amb = new THREE.AmbientLight(0xffffff, 0.26); scene.add(amb);
      const sun = new THREE.DirectionalLight(0xfff0dd, 0.40);
      sun.position.set(9, 22, 12);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.18;
      sun.shadow.radius = 3;
      const sc = sun.shadow.camera; sc.near = 0.5; sc.far = 60; sc.left = -14; sc.right = 14; sc.top = 14; sc.bottom = -14;
      scene.add(sun); scene.add(sun.target);
      const fill = new THREE.DirectionalLight(0xd2dae2, 0.14);
      fill.position.set(-10, 16, -8); scene.add(fill);
      this.hemi = hemi; this.amb = amb; this.sun = sun; this.fill = fill;
      this.lightDir = sun.position.clone().normalize();

      // Shared materials.
      this.mats = this._buildMaterials();

      this._initLightingDebug();

      this._buildDom();
      this._bindInput();
      this._resize();
      window.addEventListener('resize', () => this._resize());

      this.ready = true;
      const l = this._pending != null ? this._pending : 1; this._pending = null;
      this.beginLevel(this._idx(l));
    }

    _buildMaterials(){
      const wall = new THREE.MeshStandardMaterial({ color: this._materialColor('#efe4d4'), roughness: 0.85, metalness: 0.0 });
      const wallTop = new THREE.MeshStandardMaterial({ color: this._materialColor('#f7efe2'), roughness: 0.8 });
      const floor = new THREE.MeshStandardMaterial({ color: this._materialColor(VISUAL.floorInnerColor), roughness: 0.95 });
      const floorEdge = new THREE.MeshStandardMaterial({ color: this._materialColor(VISUAL.floorOuterColor), roughness: 0.95 });
      const base = new THREE.MeshStandardMaterial({ color: this._materialColor('#ece0cf'), roughness: 1.0 });
      const blockCol = saturate(STYLE.accent, 1.9);
      const block = new THREE.MeshStandardMaterial({ color: this._materialColor(blockCol), roughness: 0.6, metalness: 0.0, emissive: this._materialColor(shade(blockCol, -140)), emissiveIntensity: 0.25, map: this._makeBlockEdgeTexture() });
      const socket = new THREE.MeshStandardMaterial({ color: this._materialColor('#241f38'), roughness: 1.0 });
      return { wall, wallTop, floor, floorEdge, base, block, socket };
    }

    _materialColor(hex){ return col3(saturate(hex, 1.2)); }

    // Average the fill colours of every liquid touching a contested cell into one vivid mix
    // (e.g. rose + sky reads as purple) so a merge is unmistakable before the batch fails.
    _blendColors(mask){
      let r = 0, g = 0, b = 0, n = 0;
      for (let k = 0; k < LIQUIDS.length; k++) if (mask & (1 << k)){ const c = this._materialColor(LIQUIDS[k].fill); r += c.r; g += c.g; b += c.b; n++; }
      if (!n) return null;
      const col = new THREE.Color(r / n, g / n, b / n), hsl = {};
      col.getHSL(hsl); col.setHSL(hsl.h, Math.min(1, hsl.s * 1.4), hsl.l * 0.9);
      return col;
    }

    // Procedural border texture (dark frame on white) multiplied onto the block so its
    // silhouette edges read darker as part of the surface — no separate edge geometry.
    _makeBlockEdgeTexture(){
      const S = 128, t = Math.round(S * BLOCK_EDGE.thickness);
      const cv = document.createElement('canvas'); cv.width = cv.height = S;
      const g = cv.getContext('2d');
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, S, S);
      g.fillStyle = 'rgba(0,0,0,' + BLOCK_EDGE.darkness + ')';
      g.fillRect(0, 0, S, t); g.fillRect(0, S - t, S, t);
      g.fillRect(0, 0, t, S); g.fillRect(S - t, 0, t, S);
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.anisotropy = this.renderer ? this.renderer.capabilities.getMaxAnisotropy() : 1;
      return tex;
    }

    // Soft round sprite for the drain-waterfall particles: a white radial blob on transparent,
    // so each point renders as a soft droplet that blends into a stream.
    _makeDropletTexture(){
      if (this._dropletTex) return this._dropletTex;
      const S = 64, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const g = cv.getContext('2d');
      const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      grd.addColorStop(0.0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.55, 'rgba(255,255,255,0.96)');
      grd.addColorStop(0.82, 'rgba(255,255,255,0.45)');
      grd.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = grd; g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2); g.fill();
      const t = new THREE.CanvasTexture(cv);
      this._dropletTex = t;
      return t;
    }

    // One shared point-sprite material for every drain's waterfall particles. Per-particle colour,
    // alpha and world-size come from geometry attributes; `uPP` (pixels per world unit) is refreshed
    // each frame so the sprites keep a constant world size under the orthographic camera + zoom.
    // Depth-tested (but not depth-writing) so the opaque board naturally hides the part of the stream
    // still inside the shaft and reveals it pouring out below.
    _dropletMaterial(){
      if (this._dropletMat) return this._dropletMat;
      this._dropletMat = new THREE.ShaderMaterial({
        transparent: true, depthTest: true, depthWrite: false,
        uniforms: { uTex: { value: this._makeDropletTexture() }, uPP: { value: 120 } },
        vertexShader: `
          attribute float aSize; attribute float aAlpha; attribute vec3 aColor;
          uniform float uPP; varying float vAlpha; varying vec3 vColor;
          void main(){
            vColor = aColor; vAlpha = aAlpha;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = clamp(aSize * uPP, 1.0, 160.0);
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: `
          uniform sampler2D uTex; varying float vAlpha; varying vec3 vColor;
          void main(){
            float a = texture2D(uTex, gl_PointCoord).a * vAlpha;
            if (a < 0.01) discard;
            // linear (three.js Color) -> sRGB framebuffer, since a custom ShaderMaterial gets no auto conversion
            gl_FragColor = vec4(pow(vColor, vec3(0.4545)), a);
          }`
      });
      return this._dropletMat;
    }

    _makeBoardShadowTexture(){
      if (this.boardShadowTexture) return this.boardShadowTexture;
      const S = 128, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const g = cv.getContext('2d');
      const fade = g.createRadialGradient(S / 2, S / 2, S * 0.08, S / 2, S / 2, S / 2);
      fade.addColorStop(0, 'rgba(255,255,255,1)');
      fade.addColorStop(0.48, 'rgba(255,255,255,.62)');
      fade.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = fade; g.fillRect(0, 0, S, S);
      this.boardShadowTexture = new THREE.CanvasTexture(cv);
      return this.boardShadowTexture;
    }

    // Shared "drag me" arrow decal material (loaded once, reused across every piece/level).
    _dragArrowMaterial(){
      if (this._dragArrowMat) return this._dragArrowMat;
      const tex = new THREE.TextureLoader().load('Dragarrow.png');
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = this.renderer ? this.renderer.capabilities.getMaxAnisotropy() : 1;
      this._dragArrowMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
      return this._dragArrowMat;
    }

    _tapHandTexture(){
      if (this._tapHandTex) return this._tapHandTex;
      const tex = new THREE.TextureLoader().load('Icon-TapHand.png');
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = this.renderer ? this.renderer.capabilities.getMaxAnisotropy() : 1;
      this._tapHandTex = tex;
      return tex;
    }

    // Flat arrow lying on the piece's top face at its footprint centre; parents to the block
    // mesh so it inherits the same position/lift and pivots with the board (orthographic).
    _makeDragArrow(cells){
      const base = cells[0];
      let sx = 0, sz = 0;
      for (const cl of cells){ sx += (cl.c - base.c); sz += (cl.r - base.r); }
      sx /= cells.length; sz /= cells.length;
      const arrow = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), this._dragArrowMaterial());
      arrow.rotation.x = -Math.PI / 2;
      arrow.position.set(sx, H_BLOCK / 2 + 0.02, sz);
      arrow.renderOrder = 4;
      return arrow;
    }

    // ---- Lighting debug panel (ported from Soft3DTemplate.html; press L to toggle) ----
    _initLightingDebug(){
      const STORAGE_KEY = 'wbj-lighting-debug-v1';
      const hexOf = (light, prop) => '#' + light[prop || 'color'].getHexString();
      const defaults = {
        ambientIntensity: this.amb.intensity, ambientColor: hexOf(this.amb),
        hemiIntensity: this.hemi.intensity, hemiSkyColor: hexOf(this.hemi), hemiGroundColor: hexOf(this.hemi, 'groundColor'),
        keyIntensity: this.sun.intensity, keyColor: hexOf(this.sun),
        keyX: this.sun.position.x, keyY: this.sun.position.y, keyZ: this.sun.position.z,
        keyShadowBias: this.sun.shadow.bias, keyShadowNormalBias: this.sun.shadow.normalBias,
        fillIntensity: this.fill.intensity, fillColor: hexOf(this.fill),
        fillX: this.fill.position.x, fillY: this.fill.position.y, fillZ: this.fill.position.z
      };
      // Baked cross-device preset wins over the built-in defaults; a local Save still overrides both on this device.
      const preset = (LIGHTING_PRESET && typeof LIGHTING_PRESET === 'object') ? LIGHTING_PRESET : {};
      let state = Object.assign({}, defaults, preset);

      const apply = (s) => {
        this.amb.intensity = s.ambientIntensity; this.amb.color.set(s.ambientColor);
        this.hemi.intensity = s.hemiIntensity; this.hemi.color.set(s.hemiSkyColor); this.hemi.groundColor.set(s.hemiGroundColor);
        this.sun.intensity = s.keyIntensity; this.sun.color.set(s.keyColor);
        this.sun.position.set(s.keyX, s.keyY, s.keyZ);
        this.sun.shadow.bias = s.keyShadowBias; this.sun.shadow.normalBias = s.keyShadowNormalBias;
        this.fill.intensity = s.fillIntensity; this.fill.color.set(s.fillColor);
        this.fill.position.set(s.fillX, s.fillY, s.fillZ);
        this.lightDir = this.sun.position.clone().normalize();
      };

      const panel = document.createElement('div');
      panel.id = 'wbjLightingDebug';
      panel.style.cssText = 'position:fixed;right:14px;top:14px;width:min(360px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;z-index:9999;display:none;'
        + 'background:rgba(15,20,30,.86);color:#eef3ff;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px;'
        + 'box-shadow:0 10px 36px rgba(0,0,0,.36);backdrop-filter:blur(6px);font:12px/1.3 "Trebuchet MS",system-ui,sans-serif;';
      document.body.appendChild(panel);

      const updaters = [];
      const addTitle = (t) => { const h = document.createElement('h3'); h.textContent = t; h.style.cssText = 'margin:0 0 8px;font-size:13px;font-weight:700;'; panel.appendChild(h); };
      const addSection = (t) => { const n = document.createElement('div'); n.textContent = t; n.style.cssText = 'margin:12px 0 4px;font-weight:700;color:#b3c8ff;'; panel.appendChild(n); };
      const rowCss = 'display:grid;grid-template-columns:120px 1fr 64px;gap:6px;align-items:center;margin:6px 0;';

      const addRange = (label, key, min, max, step) => {
        const row = document.createElement('div'); row.style.cssText = rowCss;
        const name = document.createElement('label'); name.textContent = label;
        const slider = document.createElement('input'); slider.type = 'range'; slider.min = min; slider.max = max; slider.step = step; slider.style.width = '100%';
        const num = document.createElement('input'); num.type = 'number'; num.min = min; num.max = max; num.step = step;
        num.style.cssText = 'width:100%;box-sizing:border-box;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#eef3ff;padding:3px 5px;';
        const set = (v) => { const n = Number(v); if (!Number.isFinite(n)) return; state[key] = n; slider.value = n; num.value = n; apply(state); };
        slider.addEventListener('input', () => set(slider.value));
        num.addEventListener('change', () => set(num.value));
        row.append(name, slider, num); panel.appendChild(row);
        updaters.push(() => { slider.value = state[key]; num.value = state[key]; });
      };
      const addColor = (label, key) => {
        const row = document.createElement('div'); row.style.cssText = rowCss;
        const name = document.createElement('label'); name.textContent = label;
        const color = document.createElement('input'); color.type = 'color'; color.style.cssText = 'grid-column:2 / span 2;width:100%;height:28px;padding:0;border:0;background:transparent;';
        color.addEventListener('input', () => { state[key] = color.value; apply(state); });
        row.append(name, color); panel.appendChild(row);
        updaters.push(() => { color.value = state[key]; });
      };
      const refresh = () => updaters.forEach(fn => fn());

      addTitle('Lighting Debug (press L to toggle)');
      addSection('Ambient');
      addRange('Ambient Int', 'ambientIntensity', 0, 2.5, 0.01);
      addColor('Ambient Color', 'ambientColor');
      addSection('Hemisphere');
      addRange('Hemi Int', 'hemiIntensity', 0, 2.5, 0.01);
      addColor('Sky Color', 'hemiSkyColor');
      addColor('Ground Color', 'hemiGroundColor');
      addSection('Key Light');
      addRange('Key Int', 'keyIntensity', 0, 3.5, 0.01);
      addColor('Key Color', 'keyColor');
      addRange('Key X', 'keyX', -80, 80, 0.1);
      addRange('Key Y', 'keyY', -10, 120, 0.1);
      addRange('Key Z', 'keyZ', -80, 80, 0.1);
      addRange('Shadow Bias', 'keyShadowBias', -0.02, 0.02, 0.0001);
      addRange('Shadow N Bias', 'keyShadowNormalBias', 0, 2, 0.001);
      addSection('Fill Light');
      addRange('Fill Int', 'fillIntensity', 0, 3.5, 0.01);
      addColor('Fill Color', 'fillColor');
      addRange('Fill X', 'fillX', -80, 80, 0.1);
      addRange('Fill Y', 'fillY', -10, 120, 0.1);
      addRange('Fill Z', 'fillZ', -80, 80, 0.1);

      const actions = document.createElement('div'); actions.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;';
      const mkBtn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.style.cssText = 'border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);color:#f2f6ff;border-radius:8px;padding:6px 8px;cursor:pointer;font:12px/1 "Trebuchet MS",system-ui,sans-serif;'; b.addEventListener('click', fn); return b; };
      actions.append(
        mkBtn('Save', () => {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          const snippet = 'const LIGHTING_PRESET = ' + JSON.stringify(state) + ';';
          try { navigator.clipboard.writeText(snippet); } catch (e) {}
          console.log('[Lighting] Saved. To bake in for all devices, paste this over LIGHTING_PRESET in index.html:\n' + snippet);
        }),
        mkBtn('Load', () => { try { const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || ''); if (p){ state = Object.assign({}, defaults, preset, p); refresh(); apply(state); } } catch (e) {} }),
        mkBtn('Reset', () => { state = Object.assign({}, defaults, preset); refresh(); apply(state); })
      );
      panel.appendChild(actions);

      try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || ''); if (saved) state = Object.assign({}, defaults, preset, saved); } catch (e) {}
      refresh(); apply(state);

      window.addEventListener('keydown', (e) => {
        if ((e.key || '').toLowerCase() === 'l' && !/^(input|textarea)$/i.test((e.target && e.target.tagName) || '')){
          panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }
      });
    }

    // ---- DOM overlays: meters, curved rotate slider, FTUE card, warn vignette
    _buildDom(){
      const s = this.stage;
      // Warning vignette (mix danger) — mounted on the full-screen game container so it covers the level UI too.
      const warn = document.createElement('div');
      warn.style.cssText = 'position:absolute;inset:0;pointer-events:none;opacity:0;z-index:7;transition:opacity .12s;box-shadow:inset 0 0 60px 20px ' + STYLE.danger + ';';
      (document.getElementById('gameScreen') || s).appendChild(warn); this.warnEl = warn;

      // Meters (drain progress) — top centre.
      const meters = document.createElement('div');
      meters.style.cssText = 'position:absolute;top:30px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none;z-index:3;';
      s.appendChild(meters); this.metersEl = meters;

      // FTUE speech card — lower centre.
      const ftue = document.createElement('div');
      ftue.style.cssText = 'position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:94%;max-width:520px;padding:11px 26px;border-radius:20px;background:' + STYLE.panel + 'f5;border:3px solid ' + STYLE.accentSoft + ';color:' + STYLE.ink + ';font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:17px;text-align:center;line-height:1.28;box-shadow:0 8px 24px rgba(40,30,70,.18);display:none;z-index:4;cursor:pointer;touch-action:manipulation;box-sizing:border-box;';
      // Tapping the card itself also advances the FTUE (it sits above the canvas and would otherwise swallow the tap).
      ftue.addEventListener('pointerdown', (e) => { e.stopPropagation(); if (this.gameState === STATE.FTUE) this._dismissFtue(); });
      s.appendChild(ftue); this.ftueEl = ftue;

      // Colour-cleared celebration — bouncy badge + confetti burst near the meters.
      const celeb = document.createElement('div');
      celeb.className = 'color-cheer';
      s.appendChild(celeb); this.celebrateEl = celeb;

      this._buildSlider();
    }

    // Curved (bowed) camera-sweep slider under the level.
    _buildSlider(){
      const W = 220, H = 74, R = 260;   // arc radius for the shallow bow
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:' + W + 'px;height:' + H + 'px;z-index:4;touch-action:none;';
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('width', W); svg.setAttribute('height', H);
      svg.style.overflow = 'visible';
      // Bowed track: a shallow downward arc across the width.
      const cx = W / 2, topY = 20, midY = 46;
      const arcY = (t) => { const x = (t - 0.5) * 2; return topY + (midY - topY) * (1 - x * x); };
      const path = document.createElementNS(NS, 'path');
      let d = 'M 10 ' + arcY(0);
      for (let i = 1; i <= 40; i++){ const t = i / 40; d += ' L ' + (10 + t * (W - 20)) + ' ' + arcY(t); }
      path.setAttribute('d', d); path.setAttribute('fill', 'none');
      path.setAttribute('stroke', STYLE.accentSoft); path.setAttribute('stroke-width', '8'); path.setAttribute('stroke-linecap', 'round');
      svg.appendChild(path);
      // Centre detent tick.
      const tick = document.createElementNS(NS, 'line');
      tick.setAttribute('x1', cx); tick.setAttribute('x2', cx); tick.setAttribute('y1', arcY(0.5) - 9); tick.setAttribute('y2', arcY(0.5) + 9);
      tick.setAttribute('stroke', STYLE.dim); tick.setAttribute('stroke-width', '3'); tick.setAttribute('opacity', '0.5'); svg.appendChild(tick);
      // Knob.
      const knob = document.createElementNS(NS, 'circle');
      knob.setAttribute('r', '13'); knob.setAttribute('fill', STYLE.cta); knob.setAttribute('stroke', '#ffffff'); knob.setAttribute('stroke-width', '3');
      svg.appendChild(knob);
      wrap.appendChild(svg); this.stage.appendChild(wrap);
      this.sliderWrap = wrap;

      const xToT = (px) => Math.max(0, Math.min(1, (px - 10) / (W - 20)));
      const place = (t) => { knob.setAttribute('cx', 10 + t * (W - 20)); knob.setAttribute('cy', arcY(t)); };
      let sliderT = 0.5; place(sliderT);
      // Knob position is driven by the shared rotTarget so board-drag rotation stays in sync.
      this._placeSliderKnob = (t) => { sliderT = t; place(t); };
      const apply = (t) => { this._setRotTarget((t - 0.5) * CAM_SWEEP); };
      let dragging = false;
      const toLocalX = (e) => { const r = svg.getBoundingClientRect(); const cx0 = (e.touches ? e.touches[0].clientX : e.clientX); return cx0 - r.left; };
      const down = (e) => { dragging = true; apply(xToT(toLocalX(e))); if (window.KPF) window.KPF.haptic('tap'); e.preventDefault(); e.stopPropagation(); };
      const move = (e) => { if (!dragging) return; apply(xToT(toLocalX(e))); e.preventDefault(); };
      const up = () => { if (!dragging) return; dragging = false; if (Math.abs(sliderT - 0.5) < 0.06) apply(0.5); };
      wrap.addEventListener('pointerdown', down);
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      this._sliderReset = () => apply(0.5);
    }

    // Clamp + apply a camera sweep target, keeping the slider knob in sync.
    _setRotTarget(rot){
      const lim = CAM_SWEEP / 2;
      this.rotTarget = Math.max(-lim, Math.min(lim, rot));
      if (this._placeSliderKnob) this._placeSliderKnob(this.rotTarget / CAM_SWEEP + 0.5);
    }

    _bindInput(){
      const el = this.renderer.domElement;
      this.raycaster = new THREE.Raycaster();
      const ndc = (e) => { const r = el.getBoundingClientRect(); return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); };
      const down = (e) => this._onDown(ndc(e));
      const move = (e) => this._onMove(ndc(e));
      const up = () => this._onUp();
      el.addEventListener('pointerdown', down);
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }

    _resize(){
      if (!this.renderer) return;
      const w = this.stage.clientWidth || 1, h = this.stage.clientHeight || 1;
      this.vw = w; this.vh = h;
      this.renderer.setSize(w, h, false);
      if (this.rows) this._fitCamera();
    }

    // ---- level lifecycle ----------------------------------------------------
    startLevel(levelNum){
      if (!this.ready){ this._pending = levelNum; return; }
      this.beginLevel(this._idx(levelNum));
    }

    beginLevel(levelIdx){
      this.levelIdx = levelIdx;
      this.cfg = LEVELS[levelIdx];
      if (!EDIT_TEST){ state.level = this.cfg.id; persist(); }
      this._clearLevel();
      this._buildLevel(this.cfg);
      this.gameState = STATE.PLAY;
      this.mixT = 0; this.warned = false; this.tSim = 0;
      this.rotTarget = 0; this.rotCur = 0; this.pivot.rotation.y = 0;
      if (this._sliderReset) this._sliderReset();
      this._buildMeters();
      this.timeLimitMs = this.cfg.timeMs || TUNING.levelTimeMs;
      this.timeLeftMs = this.timeLimitMs;
      this.timerStarted = false; // hold the countdown until the first player interaction
      this._pauseReasons = null;
      this._resumeState = null;
      this._updateTimer();
      // Level-intro tutorials — each mechanic's card replays every time its level is played
      // (previously flow/drains/mix were suppressed after one view, so stale localStorage flags
      // hid every tutorial past level 1).
      if (!EDIT_TEST){
        if (levelIdx === 0) this._runFtue('move');
        else if (levelIdx === 1) this._runFtue('flow');
        else if (levelIdx === 3) this._runFtue('drains');
        else if (levelIdx === 4) this._runFtue('mix');
        else if (levelIdx === 10) this._runFtue('gate');
      }
    }

    _clearLevel(){
      this._clearFtue();
      this.drag = null; this.camDrag = null;
      if (this.boardGroup){ while (this.boardGroup.children.length) { const c = this.boardGroup.children.pop(); this._disposeObj(c); } }
      this.pieceMeshes = null; this.gateGroups = null; this.drainMeshes = null; this.sourceMeshes = null; this.water = null;
      this.rings = []; this.ringPool = null;
      this._hideCelebrate();
      this._setWarn(false);
    }

    _disposeObj(o){ o.traverse && o.traverse(n => { if (n.geometry) n.geometry.dispose(); }); if (o.geometry) o.geometry.dispose(); }

    _buildLevel(cfg){
      const grid = cfg.grid, rows = grid.length, cols = grid[0].length;
      this.rows = rows; this.cols = cols;
      this.camQuarter = 0;

      // Parse grid → data model (identical semantics to the original).
      this.cells = []; this.sources = []; this.drains = [];
      const pieceCells = {}; const usedColors = new Set();
      for (let r = 0; r < rows; r++){
        this.cells[r] = [];
        for (let c = 0; c < cols; c++){
          const ch = grid[r][c]; let type = 'empty', color = -1;
          if (ch === '#') type = 'wall';
          else if (ch >= '1' && ch <= '4'){ type = 'src'; color = +ch - 1; }
          else if (ch >= 'A' && ch <= 'D'){ type = 'drain'; color = ch.charCodeAt(0) - 65; }
          else if (ch >= 'E' && ch <= 'H'){ type = 'gate'; color = ch.charCodeAt(0) - 69; }
          else if (ch >= 'a' && ch <= 'z') (pieceCells[ch] = pieceCells[ch] || []).push({ r, c });
          this.cells[r][c] = { type, color };
          if (type === 'src'){ this.sources.push({ r, c, color }); usedColors.add(color); }
          else if (type === 'drain'){ this.drains.push({ r, c, color, prog: 0, open: 0 }); usedColors.add(color); }
        }
      }
      this.pieces = [];
      Object.keys(pieceCells).forEach((letter) => {
        const arr = pieceCells[letter];
        this.pieces.push({ letter, cells: arr.map(a => ({ r: a.r, c: a.c })) });
      });
      this.gates = []; this.gateByCell = new Map();
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (this.cells[r][c].type === 'gate'){
        const gt = { r, c, color: this.cells[r][c].color, state: 'solid', meltT: 0, delay: 0 };
        this.gates.push(gt); this.gateByCell.set(r * cols + c, gt);
      }
      this.level = []; this.wetColor = []; this.wetMix = []; this.mixEase = []; this.rh = []; this.rv = [];
      for (let r = 0; r < rows; r++){ this.level[r] = new Array(cols).fill(0); this.wetColor[r] = new Array(cols).fill(-1); this.wetMix[r] = new Array(cols).fill(null); this.mixEase[r] = new Array(cols).fill(0); this.rh[r] = new Array(cols).fill(0); this.rv[r] = new Array(cols).fill(0); }
      this.usedColors = [...usedColors].sort((a, b) => a - b);
      this.completed = {}; this.rings = [];

      this.rebuildOcc();
      this._buildMeshes();
      this.simulate();
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){ this.level[r][c] = this.targetLevel(r, c); if (this.colorGrid[r][c] >= 0){ this.wetColor[r][c] = this.colorGrid[r][c]; this.wetMix[r][c] = this.mixGrid[r][c]; } }
      this._fitCamera();
    }

    cx(c){ return c - (this.cols - 1) / 2; }
    cz(r){ return r - (this.rows - 1) / 2; }

    _buildMeshes(){
      const rows = this.rows, cols = this.cols, G = this.boardGroup, M = this.mats;
      const shadowGeo = new THREE.CircleGeometry(1, 48);
      const shadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({ color: 0xba9a84, map: this._makeBoardShadowTexture(), transparent: true, opacity: 0.22, depthWrite: false }));
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = -BASE_THICK - 0.07;
      shadow.scale.set((cols + 0.3) * 0.68, (rows + 0.3) * 0.68, 1);
      G.add(shadow);

      // Floating base slab.
      const base = new THREE.Mesh(new THREE.BoxGeometry(cols + 0.3, BASE_THICK, rows + 0.3), M.base);
      base.position.set(0, -BASE_THICK / 2 - 0.03, 0); base.receiveShadow = true; G.add(base);

      const floorGeo = new THREE.BoxGeometry(0.96, 0.12, 0.96);
      this.pieceMeshes = new Map(); this.gateGroups = []; this.drainMeshes = new Map(); this.sourceMeshes = new Map();
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
        const cell = this.cells[r][c], x = this.cx(c), z = this.cz(r);
        if (cell.type !== 'wall'){
          const tile = new THREE.Mesh(floorGeo, M.floor);
          tile.position.set(x, -0.06, z); tile.receiveShadow = true; G.add(tile);
        }
        if (cell.type === 'wall'){
          // Full-size (1.0) and flush against neighbours so walls read as one continuous mesh.
          const w = new THREE.Mesh(new THREE.BoxGeometry(1.0, H_WALL, 1.0), M.wall);
          w.position.set(x, H_WALL / 2, z); w.castShadow = true; w.receiveShadow = true; G.add(w);
          const cap = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.06, 1.0), M.wallTop);
          cap.position.set(x, H_WALL + 0.01, z); cap.receiveShadow = true; G.add(cap);
        } else if (cell.type === 'src'){
          this._buildSource(r, c);
        } else if (cell.type === 'drain'){
          this._buildDrain(r, c);
        }
      }
      // Slime gates: one merged mesh per colour (built like a movable block).
      this._buildGates();
      // Movable blocks: one merged, single-entity mesh per piece (no internal seams between its cells).
      for (const piece of this.pieces){
        const grp = new THREE.Group();
        const geo = this._buildPieceGeometry(piece.cells);
        const mesh = new THREE.Mesh(geo, M.block);
        mesh.castShadow = true; mesh.receiveShadow = true; mesh.userData.piece = piece;
        mesh.scale.setScalar(0.95);
        mesh.add(this._makeDragArrow(piece.cells));
        // White outline (inverted hull) shown only while the block is held.
        const outline = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide }));
        outline.scale.setScalar(1.06); outline.visible = false; outline.renderOrder = 1;
        mesh.add(outline);
        grp.add(mesh);
        G.add(grp);
        this.pieceMeshes.set(piece, { group: grp, mesh, outline, anchor: piece.cells[0] });
      }
      this._buildWater();
      this._syncPieces();
    }

    // Builds a single watertight geometry for a piece's footprint, culling faces shared
    // between adjacent cells so the whole shape renders as one seamless solid.
    _buildPieceGeometry(cells, hy = H_BLOCK / 2, t = BLOCK_EDGE.thickness){
      const set = new Set(cells.map(cl => cl.r + ',' + cl.c));
      const has = (r, c) => set.has(r + ',' + c);
      const hw = 0.5;
      const base = cells[0];
      const positions = [], normals = [], uvs = [], indices = [];
      let vi = 0;
      // A side maps to UV 0/1 when it should show the border, or the inset (t / 1-t) to hide it
      // along internal seams so multi-cell pieces stay frameless on the inside.
      const lo = (border) => border ? 0 : t;
      const hi = (border) => border ? 1 : 1 - t;
      const quad = (p0, p1, p2, p3, n, uv) => {
        positions.push(...p0, ...p1, ...p2, ...p3);
        for (let i = 0; i < 4; i++) normals.push(...n);
        uvs.push(...uv[0], ...uv[1], ...uv[2], ...uv[3]);
        indices.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
        vi += 4;
      };
      for (const cl of cells){
        const r = cl.r, c = cl.c;
        const ox = c - base.c, oz = r - base.r;
        const x0 = ox - hw, x1 = ox + hw, z0 = oz - hw, z1 = oz + hw, y0 = -hy, y1 = hy;
        // Top / bottom: border on the sides with no orthogonal neighbour.
        {
          const uL = lo(!has(r, c - 1)), uH = hi(!has(r, c + 1));
          const vL = lo(!has(r - 1, c)), vH = hi(!has(r + 1, c));
          quad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], [0, 1, 0], [[uL, vH], [uH, vH], [uH, vL], [uL, vL]]);
          quad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], [0, -1, 0], [[uL, vL], [uH, vL], [uH, vH], [uL, vH]]);
        }
        // Vertical walls: horizontal border hidden where the flat face continues into a
        // co-planar neighbour; vertical (top/bottom) border always shown.
        if (!has(r, c + 1)){
          const uL = lo(!(has(r - 1, c) && !has(r - 1, c + 1))), uH = hi(!(has(r + 1, c) && !has(r + 1, c + 1)));
          quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [1, 0, 0], [[uH, 0], [uL, 0], [uL, 1], [uH, 1]]);
        }
        if (!has(r, c - 1)){
          const uL = lo(!(has(r - 1, c) && !has(r - 1, c - 1))), uH = hi(!(has(r + 1, c) && !has(r + 1, c - 1)));
          quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [-1, 0, 0], [[uL, 0], [uH, 0], [uH, 1], [uL, 1]]);
        }
        if (!has(r + 1, c)){
          const uL = lo(!(has(r, c - 1) && !has(r + 1, c - 1))), uH = hi(!(has(r, c + 1) && !has(r + 1, c + 1)));
          quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], [0, 0, 1], [[uL, 0], [uH, 0], [uH, 1], [uL, 1]]);
        }
        if (!has(r - 1, c)){
          const uL = lo(!(has(r, c - 1) && !has(r - 1, c - 1))), uH = hi(!(has(r, c + 1) && !has(r - 1, c + 1)));
          quad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], [0, 0, -1], [[uH, 0], [uL, 0], [uL, 1], [uH, 1]]);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      return geo;
    }

    // Inward facing (dr,dc) for a source: toward the open flow cell, back-wall against the edge.
    // A level may list "r,c" cells in cfg.flipSources to flip that pipe 180°.
    _sourceFacing(r, c){
      const flip = this.cfg && this.cfg.flipSources && this.cfg.flipSources.includes(r + ',' + c);
      const F = (d) => flip ? { dr: -d.dr, dc: -d.dc } : d;
      const dirs = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];
      const inb = (rr, cc) => rr >= 0 && cc >= 0 && rr < this.rows && cc < this.cols;
      const flow = (rr, cc) => inb(rr, cc) && this.cells[rr][cc].type !== 'wall' && this.cells[rr][cc].type !== 'src';
      const outer = (rr, cc) => !inb(rr, cc) || this.cells[rr][cc].type === 'wall';
      for (const d of dirs) if (flow(r + d.dr, c + d.dc) && outer(r - d.dr, c - d.dc)) return F(d);
      for (const d of dirs) if (flow(r + d.dr, c + d.dc)) return F(d);
      const dc = Math.sign((this.cols - 1) / 2 - c), dr = Math.sign((this.rows - 1) / 2 - r);
      return F(Math.abs(dc) >= Math.abs(dr) ? { dr: 0, dc: dc || 1 } : { dr: dr || 1, dc: 0 });
    }

    _buildSource(r, c){
      const color = this.cells[r][c].color, L = LIQUIDS[color];
      const x = this.cx(c), z = this.cz(r);
      const f = this._sourceFacing(r, c);
      const grp = new THREE.Group();
      grp.position.set(x, 0, z);
      grp.rotation.y = Math.atan2(f.dc, f.dr);   // local +Z points inward toward the board
      this.boardGroup.add(grp);

      // Half-depth back wall on the outer half of the cell, matching the surrounding wall ring.
      const wall = new THREE.Mesh(new THREE.BoxGeometry(1.0, H_WALL, 0.5), this.mats.wall);
      wall.position.set(0, H_WALL / 2, -0.25); wall.castShadow = true; wall.receiveShadow = true; grp.add(wall);
      const cap = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.06, 0.5), this.mats.wallTop);
      cap.position.set(0, H_WALL + 0.01, -0.25); cap.receiveShadow = true; grp.add(cap);

      // Mario-style pipe (liquid colour) protruding inward from the back wall.
      const pipeMat = new THREE.MeshStandardMaterial({ color: this._materialColor(L.fill), roughness: 0.4, metalness: 0.1, emissive: this._materialColor(shade(L.edge, -60)), emissiveIntensity: 0.22 });
      const grateMat = new THREE.MeshStandardMaterial({ color: this._materialColor('#c9cede'), roughness: 0.4, metalness: 0.6 });
      const mouthY = H_WALL * 0.6, mouthZ = 0.47;
      const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.5, 24), pipeMat);
      tube.rotation.x = Math.PI / 2; tube.position.set(0, mouthY, 0.16); tube.castShadow = true; tube.receiveShadow = true; grp.add(tube);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.13, 24), pipeMat);
      rim.rotation.x = Math.PI / 2; rim.position.set(0, mouthY, 0.4); rim.castShadow = true; grp.add(rim);

      // Grey grate cover: bar grid + ring; gaps let the water spill through.
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.185, 0.022, 8, 24), grateMat);
      ring.position.set(0, mouthY, mouthZ); grp.add(ring);
      const barH = new THREE.BoxGeometry(0.34, 0.045, 0.02), barV = new THREE.BoxGeometry(0.045, 0.34, 0.02);
      for (const o of [-0.11, 0, 0.11]){
        const bh = new THREE.Mesh(barH, grateMat); bh.position.set(0, mouthY + o, mouthZ); grp.add(bh);
        const bv = new THREE.Mesh(barV, grateMat); bv.position.set(o, mouthY, mouthZ); grp.add(bv);
      }

      // Little arrow on top of the half wall, in the pipe's colour, pointing inward toward the pipe.
      const aw = 0.05, ahw = 0.12, aLen = 0.30, aHead = 0.13;
      const aShape = new THREE.Shape();
      aShape.moveTo(-aw, 0); aShape.lineTo(-aw, aLen - aHead); aShape.lineTo(-ahw, aLen - aHead);
      aShape.lineTo(0, aLen); aShape.lineTo(ahw, aLen - aHead); aShape.lineTo(aw, aLen - aHead);
      aShape.lineTo(aw, 0); aShape.closePath();
      const arrow = new THREE.Mesh(new THREE.ExtrudeGeometry(aShape, { depth: 0.03, bevelEnabled: false }), pipeMat);
      arrow.rotation.x = Math.PI / 2; arrow.position.set(0, H_WALL + 0.07, -0.42);
      arrow.castShadow = true; grp.add(arrow);

      // Pouring water VFX: a translucent core column plus falling droplets that splash on landing.
      const pourMat = new THREE.MeshStandardMaterial({ color: this._materialColor(L.fill), emissive: this._materialColor(L.fill), emissiveIntensity: 0.35, roughness: 0.15, metalness: 0.0, transparent: true, opacity: 0.6, depthWrite: false });
      const pourZ = mouthZ - 0.03, topY = mouthY - 0.05, botY = 0.06;
      const core = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.075, 1, 12, 1, true), pourMat);
      core.position.set(0, (topY + botY) / 2, pourZ); core.scale.y = Math.max(0.1, topY - botY); grp.add(core);
      const dropGeo = new THREE.SphereGeometry(0.05, 10, 8);
      const drops = [];
      for (let i = 0; i < 3; i++){
        const d = new THREE.Mesh(dropGeo, pourMat.clone()); d.position.set(0, topY, pourZ); grp.add(d);
        drops.push({ mesh: d, t: i / 3 });
      }
      const land = { r: r + f.dr, c: c + f.dc };
      this.sourceMeshes.set(r * this.cols + c, { grp, pourMat, core, drops, topY, botY, land, color, fill: 1 });
    }

    // Nearest wall cell to (r,c), returned as an anchor point in the drain group's local space.
    _nearestWallAnchor(r, c){
      let best = null, bd = Infinity;
      for (let rr = 0; rr < this.rows; rr++) for (let cc = 0; cc < this.cols; cc++){
        if (this.cells[rr][cc].type !== 'wall') continue;
        const d = (rr - r) * (rr - r) + (cc - c) * (cc - c);
        if (d < bd){ bd = d; best = { r: rr, c: cc }; }
      }
      if (!best) return null;
      let dx = best.c - c, dz = best.r - r;
      const len = Math.hypot(dx, dz) || 1, ux = dx / len, uz = dz / len;
      // Bolt point: on the wall's face closest to the drain, near its top.
      return { x: dx - ux * 0.5, y: H_WALL - 0.06, z: dz - uz * 0.5 };
    }

    _buildDrain(r, c){
      const L = LIQUIDS[this.cells[r][c].color], x = this.cx(c), z = this.cz(r);
      const fill = this._materialColor(L.fill);
      const grp = new THREE.Group(); grp.position.set(x, 0, z); this.boardGroup.add(grp);

      // Dark shaft the water drains down into. Top poked slightly above the floor plane to avoid z-fighting with the board mesh.
      const shaftTopOverlap = 0.02;
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.28, 0.8 + shaftTopOverlap, 24), this.mats.socket);
      shaft.position.set(0, -0.4 + shaftTopOverlap / 2, 0); grp.add(shaft);

      // Metallic rim around the hole.
      const metalMat = new THREE.MeshStandardMaterial({ color: this._materialColor('#c9cede'), roughness: 0.4, metalness: 0.6 });
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.05, 10, 28), metalMat);
      rim.rotation.x = Math.PI / 2; rim.position.set(0, 0.0, 0); rim.receiveShadow = true; grp.add(rim);

      // Circular plug (tapered cylinder) that seals the drain hole.
      const plug = new THREE.Group();
      const plugMat = new THREE.MeshStandardMaterial({ color: fill, roughness: 0.4, metalness: 0.1, emissive: this._materialColor(shade(L.edge, -60)), emissiveIntensity: 0.25 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.34, 0.2, 24), plugMat);
      body.castShadow = true; body.receiveShadow = true; plug.add(body);

      // Golf-style flag sat above the plug, in the drain's liquid colour and tall enough to poke above
      // the water line so the drain stays identifiable even on dense, flooded boards.
      const poleMat = new THREE.MeshStandardMaterial({ color: this._materialColor('#eef1f8'), roughness: 0.5, metalness: 0.4 });
      const flagMat = new THREE.MeshStandardMaterial({ color: fill, roughness: 0.45, metalness: 0.05, emissive: this._materialColor(shade(L.edge, -60)), emissiveIntensity: 0.32, side: THREE.DoubleSide });
      const poleBaseY = 0.08, poleH = 0.95;
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, poleH, 10), poleMat);
      pole.position.y = poleBaseY + poleH / 2; pole.castShadow = true; plug.add(pole);
      const finial = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), poleMat);
      finial.position.y = poleBaseY + poleH; plug.add(finial);
      // Triangular pennant hanging off the top of the pole, subdivided into a small grid so it can
      // ripple gently as if blowing in the wind (animated per-frame in _syncDrain).
      const flagTopY = poleBaseY + poleH - 0.05, flagBotY = flagTopY - 0.26, flagTipX = 0.36;
      const flagPoleX = 0.02, flagMidY = (flagTopY + flagBotY) / 2;
      const FLAG_COLS = 10, FLAG_ROWS = 3;
      const flagVerts = (FLAG_COLS + 1) * (FLAG_ROWS + 1);
      const flagPos = new Float32Array(flagVerts * 3);
      const flagBaseY = new Float32Array(flagVerts);
      const flagU = new Float32Array(flagVerts);
      for (let i = 0; i <= FLAG_COLS; i++){
        const u = i / FLAG_COLS;                                   // 0 at pole, 1 at free tip
        const x = flagPoleX + (flagTipX - flagPoleX) * u;
        const topY = flagTopY + (flagMidY - flagTopY) * u;         // triangle narrows to the tip
        const botY = flagBotY + (flagMidY - flagBotY) * u;
        for (let j = 0; j <= FLAG_ROWS; j++){
          const v = j / FLAG_ROWS, idx = i * (FLAG_ROWS + 1) + j;
          const y = botY + (topY - botY) * v;
          flagPos[idx * 3] = x; flagPos[idx * 3 + 1] = y; flagPos[idx * 3 + 2] = 0;
          flagBaseY[idx] = y; flagU[idx] = u;
        }
      }
      const flagIdx = [];
      for (let i = 0; i < FLAG_COLS; i++) for (let j = 0; j < FLAG_ROWS; j++){
        const a = i * (FLAG_ROWS + 1) + j, b = a + (FLAG_ROWS + 1);
        flagIdx.push(a, b, a + 1, a + 1, b, b + 1);
      }
      const flagGeo = new THREE.BufferGeometry();
      flagGeo.setAttribute('position', new THREE.BufferAttribute(flagPos, 3));
      flagGeo.setIndex(flagIdx);
      flagGeo.computeVertexNormals();
      const flag = new THREE.Mesh(flagGeo, flagMat);
      flag.castShadow = true; plug.add(flag);
      grp.add(plug);

      // ---- Draining waterfall (particle spray) -------------------------------------------------
      // A pool of soft point-sprites spills from the drain throat, falls through the shaft and pours
      // out beneath the floating board, drifting toward the camera so it shows against the background
      // as it drains away. The shared material is depth-tested, so the board hides the part still in
      // the shaft and reveals the stream below — no mesh geometry involved.
      const P = VISUAL.drainParticleCount;
      const pPos = new Float32Array(P * 3);
      const pCol = new Float32Array(P * 3);
      const pAlpha = new Float32Array(P);
      const pSize = new Float32Array(P);
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3));
      pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1));
      pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
      const points = new THREE.Points(pGeo, this._dropletMaterial());
      points.frustumCulled = false; points.visible = false; points.renderOrder = 3; grp.add(points);
      const waterCol = new THREE.Color(fill), foamColor = new THREE.Color(this._materialColor(L.foam));
      const parts = [];
      for (let i = 0; i < P; i++) parts.push({ life: 0, ttl: 0, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, size: 0, foam: false });

      this.drainMeshes.set(r * this.cols + c, { plug, points, pGeo, pPos, pCol, pAlpha, pSize, parts, spawnAcc: 0, waterCol, foamColor, lean: VISUAL.drainCascadeLean, flag, flagGeo, flagPos, flagBaseY, flagU });

    }

    // Slime gates: group every gate cell by colour into one merged, single-entity mesh
    // (matching the movable blocks) and give it the same baked edge-outline texture tinted
    // to its liquid. A water fill bar is overlaid on the top face like the drag arrows.
    // Split cells (same colour) into 4-connected clusters so each contiguous slime
    // block becomes its own mesh — otherwise disconnected same-colour gates merge into
    // one mesh whose fill bar sits at their combined centroid (floating off the blocks).
    _gateClusters(cells){
      const key = cl => cl.r + ',' + cl.c;
      const remaining = new Map(cells.map(cl => [key(cl), cl]));
      const clusters = [];
      for (const cl of cells){
        if (!remaining.has(key(cl))) continue;
        const cluster = [], stack = [cl];
        remaining.delete(key(cl));
        while (stack.length){
          const cur = stack.pop(); cluster.push(cur);
          for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
            const nk = (cur.r + dr) + ',' + (cur.c + dc), nb = remaining.get(nk);
            if (nb){ remaining.delete(nk); stack.push(nb); }
          }
        }
        clusters.push(cluster);
      }
      return clusters;
    }

    _buildGates(){
      this.gateGroups = [];
      if (!this.gates || !this.gates.length) return;
      const byColor = new Map();
      for (const gt of this.gates){ if (!byColor.has(gt.color)) byColor.set(gt.color, []); byColor.get(gt.color).push({ r: gt.r, c: gt.c }); }
      for (const [color, allCells] of byColor) for (const cells of this._gateClusters(allCells)){
        const L = LIQUIDS[color], base = shade(L.fill, VISUAL.gateShadeOffset);
        const mat = new THREE.MeshStandardMaterial({ color: this._materialColor(base), roughness: 0.3, metalness: 0.0, transparent: true, opacity: 0.94, emissive: this._materialColor(shade(base, -80)), emissiveIntensity: 0.22, map: this._makeBlockEdgeTexture() });
        const mesh = new THREE.Mesh(this._buildPieceGeometry(cells, H_WALL / 2), mat);
        const anchor = cells[0];
        mesh.position.set(this.cx(anchor.c), H_WALL / 2, this.cz(anchor.r));
        mesh.scale.setScalar(0.95); mesh.castShadow = true; mesh.receiveShadow = true;
        this.boardGroup.add(mesh);
        const fillBar = this._makeGateFillBar(cells, color);
        mesh.add(fillBar.group);
        this.gateGroups.push({ color, cells, mesh, mat, baseH: H_WALL, fillBar });
      }
    }

    // Horizontal water-remaining bar lying on the gate's top face at its footprint centre,
    // parented to the gate mesh so it tracks the same pivot/position (same as the drag arrows).
    _makeGateFillBar(cells, color){
      const base = cells[0], L = LIQUIDS[color];
      let sx = 0, sz = 0;
      for (const cl of cells){ sx += (cl.c - base.c); sz += (cl.r - base.r); }
      sx /= cells.length; sz /= cells.length;
      // Keep the true centroid (correct centre for straight/even-length blocks); only if it
      // lands over an empty notch (e.g. inner corner of an L-shape) snap to the nearest cell.
      let bx = sx, bz = sz;
      const has = (oz, ox) => cells.some(cl => (cl.c - base.c) === ox && (cl.r - base.r) === oz);
      if (!has(Math.round(sz), Math.round(sx))){
        let best = Infinity;
        for (const cl of cells){
          const ox = cl.c - base.c, oz = cl.r - base.r, d = (ox - sx) * (ox - sx) + (oz - sz) * (oz - sz);
          if (d < best){ best = d; bx = ox; bz = oz; }
        }
      }
      const grp = new THREE.Group();
      grp.rotation.x = -Math.PI / 2;
      grp.position.set(bx, H_WALL / 2 + 0.03, bz);
      const W = 0.66, Hh = 0.16, bd = 0.05;
      const frame = new THREE.Mesh(new THREE.PlaneGeometry(W + bd, Hh + bd), new THREE.MeshBasicMaterial({ color: this._materialColor(shade(L.edge, -90)), transparent: true, depthWrite: false }));
      frame.renderOrder = 5; grp.add(frame);
      const track = new THREE.Mesh(new THREE.PlaneGeometry(W, Hh), new THREE.MeshBasicMaterial({ color: col3('#2c2740'), transparent: true, opacity: 0.5, depthWrite: false }));
      track.position.z = 0.001; track.renderOrder = 6; grp.add(track);
      const innerW = W - 0.03, innerH = Hh - 0.03;
      const fillGeo = new THREE.PlaneGeometry(innerW, innerH); fillGeo.translate(innerW / 2, 0, 0);
      const fill = new THREE.Mesh(fillGeo, new THREE.MeshBasicMaterial({ color: this._materialColor(L.fill), transparent: true, depthWrite: false }));
      fill.position.set(-innerW / 2, 0, 0.002); fill.renderOrder = 7; grp.add(fill);
      return { group: grp, fill };
    }

    // ---- water surface (Phase 1: rippling shaded sheet; Phase 2 upgrades this)
    _buildWater(){
      const rows = this.rows, cols = this.cols;
      const nx = cols + 1, nz = rows + 1;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(nx * nz * 3);
      const acol = new Float32Array(nx * nz * 3);
      const aal = new Float32Array(nx * nz);
      for (let iz = 0; iz < nz; iz++) for (let ix = 0; ix < nx; ix++){
        const k = iz * nx + ix;
        pos[k * 3] = ix - cols / 2; pos[k * 3 + 1] = 0; pos[k * 3 + 2] = iz - rows / 2;
      }
      const idx = [];
      for (let iz = 0; iz < rows; iz++) for (let ix = 0; ix < cols; ix++){
        const a = iz * nx + ix, b = a + 1, cc = a + nx, d = cc + 1;
        idx.push(a, cc, b, b, cc, d);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(acol, 3));
      geo.setAttribute('aAlpha', new THREE.BufferAttribute(aal, 1));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        uniforms: { uLightDir: { value: this.lightDir.clone() }, uSky: { value: this._materialColor('#bfe0ff') }, uOpacity: { value: 0.9 } },
        vertexShader: [
          'attribute vec3 aColor; attribute float aAlpha;',
          'varying vec3 vColor; varying float vAlpha; varying vec3 vN; varying vec3 vView;',
          'void main(){ vColor=aColor; vAlpha=aAlpha;',
          '  vec4 wp = modelMatrix * vec4(position,1.0);',
          '  vN = normalize(mat3(modelMatrix) * normal);',
          '  vView = normalize(cameraPosition - wp.xyz);',
          '  gl_Position = projectionMatrix * viewMatrix * wp; }'
        ].join('\n'),
        fragmentShader: [
          'uniform vec3 uLightDir; uniform vec3 uSky; uniform float uOpacity;',
          'varying vec3 vColor; varying float vAlpha; varying vec3 vN; varying vec3 vView;',
          'void main(){ if(vAlpha < 0.01) discard;',
          '  vec3 N=normalize(vN), L=normalize(uLightDir), V=normalize(vView);',
          '  float diff=0.74+0.30*max(dot(N,L),0.0);',
          '  vec3 H=normalize(L+V); float spec=pow(max(dot(N,H),0.0),80.0);',
          '  float fres=pow(1.0-max(dot(N,V),0.0),3.0);',
          '  vec3 col=vColor*diff + vec3(1.0)*spec*0.9 + uSky*fres*0.6;',
          '  gl_FragColor=vec4(col, clamp(vAlpha*uOpacity + fres*0.25, 0.0, 1.0)); }'
        ].join('\n')
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.frustumCulled = false; mesh.renderOrder = 2;
      this.boardGroup.add(mesh);
      this.water = { mesh, geo, pos, acol, aal, nx, nz };

      // Ripple ring pool (surface feedback).
      this.ringPool = [];
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false });
      for (let i = 0; i < 20; i++){
        const rm = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.28, 24), ringMat.clone());
        rm.rotation.x = -Math.PI / 2; rm.visible = false; rm.renderOrder = 3;
        this.boardGroup.add(rm); this.ringPool.push(rm);
      }
    }

    _fitCamera(){
      if (!this.camera || !this.rows) return;
      const cam = this.camera, cols = this.cols, rows = this.rows;
      const dist = Math.max(cols, rows) + 22;
      cam.position.copy(this.camDir.clone().multiplyScalar(dist));
      cam.up.set(0, 1, 0); cam.lookAt(0, 0.1, 0);
      cam.updateMatrixWorld(true);
      const inv = new THREE.Matrix4().copy(cam.matrixWorld).invert();
      const hC = cols / 2 + 0.4, hR = rows / 2 + 0.4, maxY = Math.max(H_BLOCK, H_WALL) + 0.4;
      let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
      // Fit the board bbox at the widest sweep so nothing clips while rotating.
      for (const rot of [-CAM_SWEEP / 2, 0, CAM_SWEEP / 2]){
        const rm = new THREE.Matrix4().makeRotationY(rot);
        for (const sx of [-hC, hC]) for (const sy of [-BASE_THICK, maxY]) for (const sz of [-hR, hR]){
          const p = new THREE.Vector3(sx, sy, sz).applyMatrix4(rm).applyMatrix4(inv);
          minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y);
        }
      }
      const pad = 0.25;
      let w = (maxx - minx) / 2 + pad, h = (maxy - miny) / 2 + pad;
      const aspect = (this.vw || 1) / (this.vh || 1);
      if (w / h < aspect) w = h * aspect; else h = w / aspect;
      cam.left = -w; cam.right = w; cam.top = h; cam.bottom = -h; cam.near = -dist * 3; cam.far = dist * 3;
      // Pan the board up the screen by offsetting the render window down (aspect/zoom-independent).
      cam.setViewOffset(1, 1, 0, CAM_BOARD_SHIFT_UP, 1, 1);
      cam.updateProjectionMatrix();
      // Cache the (fixed) camera inverse + frustum half-extents so step() can measure
      // how close the board sits to the screen edges at the live rotation and zoom to suit.
      this._camInv = inv.clone(); this._fitW = w; this._fitH = h;
      // Silhouette of the playable cells (non-wall) as per-row span endpoints, so the
      // zoom-in can be capped to keep every gameplay cell on-screen without over-shrinking
      // L-shaped boards (a plain bbox would count wall corners the content never reaches).
      const cpts = [];
      for (let r = 0; r < rows; r++){
        let lo = 1e9, hi = -1e9;
        for (let c = 0; c < cols; c++) if (this.cells[r][c].type !== 'wall'){ lo = Math.min(lo, c); hi = Math.max(hi, c); }
        if (hi < lo) continue;
        const z0 = this.cz(r) - 0.5, z1 = this.cz(r) + 0.5, xl = this.cx(lo) - 0.5, xr = this.cx(hi) + 0.5;
        cpts.push(xl, z0, xl, z1, xr, z0, xr, z1);
      }
      this._contentPts = cpts.length ? new Float32Array(cpts) : null;
      // Verticality-boosted fill: taller boards (rows > cols) target more overspill.
      this._fillTarget = Math.min(CAM_ZOOM_FILL_MAX, CAM_ZOOM_FILL + CAM_ZOOM_VERT_GAIN * Math.max(0, rows / cols - 1));
      cam.zoom = this._zoomForRot(0);
      cam.updateProjectionMatrix();
      this._computeRotateZone();
    }

    // How close the board's nearest edge sits to the screen edge for a given pivot
    // rotation, as a fraction of the frustum half-extent (1 = touching the screen edge).
    _boardExtent(rot){
      if (!this._camInv) return 1;
      const hC = this.cols / 2 + 0.4, hR = this.rows / 2 + 0.4, maxY = Math.max(H_BLOCK, H_WALL) + 0.4;
      const m = new THREE.Matrix4().multiplyMatrices(this._camInv, new THREE.Matrix4().makeRotationY(rot));
      let ext = 0;
      for (const sx of [-hC, hC]) for (const sy of [-BASE_THICK, maxY]) for (const sz of [-hR, hR]){
        const p = new THREE.Vector3(sx, sy, sz).applyMatrix4(m);
        ext = Math.max(ext, Math.abs(p.x) / this._fitW, Math.abs(p.y) / this._fitH);
      }
      return ext || 1;
    }
