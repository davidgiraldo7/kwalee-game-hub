    // Same measure as _boardExtent but over the playable cells (non-wall) only, so the
    // zoom-in can be capped to keep every gameplay cell on-screen (1 = touching the edge).
    _contentExtent(rot){
      const p = this._contentPts;
      if (!this._camInv || !p) return this._boardExtent(rot);
      const maxY = H_BLOCK;
      const m = new THREE.Matrix4().multiplyMatrices(this._camInv, new THREE.Matrix4().makeRotationY(rot));
      const v = this._extScratch || (this._extScratch = new THREE.Vector3());
      let ext = 0;
      for (let i = 0; i < p.length; i += 2){
        for (const sy of [0, maxY]){
          v.set(p[i], sy, p[i + 1]).applyMatrix4(m);
          ext = Math.max(ext, Math.abs(v.x) / this._fitW, Math.abs(v.y) / this._fitH);
        }
      }
      return ext || 1;
    }

    // Zoom for a given pivot rotation. The board is filled to a verticality-boosted
    // target (taller boards zoom in more), but never past the point where a playable
    // cell would leave the screen; rotating eases the zoom out a touch for breathing room.
    _zoomForRot(rot){
      if (!this._camInv) return 1;
      const rotFrac = Math.min(1, Math.abs(rot) / (CAM_SWEEP / 2));
      const fillZoom = (this._fillTarget || CAM_ZOOM_FILL) / this._boardExtent(rot);
      const contentZoom = CAM_CONTENT_CAP / this._contentExtent(rot);
      const rest = Math.max(1, Math.min(CAM_ZOOM_MAX, fillZoom, contentZoom));
      return Math.max(1, rest * (1 - CAM_ZOOM_ROTOUT * rotFrac));
    }

    // Lowest NDC.y the board ever reaches across the sweep; a drag below this
    // (empty space under the board) rotates the camera instead of a piece.
    _computeRotateZone(){
      if (!this.camera || !this.rows){ this.rotZoneY = -1.1; return; }
      const hC = this.cols / 2 + 0.4, hR = this.rows / 2 + 0.4, maxY = Math.max(H_BLOCK, H_WALL) + 0.4;
      let minNdcY = 1e9;
      for (const rot of [-CAM_SWEEP / 2, 0, CAM_SWEEP / 2]){
        const rm = new THREE.Matrix4().makeRotationY(rot);
        for (const sx of [-hC, hC]) for (const sy of [-BASE_THICK, maxY]) for (const sz of [-hR, hR]){
          const p = new THREE.Vector3(sx, sy, sz).applyMatrix4(rm).project(this.camera);
          minNdcY = Math.min(minNdcY, p.y);
        }
      }
      this.rotZoneY = minNdcY;
    }

    // ---- meters (DOM) -------------------------------------------------------
    _buildMeters(){
      const box = this.metersEl; box.innerHTML = ''; this.meterEls = {};
      for (const color of this.usedColors){
        const L = LIQUIDS[color];
        const pill = document.createElement('div');
        pill.style.cssText = 'width:78px;height:14px;border-radius:8px;border:2px solid ' + L.edge + ';background:rgba(44,39,64,.16);overflow:hidden;box-sizing:border-box;transform:scale(1);transform-origin:center;transition:transform .16s ease;';
        const fill = document.createElement('div');
        fill.style.cssText = 'height:100%;width:0%;border-radius:6px;background:' + L.fill + ';transition:width .12s;';
        pill.appendChild(fill); box.appendChild(pill); this.meterEls[color] = { pill, fill };
      }
    }
    _updateMeters(){
      if (!this.meterEls) return;
      for (const color of this.usedColors){
        const dr = this.drains.find(d => d.color === color), prog = dr ? dr.prog : 0;
        const meter = this.meterEls[color];
        if (meter){
          const draining = !!(dr && this.connected && this.connected[color] && !this.completed[color] && dr.prog < 1);
          meter.fill.style.width = Math.round(prog * 100) + '%';
          meter.pill.style.transform = draining ? 'scale(1.15)' : 'scale(1)';
        }
      }
    }

    _updateTimer(){
      const el = this.timerEl || (this.timerEl = document.getElementById('gameTimer'));
      if (!el) return;
      const s = Math.max(0, Math.ceil((this.timeLeftMs || 0) / 1000));
      el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      el.classList.toggle('low', s <= 10);
    }

    // Begin the level countdown on the first real player interaction.
    _startTimer(){ this.timerStarted = true; }

    // Freeze gameplay for a named reason (settings menu, app backgrounded, ...).
    // Multiple reasons stack; play only resumes once every reason is cleared.
    pause(reason){
      this._pauseReasons = this._pauseReasons || new Set();
      const wasEmpty = this._pauseReasons.size === 0;
      this._pauseReasons.add(reason || 'manual');
      if (wasEmpty && (this.gameState === STATE.PLAY || this.gameState === STATE.FTUE)){
        this._resumeState = this.gameState;
        this.gameState = STATE.PAUSE;
      }
    }
    resume(reason){
      if (!this._pauseReasons) return;
      this._pauseReasons.delete(reason || 'manual');
      if (this._pauseReasons.size === 0 && this.gameState === STATE.PAUSE){
        this.gameState = this._resumeState || STATE.PLAY;
        this._resumeState = null;
      }
    }

    // ===== game logic (ported) ==============================================
    rebuildOcc(){
      this.occ = []; for (let r = 0; r < this.rows; r++) this.occ[r] = new Array(this.cols).fill(null);
      this.pieces.forEach(p => p.cells.forEach(cl => { this.occ[cl.r][cl.c] = p; }));
    }
    passableForBlock(r, c){ return r >= 0 && c >= 0 && r < this.rows && c < this.cols && this.cells[r][c].type === 'empty'; }
    occAt(r, c, ignore){ for (const pc of this.pieces){ if (pc === ignore) continue; for (const cl of pc.cells) if (cl.r === r && cl.c === c) return pc; } return null; }
    canPlaceAt(piece, origin, dr, dc){ for (const cl of origin){ const r = cl.r + dr, c = cl.c + dc; if (!this.passableForBlock(r, c)) return false; if (this.occAt(r, c, piece)) return false; } return true; }
    blockCentroidWorld(cells, dr, dc){ let x = 0, z = 0; for (const cl of cells){ x += this.cx(cl.c + dc); z += this.cz(cl.r + dr); } return { x: x / cells.length, z: z / cells.length }; }

    pathfindBlockOffset(piece, origin, desX, desZ){
      const sq = (dr, dc) => { const cen = this.blockCentroidWorld(origin, dr, dc); const ex = cen.x - desX, ez = cen.z - desZ; return ex * ex + ez * ez; };
      const limit = this.maxPathDist || TUNING.blockPathLimit;
      const visited = new Set(['0,0']); const queue = [[0, 0, 0]];
      let best = [0, 0], bestD = sq(0, 0), head = 0;
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      while (head < queue.length){
        const [dr, dc, dist] = queue[head++]; if (dist >= limit) continue;
        for (const [er, ec] of dirs){
          const ndr = dr + er, ndc = dc + ec, key = ndr + ',' + ndc;
          if (visited.has(key)) continue;
          if (!this.canPlaceAt(piece, origin, ndr, ndc)) continue;
          visited.add(key); queue.push([ndr, ndc, dist + 1]);
          const d = sq(ndr, ndc); if (d < bestD - 0.0001){ bestD = d; best = [ndr, ndc]; }
        }
      }
      return best;
    }

    targetLevel(r, c){
      const cg = this.colorGrid; if (!cg) return 0;
      const k = cg[r][c]; if (k < 0) return 0;
      let prog = 0; if (this.drains) for (const d of this.drains) if (d.color === k) prog = Math.max(prog, d.prog);
      return WATER_FULL * (1 - prog);
    }

    simulate(){
      const rows = this.rows, cols = this.cols;
      const cg = []; for (let r = 0; r < rows; r++) cg[r] = new Array(cols).fill(-1);
      // Per-cell bitmask of every colour whose flood can reach the cell (drives blended mix rendering).
      const reach = []; for (let r = 0; r < rows; r++) reach[r] = new Array(cols).fill(0);
      const flow = (r, c) => r >= 0 && c >= 0 && r < rows && c < cols && this.cells[r][c].type === 'empty' && !this.occ[r][c];
      for (const src of this.sources){
        if (this.completed && this.completed[src.color]) continue;
        const k = src.color, bit = 1 << k, stack = [];
        // Water only pours out the mouth of the pipe (its facing cell), so a block placed in front stops all flow.
        const f = src.facing || (src.facing = this._sourceFacing(src.r, src.c));
        { const fr = src.r + f.dr, fc = src.c + f.dc; if (flow(fr, fc)) stack.push([fr, fc]); }
        while (stack.length){
          const [r, c] = stack.pop(); if (reach[r][c] & bit) continue; reach[r][c] |= bit; cg[r][c] = k;
          [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([nr, nc]) => { if (flow(nr, nc) && !(reach[nr][nc] & bit)) stack.push([nr, nc]); });
        }
      }
      // Any cell reached by more than one colour is a contested "mix": ruin the batch and blend its colour.
      let mixed = false;
      const mixGrid = []; for (let r = 0; r < rows; r++) mixGrid[r] = new Array(cols).fill(null);
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
        const m = reach[r][c]; if (m && (m & (m - 1))){ mixed = true; mixGrid[r][c] = this._blendColors(m); }
      }
      const connected = {};
      // A drain only fills from PURE colour water: if the touching cell is contested (mixed), it must not drain.
      for (const dr of this.drains){ const k = dr.color, bit = 1 << k; if ([[dr.r - 1, dr.c], [dr.r + 1, dr.c], [dr.r, dr.c - 1], [dr.r, dr.c + 1]].some(([r, c]) => r >= 0 && c >= 0 && r < rows && c < cols && reach[r][c] === bit)) connected[k] = true; }
      this.colorGrid = cg; this.mixed = mixed; this.mixGrid = mixGrid; this.connected = connected;
      this.flowDist = this._computeFlowDist(cg);
    }

    // Graph distance (in cells) from each source into its connected pool. Drives the pour front
    // so newly opened cells fill in order of how far the water has to travel to reach them.
    _computeFlowDist(cg){
      const rows = this.rows, cols = this.cols;
      const dist = []; for (let r = 0; r < rows; r++) dist[r] = new Array(cols).fill(-1);
      const q = []; let head = 0;
      for (const src of this.sources){
        if (this.completed && this.completed[src.color]) continue;
        const k = src.color;
        const f = src.facing || (src.facing = this._sourceFacing(src.r, src.c));
        const r = src.r + f.dr, c = src.c + f.dc;
        if (r >= 0 && c >= 0 && r < rows && c < cols && cg[r][c] === k && dist[r][c] < 0){ dist[r][c] = 0; q.push([r, c]); }
      }
      while (head < q.length){
        const [r, c] = q[head++]; const k = cg[r][c], nd = dist[r][c] + 1;
        for (const [nr, nc] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]){
          if (nr >= 0 && nc >= 0 && nr < rows && nc < cols && cg[nr][nc] === k && dist[nr][nc] < 0){ dist[nr][nc] = nd; q.push([nr, nc]); }
        }
      }
      return dist;
    }

    // A cell may keep rising toward full only once an upstream neighbour (closer to the source)
    // is partly filled, so the surface advances as a continuous front rather than snapping in.
    _canFill(r, c){
      const dist = this.flowDist; if (!dist) return true;
      const d = dist[r][c]; if (d <= 0) return true;
      const cg = this.colorGrid, k = cg[r][c];
      const thr = WATER_FULL * VISUAL.flowFrontThreshold;
      const rows = this.rows, cols = this.cols;
      for (const [nr, nc] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]){
        if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
        if (cg[nr][nc] === k && dist[nr][nc] >= 0 && dist[nr][nc] < d && this.level[nr][nc] >= thr) return true;
      }
      return false;
    }

    splashAround(piece, amp){
      if (!this.rv) return false;
      let hit = false;
      piece.cells.forEach(cl => { [[cl.r - 1, cl.c], [cl.r + 1, cl.c], [cl.r, cl.c - 1], [cl.r, cl.c + 1]].forEach(([r, c]) => {
        if (r >= 0 && c >= 0 && r < this.rows && c < this.cols && this.wetColor[r][c] >= 0){ this.rv[r][c] -= amp; this.spawnRing(r, c, VISUAL.splashRingRadius * 2.2, VISUAL.splashRingLife); hit = true; }
      }); });
      return hit;
    }
    spawnRing(r, c, maxR, life){
      if (!this.ringPool || this.wetColor[r][c] < 0) return;
      const ring = this.ringPool.find(rm => !rm.visible) || this.ringPool[0];
      const y = this.level[r][c] * H_LIQ + this.rh[r][c] * RIPPLE_AMP + 0.02;
      ring.position.set(this.cx(c), y, this.cz(r)); ring.visible = true;
      ring.material.color = this._materialColor(LIQUIDS[this.wetColor[r][c]].foam);
      ring.userData = { age: 0, life: life || 900, maxR: maxR || 0.8 };
    }

    rippleStep(){
      if (!this.rh) return;
      const rows = this.rows, cols = this.cols, rh = this.rh, rv = this.rv;
      const wet = (r, c) => r >= 0 && c >= 0 && r < rows && c < cols && this.wetColor[r][c] >= 0 && this.level[r][c] > 0.05 && !this.occ[r][c];
      const COUPLE = VISUAL.rippleCouple, DAMP = TUNING.rippleDamp, SPRING = VISUAL.rippleSpring;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
        if (!wet(r, c)){ rh[r][c] *= VISUAL.rippleDryDecay; rv[r][c] *= VISUAL.rippleDryDecay; continue; }
        const cur = rh[r][c];
        const l = wet(r, c - 1) ? rh[r][c - 1] : cur, ri = wet(r, c + 1) ? rh[r][c + 1] : cur;
        const u = wet(r - 1, c) ? rh[r - 1][c] : cur, dn = wet(r + 1, c) ? rh[r + 1][c] : cur;
        rv[r][c] += ((l + ri + u + dn) * 0.25 - cur) * COUPLE - cur * SPRING; rv[r][c] *= DAMP;
      }
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
        if (!wet(r, c)) continue; rh[r][c] += rv[r][c];
        if (rh[r][c] > VISUAL.rippleClamp) rh[r][c] = VISUAL.rippleClamp; else if (rh[r][c] < -VISUAL.rippleClamp) rh[r][c] = -VISUAL.rippleClamp;
      }
    }

    triggerGateMelt(color){
      if (!this.gates || !this.gates.length) return;
      const group = this.gates.filter(gt => gt.color === color && gt.state === 'solid'); if (!group.length) return;
      const minDist = Math.min(...group.map(gt => gt.r + gt.c));
      group.forEach(gt => { gt.state = 'melting'; gt.meltT = 0; gt.delay = (gt.r + gt.c - minDist) * VISUAL.gateMeltStaggerMs; });
      sfx.melt();
    }

    // ===== per-frame step (driven by KPF updateGame → WBJ.step) =============
    step(dtMs){
      if (!this.ready || !this.renderer) return;
      const dt = dtMs || (1000 / 60);
      this._checkResize();
      // Smooth camera sweep toward slider target.
      this.rotCur += (this.rotTarget - this.rotCur) * Math.min(1, dt / 120);
      this.pivot.rotation.y = this.rotCur;
      // Soft zoom: keep the board's nearest edge a hair past the screen edge, so it
      // sits tight when square-on and eases out as rotation swings an edge closer.
      if (this._camInv){
        const targetZoom = this._zoomForRot(this.rotCur);
        const z = this.camera.zoom + (targetZoom - this.camera.zoom) * Math.min(1, dt / 120);
        if (Math.abs(z - this.camera.zoom) > 1e-4){ this.camera.zoom = z; this.camera.updateProjectionMatrix(); }
      }

      const active = this.gameState === STATE.PLAY || this.gameState === STATE.FTUE;
      if (active) this._advance(dt);
      if (this.gameState === STATE.FTUE) this._animateFtue(dt);
      this._syncMeshes(dt);
      this.renderer.render(this.scene, this.camera);
    }

    _checkResize(){
      const w = this.stage.clientWidth, h = this.stage.clientHeight;
      if (w && h && (w !== this.vw || h !== this.vh)) this._resize();
    }

    _advance(dt){
      this.tSim += dt;
      // Audio: (a) any cell's liquid still visibly rising, (b) any drain actively pouring.
      let anyFilling = false, anyPouring = false;
      // Ease liquid level toward region depth; track wet colour.
      if (this.level && this.colorGrid){
        const kUp = Math.min(1, dt / VISUAL.waterFillSpeed), kDn = Math.min(1, dt / VISUAL.waterDrainSpeed);
        for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++){
          const tgt = this.targetLevel(r, c), cur = this.level[r][c];
          let ease;
          if (tgt > cur) ease = (this.colorGrid[r][c] >= 0 && !this._canFill(r, c)) ? 0 : kUp;
          else ease = kDn;
          if (ease > 0 && tgt - cur > 0.01) anyFilling = true;
          const nl = cur + (tgt - cur) * ease; this.level[r][c] = nl;
          const wasWet = this.wetColor[r][c] >= 0;
          if (this.colorGrid[r][c] >= 0){
            this.wetColor[r][c] = this.colorGrid[r][c];
            const mc = this.mixGrid ? this.mixGrid[r][c] : null;
            if (mc) this.wetMix[r][c] = mc;
            // Ease the mixed tint in (or back out) instead of snapping, so a merge reads as a gradual bleed.
            const kMix = Math.min(1, dt / VISUAL.mixBlendSpeed);
            this.mixEase[r][c] += ((mc ? 1 : 0) - this.mixEase[r][c]) * kMix;
            if (this.mixEase[r][c] < 0.002){ this.mixEase[r][c] = 0; this.wetMix[r][c] = null; }
            if (!wasWet && this.rv) this.rv[r][c] -= 0.03;
            // Kick a ripple the instant the pour front first floods this cell, so the leading edge reads as rushing water.
            if (this.rv && cur < 0.05 && nl >= 0.05) this.rv[r][c] -= VISUAL.flowFrontRipple;
          }
          else if (nl < 0.04){ this.wetColor[r][c] = -1; this.wetMix[r][c] = null; this.mixEase[r][c] = 0; }
        }
      }
      // Drain gates rise while pouring, and stay up until the water has visibly drained away.
      if (this.drains) for (const d of this.drains){
        const filling = !!(this.connected && this.connected[d.color]) && !this.completed[d.color] && d.prog < 1;
        const pouring = filling || (this.completed[d.color] && this._colorHasWater(d.color));
        if (pouring) anyPouring = true;
        d.open = (d.open || 0) + ((pouring ? 1 : 0) - (d.open || 0)) * Math.min(1, dt / 200);
      }
      // Drive the water-flow loop (pouring always plays; fill-only ducks under wobble + caps out).
      wbjSfx.waterFlow(anyPouring, anyFilling, dt);
      // Very gentle recurring haptic pulse while water drains out (respects the settings toggle inside KPF.haptic).
      if (anyPouring){
        if (!this._wasPouring) this._drainHapticAcc = DRAIN_HAPTIC_MS;  // buzz on the first pouring frame
        this._drainHapticAcc = (this._drainHapticAcc || 0) + dt;
        if (this._drainHapticAcc >= DRAIN_HAPTIC_MS){
          this._drainHapticAcc = 0;
          if (window.KPF && window.KPF.haptic) window.KPF.haptic('drain');
        }
      } else {
        this._drainHapticAcc = 0;
      }
      this._wasPouring = anyPouring;
      // Slime gate melt.
      if (this.gates && this.gates.length){
        let anyDone = false;
        for (const gt of this.gates){
          if (gt.state !== 'melting') continue;
          if (gt.delay > 0){ gt.delay -= dt; continue; }
          gt.meltT += dt;
          if (gt.meltT >= VISUAL.gateMeltMs){ gt.state = 'done'; this.cells[gt.r][gt.c].type = 'empty'; this.cells[gt.r][gt.c].color = -1; anyDone = true; }
        }
        if (anyDone){ this.rebuildOcc(); this.simulate(); }
      }
      // Ambient droplet.
      this._drop += dt;
      if (this._drop > VISUAL.dropInterval && this.rv){
        this._drop = 0; const wc = [];
        for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) if (this.wetColor[r][c] >= 0 && this.level[r][c] > VISUAL.dropMinLevel && !this.occ[r][c]) wc.push([r, c]);
        if (wc.length && Math.random() < VISUAL.dropChance){ const [r, c] = wc[(Math.random() * wc.length) | 0]; this.rv[r][c] -= 0.018; this.spawnRing(r, c, 0.7, 1200); }
      }
      this.rippleStep();
      this._advanceRings(dt);

      if (this.gameState !== STATE.PLAY) return;
      // Drain progress + completion.
      let changed = false;
      for (const dr of this.drains){
        if (this.completed[dr.color]) continue;
        const on = !!(this.connected && this.connected[dr.color]);
        dr.wasOn = on;
        if (on) dr.prog = Math.min(1, dr.prog + dt / (this.cfg.fillMs || TUNING.drainFillMs));
        if (dr.prog >= 1){
          this.completed[dr.color] = true; this.triggerGateMelt(dr.color); changed = true;
          const isLast = this.usedColors.every(k => this.completed[k]);
          // Flavour cheer per colour — but not the last one (level-complete's Well Done handles that).
          if (!isLast){ if (this.usedColors.length > 1) this._colorCelebrate(dr.color); }
        }
      }
      if (changed) this.simulate();
      this._updateMeters();
      // Level timer countdown (held until the player first interacts).
      if (this.timeLeftMs != null && this.timerStarted){
        this.timeLeftMs = Math.max(0, this.timeLeftMs - dt);
        this._updateTimer();
        if (this.timeLeftMs <= 0){ this._timeFail(); return; }
      }
      // Mix warn / fail.
      if (this.mixed){ this.mixT += dt; this._setWarn(true, this.mixT / TUNING.mixGraceMs); if (this.mixT >= TUNING.mixGraceMs){ this._mixFail(); return; } }
      else if (this.mixT > 0){ this.mixT = Math.max(0, this.mixT - dt * 1.6); this._setWarn(this.mixT > 0, this.mixT / TUNING.mixGraceMs); }
      // Wait for the water to visually finish draining away before ending the level.
      if (this.usedColors.length && this.usedColors.every(k => this.completed[k]) && this._isFullyDrained() && this._isDrainVfxComplete()) this.levelComplete();
    }

    _isFullyDrained(){
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) if (this.level[r][c] > 0.02) return false;
      return true;
    }

    _isDrainVfxComplete(){
      if (!this.drainMeshes) return true;
      for (const dm of this.drainMeshes.values()) for (const p of dm.parts) if (p.life < p.ttl) return false;
      return true;
    }

    _colorHasWater(k){
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) if (this.wetColor[r][c] === k && this.level[r][c] > 0.02) return true;
      return false;
    }

    _advanceRings(dt){
      if (!this.ringPool) return;
      for (const rm of this.ringPool){
        if (!rm.visible) continue; const u = rm.userData; u.age += dt; const pr = u.age / u.life;
        if (pr >= 1){ rm.visible = false; continue; }
        const s = u.maxR * (0.3 + pr * 0.7); rm.scale.set(s, s, s);
        rm.material.opacity = (1 - pr) * (1 - pr) * 0.6;
      }
    }

    // ---- mesh sync ----------------------------------------------------------
    _syncMeshes(dt){
      this._syncPieces();
      // Drain plugs: float up on the water while draining, chain sags, water cascades out.
      if (this.drainMeshes) this.drains.forEach(d => this._syncDrain(d, dt || 16.7));
      // Source pipes: continuous pour with splashing droplets.
      if (this.sourceMeshes) this.sourceMeshes.forEach(rec => this._syncSource(rec, dt || 16.7));
      // Slime gate melt (sink + shrink + fade) and water-remaining fill bar.
      if (this.gateGroups) for (const g of this.gateGroups){
        let melting = false, done = true, mp = 0;
        for (const cl of g.cells){
          const gt = this.gateByCell.get(cl.r * this.cols + cl.c); if (!gt) continue;
          if (gt.state !== 'done') done = false;
          if (gt.state === 'melting') { melting = true; mp = Math.max(mp, Math.min(1, gt.meltT / VISUAL.gateMeltMs)); }
        }
        if (done){ g.mesh.visible = false; continue; }
        const ease = mp * mp * (3 - 2 * mp), h = Math.max(0.04, 1 - ease * 0.96);
        g.mesh.scale.y = h; g.mesh.position.y = (g.baseH * h) / 2; g.mat.opacity = 0.94 * (1 - ease * 0.5);
        if (g.fillBar){
          let prog = 0; for (const d of this.drains) if (d.color === g.color) prog = Math.max(prog, d.prog);
          if (this.completed && this.completed[g.color]) prog = 1;
          const remain = Math.max(0, 1 - prog);
          g.fillBar.group.visible = !melting && remain > 0.001;
          g.fillBar.fill.scale.x = Math.max(0.0001, remain);
        }
      }
      this._syncWater();
    }

    _syncPieces(){
      if (!this.pieceMeshes) return;
      for (const piece of this.pieces){
        const rec = this.pieceMeshes.get(piece); if (!rec) continue;
        const held = !!(this.drag && this.drag.piece === piece);
        const lift = held ? H_BLOCK * 0.35 : 0;
        const anchor = piece.cells[0];
        rec.mesh.position.set(this.cx(anchor.c), H_BLOCK / 2 + lift, this.cz(anchor.r));
        if (rec.outline) rec.outline.visible = held;
      }
    }

    _syncDrain(d, dt){
      const dm = this.drainMeshes.get(d.r * this.cols + d.c); if (!dm) return;
      const open = d.open || 0;
      const draining = d.prog < 1 || this._colorHasWater(d.color);
      const surf = (this.level[d.r][d.c] || 0) * H_LIQ;
      // Plug: seals the hole when idle; once water reaches it, lifts clear of the rim so the
      // exit hole is revealed beneath, then rides on the surface if the water is higher.
      const closedY = 0.06;
      const revealY = 0.34;
      const floatY = Math.max(revealY, surf + 0.06);
      const bob = draining ? Math.sin(this.tSim / 240) * 0.02 * open : 0;
      dm.plug.position.y = closedY + (floatY - closedY) * open + bob;
      // Plug (and its flag) lift straight up out of the rim; no chain to nudge it sideways now.
      dm.plug.position.x = 0; dm.plug.position.z = 0;

      // Gentle wind ripple across the pennant: pinned at the pole, sways more toward the free tip.
      if (dm.flagU){
        const t = this.tSim, amp = 0.055;
        for (let i = 0; i < dm.flagU.length; i++){
          const u = dm.flagU[i], o = i * 3;
          const w = Math.sin(u * 5.2 - t * 0.0042) + 0.45 * Math.sin(u * 9.5 - t * 0.0067);
          dm.flagPos[o + 2] = amp * u * w;                                      // side-to-side sway
          dm.flagPos[o + 1] = dm.flagBaseY[i] + amp * 0.3 * u * Math.sin(u * 6.0 - t * 0.005);
        }
        dm.flagGeo.attributes.position.needsUpdate = true;
        dm.flagGeo.computeVertexNormals();
      }

      // ---- Draining waterfall (particle spray) ------------------------------------------------
      const emitting = draining && open > 0.4;
      const top = Math.max(0.04, surf) + 0.02;              // spill height at the drain throat
      const bottom = -VISUAL.drainCascadeDepth;             // where particles dissolve, deep below the board

      // Keep the shared sprites a constant world size under the orthographic camera + current zoom.
      if (this._dropletMat && this.renderer){
        const cam = this.camera;
        this._dropletMat.uniforms.uPP.value = (cam.zoom * this.renderer.domElement.height) / Math.max(0.001, cam.top - cam.bottom);
      }

      // Emit new particles at the throat while draining.
      if (emitting){
        dm.spawnAcc += dt * VISUAL.drainParticleRate;
        let guard = 0;
        while (dm.spawnAcc >= 1 && guard < 48){
          dm.spawnAcc -= 1; guard++;
          let fi = -1;
          for (let k = 0; k < dm.parts.length; k++){ if (dm.parts[k].life >= dm.parts[k].ttl){ fi = k; break; } }
          if (fi < 0) break;
          this._spawnDrainParticle(dm, fi, top);
        }
      } else dm.spawnAcc = 0;

      // Integrate: gravity pulls down, a sideways pull toward the camera swings the stream clear of the
      // board so it shows against the background, and particles dissolve as they reach the void floor.
      const LA = 0.0000024 * dm.lean;   // lateral acceleration toward the camera (local +x,+z)
      let anyAlive = false;
      for (let i = 0; i < dm.parts.length; i++){
        const p = dm.parts[i], o = i * 3;
        if (p.life < p.ttl){
          p.life += dt;
          p.vy -= 0.0000060 * dt;
          p.vx += LA * dt; p.vz += LA * dt;
          p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
          let a = Math.min(1, p.life / 40) * Math.min(1, (p.ttl - p.life) / 150);
          a *= Math.min(1, Math.max(0, (p.y - bottom) / 0.45));   // dissolve into the void as it nears the floor
          if (p.y < bottom){ p.life = p.ttl; a = 0; }
          dm.pPos[o] = p.x; dm.pPos[o + 1] = p.y; dm.pPos[o + 2] = p.z;
          dm.pAlpha[i] = Math.max(0, a) * (p.foam ? 0.85 : 0.95);
          if (a > 0) anyAlive = true;
        } else if (dm.pAlpha[i] !== 0){
          dm.pAlpha[i] = 0;
        }
      }
      dm.points.visible = emitting || anyAlive;
      dm.pGeo.attributes.position.needsUpdate = true;
      dm.pGeo.attributes.aAlpha.needsUpdate = true;
    }

    // Seed particle `i` of drain record `dm` at the spill throat with a downward toss and a little
    // spread; colour + world size are set once here (constant for the particle's life).
    _spawnDrainParticle(dm, i, top){
      const p = dm.parts[i], o = i * 3;
      const a = Math.random() * Math.PI * 2, rr = Math.random() * 0.08;
      p.x = Math.cos(a) * rr; p.z = Math.sin(a) * rr; p.y = top - Math.random() * 0.05;
      p.foam = Math.random() < VISUAL.drainFoamFraction;
      p.vx = 0.0007 + (Math.random() - 0.5) * 0.0005;
      p.vz = 0.0007 + (Math.random() - 0.5) * 0.0005;
      p.vy = -0.0009 - Math.random() * 0.0005;
      p.ttl = 780 + Math.random() * 340; p.life = 0;
      p.size = p.foam ? 0.05 + Math.random() * 0.04 : VISUAL.drainParticleSize * (0.7 + Math.random() * 0.55);
      const col = p.foam ? dm.foamColor : dm.waterCol;
      dm.pCol[o] = col.r; dm.pCol[o + 1] = col.g; dm.pCol[o + 2] = col.b;
      dm.pSize[i] = p.size;
      dm.pGeo.attributes.aColor.needsUpdate = true;
      dm.pGeo.attributes.aSize.needsUpdate = true;
    }

    _syncSource(rec, dt){
      // Remaining water for this source's colour: full at prog 0, empty as the matching drain finishes.
      let prog = 0; if (this.drains) for (const d of this.drains) if (d.color === rec.color) prog = Math.max(prog, d.prog);
      if (this.completed && this.completed[rec.color]) prog = 1;
      const targetFill = Math.max(0, 1 - prog);
      rec.fill += (targetFill - rec.fill) * Math.min(1, dt / 260);  // smooth follow
      const fill = rec.fill;
      // Pour width tracks remaining water: starts larger than default and thins out to nothing.
      const width = fill * 1.5;
      rec.core.visible = width > 0.02;
      rec.core.scale.x = rec.core.scale.z = width;
      rec.pourMat.opacity = 0.6 * Math.min(1, fill * 1.6);
      rec.pourMat.emissiveIntensity = 0.3 + 0.14 * (0.5 + 0.5 * Math.sin(this.tSim * 0.01));
      const span = Math.max(0.05, rec.topY - rec.botY);
      for (const d of rec.drops){
        d.t += dt / 520;
        if (d.t >= 1){ d.t -= 1; if (rec.land && fill > 0.05) this.spawnRing(rec.land.r, rec.land.c, 0.5 * fill, 700); }
        d.mesh.visible = width > 0.02;
        d.mesh.position.y = rec.topY - span * d.t;
        d.mesh.scale.setScalar((0.7 + 0.3 * Math.sin(d.t * Math.PI)) * width);
        d.mesh.material.opacity = 0.65 * (1 - d.t * 0.35) * Math.min(1, fill * 1.6);
      }
    }

    _syncWater(){
      const W = this.water; if (!W) return;
      const rows = this.rows, cols = this.cols, nx = W.nx;
      const wet = (r, c) => r >= 0 && c >= 0 && r < rows && c < cols && this.wetColor[r][c] >= 0 && this.level[r][c] > 0.03 && this.cells[r][c].type === 'empty' && !this.occ[r][c];
      const surf = (r, c) => this.level[r][c] * H_LIQ + this.rh[r][c] * RIPPLE_AMP;
      for (let iz = 0; iz < W.nz; iz++) for (let ix = 0; ix < nx; ix++){
        const k = iz * nx + ix; let sum = 0, n = 0, cr = 0, cg = 0, cb = 0, fade = 0;
        for (const [dr, dc] of [[-1, -1], [-1, 0], [0, -1], [0, 0]]){

  }

  // Mixer state
  const _mixerDefaults = { master: 100, sfx: 100, music: 25, sfxMute: false, sfxSolo: false, musicMute: false, musicSolo: false, sounds: {} };
  let _mixer = JSON.parse(JSON.stringify(_mixerDefaults));
  const _savedMixer = localStorage.getItem(STORAGE_KEYS.mixer);
  if (_savedMixer) {
    try { Object.assign(_mixer, JSON.parse(_savedMixer)); } catch(e) {}
  }

  // Gain nodes
  let _masterGain = null;
  let _sfxGain = null;
  let _musicGain = null;
  let _meterInput = null; // for loudness meter

  function ensureGainGraph() {
    if (_masterGain) return;
    const ctx = getAudioContext();
    _masterGain = ctx.createGain();
    _sfxGain = ctx.createGain();
    _musicGain = ctx.createGain();
    _sfxGain.connect(_masterGain);
    _musicGain.connect(_masterGain);
    _masterGain.connect(ctx.destination);
    // Meter tap (parallel)
    _meterInput = ctx.createGain();
    _meterInput.gain.value = 1;
    _masterGain.connect(_meterInput);
    applyMixerGains();
  }

  function applyMixerGains() {
    if (!_masterGain) return;
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    _masterGain.gain.setTargetAtTime(_mixer.master / 100, now, 0.02);

    // Solo logic: if any channel is soloed, others are silenced
    const anySolo = _mixer.sfxSolo || _mixer.musicSolo;
    let sfxVol = _mixer.sfxMute ? 0 : _mixer.sfx / 100;
    let musicVol = _mixer.musicMute ? 0 : _mixer.music / 100;
    if (anySolo) {
      if (!_mixer.sfxSolo) sfxVol = 0;
      if (!_mixer.musicSolo) musicVol = 0;
    }
    // Settings toggles
    if (!toggleSound.checked) sfxVol = 0;
    if (!toggleMusic.checked) musicVol = 0;

    _sfxGain.gain.setTargetAtTime(sfxVol, now, 0.02);
    _musicGain.gain.setTargetAtTime(musicVol, now, 0.02);

    // Per-sound gains
    _activeInstances.forEach(inst => {
      if (!inst.gainNode) return;
      const snd = _mixer.sounds[inst.name] || {};
      const sndMute = snd.mute || false;
      const sndSolo = snd.solo || false;
      let vol = (snd.volume !== undefined ? snd.volume : 100) / 100;
      if (sndMute) vol = 0;
      // Per-sound solo: if any in the same channel is soloed, silence non-soloed
      const ch = getChannel(inst.name);
      const channelSounds = Object.keys(AUDIO_FILES).filter(n => getChannel(n) === ch);
      const anySndsolo = channelSounds.some(n => (_mixer.sounds[n] || {}).solo);
      if (anySndsolo && !sndSolo) vol = 0;
      inst.gainNode.gain.setTargetAtTime(vol, now, 0.02);
      // Live loop update
      if (inst.source && inst.source.loop !== undefined) {
        inst.source.loop = snd.loop || false;
      }
    });
  }

  // Active sound instances (for live updates)
  const _activeInstances = [];

  function playSound(name, { loop = false } = {}) {
    if (!AUDIO_FILES[name]) return null;
    const ctx = getAudioContext();
    ensureGainGraph();
    const el = new Audio();
    el.crossOrigin = "anonymous"; // required for MediaElementSource on cross-origin hosts (else silent)
    el.src = AUDIO_FILES[name]; // direct path — browser media loader, not fetch
    el.preload = "auto";
    const sndSettings = _mixer.sounds[name] || {};
    el.loop = sndSettings.loop !== undefined ? sndSettings.loop : loop;
    let mediaNode;
    try {
      mediaNode = ctx.createMediaElementSource(el);
    } catch (e) {
      console.warn("[Audio] Failed to route", name, e);
      return null;
    }
    const gainNode = ctx.createGain();
    const vol = (sndSettings.volume !== undefined ? sndSettings.volume : 100) / 100;
    gainNode.gain.value = sndSettings.mute ? 0 : vol;
    mediaNode.connect(gainNode);
    const ch = getChannel(name);
    gainNode.connect(ch === "music" ? _musicGain : _sfxGain);
    // source shim: preserves the mixer/stop interface (loop getter/setter + stop()).
    const source = {
      get loop() { return el.loop; },
      set loop(v) { el.loop = v; },
      stop() { try { el.pause(); el.currentTime = 0; } catch (e) {} try { mediaNode.disconnect(); } catch (e) {} },
    };
    const inst = { name, source, gainNode, el };
    _activeInstances.push(inst);
    el.addEventListener("ended", () => {
      if (el.loop) return;
      const idx = _activeInstances.indexOf(inst);
      if (idx !== -1) _activeInstances.splice(idx, 1);
      try { mediaNode.disconnect(); } catch (e) {}
    });
    el.play().catch(() => {});
    return inst;
  }

  function stopSound(inst) {
    if (!inst || !inst.source) return;
    try { inst.source.stop(); } catch(e) {}
  }

  // ---------- Background Audio ----------
  let _bgInstances = [];
  let _bgPlaying = false;
  let _bgWasPlayingBeforeBackground = false;

  async function playBackgroundAudio() {
    if (_bgPlaying) return;
    _bgPlaying = true;
    const ctx = getAudioContext();
    await ctx.resume();
    ensureGainGraph();
    for (const name of Object.keys(AUDIO_FILES)) {
      if (getChannel(name) === "music") {
        if (!_bgPlaying) return;
        const inst = playSound(name, { loop: true });
        if (inst) _bgInstances.push(inst);
      }
    }
  }

  function stopBackgroundAudio() {
    _bgPlaying = false;
    _bgInstances.forEach(stopSound);
    _bgInstances = [];
  }

  function handleAppBackgrounded(){
    if (window.WBJ) window.WBJ.pause('background'); // freeze game/timer while minimised
    wbjAudio.suspendForBackground();               // pause bgm + water-flow loop so music stops in the background
    if (_actx && _actx.state === "running") _actx.suspend().catch(() => {}); // silence any remaining one-shots
    _bgWasPlayingBeforeBackground = _bgPlaying;
    if (_bgWasPlayingBeforeBackground) stopBackgroundAudio();
  }

  function handleAppForegrounded(){
    if (window.WBJ) window.WBJ.resume('background'); // stays paused if the settings menu is still open
    if (typeof refreshLanguageFromDevice === "function") refreshLanguageFromDevice(); // pick up a device language change while backgrounded
    if (_actx && _actx.state !== "running") _actx.resume().catch(() => {}); // context suspends while backgrounded
    wbjAudio.resumeFromBackground();                // restart the voices that were playing before minimising
    if (!_bgWasPlayingBeforeBackground) return;
    _bgWasPlayingBeforeBackground = false;
    if (toggleMusic.checked) playBackgroundAudio();
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) handleAppBackgrounded();
    else handleAppForegrounded();
  });
  window.addEventListener("pagehide", handleAppBackgrounded);
  window.addEventListener("pageshow", handleAppForegrounded);

  const capacitorApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (capacitorApp && typeof capacitorApp.addListener === "function") {
    try {
      capacitorApp.addListener("appStateChange", ({ isActive }) => {
        if (isActive) handleAppForegrounded();
        else handleAppBackgrounded();
      });
    } catch (e) {}
  }

  // ---------- Sound Effects ----------
  // sfxClick  → normal UI button click
  // sfxToggle → toggle-style switches
  // sfxPopup  → a popup opening. If a popup is ALREADY open, falls back to the
  //             click sound so stacked popups don't double-trigger the popup SFX.
  // (Debug panel / mixer / meter controls intentionally call none of these.)
  // Real, actionable UI button click → WaterBlockJam recorded sample.
  function sfxClick(){ wbjAudio.playClick(); }
  function sfxToggle(){ playSound("sfx_toggle"); }
  function sfxPopup(){
    const popupOpen =
      settingsOverlay.classList.contains("show") ||
      document.getElementById("quitConfirm").classList.contains("show");
    if (popupOpen) sfxClick();
    else playSound("sfx_popup");
  }

  // Listen to settings toggles for live mute
  toggleMusic.addEventListener("change", () => { saveSettingsPreferences(); sfxToggle(); applyMixerGains(); });
  toggleSound.addEventListener("change", () => { saveSettingsPreferences(); sfxToggle(); applyMixerGains(); });
  toggleHaptics.addEventListener("change", () => { saveSettingsPreferences(); sfxToggle(); });

  // ════════════════════════════════════════════════════════════════
  //  WaterBlockJam sample audio — real recorded .wav assets only.
  //  One-shot SFX and the water-flow loop are loaded like images: an
  //  HTMLAudioElement pointing straight at the file path (no fetch/XHR,
  //  which some external platforms block), routed through the shared
  //  Web Audio graph via a MediaElementSource.
  //  BGM is the exception: it is fetched + decodeAudioData'd once into a
  //  cached AudioBuffer and played with a looping AudioBufferSourceNode.
  //  Native media-element looping fires `ended` prematurely inside the
  //  Capacitor Android WebView (restarting the track after ~0.25–1s), so
  //  the sample-accurate buffer loop replaces it entirely for music.
  //  Every voice feeds a dedicated boost node that multiplies its volume
  //  by WBJ_MASTER_BOOST before the SFX/Music channel, so the settings
  //  toggles still apply.
  //  All behaviour (throttling, ducking, capping, fading) is kept in
  //  the dedicated play*/stop* methods below so it stays easy to tune.
  // ════════════════════════════════════════════════════════════════
  const wbjAudio = (() => {
    let _sfxBoost = null, _musicBoost = null;
    const _voices = {};              // key -> persistent looping voice {el,gain,node}
    let _wobbleInst = null;
    let _lastMoveAt = 0, _lastWobbleAt = 0;
    // Flow-loop state machine
    let _flowMode = null, _flowFillMs = 0, _flowFillCapped = false;
    let _flowEnabled = false, _flowPaused = false;
    let _bgPausedVoices = null;      // flow voices paused when the app was minimised
    // BGM buffer-loop state (no HTMLAudioElement — see the header comment).
    let _bgmBuffer = null;           // decoded AudioBuffer, cached once
    let _bgmBufferPromise = null;    // in-flight decode (dedupes concurrent requests)
    let _bgmSource = null;           // current looping AudioBufferSourceNode (null when stopped/suspended)
    let _bgmGain = null;             // dedicated BGM gain → _musicBoost → _musicGain
    let _bgmPlaying = false;         // logical "should be audible" flag (idempotency + resume)
    let _bgmOffset = 0;              // playback position (s) the next source starts from
    let _bgmStartCtxTime = 0;        // ctx.currentTime when the live source began
    let _bgmWasPlaying = false;      // was BGM playing when the app was backgrounded

    function _ctx(){ return getAudioContext(); }
    function _ensureGraph(){
      if (_sfxBoost) return;
      ensureGainGraph();
      const ctx = _ctx();
      _sfxBoost = ctx.createGain();   _sfxBoost.gain.value = WBJ_MASTER_BOOST;   _sfxBoost.connect(_sfxGain);
      _musicBoost = ctx.createGain(); _musicBoost.gain.value = WBJ_MASTER_BOOST; _musicBoost.connect(_musicGain);
    }
    function _boost(channel){ return channel === "music" ? _musicBoost : _sfxBoost; }
    function _pickRandom(pool){ return pool[(Math.random() * pool.length) | 0]; }

    // Direct-path element → MediaElementSource → per-sound gain → boost → channel.
    function _wire(path, volume, { loop = false, channel = "sfx" } = {}){
      _ensureGraph();
      const el = new Audio();
      el.crossOrigin = "anonymous"; // required for MediaElementSource on cross-origin hosts (else silent)
      el.src = path;                 // file path used directly (browser media loader, not fetch)
      el.loop = loop;
      el.preload = "auto";
      let node, g;
      try {
        node = _ctx().createMediaElementSource(el);
        g = _ctx().createGain(); g.gain.value = volume;
        node.connect(g); g.connect(_boost(channel));
      } catch (e) { console.warn("[WBJ audio] wire failed", path, e); return null; }
      return { el, gain: g, node };
    }

    // Fire-and-forget one-shot (fresh element each trigger so clips can overlap).
    function _oneShot(path, volume, channel){
      const v = _wire(path, volume, { channel });
      if (!v) return null;
      const inst = { el: v.el, ended: false };
      v.el.addEventListener("ended", () => { inst.ended = true; try { v.node.disconnect(); v.gain.disconnect(); } catch (_) {} });
      const p = v.el.play(); if (p && p.catch) p.catch(() => {});
      return inst;
    }
    // Reusable looping voice (bgm / flow) — created once, then play()/pause()d.
    function _voice(key, path, channel){
      if (_voices[key]) return _voices[key];
      const v = _wire(path, 1, { loop: true, channel });
      if (!v) return null;
      return (_voices[key] = v);
    }

    function _flowStart(){
      const v = _voice("flow", WBJ_SND.flowLoop, "sfx"); if (!v) return;
      try { v.gain.gain.cancelScheduledValues(_ctx().currentTime); } catch (e) {}
      v.gain.gain.value = WBJ_VOL.flowLoop;
      if (v.el.paused){ try { v.el.currentTime = 0; } catch (e) {} const p = v.el.play(); if (p && p.catch) p.catch(() => {}); }
    }
    function _flowStop(fadeMs){
      const v = _voices.flow; if (!v || v.el.paused) return;
      if (fadeMs && fadeMs > 0){
        const now = _ctx().currentTime;
        try {
          v.gain.gain.cancelScheduledValues(now);
          v.gain.gain.setValueAtTime(v.gain.gain.value, now);
          v.gain.gain.linearRampToValueAtTime(0, now + fadeMs / 1000);
        } catch (e) {}
        setTimeout(() => { try { v.el.pause(); v.el.currentTime = 0; } catch (e) {} }, fadeMs);
      } else {
        try { v.el.pause(); v.el.currentTime = 0; } catch (e) {}
      }
    }
    function _flowPlaying(){ const v = _voices.flow; return !!(v && !v.el.paused); }

    // ---- BGM buffer-loop helpers ----
    // Fetch + decode the BGM once; returns a promise resolving to the cached buffer.
    function _ensureBgmBuffer(){
      if (_bgmBuffer) return Promise.resolve(_bgmBuffer);
      if (_bgmBufferPromise) return _bgmBufferPromise;
      const ctx = _ctx();
      _bgmBufferPromise = fetch(WBJ_SND.bgm)
        .then((res) => { if (!res.ok) throw new Error("HTTP " + res.status); return res.arrayBuffer(); })
        .then((data) => ctx.decodeAudioData(data))
        .then((buf) => { _bgmBuffer = buf; return buf; })
        .catch((err) => { _bgmBufferPromise = null; console.warn("[WBJ audio] BGM load/decode failed", WBJ_SND.bgm, err); throw err; });
      return _bgmBufferPromise;
    }
    // Start a fresh looping source at the retained _bgmOffset.
    function _startBgmSource(){
      const ctx = _ctx();
      if (!_bgmGain){ _bgmGain = ctx.createGain(); _bgmGain.connect(_musicBoost); }
      _bgmGain.gain.value = WBJ_VOL.bgm;
      const src = ctx.createBufferSource();
      src.buffer = _bgmBuffer;
      src.loop = true;                 // sample-accurate hardware loop — no `ended`/setTimeout
      src.connect(_bgmGain);
      const off = _bgmOffset % _bgmBuffer.duration;
      src.start(0, off);
      _bgmSource = src;
      _bgmStartCtxTime = ctx.currentTime;
      _bgmOffset = off;
    }
    // Stop the live source (a buffer source can't pause) without touching logical state.
    function _stopBgmSource(){
      if (!_bgmSource) return;
      try { _bgmSource.onended = null; _bgmSource.stop(); } catch (e) {}
      try { _bgmSource.disconnect(); } catch (e) {}
      _bgmSource = null;
    }
    // Save the current elapsed position (mod buffer duration) so playback can resume there.
    function _captureBgmOffset(){
      if (!_bgmBuffer || !_bgmSource) return;
      const elapsed = _ctx().currentTime - _bgmStartCtxTime;
      _bgmOffset = (_bgmOffset + elapsed) % _bgmBuffer.duration;
    }

    return {
      preload(){
        // Warm the media cache by pointing throwaway elements at each path.
        const warm = (p) => { try { const a = new Audio(); a.crossOrigin = "anonymous"; a.preload = "auto"; a.src = p; } catch (e) {} };
        [WBJ_SND.flowLoop, WBJ_SND.levelFail, WBJ_SND.levelWin, WBJ_SND.buttonClick].forEach(warm);
        Object.values(WBJ_POOLS).forEach(pool => pool.forEach(warm));
        _ensureBgmBuffer().catch(() => {}); // fetch + decode the looping BGM buffer up front
      },

      // ---- one-shot SFX ----
      playPickup(){ _oneShot(_pickRandom(WBJ_POOLS.pickup), WBJ_VOL.pickup); },
      playDrop(){ _oneShot(_pickRandom(WBJ_POOLS.drop), WBJ_VOL.drop); },
      playMove(){
        const now = performance.now();
        if (now - _lastMoveAt < WBJ_MOVE_THROTTLE_MS) return;
        _lastMoveAt = now;
        _oneShot(_pickRandom(WBJ_POOLS.move), WBJ_VOL.move);
      },
      playWobble(){
        const now = performance.now();
        if (now - _lastWobbleAt < WBJ_WOBBLE_THROTTLE_MS) return;
        _lastWobbleAt = now;
        _wobbleInst = _oneShot(_pickRandom(WBJ_POOLS.wobble), WBJ_VOL.wobble);
      },
      isWobblePlaying(){ return !!(_wobbleInst && !_wobbleInst.ended); },
      playClick(){ _oneShot(WBJ_SND.buttonClick, WBJ_VOL.buttonClick); },
      playFail(){ _oneShot(WBJ_SND.levelFail, WBJ_VOL.levelFail); },
      playWin(){ _oneShot(WBJ_SND.levelWin, WBJ_VOL.levelWin); },

      // ---- background music (looping AudioBufferSourceNode; persists through pause, stops only on main-menu) ----
      playBgm(){
        _flowEnabled = true; // a level is (re)starting → allow the flow loop again
        _ensureGraph();
        const ctx = _ctx();
        if (ctx.state === "suspended") ctx.resume();
        _bgmPlaying = true;
        if (_bgmSource) return; // already looping — idempotent, never stack a second source
        _ensureBgmBuffer().then(() => {
          if (!_bgmPlaying || _bgmSource) return; // stopped, or a source already started, while decoding
          _startBgmSource();
        }).catch(() => {}); // failure already reported by _ensureBgmBuffer
      },
      stopBgm(){ _bgmPlaying = false; _stopBgmSource(); _bgmOffset = 0; }, // reset to the start of the track

      // ---- water-flow loop ----
      // pouring: any drain actively pouring/draining.  filling: any cell's level still rising.
      updateWaterFlow(pouring, filling, dt){
        if (!_flowEnabled){ this.stopWaterFlow(); return; }
        if (_flowPaused){ _flowStop(0); return; }
        let want = false, mode = null;
        if (pouring){
          want = true; mode = "pour"; _flowFillMs = 0; _flowFillCapped = false;
        } else if (filling){
          mode = "fill";
          _flowFillMs += dt;
          if (_flowFillMs >= WBJ_FLOW_FILL_CAP_MS) _flowFillCapped = true;
          // Play while filling, but duck out entirely during a wobble hit, and cut once capped.
          want = !_flowFillCapped && !this.isWobblePlaying();
        } else {
          _flowFillMs = 0; _flowFillCapped = false;
        }

        if (want){
          _flowStart();
          _flowMode = mode;
        } else if (_flowPlaying()){
          // A pour session truly ending fades out; fill ducking/capping/ending cuts instantly.
          const fade = (_flowMode === "pour" && !pouring && !filling) ? WBJ_FLOW_FADE_MS : 0;
          _flowStop(fade);
          _flowMode = null;
        }
      },
      stopWaterFlow(){
        _flowEnabled = false;
        _flowStop(0);
        _flowMode = null; _flowFillMs = 0; _flowFillCapped = false;
      },
      pauseFlow(){ _flowPaused = true; _flowStop(0); _flowMode = null; },
      resumeFlow(){ _flowPaused = false; }, // the per-frame update restarts it when conditions hold

      // ---- app-minimised safety: stop every persistent voice so nothing plays in the background ----
      suspendForBackground(){
        _bgPausedVoices = [];
        Object.keys(_voices).forEach((k) => {
          const v = _voices[k];
          if (v && !v.el.paused){ _bgPausedVoices.push(k); try { v.el.pause(); } catch (e) {} }
        });
        _flowMode = null;
        // BGM: a buffer source can't pause, so remember the position and stop the source.
        _bgmWasPlaying = !!_bgmSource;
        _captureBgmOffset();
        _stopBgmSource();
      },
      resumeFromBackground(){
        if (_bgPausedVoices){
          _bgPausedVoices.forEach((k) => {
            const v = _voices[k];
            if (v && v.el.paused){ const p = v.el.play(); if (p && p.catch) p.catch(() => {}); }
          });
          _bgPausedVoices = null;
        }
        // Restart the BGM loop at the retained offset only if it was playing before backgrounding.
        if (_bgmWasPlaying){ _bgmWasPlaying = false; this.playBgm(); }
      },
    };
  })();

  // ---------- Loudness Meter (ITU-R BS.1770 approx) ----------
  let _meterRAF = null;
  let _meterAnalyser = null;
  let _kWeightHigh = null;
  let _kWeightShelf = null;
  let _meterBuffer = null;
  let _meterShortRing = [];
  let _meterIntegrated = { sum: 0, count: 0 };
  let _meterTruePeak = -Infinity;

  function initMeter() {
    if (_meterAnalyser) return;
    const ctx = getAudioContext();
    ensureGainGraph();

    // K-weighting: high-pass 60Hz + high-shelf 1500Hz +4dB (approx BS.1770)
    _kWeightHigh = ctx.createBiquadFilter();
    _kWeightHigh.type = "highpass";
    _kWeightHigh.frequency.value = 60;
    _kWeightHigh.Q.value = 0.5;

    _kWeightShelf = ctx.createBiquadFilter();
    _kWeightShelf.type = "highshelf";
    _kWeightShelf.frequency.value = 1500;
    _kWeightShelf.gain.value = 4;

    _meterAnalyser = ctx.createAnalyser();
    _meterAnalyser.fftSize = 2048;

    _meterInput.connect(_kWeightHigh);
    _kWeightHigh.connect(_kWeightShelf);
    _kWeightShelf.connect(_meterAnalyser);

    _meterBuffer = new Float32Array(_meterAnalyser.fftSize);
  }

  function meterTick() {
    if (!_meterAnalyser) return;
    _meterAnalyser.getFloatTimeDomainData(_meterBuffer);
    const len = _meterBuffer.length;

    // RMS for this block
    let sumSq = 0;
    let blockPeak = 0;
    for (let i = 0; i < len; i++) {
      const s = _meterBuffer[i];
      sumSq += s * s;
      const abs = Math.abs(s);
      if (abs > blockPeak) blockPeak = abs;
    }
    const rms = Math.sqrt(sumSq / len);

    // 4x oversampled true peak approximation (linear interp between samples)
    for (let i = 0; i < len - 1; i++) {
      const a = _meterBuffer[i], b = _meterBuffer[i + 1];
      for (let j = 1; j <= 3; j++) {
        const interp = Math.abs(a + (b - a) * (j / 4));
        if (interp > blockPeak) blockPeak = interp;
      }
    }

    const dbTP = blockPeak > 0 ? 20 * Math.log10(blockPeak) : -Infinity;
    if (dbTP > _meterTruePeak) _meterTruePeak = dbTP;

    // LUFS = -0.691 + 10*log10(mean_square) (simplified)
    const lufs = rms > 0 ? -0.691 + 10 * Math.log10(rms * rms) : -Infinity;

    // Short-term: trailing 3s ring buffer (~3s of blocks at rAF rate)
    const now = performance.now();
    _meterShortRing.push({ t: now, sq: rms * rms });
    while (_meterShortRing.length && _meterShortRing[0].t < now - 3000) _meterShortRing.shift();
    let shortSum = 0;
    for (const b of _meterShortRing) shortSum += b.sq;
    const shortMean = shortSum / (_meterShortRing.length || 1);
    const shortLUFS = shortMean > 0 ? -0.691 + 10 * Math.log10(shortMean) : -Infinity;

    // Integrated (gated: only blocks > -70 LUFS)
    if (lufs > -70) {
      _meterIntegrated.sum += rms * rms;
      _meterIntegrated.count++;
    }
    const intMean = _meterIntegrated.count > 0 ? _meterIntegrated.sum / _meterIntegrated.count : 0;
    const intLUFS = intMean > 0 ? -0.691 + 10 * Math.log10(intMean) : -Infinity;

    // Update UI
    document.getElementById("meterShort").textContent = isFinite(shortLUFS) ? shortLUFS.toFixed(1) : "—";
    document.getElementById("meterIntegrated").textContent = isFinite(intLUFS) ? intLUFS.toFixed(1) : "—";
    document.getElementById("meterPeak").textContent = isFinite(_meterTruePeak) ? _meterTruePeak.toFixed(1) : "—";
  }

  function startMeter() {
    initMeter();
    if (_meterRAF) return;
    function loop() {
      meterTick();
      _meterRAF = requestAnimationFrame(loop);
    }
    _meterRAF = requestAnimationFrame(loop);
  }

  function stopMeter() {
    if (_meterRAF) { cancelAnimationFrame(_meterRAF); _meterRAF = null; }
  }

  function resetMeter() {
    _meterShortRing = [];
    _meterIntegrated = { sum: 0, count: 0 };
    _meterTruePeak = -Infinity;

  // ---------- Game Loop (60 fps cap) ----------
  // All gameplay rendering/logic goes in updateGame(dt).
  // The loop is started by startGame() and stopped by levelComplete()/levelFailed().
  // On high-refresh-rate displays (90/120 Hz) frames are skipped to hold 60 fps.
  const FRAME_MS = 1000 / 60;
  // Never advance the sim/timer by more than a few frames in one step. When the app is
  // minimised RAF halts and `_lastFrame` goes stale, so the first frame back would report
  // the whole background span as dt and instantly drain the timer — clamp it out.
  const MAX_DT_MS = 100;
  let _lastFrame = 0;
  let _gameRAF = null;

  function _tick(now) {
    _gameRAF = requestAnimationFrame(_tick);
    const dt = now - _lastFrame;
    if (dt < FRAME_MS) return;
    _lastFrame = now;
    updateGame(Math.min(dt, MAX_DT_MS));
  }

  function startLoop() {
    if (_gameRAF) return;
    _lastFrame = performance.now();
    _gameRAF = requestAnimationFrame(_tick);
  }

  function stopLoop() {
    if (_gameRAF) {
      cancelAnimationFrame(_gameRAF);
      _gameRAF = null;
    }
  }

  // ★ YOUR GAME LOGIC — called at 60 fps with delta time in ms ★
  function updateGame(dt) {
    if (window.WBJ) window.WBJ.step(dt);
  }

  // ---------- Localisation ----------
  // Text strings live in translations.js (window.GAME_TEXT). Edit that file to
  // change wording or add new strings / languages.
  const I18N = window.GAME_TEXT;
  const LANGS = window.LANGUAGE_ORDER || Object.keys(I18N);
  const i18nEls = document.querySelectorAll("[data-i18n]");

  function matchSupportedLanguage(deviceLanguage){
    if (!deviceLanguage) return null;
    const normalizedLanguage = String(deviceLanguage).toLowerCase().replace(/_/g, "-");
    const exactLanguage = LANGS.find((supportedLanguage) =>
      supportedLanguage.toLowerCase() === normalizedLanguage
    );
    if (exactLanguage) return exactLanguage;
    const baseLanguage = normalizedLanguage.split("-")[0];
    return LANGS.find((supportedLanguage) =>
      supportedLanguage.toLowerCase() === baseLanguage
    ) || null;
  }

  function primaryDeviceLanguage(){
    return (Array.isArray(navigator.languages) && navigator.languages.length
      ? navigator.languages[0]
      : navigator.language) || "";
  }

  function detectInitialLanguage(){
    // Only the device's PRIMARY (active) language selects the game language.
    // Any language we don't translate (e.g. the user switches the device to a
    // non-English, non-Polish language) falls back to English rather than a
    // lingering secondary preference such as Polish.
    return matchSupportedLanguage(primaryDeviceLanguage()) || (LANGS.includes("en") ? "en" : LANGS[0]);
  }

  let lang = detectInitialLanguage();
  const t = (key) => I18N[lang][key];

  function applyLanguage(){
    const dict = I18N[lang];
    // Static text nodes flagged with data-i18n
    i18nEls.forEach((el) => {
      const key = el.getAttribute("data-i18n");
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    // Language toggle button shows the language you can switch to
    debugLang.textContent = dict.language;
    // Level-dependent labels
    updateLevelLabels();
    // Refresh the result overlay if it is currently on screen
    if (overlay.classList.contains("show")){
      if (overlayCard.classList.contains("win")){
        animateTitle(overlayTitle, dict.completeTitle);
        overlaySubtitle.textContent = dict.completeSubtitle;
        overlayBtn.textContent = t("level") + " " + (level + 1);
      } else {
        overlayTitle.textContent = dict.failTitle;
        overlaySubtitle.textContent = dict.failSubtitle;
        overlayBtn.textContent = dict.retry;
      }
    }
  }

  function toggleLanguage(){
    const i = LANGS.indexOf(lang);
    lang = LANGS[(i + 1) % LANGS.length];
    lastDeviceLanguage = primaryDeviceLanguage();   // a manual pick sticks until the device language actually changes
    applyLanguage();
  }

  // Re-detect when the device's active language changes (e.g. the user switches
  // their phone to a non-English, non-Polish language) so the game falls back to
  // English instead of staying on Polish. Fires on the web languagechange event
  // and whenever the app returns to the foreground.
  let lastDeviceLanguage = primaryDeviceLanguage();
  function refreshLanguageFromDevice(){
    const current = primaryDeviceLanguage();
    if (current === lastDeviceLanguage) return;
    lastDeviceLanguage = current;
    const detected = detectInitialLanguage();
    if (detected !== lang){ lang = detected; applyLanguage(); }
  }
  window.addEventListener("languagechange", refreshLanguageFromDevice);

  function handleBackNavigation(){
    // A device back gesture (Android Back / iOS back-swipe) must never minimize
    // the game or leave the board frozen behind an open menu. Dismiss the
    // top-most open layer through its normal close path so the 'settings' pause
    // reason always clears (otherwise the board stays paused = softlock).
    const qc = document.getElementById("quitConfirm");
    if (qc && qc.classList.contains("show")) {
      qc.classList.remove("show");
      haptic("tap");
      return;
    }
    if (settingsOverlay.classList.contains("show")) {
      closeSettings(); // resumes the board so a back-swipe can't softlock it
      haptic("tap");
      return;
    }
    // Nothing open: absorb the gesture and stay in the game.
    haptic("tap");
  }

  function installBackNavigationGuard(){
    const capacitorApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (capacitorApp && typeof capacitorApp.addListener === "function") {
      try { capacitorApp.addListener("backButton", handleBackNavigation); } catch (e) {}
    }

    try {
      history.pushState({ kpfBackGuard: true }, "", location.href);
      window.addEventListener("popstate", () => {
        history.pushState({ kpfBackGuard: true }, "", location.href);
        handleBackNavigation();
      });
    } catch (e) {}
  }

  // Split the title into per-letter spans so each pops in with a stagger.
  function animateTitle(el, text){
    el.textContent = "";
    let i = 0;
    [...text].forEach((ch) => {
      if (ch === "\n"){
        el.appendChild(document.createElement("br"));
        return;
      }
      const span = document.createElement("span");
      span.className = "ltr";
      span.textContent = ch;
      span.style.animationDelay = (i * 45) + "ms";
      el.appendChild(span);
      i++;
    });
  }

  function launchConfetti(){
    const rect = confettiCanvas.getBoundingClientRect();
    confettiCanvas.width = rect.width;
    confettiCanvas.height = rect.height;
    const W = confettiCanvas.width;
    const H = confettiCanvas.height;
    const colors = ["#38dc85", "#ffcb3d", "#ff6b70", "#4d9bff", "#c86bff", "#ffffff"];

    confettiParticles = [];
    for (let i = 0; i < 140; i++){
      confettiParticles.push({
        x: Math.random() * W,
        y: -20 - Math.random() * H * 0.6,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        color: colors[(Math.random() * colors.length) | 0],
        vx: (Math.random() - 0.5) * 1.6,
        vy: 2 + Math.random() * 3,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        sway: Math.random() * Math.PI * 2
      });
    }

    if (confettiRAF) cancelAnimationFrame(confettiRAF);
    let lastVFX = 0;

    function frame(now){
      confettiRAF = requestAnimationFrame(frame);
      if (now - lastVFX < FRAME_MS) return;
      lastVFX = now;
      cctx.clearRect(0, 0, W, H);
      let alive = false;
      for (const p of confettiParticles){
        p.sway += 0.05;
        p.x += p.vx + Math.sin(p.sway) * 0.6;
        p.y += p.vy;
        p.rot += p.vr;
        if (p.y < H + 20) alive = true;
        cctx.save();
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rot);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cctx.restore();
      }
      if (!alive){
        cancelAnimationFrame(confettiRAF);
        cctx.clearRect(0, 0, W, H);
        confettiRAF = null;
      }
    }
    confettiRAF = requestAnimationFrame(frame);
  }

  function stopConfetti(){
    if (confettiRAF){
      cancelAnimationFrame(confettiRAF);
      confettiRAF = null;
    }
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }

  const FW_COLORS = ["#38dc85", "#ffcb3d", "#ff6b70", "#4d9bff", "#c86bff", "#ffffff", "#ff9f43"];

  function launchFireworks(){
    const rect = fireworksCanvas.getBoundingClientRect();
    fireworksCanvas.width = rect.width;
    fireworksCanvas.height = rect.height;
    const W = fireworksCanvas.width;
    const H = fireworksCanvas.height;

    fwRockets = [];
    fwParticles = [];

    let launched = 0;
    let nextLaunch = 0;
    const maxLaunch = 6;
    const start = performance.now();

    function spawnRocket(){
      fwRockets.push({
        x: W * (0.2 + Math.random() * 0.6),
        y: H + 10,
        vy: -(H * 0.013 + Math.random() * 2.4),
        targetY: H * (0.18 + Math.random() * 0.32),
        color: FW_COLORS[(Math.random() * FW_COLORS.length) | 0]
      });
    }

    function explode(x, y, color){
      const n = 42 + (Math.random() * 28 | 0);
      for (let i = 0; i < n; i++){
        const ang = (Math.PI * 2 * i) / n + Math.random() * 0.2;
        const speed = 1.8 + Math.random() * 4.1;
        fwParticles.push({
          x, y,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed,
          life: 1,
          decay: 0.012 + Math.random() * 0.014,
          color: Math.random() < 0.15 ? "#ffffff" : color,
          size: 2 + Math.random() * 2
        });
      }
    }

    if (fireworksRAF) cancelAnimationFrame(fireworksRAF);
    let lastVFX = 0;

    function frame(now){
      fireworksRAF = requestAnimationFrame(frame);
      if (now - lastVFX < FRAME_MS) return;
      lastVFX = now;
      const t = now - start;
      fwctx.clearRect(0, 0, W, H);

      if (launched < maxLaunch && t >= nextLaunch){
        spawnRocket();
        launched++;
        nextLaunch = t + 130 + Math.random() * 170;
      }

      for (let i = fwRockets.length - 1; i >= 0; i--){
        const r = fwRockets[i];
        r.y += r.vy;
        r.vy += 0.05;
        fwctx.fillStyle = r.color;
        fwctx.beginPath();
        fwctx.arc(r.x, r.y, 2.5, 0, Math.PI * 2);
        fwctx.fill();
        if (r.y <= r.targetY || r.vy >= 0){
          explode(r.x, r.y, r.color);
          fwRockets.splice(i, 1);
        }
      }

      let len = fwParticles.length;
      for (let i = len - 1; i >= 0; i--){
        const p = fwParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.life -= p.decay;
        if (p.life <= 0){ fwParticles[i] = fwParticles[--len]; continue; }
        fwctx.globalAlpha = p.life;
        fwctx.fillStyle = p.color;
        fwctx.beginPath();
        fwctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        fwctx.fill();
      }
      fwParticles.length = len;
      fwctx.globalAlpha = 1;

      const active = fwRockets.length || len || launched < maxLaunch;
      if (!active || t >= 4500){
        cancelAnimationFrame(fireworksRAF);
        fwctx.clearRect(0, 0, W, H);
        fireworksRAF = null;
      }
    }
    fireworksRAF = requestAnimationFrame(frame);
  }

  function stopFireworks(){
    if (fireworksRAF){
      cancelAnimationFrame(fireworksRAF);
      fireworksRAF = null;
    }
    fwRockets = [];
    fwParticles = [];
    fwctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
  }

    location.reload();
  });

  // Mixer toggle (also shows/hides loudness meter)
  document.getElementById("debugMixerToggle").addEventListener("click", () => {
    const opening = !debugPanel.classList.contains("mixer-open");
    debugPanel.classList.toggle("mixer-open");
    if (opening) {
      meterPanel.classList.add("show");
      startMeter();
    } else {
      meterPanel.classList.remove("show");
      stopMeter();
    }
  });
  document.getElementById("meterReset").addEventListener("click", resetMeter);

  // Init mixer controls
  initMixerControls();
  preloadAllAudio();
  wbjAudio.preload();

  settingsBtnStart.addEventListener("click", () => { sfxClick(); openSettings(); });
  settingsBtnGame.addEventListener("click", () => { sfxClick(); openSettings(); });
  resetBtnGame.addEventListener("click", () => { sfxClick(); if (window.WBJ) window.WBJ.startLevel(level); });
  settingsClose.addEventListener("click", () => { sfxClick(); closeSettings(); });

  // Quit confirmation flow
  const quitConfirm = document.getElementById("quitConfirm");
  const quitYes = document.getElementById("quitYes");
  const quitNo = document.getElementById("quitNo");

  settingsQuit.addEventListener("click", () => {
    sfxClick();
    sfxPopup();
    quitConfirm.classList.add("show");
  });
  quitYes.addEventListener("click", () => {
    sfxClick();
    quitConfirm.classList.remove("show");
    quitToHome();
  });
  quitNo.addEventListener("click", () => {
    sfxClick();
    quitConfirm.classList.remove("show");
  });

  settingsOverlay.addEventListener("click", (e) => {
    if (e.target === settingsOverlay) {
      sfxClick();
      quitConfirm.classList.remove("show");
      closeSettings();
    }
  });

  // Locked tab toasts
  document.querySelectorAll(".home-bar .tab.locked").forEach((tab) => {
    tab.addEventListener("click", () => {
      haptic("tap");
      const rect = tab.getBoundingClientRect();
      const appRect = tab.closest(".app").getBoundingClientRect();
      const toast = document.createElement("span");
      toast.className = "locked-toast";
      toast.textContent = t("keepPlaying");
      toast.style.top = (rect.top - appRect.top - 8) + "px";
      tab.closest(".app").appendChild(toast);
      // Centre on the tab, clamped so it stays on-screen
      const tw = toast.offsetWidth;
      const centre = rect.left - appRect.left + rect.width / 2;
      const left = Math.max(8, Math.min(appRect.width - tw - 8, centre - tw / 2));
      toast.style.left = left + "px";
      toast.addEventListener("animationend", () => toast.remove());
    });
  });

  applyLanguage();
  updateLevelLabels();
  installBackNavigationGuard();

  // ---- Bridge the KPF template to the WaterBlockJam gameplay ----
  window.KPF = {
    haptic: haptic,
    playSound: playSound,
    stopSound: stopSound,
    wbj: wbjAudio,
    t: t,
    quitToHome: quitToHome,
    get level(){ return level; },
  };
  if (window.WBJ) {
    window.WBJ.onLevelComplete = levelComplete;
    window.WBJ.onLevelFailed = levelFailed;
  }

  // ---------- Orientation Lock (PORTRAIT ONLY) ----------
  // The game must never rotate to landscape. In Capacitor builds the native
  // manifest (android:screenOrientation="portrait") prevents rotation at the OS
  // level. We also call the Capacitor ScreenOrientation plugin as a belt-and-
  // suspenders measure.
  //
  // IMPORTANT: We intentionally do NOT call screen.orientation.lock() in plain
  // browsers because Chrome shows a "rotate" button in the bottom-left corner
  // whenever it detects a JS orientation lock, which lets users override it.
  // By skipping it, that button never appears.
  (function lockPortrait() {
    if (!window.Capacitor || !window.Capacitor.Plugins) return;
    // Capacitor ScreenOrientation plugin (preferred — native-level lock)
    const { ScreenOrientation } = window.Capacitor.Plugins;
    if (ScreenOrientation && ScreenOrientation.lock) {
      ScreenOrientation.lock({ orientation: "portrait" }).catch(() => {});
    }
    // Fallback: standard API inside Capacitor's webview (no Chrome rotate button
    // appears because the Activity manifest already locks orientation).
    const so = window.screen && window.screen.orientation;
    if (so && typeof so.lock === "function") {
      Promise.resolve(so.lock("portrait-primary")).catch(() => {
        Promise.resolve(so.lock("portrait")).catch(() => {});
      });
    }
  })();

  // ---------- Splash sequence ----------
  // Fade in logo, hold, fade out, then show appropriate screen.
  setTimeout(() => splashLogo.classList.add("visible"), 100);
  setTimeout(() => splashLogo.classList.remove("visible"), 1600);
  setTimeout(() => {
    if (level === 1) {
      // First-time player: skip home, go straight into level 1.
      // Must route through startGame() so the analytics level-start hook fires.
      startGame();
    } else {
      showScreen(startScreen);
    }
  }, 2200);

  // Start BGM on first user interaction (browsers require a gesture to play audio)
  document.addEventListener("pointerdown", () => {
    playBackgroundAudio();
  }, { once: true });
})();
  </script>
</body>

</html>
