<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Star Tap</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 20px;
      font-family: Inter, system-ui, sans-serif;
      background: #1032cf;
      color: #fbfbfb;
    }
    .hud { display: flex; gap: 28px; font-weight: 800; letter-spacing: .04em; }
    .hud span { font-variant-numeric: tabular-nums; }
    button.star {
      width: 168px;
      height: 168px;
      border: 0;
      border-radius: 50%;
      background: #ffcb05;
      color: #1032cf;
      font-size: 72px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 10px 0 #d9a904;
    }
    button.star:active { transform: translateY(6px); box-shadow: 0 4px 0 #d9a904; }
    button.star:disabled { opacity: .55; cursor: default; transform: none; }
    .go {
      min-width: 160px;
      padding: 12px 18px;
      border: 0;
      border-radius: 14px;
      background: #ffcb05;
      color: #141414;
      font-weight: 800;
      cursor: pointer;
    }
    p { margin: 0; font-size: 13px; color: #9ff0db; text-align: center; }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>TIME <span id="time">10</span></div>
  </div>
  <button class="star" id="star" type="button" disabled>★</button>
  <button class="go" id="go" type="button">Start</button>
  <p id="note">A catalog game. Scores post back to the hub.</p>
  <script>
    (function () {
      var DURATION = 10;
      var score = 0;
      var left = DURATION;
      var running = false;
      var timer = null;
      var scoreEl = document.getElementById("score");
      var timeEl = document.getElementById("time");
      var star = document.getElementById("star");
      var go = document.getElementById("go");
      var note = document.getElementById("note");

      function send(value) {
        if (window.parent === window) return;
        window.parent.postMessage({ type: "kwalee.score", score: value, streak: 0 }, "*");
      }

      function finish() {
        running = false;
        clearInterval(timer);
        star.disabled = true;
        go.disabled = false;
        go.textContent = "Play again";
        note.textContent = "Run sent to the hub: " + score;
        send(score);
      }

      go.addEventListener("click", function () {
        if (running) return;
        score = 0;
        left = DURATION;
        running = true;
        scoreEl.textContent = "0";
        timeEl.textContent = String(left);
        star.disabled = false;
        go.disabled = true;
        note.textContent = "Tap the star.";
        timer = setInterval(function () {
          left -= 1;
          timeEl.textContent = String(left);
          if (left <= 0) finish();
        }, 1000);
      });

      star.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        if (!running) return;
        score += 1;
        scoreEl.textContent = String(score);
      });
    })();
  </script>
</body>
</html>
