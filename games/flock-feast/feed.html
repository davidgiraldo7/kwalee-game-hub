                        if ('roughness' in o.material) o.material.roughness = Math.min(o.material.roughness ?? 1, 0.7);
                    } else if (o.material.color) {
                        o.material.color.copy(tintCol); // fallback if the texture can't be read
                    }
                    o.material.needsUpdate = true;
                    o.castShadow = true; o.receiveShadow = true;
                }
            });
            m.rotation.y = 0; // model already faces +Z (toward camera / travel dir)
            g.add(m);
            // The model's eyes are baked into its texture, so add two feather-colored eyelid
            // discs over them that grow shut for a blink. Positions were tuned per eye against
            // the model's actual pupils (bird-local space, before the group's 0.72 scale).
            const lidMat = new THREE.MeshStandardMaterial({ color: tint(FOOD[color], -0.14), roughness: 0.65 });
            const EYE = [
                { x: -0.102, y: 0.851, z: 0.468, r: 0.064 }, // screen-left eye
                { x:  0.193, y: 0.865, z: 0.468, r: 0.064 }, // screen-right eye
            ];
            const _lids = [];
            for (const e of EYE) {
                const lid = new THREE.Mesh(lidGeo, lidMat);
                lid.position.set(e.x, e.y, e.z);
                lid.scale.set(e.r, 0.001, e.r * 0.42); // flat disc over the eye; y grows to blink shut
                lid.userData.closeY = e.r;
                lid.userData._bx = e.x; // side marker for the blink loop
                lid.visible = false; // hidden until a blink closes it
                lid.castShadow = false; lid.receiveShadow = false;
                g.add(lid);
                _lids.push(lid);
            }
            g.scale.setScalar(0.9);
            g.userData.kind = 'bird';
            // The model ships with the wings as separate meshes (Wing_L / Wing_R), each pivoted
            // at the shoulder. Grab them so the flap loop can hinge them up/down for a real wing
            // beat — no geometry cutting, no squashing. Remember each wing's rest rotation.
            const wL = m.getObjectByName('Wing_L'), wR = m.getObjectByName('Wing_R');
            const wings = [];
            if (wL) { wL.userData.restZ = wL.rotation.z; wL.userData.dir = -1; wings.push(wL); }
            if (wR) { wR.userData.restZ = wR.rotation.z; wR.userData.dir = 1; wings.push(wR); }
            g.userData.flap = wings.length ? { parts: wings }
                : { node: m, base: m.scale.clone(), wings: null };
            g.userData.blink = { eyes: null, lids: _lids };
            return g;
        }
        // Procedural fallback (used until bird.glb finishes loading, or if it fails).
        const mat = foodMat(color);
        const body = new THREE.Mesh(birdBodyGeo, mat);
        body.scale.set(1, 0.92, 1.02);
        body.castShadow = true; body.receiveShadow = true;
        g.add(body);
        // belly
        const belly = new THREE.Mesh(birdBodyGeo, new THREE.MeshStandardMaterial({ color: tint(FOOD[color], 0.28), roughness: 0.5 }));
        belly.scale.set(0.66, 0.6, 0.5); belly.position.set(0, -0.08, 0.34);
        g.add(belly);
        // wings
        const _wings = [];
        for (const s of [-1, 1]) {
            const w = new THREE.Mesh(wingGeo, new THREE.MeshStandardMaterial({ color: tint(FOOD[color], -0.12), roughness: 0.5 }));
            w.scale.set(0.5, 0.72, 0.32); w.position.set(s * 0.46, -0.02, 0.02);
            w.userData.dir = s; // flap pivot direction (see the flap loop in update())
            g.add(w);
            _wings.push(w);
        }
        // tuft
        for (const a of [-0.28, 0, 0.28]) {
            const t = new THREE.Mesh(tuftGeo, new THREE.MeshStandardMaterial({ color: tint(FOOD[color], -0.18), roughness: 0.6 }));
            t.position.set(a * 0.3, 0.5, 0); t.rotation.z = -a * 1.4;
            g.add(t);
        }
        // beak
        const beak = new THREE.Mesh(beakGeo, beakMat);
        beak.rotation.x = Math.PI / 2; beak.position.set(0, 0.02, 0.52);
        g.add(beak);
        // eyes
        const _eyes = [];
        for (const s of [-1, 1]) {
            const eye = new THREE.Mesh(eyeGeo, eyeMat);
            eye.position.set(s * 0.2, 0.2, 0.44); g.add(eye);
            _eyes.push(eye);
            const hi = new THREE.Mesh(eyeHiGeo, eyeHiMat);
            hi.position.set(s * 0.2 - 0.02, 0.24, 0.5); g.add(hi);
        }
        g.scale.setScalar(0.9);
        g.userData.kind = 'bird';
        g.userData.flap = { node: null, wings: _wings }; // real wing meshes flap in update()
        g.userData.blink = { eyes: _eyes, lids: null }; // squash eye meshes to blink
        return g;
    }

    // peg that pins an item to the vertical board (points toward the camera)
    const pegMat = new THREE.MeshStandardMaterial({ color: 0xcab48f, roughness: 0.52, metalness: 0.08 });
    const pegPinGeo = new THREE.CylinderGeometry(0.042, 0.0525, 0.434, 12);
    const pegCapGeo = new THREE.SphereGeometry(0.07, 14, 10);
    // thicker pin sized to the donut hole so a donut threads on snugly (fits tightly)
    const pegThroughGeo = new THREE.CylinderGeometry(0.091, 0.091, 0.574, 18);
    const pegTipGeo = new THREE.SphereGeometry(0.091, 16, 12);
    function buildPeg(x, y, through) {
        const g = new THREE.Group();
        if (through) {
            const pin = new THREE.Mesh(pegThroughGeo, pegMat);
            pin.rotation.x = Math.PI / 2; pin.castShadow = true; g.add(pin);
            const tip = new THREE.Mesh(pegTipGeo, pegMat);
            tip.position.z = 0.28; tip.castShadow = true; g.add(tip);
            g.position.set(x, y, -0.18);   // pin threads from the back wall through the donut hole
        } else {
            const pin = new THREE.Mesh(pegPinGeo, pegMat);
            pin.rotation.x = Math.PI / 2; pin.castShadow = true;
            const cap = new THREE.Mesh(pegCapGeo, pegMat);
            cap.position.z = 0.21; cap.castShadow = true;
            g.add(pin, cap);
            g.position.set(x, y - 0.02, BOARD.pegZ);
        }
        return g;
    }

    // static machine (built once)
    let gearL = null, gearR = null;
    // a single grinder gear: an extruded COG with sharp pointed teeth + hub/bolts, facing the camera
    function buildGear(rPitch, N, color, hand) {
        const D = TAU / N, rTip = rPitch + 0.075, rRoot = rPitch - 0.095, hw = D * 0.27, hwTip = D * 0.16;
        const P = (ang, rad) => [Math.cos(ang) * rad, Math.sin(ang) * rad];
        const shape = new THREE.Shape();
        shape.moveTo(...P(0, rRoot));
        for (let i = 0; i < N; i++) {
            const c = i * D + D / 2;                  // tooth centre
            shape.lineTo(...P(c - hw, rRoot));         // valley -> left flank base
            shape.lineTo(...P(c - hwTip, rTip));       // up the left flank
            shape.lineTo(...P(c + hwTip, rTip));       // short flat top (sharp but chunky)
            shape.lineTo(...P(c + hw, rRoot));         // down the right flank
            shape.lineTo(...P((i + 1) * D, rRoot));    // flat valley to the next tooth
        }
        shape.closePath();
        const depth = 0.92;
        const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
        geo.translate(0, 0, -depth / 2);
        // twist into HELICAL (slanted) teeth — opposite hands so the pair still meshes
        const pos = geo.attributes.position, tw = (hand || 1) * 0.5;
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), a = tw * (z / depth);
            const ca = Math.cos(a), sa = Math.sin(a);
            pos.setX(i, x * ca - y * sa); pos.setY(i, x * sa + y * ca);
        }
        pos.needsUpdate = true; geo.computeVertexNormals();
        const g = new THREE.Group();
        // polygonOffset pushes the cog face back in the depth buffer so overlapping
        // bolt spheres and hub faces always win where they cross the cog surface.
        const mat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.62, metalness: 0.12, clearcoat: 0.22, clearcoatRoughness: 0.5, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
        const cog = new THREE.Mesh(geo, mat);
        cog.castShadow = false; cog.receiveShadow = true;
        g.add(cog);
        // hub with a recessed inset bore at the centre (lathed profile: outer wall + front recess)
        // hubL is kept strictly inside depth/2 so hub faces never share a plane with the cog faces.
        const hubR = rPitch * 0.4, hubL = depth / 2 - 0.005, boreR = hubR * 0.6, boreD = 0.14;
        const hubProf = [
            new THREE.Vector2(0, -hubL),
            new THREE.Vector2(hubR, -hubL),
            new THREE.Vector2(hubR, hubL),
            new THREE.Vector2(boreR, hubL),
            new THREE.Vector2(boreR, hubL - boreD),
            new THREE.Vector2(0, hubL - boreD),
        ];
        const hub = new THREE.Mesh(new THREE.LatheGeometry(hubProf, 28),
            new THREE.MeshPhysicalMaterial({ color: 0x7a6144, roughness: 0.55, metalness: 0.12, clearcoat: 0.15, clearcoatRoughness: 0.6 }));
        hub.rotation.x = Math.PI / 2; hub.castShadow = false; g.add(hub);
        // dark floor at the bottom of the bore so the inset reads clearly
        const insetFloor = new THREE.Mesh(new THREE.CircleGeometry(boreR * 0.98, 24),
            new THREE.MeshStandardMaterial({ color: 0x2e2519, roughness: 0.9, metalness: 0.08 }));
        insetFloor.position.set(0, 0, hubL - boreD + 0.002); g.add(insetFloor);
        const boltMat = new THREE.MeshPhysicalMaterial({ color: 0x5a4a35, roughness: 0.5, metalness: 0.2, clearcoat: 0.2 });
        for (let i = 0; i < 6; i++) {
            const a = i / 6 * TAU;
            const bolt = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 10), boltMat);
            bolt.position.set(Math.cos(a) * rPitch * 0.62, Math.sin(a) * rPitch * 0.62, 0.42);
            g.add(bolt);
        }
        return g;
    }

    function buildMachine() {
        const machine = new THREE.Group();

        // Soft matte earthy gradient shared by the wall + floor. Parametrised by distance
        // ALONG the surface (from the top of the wall, down then forward across the floor) so
        // the colour never plateaus at the wall/floor bend — that keeps the transition
        // perfectly seamless (no gradient kink, no line). Unlit vertex colours (linear space).
        const GRAD_TOPY = 13;
        const GRAD_A = new THREE.Color(0xa8896b).convertSRGBToLinear();   // wall (deeper earthy)
        const GRAD_B = new THREE.Color(0xe8d8bd).convertSRGBToLinear();   // floor (pale sand)
        const GRAD_SPAN = 26;
        const _gc = new THREE.Color();
        function colorForDist(d) {
            // Clamp at the floor end; above the design top (d<0) let the ramp CONTINUE
            // a little (extrapolate darker) so the enlarged wall never shows a hard cap
            // or seam when the camera frames higher on some aspect ratios.
            let t = d / GRAD_SPAN; t = t > 1 ? 1 : (t < -0.6 ? -0.6 : t);
            return _gc.copy(GRAD_A).lerp(GRAD_B, t);
        }
        function paintWall(geo) {   // flat vertical wall: surface distance from top = TOPY - y
            const pos = geo.attributes.position, n = pos.count, col = new Float32Array(n * 3);
            for (let i = 0; i < n; i++) {
                const c = colorForDist(GRAD_TOPY - pos.getY(i));
                col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        }

        // (The old "HUD backing panel" slab that used to sit behind the DOM top bar was
        // removed: the top bar is now pinned to the screen top while the machine is
        // bottom-anchored, so that slab no longer lined up with the bar and instead showed
        // as an orphaned band across the cabinet. The extended cabinet wall now covers this
        // area smoothly.)

        // Recessed BACK WALL of the cavity — what you see through the carved chamber.
        // The chamber backdrop (this wall, the carved cabinet face, its lining and the funnel
        // slope) all live in `cabinetFace`, a group we scale in X on wide screens so the
        // cabinet expands sideways to use the space (see applySpread). Everything else — the
        // grinder, feeder, nests — stays centred.
        const cabinetFace = new THREE.Group();
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(18, 32),
            new THREE.MeshStandardMaterial({ color: 0x4a3a28, roughness: 0.95 }));
        backWall.position.set(0, 9.0, -0.62); backWall.receiveShadow = false;
        cabinetFace.add(backWall);

        // CABINET FRONT FACE with the chamber -> funnel -> bowl cavity carved out of it.
        // The extruded hole's inner walls become the smooth funnel the items roll down,
        // so the funnel reads as part of the wall (a recess), never a floating object.
        {
            // yTop runs the chamber opening UP past the top HUD bar (off the visible frame) so the
            // cavity fills the area behind the HUD too, instead of leaving a blank wall band above it.
            const xW = FUNNEL_EDGE.x0, yTop = 16.0, topR = 0.55;
            const yFunTop = FUNNEL_EDGE.y0;   // vertical side-wall bottom meets the funnel start
            const cav = new THREE.Path();
            cav.moveTo(-xW, yTop - topR);
            cav.quadraticCurveTo(-xW, yTop, -xW + topR, yTop);
            cav.lineTo(xW - topR, yTop);
            cav.quadraticCurveTo(xW, yTop, xW, yTop - topR);
            cav.lineTo(xW, yFunTop);
            // deep, rounded parabolic funnel curving down to the shredder, then a BOXY pocket.
            // Box shrunk 30% (to match the 30%-smaller gears); funnel keeps the SAME control
            // points so its slope is unchanged, just extended down to the narrower mouth.
            cav.bezierCurveTo(FUNNEL_EDGE.c1x, FUNNEL_EDGE.c1y, FUNNEL_EDGE.c2x, FUNNEL_EDGE.c2y, FUNNEL_EDGE.x1, FUNNEL_EDGE.y1);  // funnel -> broader, squarer box mouth
            cav.lineTo(FUNNEL_EDGE.x1, CONTAINER_CORNER_Y);          // right wall of the boxy cavity
            cav.quadraticCurveTo(FUNNEL_EDGE.x1, CONTAINER_BASE_Y, 0.49, CONTAINER_BASE_Y); // rounded bottom-right corner
            cav.lineTo(-0.49, CONTAINER_BASE_Y);                     // flat bottom
            cav.quadraticCurveTo(-FUNNEL_EDGE.x1, CONTAINER_BASE_Y, -FUNNEL_EDGE.x1, CONTAINER_CORNER_Y); // rounded bottom-left corner
            cav.lineTo(-FUNNEL_EDGE.x1, FUNNEL_EDGE.y1);            // left wall of the boxy cavity
            cav.bezierCurveTo(-FUNNEL_EDGE.c2x, FUNNEL_EDGE.c2y, -FUNNEL_EDGE.c1x, FUNNEL_EDGE.c1y, -xW, yFunTop);
            cav.lineTo(-xW, yTop - topR);
            const face = new THREE.Shape();
            // the cabinet is the ONLY wall — a large slab that fills the frame; its base curves
            // forward into the ground below (see the floor cove), so nothing renders behind it.
            // Sized VERY generously in width so it reaches the screen edges on EVERY aspect the
            // bottom-anchored camera fit can produce (portrait through wide desktop) — no side gap.
            face.moveTo(-80, 36);
            face.lineTo(80, 36);
            face.lineTo(80, -6.5);
            face.lineTo(-80, -6.5);
            face.closePath();
            face.holes.push(cav);
            const faceGeo = new THREE.ExtrudeGeometry(face, { depth: 1.0, bevelEnabled: false, steps: 1 });
            faceGeo.computeVertexNormals();
            paintWall(faceGeo);
            const cabinetMat = new THREE.MeshBasicMaterial({ color: 0xffffff, vertexColors: true, fog: false });
            const cavityMat = new THREE.MeshStandardMaterial({ color: 0x483726, roughness: 0.92 });
            const cabinet = new THREE.Mesh(faceGeo, [cabinetMat, cavityMat]);
            cabinet.position.set(0, 0, -0.5); // front face at z=0.5, recess goes back to the back wall
            cabinet.castShadow = true; cabinet.receiveShadow = false; // no shadows inside the cabinet
            cabinetFace.add(cabinet);

            // CAVITY LINING — a thin pastel piping that traces the whole cavity edge along the
            // front face, framing the opening with a soft accent line.
            {
                // Drop the last point — it duplicates the first (the path closes back to its start),
                // and having an identical start/end in a closed CatmullRomCurve3 creates a
                // zero-length segment that kinks the tube at the closure seam.
                const linePts = cav.getPoints(260).slice(0, -1).map(p => new THREE.Vector3(p.x, p.y, 0.5));
                const lineCurve = new THREE.CatmullRomCurve3(linePts, true);
                const lineGeo = new THREE.TubeGeometry(lineCurve, 340, 0.055, 10, true);
                const lineMat = new THREE.MeshPhysicalMaterial({ color: 0xf0e3c6, roughness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.3, emissive: 0x483a20, emissiveIntensity: 0.25 });
                const lining = new THREE.Mesh(lineGeo, lineMat);
                lining.castShadow = true;
                cabinetFace.add(lining);
            }

            // FUNNEL SLOPE SURFACE — where the vertical playfield gives way to the funnel, a
            // concave scoop sweeps the parabolic opening down into the grinder throat so the
            // slope's inner surface is revealed (read top-down) instead of an empty hole. It
            // meets the board plane at the top, so the lining flows smoothly onto the surface.
            {
                // The slope is the lining itself, twisting open. Each side runs along the SAME
                // cavity bezier the lining traces (outer edge, z=0.5). The inner edge twists from
                // directly-behind (edge-on → reads as thin piping where the slope starts) to the
                // recessed valley centre (face-on → the full slope surface at the grinder). The
                // twist is monotonic, so the thickness grows smoothly instead of bulging mid-way.
                const funEdge = new THREE.CubicBezierCurve(
                    new THREE.Vector2(FUNNEL_EDGE.x0, FUNNEL_EDGE.y0), new THREE.Vector2(FUNNEL_EDGE.c1x, FUNNEL_EDGE.c1y),
                    new THREE.Vector2(FUNNEL_EDGE.c2x, FUNNEL_EDGE.c2y), new THREE.Vector2(FUNNEL_EDGE.x1, FUNNEL_EDGE.y1));
                // SLOPE_REACH (0..1): how far UP the funnel — measured from the grinder — the
                // surface is allowed to open. 1 = opens all the way to the top of the lining;
                // smaller values keep the top part collapsed as thin lining and only open the
                // lower portion near the grinder. Tune this to control the reach along the lining.
                const SLOPE_REACH = 1.8;
                const Nd = 64, pos = [], idx = [];
                for (const sign of [1, -1]) {
                    const base = pos.length / 3;
                    for (let j = 0; j <= Nd; j++) {
                        const d = j / Nd, e = d * d * (3 - 2 * d);       // smoothstep the twist
                        const E = funEdge.getPoint(d);
                        // width ramp gated by SLOPE_REACH: stays 0 (collapsed on the lining) above the
                        // reach line, then smoothsteps up to full width down at the grinder.
                        const wt = SLOPE_REACH > 0 ? Math.min(1, Math.max(0, (d - (1 - SLOPE_REACH)) / SLOPE_REACH)) : 0;
                        const ew = wt * wt * (3 - 2 * wt);
                        // TUCK: over the last stretch (d>0.72) the inner edge curls backward + down so the
                        // slope folds under itself into the grinder throat instead of ending in a flat,
                        // forward-pointing tip that renders over the gears. Width also tapers here so the
                        // two sides recede to a soft rounded lip rather than two sharp points.
                        const tk = Math.min(1, Math.max(0, (d - 0.72) / 0.28));
                        const tkS = tk * tk * (3 - 2 * tk);
                        // outer edge: exactly on the lining bezier at the front face
                        pos.push(sign * E.x, E.y, 0.5);
                        // inner edge: a TAPERED offset whose direction rotates from straight-back
                        // (edge-on at the start) to a gentle inward tilt that recedes rather than
                        // dropping — so it never stabs a point down into the grinder mouth. The width
                        // also ramps from ~0 at the very top (the inner edge collapses onto the lining
                        // bezier, so the slope starts as the lining piping itself — no visible thickness
                        // step) up to the full width at the grinder, growing smoothly with the twist.
                        const lx = -0.82 * e, ly = -0.18 * e - 0.9 * tkS, lz = -(1 - e) - 0.54 * e - 1.4 * tkS;
                        const L = Math.hypot(lx, ly, lz) || 1, W = 0.94 * ew * (1 - 0.36 * tkS);
                        pos.push(sign * (E.x + W * lx / L), E.y + W * ly / L, 0.5 + W * lz / L);
                    }
                    for (let j = 0; j < Nd; j++) {
                        const a = base + j * 2;
                        idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
                    }
                }
                const g = new THREE.BufferGeometry();
                g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                g.setIndex(idx); g.computeVertexNormals();
                // exact same pastel material as the cavity lining — the slope is not a separate
                // part; it is the lining itself, now seen as a surface because we look down onto it.
                const slopeMat = new THREE.MeshPhysicalMaterial({ color: 0xf0e3c6, roughness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.3, emissive: 0x483a20, emissiveIntensity: 0.25, side: THREE.DoubleSide });
                const slope = new THREE.Mesh(g, slopeMat);
                // receiveShadow off: this is the funnel/throat surface directly behind & around
                // the grinder gears — it was catching a cast shadow (the "shadow behind the right
                // grinding wheel"). Disabling reception keeps it evenly lit and shadow-free.
                slope.receiveShadow = false;
                cabinetFace.add(slope);
            }
        }
        // Register the chamber backdrop group so it can be expanded sideways per aspect ratio.
        machine.add(cabinetFace);
        cabinetFaceGroup = cabinetFace;

        // GRINDER: two interlocking gears that counter-rotate, pulling crackers into the
        // nip and squeezing pellets out below (see update() for the spin + spawnPellet).
        gearL = buildGear(0.4, 8, 0xbfae90, 1);
        gearR = buildGear(0.4, 8, 0xbfae90, -1);
        const gx = 0.4;
        gearL.position.set(-gx, 0, 0);
        gearR.position.set(gx, 0, 0);
        gearR.rotation.z = Math.PI / 8;         // half-tooth offset (even teeth) -> perfect interlock
        // Assemble the pair INLINE (side by side, level) with a slight lean so the
        // slanted (helical) teeth read as real 3D metal.
        const gearAssembly = new THREE.Group();
        gearAssembly.add(gearL, gearR);
        for (const hx of [-gx, gx]) {
            const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.34, 16),
                new THREE.MeshPhysicalMaterial({ color: 0x4a3d2a, roughness: 0.6, metalness: 0.2, clearcoat: 0.12 }));
            axle.rotation.x = Math.PI / 2; axle.position.set(hx, 0, -0.28); gearAssembly.add(axle);
        }
        gearAssembly.position.set(0, -0.05 + GEAR_LIFT, -0.1); // seated up inside the mouth of the boxy cavity
        gearAssembly.rotation.x = -0.4;         // slight lean -> shows the slanted teeth
        gearAssembly.rotation.z = 0;            // inline (gears level, side by side)
        gearAssembly.scale.setScalar(0.7);      // 30% smaller grinder (uniform -> teeth stay interlocked)
        machine.add(gearAssembly);

        // Smooth curved launch slope MOULDED FROM THE WALL: a spline ribbon swept across
        // the pocket, in the cavity material, tucked into the side walls so no seams show.
        {
            const N = 46, halfW = 0.66, positions = [], indices = [];
            for (let i = 0; i <= N; i++) {
                const p = scoopCurve.getPoint(i / N);
                const t = i / N;
                const k = Math.min(1, Math.max(0, (t - 0.72) / 0.28));
                const s = k * k * (3 - 2 * k);
                const w = halfW + (0.49 - halfW) * s;
                positions.push(-w, p.y, p.z, w, p.y, p.z);
            }
            for (let i = 0; i < N; i++) { const a = i * 2; indices.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setIndex(indices); geo.computeVertexNormals();
            const scoopMat = new THREE.MeshPhysicalMaterial({ color: 0x6a5234, roughness: 0.3, clearcoat: 0.6, clearcoatRoughness: 0.28, side: THREE.DoubleSide });
            const scoop = new THREE.Mesh(geo, scoopMat);
            // castShadow off: the scoop sat in the grinder throat and threw a shadow onto the
            // wall BEHIND the gears (the "shadow behind the grinder"). Still receives light/shadow.
            scoop.receiveShadow = true; scoop.castShadow = false;
            machine.add(scoop);
        }
        // WOODEN DECK platform — the feeding dish + nests rest on it. Matches the cabinet's
        // warm wood so it reads as one piece of furniture; a darker trim lip frames the edge.
        {
            const mkRect = (w, d, r) => {
                const s = new THREE.Shape();
                s.moveTo(-w / 2 + r, -d / 2);
                s.lineTo(w / 2 - r, -d / 2);
                s.quadraticCurveTo(w / 2, -d / 2, w / 2, -d / 2 + r);
                s.lineTo(w / 2, d / 2 - r);
                s.quadraticCurveTo(w / 2, d / 2, w / 2 - r, d / 2);
                s.lineTo(-w / 2 + r, d / 2);
                s.quadraticCurveTo(-w / 2, d / 2, -w / 2, d / 2 - r);
                s.lineTo(-w / 2, -d / 2 + r);
                s.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + r, -d / 2);
                return s;
            };
            const pw = 5.4 * FEEDER_SCALE, pd = 4.2 * FEEDER_SCALE, pr = 0.55 * FEEDER_SCALE, pth = 0.275 * FEEDER_SCALE;
            const topY = BOWL.y - 0.08; // top surface = the dish/nest base, so they sit ON the deck
            // darker trim lip (slightly larger + lower) frames the deck
            // Trim the platform's FRONT so it meets the bowl instead of overhanging with unused wood.
            const frontCut = pd / 2 - BOWL.r;                                   // deck front apron beyond the bowl
            const lipFrontCut = (pd + 0.5 * FEEDER_SCALE) / 2 - BOWL.r - 0.04;  // keep only a thin front frame
            const lipGeo = new THREE.ExtrudeGeometry(mkRect(pw + 0.5 * FEEDER_SCALE, (pd + 0.5 * FEEDER_SCALE) - lipFrontCut, pr + 0.1 * FEEDER_SCALE),
                { depth: pth + 0.09 * FEEDER_SCALE, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.08, bevelSegments: 3 });
            lipGeo.translate(0, -lipFrontCut / 2, 0);   // shift back so only the FRONT trims (rear edge stays)
            const lip = new THREE.Mesh(lipGeo, new THREE.MeshStandardMaterial({ color: 0x6f5131, roughness: 0.82 }));
            lip.rotation.x = Math.PI / 2 + FEED_TILT; lip.position.set(BOWL.x, topY - 0.035 * FEEDER_SCALE, BOWL.z);
            lip.receiveShadow = true; lip.castShadow = true; machine.add(lip);
            // warm wood deck top
            const deckGeo = new THREE.ExtrudeGeometry(mkRect(pw, pd - frontCut, pr),
                { depth: pth, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.1, bevelSegments: 4 });
            deckGeo.translate(0, -frontCut / 2, 0);   // shift back so only the FRONT trims (rear edge stays)
            const deck = new THREE.Mesh(deckGeo, new THREE.MeshPhysicalMaterial({ color: 0xa8896b, roughness: 0.72, clearcoat: 0.12, clearcoatRoughness: 0.7 }));
            deck.rotation.x = Math.PI / 2 + FEED_TILT; deck.position.set(BOWL.x, topY, BOWL.z);
            deck.receiveShadow = true; deck.castShadow = true; machine.add(deck);

            // Small wooden TABLET nailed onto the deck's front face, showing the feeding-area count.
            {
                // sit in FRONT of the protruding trim lip so it isn't occluded, and raised so it
                // reads clearly from the high camera angle.
                // Sits in the open space just in front of / below the bowl, close to it.
                const frontZ = BOWL.z + BOWL.r * Math.cos(FEED_TILT) + 0.12; // just in front of the bowl rim, clear of the deck edge
                const midY = BOWL.y - 0.12; // lifted clear of the platform so the count reads
                const pg = new THREE.Group();
                pg.position.set(BOWL.x, midY, frontZ);
                pg.rotation.x = -0.3;      // face the high camera
                pg.scale.setScalar(0.5 * FEEDER_SCALE);   // 50% smaller, then shrunk with the feeder

                const Wt = 1.85, Ht = 0.7, border = 0.065; // thin frame bevel
                // centered rounded-rect builder (works for a Shape or a Path)
                const rr = (o, w, h, r) => {
                    const x = -w / 2, y = -h / 2;
                    o.moveTo(x + r, y);
                    o.lineTo(x + w - r, y); o.quadraticCurveTo(x + w, y, x + w, y + r);
                    o.lineTo(x + w, y + h - r); o.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    o.lineTo(x + r, y + h); o.quadraticCurveTo(x, y + h, x, y + h - r);
                    o.lineTo(x, y + r); o.quadraticCurveTo(x, y, x + r, y);
                    return o;
                };
                // real 3D BEVELLED FRAME — a rounded-rect ring extruded toward the camera
                const frameShape = rr(new THREE.Shape(), Wt, Ht, 0.14);
                frameShape.holes.push(rr(new THREE.Path(), Wt - 2 * border, Ht - 2 * border, 0.09));
                const frameGeo = new THREE.ExtrudeGeometry(frameShape,
                    { depth: 0.14, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.035, bevelSegments: 3 });
                const frame = new THREE.Mesh(frameGeo, new THREE.MeshPhysicalMaterial({ color: 0x9a5636, roughness: 0.5, clearcoat: 0.3, clearcoatRoughness: 0.5 }));
                frame.castShadow = true; frame.receiveShadow = true; pg.add(frame);
                // recessed dark PANEL filling the opening
                const panelGeo = new THREE.ExtrudeGeometry(rr(new THREE.Shape(), Wt - 2 * border + 0.05, Ht - 2 * border + 0.05, 0.1),
                    { depth: 0.06, bevelEnabled: false });
                const panel = new THREE.Mesh(panelGeo, new THREE.MeshStandardMaterial({ color: 0x2a140f, roughness: 0.85 }));
                panel.position.z = 0.02; pg.add(panel);
                // TEXT face (canvas texture, transparent bg — the panel is the dark background)
                const openW = Wt - 2 * border, openH = Ht - 2 * border;
                const cvs = document.createElement('canvas'); cvs.width = 512; cvs.height = Math.round(512 * openH / openW);
                const ctx = cvs.getContext('2d');
                const tex = new THREE.CanvasTexture(cvs); tex.anisotropy = 8;
                const face = new THREE.Mesh(new THREE.PlaneGeometry(openW * 0.96, openH * 0.92),
                    new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
                face.position.z = 0.092; pg.add(face);
                deckCount = {
                    draw(text, full) {
                        const W = cvs.width, H = cvs.height;
                        ctx.clearRect(0, 0, W, H);
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.font = "800 " + Math.round(H * 0.82) + "px 'Baloo 2', 'Nunito', sans-serif";
                        ctx.lineJoin = 'round'; ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,.6)';
                        ctx.strokeText(text, W / 2, H / 2 + 4);
                        ctx.fillStyle = full ? '#ff5a4d' : '#ffe6b8';
                        ctx.fillText(text, W / 2, H / 2 + 4);
                        tex.needsUpdate = true;
                    }
                };
                deckCount.draw('0/' + BOWL_CAPACITY, false);
                machine.add(pg);
            }
        }

        // FLAT, ROUND feeding plate (the feeding area) — tilted toward the camera so its
        // round face reads as a full circle. Shredded food flies out of the slope and lands here.
        const feedGroup = new THREE.Group();
        const plate = new THREE.Mesh(new THREE.CylinderGeometry(BOWL.r, BOWL.r * 0.92, 0.16, 56),
            new THREE.MeshPhysicalMaterial({ color: 0x5a3a22, roughness: 0.5, clearcoat: 0.4 }));
        plate.receiveShadow = true; plate.castShadow = true; feedGroup.add(plate);
        const dishFloor = new THREE.Mesh(new THREE.CircleGeometry(BOWL.r * 0.9, 56),
            new THREE.MeshStandardMaterial({ color: 0x452b18, roughness: 0.65 }));
        dishFloor.rotation.x = -Math.PI / 2; dishFloor.position.y = 0.085; dishFloor.receiveShadow = true; feedGroup.add(dishFloor);
        const rim = new THREE.Mesh(new THREE.TorusGeometry(BOWL.r * 0.97, 0.09, 16, 56),
            new THREE.MeshPhysicalMaterial({ color: 0x7a4f2e, roughness: 0.38, clearcoat: 0.5 }));
        rim.rotation.x = Math.PI / 2; rim.position.y = 0.09; rim.castShadow = true; feedGroup.add(rim);
        feedGroup.position.set(BOWL.x, BOWL.y, BOWL.z);
        feedGroup.rotation.x = FEED_TILT;   // face the camera -> full circle
        machine.add(feedGroup);

        // nests (woven twig ring) — rotated onto the tilted deck surface so they
        // ride with it. NESTS is mutated in place so the birds still land squarely on each nest.
        const twigMat = new THREE.MeshStandardMaterial({ color: 0x8a5a2c, roughness: 0.9 });
        const nestPivotY = BOWL.y - 0.08;                // deck top = tilt pivot (matches topY below)
        const nestCt = Math.cos(FEED_TILT), nestSt = Math.sin(FEED_TILT);
        for (const n of NESTS) {
            n.x *= FEEDER_SCALE;
            const ry = (n.y - nestPivotY) * FEEDER_SCALE, rz = (n.z - BOWL.z) * FEEDER_SCALE;
            n.y = nestPivotY + ry * nestCt - rz * nestSt;
            n.z = BOWL.z + ry * nestSt + rz * nestCt;
            const nest = new THREE.Group();
            if (nestProto) {
                nest.add(nestProto.clone(true));            // use the loaded nest model
            } else {
                // procedural twig-ring fallback; recorded so it can be swapped for the model on load
                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.16, 12, 24), twigMat);
                ring.rotation.x = Math.PI / 2; ring.castShadow = true; ring.receiveShadow = true;
                nest.add(ring);
                const bowl2 = new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 14, 0, TAU, Math.PI * 0.5, Math.PI * 0.5), new THREE.MeshStandardMaterial({ color: 0x4a2d15, roughness: 1, side: THREE.DoubleSide }));
                nest.add(bowl2);
                nestGroups.push(nest);
            }
            nest.rotation.x = FEED_TILT;
            nest.scale.setScalar(FEEDER_SCALE);
            n.y += 0.02;   // small base lift (matches the deck pivot)
            // Wooden STAND that raises the nest dock up off the deck. Built as a SIBLING
            // (not a child) so a bird-plop punch-scale on the nest never squashes the stand.
            const NEST_STAND_H = 0.4;   // world height of the stand
            const dyS = NEST_STAND_H * Math.cos(FEED_TILT), dzS = NEST_STAND_H * Math.sin(FEED_TILT);
            const stand = new THREE.Mesh(
                new THREE.CylinderGeometry(0.24, 0.30, NEST_STAND_H, 20),
                new THREE.MeshPhysicalMaterial({ color: 0x8a6a45, roughness: 0.72, clearcoat: 0.1, clearcoatRoughness: 0.6 }));
            stand.rotation.x = FEED_TILT;
            stand.position.set(n.x, n.y + dyS / 2, n.z + dzS / 2);   // base on the deck, top at the raised nest
            stand.castShadow = true; stand.receiveShadow = true;
            machine.add(stand);
            n.y += dyS; n.z += dzS;   // lift the nest (and its bird) onto the stand
            nest.position.set(n.x, n.y, n.z);
            machine.add(nest);
            n.mesh = nest;   // ref so a bird plop can punch-scale its nest
        }

        // The cabinet is the ONLY wall: its front base curves seamlessly into the ground, and
        // that ground covers the whole floor toward the camera. Nothing renders behind it.
        {
            const gY = GROUND_Y;
            const zW = FLOOR_ZW;
            // Curvature-continuous fillet: the tangent angle eases 0deg->90deg via smootherstep,
            // so curvature ramps up from 0 and back to 0 (G2) — no kinks, no banding lines.
            const smoother = (u) => u * u * u * (u * (u * 6 - 15) + 10);
            const M = 80, Larc = 1.0;
            const fil = [];
            let z = zW, y = 0;
            fil.push([y, z]);
            for (let i = 1; i <= M; i++) {
                const th = (Math.PI / 2) * smoother(i / M);
                const ds = Larc / M;
                z += ds * Math.sin(th);
                y -= ds * Math.cos(th);
                fil.push([y, z]);
            }
            const shift = gY - fil[fil.length - 1][0];   // land the fillet exactly on the floor
            // The floor in front of the fillet tilts toward the camera on the SAME plane as the
            // feeding deck (via groundYAt), so the tilted deck sits flush on it instead of clipping
            // through a flat floor. It levels back out just past the deck's front edge.
            const prof = [];
            prof.push(new THREE.Vector3(0, gY + 1.1, zW));            // straight wall (coplanar w/ cabinet)
            for (const [fy, fz] of fil) prof.push(new THREE.Vector3(0, fy + shift, fz));
            prof.push(new THREE.Vector3(0, groundYAt(FLOOR_LEVEL_Z), FLOOR_LEVEL_Z));   // tilted floor (parallel to the deck)
            prof.push(new THREE.Vector3(0, groundYAt(FLOOR_LEVEL_Z), 24));              // flat again beyond the deck
            const HALF = 80, N = prof.length, positions = [], indices = [];
            for (let i = 0; i < N; i++) {
                const p = prof[i];
                positions.push(-HALF, p.y, p.z, HALF, p.y, p.z);
            }
            for (let i = 0; i < N - 1; i++) {
                const a = i * 2;
                indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setIndex(indices);
            // Colour by cumulative surface distance from the top of the wall, so it flows
            // seamlessly out of the wall gradient and keeps changing across the bend (no line).
            {
                const dist = new Array(N);
                dist[0] = GRAD_TOPY - prof[0].y;
                for (let i = 1; i < N; i++) dist[i] = dist[i - 1] + prof[i].distanceTo(prof[i - 1]);
                const colors = new Float32Array(N * 2 * 3);
                for (let i = 0; i < N; i++) {
                    const c = colorForDist(dist[i]);
                    colors[i * 6] = c.r; colors[i * 6 + 1] = c.g; colors[i * 6 + 2] = c.b;
                    colors[i * 6 + 3] = c.r; colors[i * 6 + 4] = c.g; colors[i * 6 + 5] = c.b;
                }
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            }
            const floor = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, vertexColors: true, fog: false, side: THREE.DoubleSide }));
            floor.receiveShadow = false;
            machine.add(floor);
        }

        // TOP BANNER / VALANCE — a themed wooden pelmet mounted across the top of the cabinet,
        // sitting IN FRONT of the chamber opening (z ahead of the pinned items). It backs the
        // DOM top bar so the UI never reads over the eggs/crackers queued up behind it.
        // Clean flat bottom edge with cream piping along the straight lower rim.
        {
            const x0 = -16, x1 = 16, yTopB = 24, yBase = 7.95;
            const shape = new THREE.Shape();
            shape.moveTo(x0, yTopB);
            shape.lineTo(x1, yTopB);
            shape.lineTo(x1, yBase);
            shape.lineTo(x0, yBase);
            shape.lineTo(x0, yTopB);
            const bgeo = new THREE.ExtrudeGeometry(shape, { depth: 0.55, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.13, bevelSegments: 2, steps: 1 });
            bgeo.computeVertexNormals();
            const bMat = new THREE.MeshStandardMaterial({ color: 0x9c7c52, roughness: 0.82, metalness: 0.0, emissive: 0x241a10, emissiveIntensity: 0.35 });
            const board = new THREE.Mesh(bgeo, bMat);
            board.position.z = 0.3;              // bevelled front lands ~z=0.98 → ahead of items (z=0.06)
            machine.add(board);
            // cream piping along the clean straight bottom edge
            const pipePts = [
                new THREE.Vector3(x0, yBase, 1.0),
                new THREE.Vector3(x1, yBase, 1.0),
            ];
            const pipeCurve = new THREE.CatmullRomCurve3(pipePts, false);
            const pipeGeo = new THREE.TubeGeometry(pipeCurve, 4, 0.085, 10, false);
            const pipeMat = new THREE.MeshPhysicalMaterial({ color: 0xf0e3c6, roughness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.3, emissive: 0x483a20, emissiveIntensity: 0.25 });
            machine.add(new THREE.Mesh(pipeGeo, pipeMat));
        }

        scene.add(machine);
    }

    // ========================================================================
    // GAME STATE
    // ========================================================================
    let gameState = STATE.BOOT;
    let levelIdx = 0, cfg = null;
    let run = { score: 0 };
    const pile = [];      // { group, type, color }
    const fallers = [];   // { group, type, color, vy }
    const shredders = []; // crackers being ground between the gears (bottom-to-top clip)
    // When the bowl is full a tapped cracker still drops but the grinder cannot process it —
    // it wedges between the gear teeth and jams the grinder until the bowl has room again.
    let grinderJammed = false;    // true while a cracker is stuck in the nip
    let jammedCracker = null;     // { group, color } of the wedged cracker
    let gearJamBaseL = 0, gearJamBaseR = 0; // gear rotation frozen at jam time
    const debris = [];    // shell shards + sparkles from a hatching egg (ballistic, fades out)
    const pellets = [];   // { mesh, color, landed, vy, tx, ty, tz, t }
    const pelletQueue = []; // staggered spawn queue so grains pour in like a cascade
    const birds = [];     // { group, color, need, fill, status, nest, feed, phase, cool, busy, eat }
    const eatingSlots = new Set(); // heaps a bird is currently nibbling (so two birds don't share one)
    const boardGroup = new THREE.Group(); // scrolling container for pinned board items + pegs
    scene.add(boardGroup);
    let crumbCount = {};
    let needQueue = {}; // per-colour queue of appetites so food splits evenly across the flock
    let deckCount = null; // text tablet nailed to the base front face (feeding-area count)

    // ── IDLE HINT SYSTEM ─────────────────────────────────────────────────────
    let _idleTimer = 0;               // seconds since the last player interaction
    let _hintCooldown = 0;            // cooldown before the next hint may fire
    const IDLE_HINT_DELAY    = 10;    // seconds of inactivity before first hint
    const HINT_REPEAT_INTERVAL = 5;   // seconds between consecutive hints
    function resetIdleHint() { _idleTimer = 0; _hintCooldown = 0; }

    // A tapped item must NOT pass through the eggs/crackers still pinned below it —
    // it PINBALLS off them. Returns the obstacle it currently overlaps (nearest by
    // deepest penetration) as { x, y, r }, or null. Both still-pinned board items and
    // other in-flight fallers act as round bumpers.
    function fallerHit(f) {
        const fx = f.group.position.x, fy = f.group.position.y, R = f.r;
        let best = null, deepest = 0;
        for (const rec of pile) {                       // still-pinned board items (+ wood planks)
            const ix = rec.group.position.x;
            const iy = boardGroup.position.y + rec.group.position.y;
            if (rec.type === 'wood') {
                // Multi-segment collider — segs are mesh-local; × group.scale so hit = visible wood.
                const ang = rec.woodRot || 0;
                const gs = (rec.group && rec.group.scale && rec.group.scale.x) ? rec.group.scale.x : 1;
                const hh = (rec.woodHalfH || 0.14) * gs;
                const cos = Math.cos(ang), sin = Math.sin(ang);
                let segs = rec.woodSegs;
                if (!segs || !segs.length) {
                    const hw = (rec.woodHalfW || 0.55);
                    segs = [{ ax: -hw, ay: 0, bx: hw, by: 0 }];
                }
                for (const s of segs) {
                    const sax = s.ax * gs, say = s.ay * gs, sbx = s.bx * gs, sby = s.by * gs;
                    const ax = ix + sax * cos - say * sin;
                    const ay = iy + sax * sin + say * cos;
                    const bx = ix + sbx * cos - sby * sin;
                    const by = iy + sbx * sin + sby * cos;
                    const abx = bx - ax, aby = by - ay;
                    let t = ((fx - ax) * abx + (fy - ay) * aby) / (abx * abx + aby * aby + 1e-9);
                    t = Math.max(0, Math.min(1, t));
                    const cx = ax + t * abx, cy = ay + t * aby;
                    const dx = fx - cx, dy = fy - cy, d2 = dx * dx + dy * dy;
                    const reach = R + hh;
                    if (d2 >= reach * reach) continue;
                    const pen = reach - Math.sqrt(d2);
                    if (pen > deepest) { deepest = pen; best = { x: cx, y: cy, r: hh }; }
                }
                continue;
            }
            const ir = rec.cr || 0.26, reach = R + ir;
            const dx = fx - ix, dy = fy - iy, d2 = dx * dx + dy * dy;
            if (d2 >= reach * reach) continue;
            const pen = reach - Math.sqrt(d2);
            if (pen > deepest) { deepest = pen; best = { x: ix, y: iy, r: ir }; }
        }
        for (const g of fallers) {                       // other live fallers
            if (g === f) continue;
            const dx = fx - g.group.position.x, dy = fy - g.group.position.y;
            const reach = R + g.r, d2 = dx * dx + dy * dy;
            if (d2 >= reach * reach) continue;
            const pen = reach - Math.sqrt(d2);
            if (pen > deepest) { deepest = pen; best = { x: g.group.position.x, y: g.group.position.y, r: g.r }; }
        }
        return best;
    }
    // Is this egg-faller resting directly ON TOP of a cracker that the player has DROPPED and
    // that is now stuck over the grinder — i.e. a held-above cracker (bowl full) or the cracker
    // wedged between the gears (jammed)? Used by the deadlock breaker so an egg is only blasted
    // open when it is genuinely pinned by a stuck, dropped cracker — never while it rests on a
    // still-pinned board item or on another egg.
    function eggOnStuckCracker(f) {
        const ex = f.group.position.x, ey = f.group.position.y, R = f.r;
        const restsOn = (gx, gy, gr, margin) => {
            if (gy >= ey) return false;                     // supporter must sit BELOW the egg
            const dx = ex - gx, dy = ey - gy, reach = R + gr;
            return dx * dx + dy * dy <= reach * reach * margin;
        };
        for (const g of fallers) {                          // dropped crackers held on a full grinder
            if (g.type !== 'cracker' || !g.holdAbove) continue;
            if (restsOn(g.group.position.x, g.group.position.y, g.r, 1.1)) return true;
        }
        if (grinderJammed && jammedCracker && jammedCracker.group) { // dropped cracker wedged in the gears
            const jg = jammedCracker.group;
            if (restsOn(jg.position.x, jg.position.y, unitR('cracker'), 1.3)) return true;
        }
        return false;
    }
    // Crackers resting/rolling on the funnel slope are constrained to the surface, so they
    // resolve against each other along X. Only crackers that are actually touching in 2D
    // collide (a cracker far above at a similar X must NOT shove one down at the throat).
    // The cracker nearer the centre keeps its ground and slips into the grinder; only the
    // OUTER one yields and is pushed back up the slope — so they feed in one at a time
    // instead of wedging symmetrically across a mouth narrower than a single cracker.
    function resolveSlopeCollisions(f) {
        if (f.type !== 'cracker') return;
        const px = f.group.position;
        for (const g of fallers) {
            if (g === f || g.type !== 'cracker') continue;
            const gp = g.group.position;
            const dx = px.x - gp.x, dy = px.y - gp.y;
            const reach = f.r + g.r;
            if (dx * dx + dy * dy >= reach * reach) continue;   // not actually touching
            // minimum horizontal centre gap that clears the overlap at this vertical offset
            const need = Math.sqrt(Math.max(0, reach * reach - dy * dy));
            const gap = Math.abs(dx);
            const total = need - gap;
            if (total <= 0) continue;
            const dir = dx >= 0 ? 1 : -1;                        // outward for the higher-|x| body
            // f yields (is the outer one) when it sits farther from centre; ties → right side yields
            const fOuter = Math.abs(px.x) > Math.abs(gp.x) || (Math.abs(px.x) === Math.abs(gp.x) && px.x > gp.x);
            // Positional-only resolution: nudge the outer cracker out just enough to not overlap,
            // and clamp ONLY its inward velocity to zero so it rests against the inner one instead
            // of driving back in (which would pump energy and oscillate forever). No rebound/force.
            if (fOuter) {
                px.x += dir * total;
                if (typeof f.vx === 'number' && f.vx * dir < 0) f.vx = 0;
            } else {
                gp.x -= dir * total;
                if (typeof g.vx === 'number' && g.vx * dir > 0) g.vx = 0;
            }
        }
        // A wedged (jammed) cracker is no longer in `fallers`, so treat it as a STATIC
        // obstacle here — resting/rolling crackers slide off it and stack aside instead of
        // clipping through the one stuck in the nip.
        if (grinderJammed && jammedCracker && jammedCracker.group) {
            const gp = jammedCracker.group.position;
            const gr = unitR('cracker');
            const dx = px.x - gp.x, dy = px.y - gp.y;
            const reach = f.r + gr;
            if (dx * dx + dy * dy < reach * reach) {
                const need = Math.sqrt(Math.max(0, reach * reach - dy * dy));
                const total = need - Math.abs(dx);
                if (total > 0) {
                    const dir = dx >= 0 ? 1 : -1;   // f always yields to the wedged cracker
                    px.x += dir * total;
                    if (typeof f.vx === 'number' && f.vx * dir < 0) f.vx = 0;
                }
            }
        }
    }
    // Crackers resting/rolling on the funnel are constrained to the slope in Y, so if a
    // STILL-PINNED board item (egg / cracker / wood plank) sits just above the grinder
    // mouth it must block them along X too — otherwise the roller clips straight through
    // the peg row on its way to the shredder (visible bug: donut slides across the funnel
    // and passes through the diamond blockers). We depenetrate horizontally only and zero
    // the inward vx so the roller rests against the obstacle until it is tapped/removed.
    // Never push a cracker past the container wall: if it is cornered between a peg and
    // the wall, clamp to the wall (accepting a small residual overlap with the peg) so
    // the visible donut never protrudes through the cavity lining.
    function resolveSlopePileCollisions(f) {
        if (f.type !== 'cracker') return;
        const px = f.group.position;
        const R = f.r;
        const clampWall = () => {
            // Cavity wall x AT THE CIRCLE'S MIDLINE (px.y) — that is where the circle is
            // widest, so its rightmost point (Cx + R) crossing the wall there is exactly the
            // "pokes past the cream lining" bug. The wall widens above and narrows below
            // the midline, and the tangent point sits below the midline anyway.
            const wallAtY = funnelContactX(px.y);
            const XW = wallAtY * SPREAD - R;
            if (px.x >  XW) { px.x =  XW; if (typeof f.vx === 'number' && f.vx > 0) f.vx = 0; }
            else if (px.x < -XW) { px.x = -XW; if (typeof f.vx === 'number' && f.vx < 0) f.vx = 0; }
        };
        for (const rec of pile) {
            const ix = rec.group.position.x;
            const iy = boardGroup.position.y + rec.group.position.y;
            if (rec.type === 'wood') {
                // Multi-segment collider (mesh-local; scale by group.scale.x to match visible wood).
                const ang = rec.woodRot || 0;
                const gs = (rec.group && rec.group.scale && rec.group.scale.x) ? rec.group.scale.x : 1;
                const hh = (rec.woodHalfH || 0.14) * gs;
                const cos = Math.cos(ang), sin = Math.sin(ang);
                let segs = rec.woodSegs;
                if (!segs || !segs.length) {
                    const hw = (rec.woodHalfW || 0.55);
                    segs = [{ ax: -hw, ay: 0, bx: hw, by: 0 }];
                }
                for (const s of segs) {
                    const sax = s.ax * gs, say = s.ay * gs, sbx = s.bx * gs, sby = s.by * gs;
                    const ax = ix + sax * cos - say * sin;
                    const ay = iy + sax * sin + say * cos;
                    const bx = ix + sbx * cos - sby * sin;
                    const by = iy + sbx * sin + sby * cos;
                    const abx = bx - ax, aby = by - ay;
                    let t = ((px.x - ax) * abx + (px.y - ay) * aby) / (abx * abx + aby * aby + 1e-9);
                    t = Math.max(0, Math.min(1, t));
                    const cx = ax + t * abx, cy = ay + t * aby;
                    const dx = px.x - cx, dy = px.y - cy;
                    const reach = R + hh;
                    if (dx * dx + dy * dy >= reach * reach) continue;
                    const need = Math.sqrt(Math.max(0, reach * reach - dy * dy));
                    const total = need - Math.abs(dx);
                    if (total <= 0) continue;
                    const dir = dx >= 0 ? 1 : -1;
                    px.x += dir * total;
                    if (typeof f.vx === 'number' && f.vx * dir < 0) f.vx = 0;
                    clampWall();
                }
                continue;
            }
            const ir = rec.cr || 0.26;
            const reach = R + ir;
            const dx = px.x - ix, dy = px.y - iy;
            if (dx * dx + dy * dy >= reach * reach) continue;
            const need = Math.sqrt(Math.max(0, reach * reach - dy * dy));
            const total = need - Math.abs(dx);
            if (total <= 0) continue;
            const dir = dx >= 0 ? 1 : -1;
            px.x += dir * total;
            if (typeof f.vx === 'number' && f.vx * dir < 0) f.vx = 0;
            clampWall();
        }
    }

    // result overlay from outside our code while it is the only path back to
    // Retry/Next/Home; this class forces it to stay visible/interactive until we
    // deliberately unlock it. Do NOT reimplement this with a MutationObserver, polling,
    // an rAF loop, or a listener that re-adds classes — that pattern previously recursed
    // on its own DOM mutations and softlocked the editor/game.
    function lockResultOverlay() { ui.overlay.classList.add('show', 'result-locked'); }

    function pickImportLevels() {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = '.zip,.json,application/zip,application/json';
        inp.addEventListener('change', async () => {
            if (!inp.files || !inp.files.length) return;
            try {
                const r = await LevelLab.importFiles(inp.files);
                refreshLevels();
                sfx.level();
                buildPanel({
                    titleTop: 'LEVEL', titleBig: 'IMPORT',
                    msg: r.ok ? (`\u2713 ${r.reason}. Tap PLAY or LEVELS to start.`) : (`\u2715 ${r.reason}`),
                    buttons: [
                        { label: 'PLAY', action: () => startRun(0) },
                        { label: 'LEVEL LAB', sec: true, action: showLevelLab },
                        { label: 'MENU', sec: true, action: showMenu },
                    ],
                });
            } catch (err) {
                sfx.click();
                buildPanel({
                    titleTop: 'LEVEL', titleBig: 'IMPORT',
                    msg: '\u2715 Could not import: ' + (err && err.message ? err.message : err),
                    buttons: [{ label: 'BACK', action: showLevelLab }],
                });
            }
        });
        inp.click();
    }

    // EDITOR — pick a level, toggle colours + eggs, live-validate, save / test.

        idx = Math.max(0, Math.min(LL_COUNT - 1, idx | 0));

        const e = llEdit;

        const v = LevelLab.validate(level);

        h += '</div>';
        h += `<div class="llrow"><div class="lllabel">EGGS / COLOUR</div>`
           + `<div class="llstepper"><button class="llstep" data-egg="-1">\u2013</button><span class="llval">${e.eggs}</span><button class="llstep" data-egg="1">+</button></div></div>`;
        const nc = e.colors.size, birds = nc * e.eggs, crackers = nc * e.eggs * 2;
        h += `<div class="llreadout">${nc} colours \u00b7 ${birds} birds \u00b7 ${crackers} crackers \u00b7 diff ${LevelLab.score(level)}/10</div>`;
        h += `<div class="llbadge ${v.ok ? 'ok' : 'bad'}">${v.ok ? '\u2713 ' + v.reason : '\u2715 ' + v.reason}</div>`;
        h += '<div class="btns"><button class="btn" data-save="1"' + (v.ok ? '' : ' disabled') + '>SAVE</button>'
           + '<div class="llbtnrow"><button class="btn sec" data-test="1"' + (v.ok ? '' : ' disabled') + '>TEST</button>'
           + '<button class="btn sec" data-revert="1">REVERT</button></div>'

        ui.panel.innerHTML = h;
        ui.panel.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => { sfx.click(); showEditor(e.idx + (+b.dataset.nav)); }));
        ui.panel.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { sfx.click(); const c = b.dataset.c; if (e.colors.has(c)) e.colors.delete(c); else e.colors.add(c); renderEditor(); }));

        const draft = () => ({ id: e.id, colors: [...e.colors], eggs: e.eggs, crackers: e.eggs * 2 });

        ui.panel.querySelector('[data-revert]').addEventListener('click', () => { sfx.click(); LevelLab.resetEdit(e.id); refreshLevels(); showEditor(e.idx); });
