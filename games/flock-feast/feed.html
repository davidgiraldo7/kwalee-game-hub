            lockResultOverlay();   // final complete popup is up — guard it against a back-gesture dismissal
        }, CONFETTI_MS);
    }
    function win() {
        gameState = STATE.WIN;
        setHud(false);
        persistBest();
        sfx.win(); haptic(HAP.win);   // bigger finale buzz on full-game win
        spawnConfetti();
        // In embedded mode the shell owns the result UI; it will enter loop mode.
        if (embedded) { postToParent({ type: 'flock-feast:complete' }); return; }
        // let the confetti finish before the win panel appears
        setTimeout(() => {
            buildPanel({
                titleTop: 'YOU DID IT!', titleBig: '', stars: 3,
                msg: 'The whole flock is fed and flying home happy!',
                score: 'FINAL  ' + run.score,
                buttons: [
                    { label: 'PLAY AGAIN', action: () => { hidePanel(); startRun(); } },
                    { label: 'HOME', sec: true, action: () => { hidePanel(); showMenu(); } },
                ],
                sub: 'BEST  ' + (save.best || 0),
            });
            lockResultOverlay();   // final win popup is up — guard it against a back-gesture dismissal
        }, CONFETTI_MS);
    }
    function persistBest() { if (run && run.score > (save.best || 0)) { save.best = run.score; persist(); } }
    // Unlock the next level in the ladder (capped at the last level) so the
    // level-select grid opens it up permanently.
    function unlockNext() {
        const next = Math.min(ACTIVE_LEVELS.length, (cfg.id || 1) + 1);
        if (next > (save.unlocked || 1)) { save.unlocked = next; persist(); }
    }

    // pause / settings
    function openPause() {
        if (gameState === STATE.FTUE) endCoach(false); // opening settings dismisses an active coach
        if (gameState === STATE.PLAY) {
            gameState = STATE.PAUSE;
            setHud(false); ui.gear.hidden = true;
            sfx.click();
            buildPanel({
                titleBig: 'PAUSED',
                buttons: [
                    { label: 'RESUME', action: resume },
                    { label: 'RESTART', sec: true, action: () => { hidePanel(); beginLevel(levelIdx); } },
                    { label: 'HOME', sec: true, action: () => { hidePanel(); showMenu(); } },
                ],
                sub: 'SOUND &amp; CONTROLS', toggles: true,
            });
        } else if (gameState === STATE.MENU) {
            openSettings();
        }
    }
    function resume() { hidePanel(); gameState = STATE.PLAY; setHud(true); }
    function openSettings() {
        gameState = STATE.PAUSE;
        sfx.click();
        buildPanel({
            titleBig: 'SETTINGS',
            sub: 'SOUND &amp; CONTROLS', toggles: true,
            msg: 'Tap eggs to hatch birds and crackers to grind food. Feed each bird its matching color!',
            buttons: [{ label: 'BACK', action: () => { hidePanel(); showMenu(); } }],
        });
    }

    function clearBoard() {
        for (const p of pile) { boardGroup.remove(p.group); if (p.peg) boardGroup.remove(p.peg); }
        for (const f of fallers) scene.remove(f.group);
        for (const p of pellets) scene.remove(p.mesh);
        for (const b of birds) { killTweens(b.group.position); scene.remove(b.group); }
        for (const s of shredders) scene.remove(s.group);
        for (const d of debris) scene.remove(d.mesh);
        if (jammedCracker) scene.remove(jammedCracker.group);
        for (const k of keysInFlight) scene.remove(k);
        keysInFlight.length = 0;
        grinderJammed = false; jammedCracker = null;
        pile.length = 0; fallers.length = 0; pellets.length = 0; birds.length = 0;
        pelletQueue.length = 0; shredders.length = 0; eatingSlots.clear();
        hatchSeqCounter = 0;
        debris.length = 0;
        fxParts.length = 0;   // clear any in-flight 2D confetti
        clearBirdBars();
        killTweens(boardGroup.position); boardGroup.position.set(0, 0, 0);
        NESTS.forEach(s => s.taken = false);
        BOWL_FEED.forEach(s => s.taken = false);
        ui.ftue.classList.remove('show');
        if (coach) endCoach(false);
        if (ui.toast) ui.toast.classList.remove('show');
    }

    // ========================================================================
    // UPDATE LOOP
    // ========================================================================
    const clock = new THREE.Clock();
    let birdTick = 0;
    function update(dt) {
        updateTweens(dt);
        updateMusic();
        if (gameState === STATE.PAUSE) return;

        // pinned board items are STATIC (flat against the board, facing the camera).
        const t = performance.now() * 0.001;
        // LOCK & KEY idle shimmer — padlocks breathe + tilt, keys bob, so both catch the eye.
        for (const p of pile) {
            if (p.lockMesh) {
                p.lockMesh.scale.setScalar(1 + Math.sin(t * 3 + p.localY) * 0.05);
                p.lockMesh.rotation.z = Math.sin(t * 1.7 + p.localY) * 0.07;
            }
            if (p.keyMesh) {
                p.keyMesh.position.y = p.keyBaseY + Math.sin(t * 3.2 + p.localY) * 0.06;
                p.keyMesh.rotation.z = -0.5 + Math.sin(t * 2.2 + p.localY) * 0.16;
            }
        }
        // counter-rotate the interlocking grinder gears (nip pulls downward)
        if (grinderJammed) {
            // gears are jammed by the wedged cracker: freeze them and add a straining shudder.
            const j = Math.sin(performance.now() * 0.02) * 0.02;
            if (gearL) gearL.rotation.z = gearJamBaseL - j;
            if (gearR) gearR.rotation.z = gearJamBaseR + j;
            // as soon as ANY slot frees, grind whatever of the wedged remainder now fits.
            const inBowl = Object.values(crumbCount).reduce((a, b) => a + b, 0);
            if (inBowl < BOWL_CAPACITY) releaseJam();
        } else {
            // The grinder STOPS the instant the bowl is full (no room for pellets); it keeps
            // turning while a cracker is still being shredded so the grind finishes cleanly.
            const inBowl = Object.values(crumbCount).reduce((a, b) => a + b, 0);
            if (inBowl < BOWL_CAPACITY || shredders.length) {
                const gSpd = 1.8 * grindSpeedMult();
                if (gearL) gearL.rotation.z -= dt * gSpd;
                if (gearR) gearR.rotation.z += dt * gSpd;
            }
        }

        // fallers: drop onto the U-shaped funnel, then roll down into the grinder
        for (let i = fallers.length - 1; i >= 0; i--) {
            const f = fallers[i];
            const px = f.group.position;
            let done = false;
            // DEADLOCK BREAKER — an egg that comes to rest ON TOP of a cracker the player has
            // DROPPED and that is now wedged over the grinder (held above a full bowl, or jammed
            // between the gears) can never reach the slope to hatch — it's forever "in contact"
            // with the cracker below it, so the board soft-locks. Only in that exact case, and
            // only once the egg has sat essentially still for a beat, blast it open right where
            // it sits so its bird is released and the level can keep going. It must NOT pop while
            // resting on a still-pinned board item or on another egg — only on a dropped, stuck cracker.
            if (f.type === 'egg') {
                if (eggOnStuckCracker(f) && f.prevStuckY !== undefined && px.y >= f.prevStuckY - 0.004) {
                    f.stuckT = (f.stuckT || 0) + dt;
                } else {
                    f.stuckT = 0;
                }
                f.prevStuckY = px.y;
                if (f.stuckT > 1.2) {
                    fallers.splice(i, 1);
                    startHatch(f);          // crack open on the spot → bird flies to its nest
                    processed++;
                    refreshHud();
                    checkComplete();
                    continue;
                }
            }
            if (f.phase === 'bounce') {
                f.bounceT += dt;
                const u = Math.min(1, f.bounceT / (REDUCED ? 0.12 : 0.22));
                px.x += f.vx * dt;
                f.vx *= 0.985;
                resolveSlopeCollisions(f);       // don't overlap neighbouring crackers on the slope
                resolveSlopePileCollisions(f);   // also block against still-pinned board items above the grinder
                // Defensive wall clamp: the cavity narrows on the funnel bezier below y0, so
                // clamping to a fixed FUNNEL_EDGE.x0 lets a roller sit tangent to the slope
                // with its right edge poking past the cream lining. Sample the wall x at the
                // circle's MIDLINE (px.y) so the rightmost of the circle (Cx + r) stays inside
                // the bezier where the wall is narrowest along the circle's rightmost extent.
                {
                    const wallAtY = funnelContactX(px.y);
                    const XW = wallAtY * SPREAD - f.r;
                    if (px.x > XW) { px.x = XW; if (f.vx > 0) f.vx = 0; }
                    else if (px.x < -XW) { px.x = -XW; if (f.vx < 0) f.vx = 0; }
                }
                const overMouth = Math.abs(px.x) < FUNNEL.mouthX;
                f.bounceY = (overMouth ? fallerGrindY(f.r) : fallerSurfaceY(px.x, f.r)) + f.contactLift;
                px.y = f.bounceY + Math.sin(u * Math.PI) * f.bounceAmp;
                px.z += (0 - px.z) * Math.min(1, dt * 5);
                f.group.rotation.z -= (f.vx * dt) / f.r;
                const squash = (1 - u) * (1 - u) * (REDUCED ? 0.08 : 0.26);
                f.group.scale.set(f.baseScale * (1 + squash * 0.5), f.baseScale * (1 - squash), f.baseScale * (1 + squash * 0.18));
                if (u >= 1) {
                    px.y = f.bounceY;
                    f.group.scale.setScalar(f.baseScale);
                    f.phase = 'roll';
                }
            } else if (f.phase === 'roll') {
                // roll down the parabolic surface toward the center (ball-in-a-bowl accel).
                // The funnel is SPREAD-wider in world X, so its true slope at world x is
                // 2*a*(x/SPREAD)*(1/SPREAD) — scale by 1/SPREAD^2 to match the widened surface.
                const slope = 2 * FUNNEL.a * px.x / (SPREAD * SPREAD);
                const ax = -grav * slope / (1 + slope * slope);
                f.vx += ax * dt; f.vx *= 0.99;
                // On a widened funnel the parabola slope is gentle, so add a pull toward the
                // central chute (as the free-fall phase does) — guarantees crackers always reach
                // the grinder instead of settling out on the wide slope. Gated by (SPREAD-1) so
                // it is exactly ZERO at SPREAD=1: portrait roll behaviour is unchanged.
                f.vx += (0 - px.x) * 3.0 * (SPREAD - 1) * dt;
                const rollX0 = px.x;
                px.x += f.vx * dt;
                // Bleed speed every time the cracker crosses the grinder centre, so a cluster
                // shoving each other stops shuttling side-to-side and settles into the mouth
                // (fixes the never-settling drift; keeps the level progressing). See CRACKER_CROSS_DAMP.
                if (rollX0 !== 0 && (px.x < 0) !== (rollX0 < 0)) f.vx *= CRACKER_CROSS_DAMP;
                px.z += (0 - px.z) * Math.min(1, dt * 6);
                resolveSlopeCollisions(f);       // don't overlap neighbouring crackers on the slope
                resolveSlopePileCollisions(f);   // also block against still-pinned board items above the grinder
                // Defensive wall clamp: the cavity narrows on the funnel bezier below y0, so
                // clamping to a fixed FUNNEL_EDGE.x0 lets a roller sit tangent to the slope
                // with its right edge poking past the cream lining. Sample the wall x at the
                // circle's MIDLINE (px.y) so the rightmost of the circle stays inside the bezier.
                {
                    const wallAtY = funnelContactX(px.y);
                    const XW = wallAtY * SPREAD - f.r;
                    if (px.x > XW) { px.x = XW; if (f.vx > 0) f.vx = 0; }
                    else if (px.x < -XW) { px.x = -XW; if (f.vx < 0) f.vx = 0; }
                }
                f.group.rotation.z -= (f.vx * dt) / f.r; // spin as it rolls
                if (Math.abs(px.x) < FUNNEL.mouthX && Math.abs(f.vx) < CRACKER_CATCH_SPEED) {
                    const restY = fallerGrindY(f.r) + f.contactLift;
                    // Room the bowl has RIGHT NOW: settled crumbs + crumbs already promised by a
                    // cracker mid-grind (roll-phase shredder). Whichever cracker reaches the
                    // grinder first is served first; a cracker only grinds what actually fits
                    // and WEDGES any leftover (jam), so no ground crumb is ever lost.
                    const freeSlots = BOWL_CAPACITY - bowlOccupancy();
                    if (grinderJammed || freeSlots <= 0) {
                        // grinder busy with a wedged cracker, OR the bowl is full → settle on TOP
                        // of the gears, clearly visible, until a bird frees a slot / the jam clears.
                        f.holdAbove = true;
                        f.vx *= 0.6;
                        px.x += (0 - px.x) * Math.min(1, dt * 6);
                        px.y = restY;
                    } else {
                        // gears grab it and pull it down. If only PART of it fits, grind what fits
                        // and wedge the remainder (jam) rather than dropping those crumbs.
                        f.holdAbove = false;
                        f.jam = freeSlots < CRUMBS_PER;
                        px.y = Math.max(restY, px.y - dt * 2.2);
                        done = px.y <= restY + 0.01;
                    }
                } else {
                    // still on the slope, OR crossing the mouth too fast to be caught → ride the
                    // funnel surface (escaping the gears) and let the parabolic pull swing it back,
                    // oscillating until air drag slows it below CRACKER_CATCH_SPEED.
                    px.y = fallerSurfaceY(px.x, f.r) + f.contactLift;
                }
            } else {
                // PINBALL free-fall: gravity pulls the item down while it ricochets off any
                // egg/cracker (or other faller) it strikes — bouncing around the pegs on its
                // way down to the grinder, instead of resting or sliding.
                //
                // REST-IN-CONTACT: if the item is already touching a bumper that supports
                // it from below (contact normal points UP) and it's essentially still,
                // snap it onto the bumper and skip gravity for this frame. Otherwise
                // gravity + a non-vertical contact normal keep injecting a tangential
                // drift that reads as jitter when the item is wedged between obstacles.
                //
                // For TILTED surfaces we compute the tangential component of gravity
                // along the surface (tgX = g·nyu·nxu) and apply it instead of freezing,
                // so crackers/eggs slide down angled wood obstacles rather than sticking.
                {
                    const preHit = fallerHit(f);
                    if (preHit) {
                        const dxs = px.x - preHit.x, dys = px.y - preHit.y;
                        const ds = Math.hypot(dxs, dys) || 1;
                        const nyUp = dys / ds; // >0 means bumper sits BELOW the item
                        if (nyUp > 0.35 && Math.abs(f.vy) < 0.35 && Math.abs(f.vx) < 0.35) {
                            const overlap = (f.r + preHit.r) - ds;
                            if (overlap > 0) {
                                px.x = preHit.x + (dxs / ds) * (f.r + preHit.r);
                                px.y = preHit.y + (dys / ds) * (f.r + preHit.r);
                            }
                            // Tangential gravity along the contact surface.
                            // For a flat surface nxu≈0, so tgX≈0 and the item freezes normally.
                            // For a tilted surface |tgX| grows with the slope, kicking the item
                            // into a slide instead of pinning it in place forever.
                            const nxu = dxs / ds;
                            const tgX = grav * nyUp * nxu;  // = g·cos(θ)·sin(θ) along surface
                            if (Math.abs(tgX) > 1.0) {
                                // Tilted surface — impart tangential gravity to start sliding.
                                f.vx += tgX * dt;
                                f.vy = 0;
                            } else {
                                // Flat enough — freeze cleanly to prevent jitter.
                                f.vx *= 0.4; f.vy = 0;
                                if (Math.abs(f.vx) < 0.03) f.vx = 0;
                            }
                            px.z += (0 - px.z) * Math.min(1, dt * 4);
                            if (!REDUCED) {
                                const s = f.group.scale, k = Math.min(1, dt * 8);
                                s.x += (f.baseScale - s.x) * k;
                                s.y += (f.baseScale - s.y) * k;
                                s.z += (f.baseScale - s.z) * k;
                            }
                            const XWALL = FUNNEL_EDGE.x0 * SPREAD - f.r;
                            if (px.x > XWALL) px.x = XWALL;
                            else if (px.x < -XWALL) px.x = -XWALL;
                            continue;
                        }
                    }
                }
                f.vy += grav * dt;                 // vy is downward speed
                px.x += f.vx * dt;
                px.y -= f.vy * dt;
                px.z += (0 - px.z) * Math.min(1, dt * 4);
                f.vx *= 0.995;                     // slight horizontal air drag

                const hit = fallerHit(f);
                let firmBounce = false;
                if (hit) {
                    let nx = px.x - hit.x, ny = px.y - hit.y;
                    let d = Math.hypot(nx, ny);
                    if (d < 1e-4) { nx = 0; ny = 1; d = 1; }   // dead-centre: pop straight up
                    nx /= d; ny /= d;
                    px.x += nx * ((f.r + hit.r) - d);           // depenetrate — sit exactly touching
                    px.y += ny * ((f.r + hit.r) - d);
                    // Split velocity into normal + tangential parts (world coords, +y up) and
                    // only reflect when moving INTO the bumper. A firm hit rebounds like a
                    // pinball; a soft touch just settles onto the surface with NO normal rebound
                    // so a resting item sits still instead of buzzing/jittering in place.
                    let vX = f.vx, vY = -f.vy;
                    const vn = vX * nx + vY * ny;               // < 0 while approaching the surface
                    if (vn < 0) {
                        const approach = -vn;                     // closing speed
                        const tX = vX - vn * nx, tY = vY - vn * ny; // tangential (kept, lets it slide/roll)
                        const rebound = approach > 0.9 ? approach * 0.5 : 0; // rest threshold
                        vX = tX * 0.92 + rebound * nx;
                        vY = tY * 0.92 + rebound * ny;
                        if (rebound > 0) {                         // a real bounce — add life + juice
                            firmBounce = true;
                            const kick = (Math.random() - 0.5) * 0.5;
                            vX += -ny * kick; vY += nx * kick;
                            f.group.rotation.z -= vX * 0.1;
                            if (!REDUCED) {
                                const sq = Math.min(0.2, approach * 0.05 + 0.06);
                                f.group.scale.set(f.baseScale * (1 + sq * 0.5), f.baseScale * (1 - sq * 0.6), f.baseScale * (1 + sq * 0.3));
                            }
                            const tnow = performance.now();
                            if (!f.lastBump || tnow - f.lastBump > 70) { sfx.bump(); haptic(5); f.lastBump = tnow; }
                        }
                        f.vx = vX; f.vy = -vY;
                    }
                } else if (f.type !== 'cracker') {
                    f.group.rotation.x += dt * 3;
                }
                if (!REDUCED && !firmBounce) {                 // ease squash back to round when not bouncing
                    const s = f.group.scale, k = Math.min(1, dt * 8);
                    s.x += (f.baseScale - s.x) * k; s.y += (f.baseScale - s.y) * k; s.z += (f.baseScale - s.z) * k;
                }

                // Keep it in the chamber: bounce off the side walls and cap horizontal
                // speed so it never careens off the board trying to escape. Sample the
                // cavity wall AT THE ITEM'S Y so a freefaller cannot punch past the bezier
                // where the funnel has already narrowed inward from x0.
                f.vx = Math.max(-2.2, Math.min(2.2, f.vx));
                const wallAtY = funnelContactX(px.y);
                const XWALL = wallAtY * SPREAD - f.r;
                if (px.x > XWALL) { px.x = XWALL; f.vx = -Math.abs(f.vx) * 0.5; }
                else if (px.x < -XWALL) { px.x = -XWALL; f.vx = Math.abs(f.vx) * 0.5; }

                // Gentle pull toward the central chute so crackers always funnel down into the
                // grinder. Eggs are exempt — they rest wherever they land on the slope and crack there.
                if (f.type !== 'egg') f.vx += (0 - px.x) * 1.4 * dt;

                // reached the funnel/grinder region — hand off to the roll-into-grinder path
                const overMouth = Math.abs(px.x) < FUNNEL.mouthX;
                const landingY = (overMouth ? fallerGrindY(f.r) : fallerSurfaceY(px.x, f.r)) + f.contactLift;
                if (!hit && px.y <= landingY) {
                    px.y = landingY;
                    if (f.type === 'egg') {
                        // egg settles on the slope wherever it landed → cracks open there
                        f.hatchOnSlope = true; done = true;
                    } else if (f.type === 'cracker' && !f.bounced) {
                        f.bounced = true;
                        f.bounceT = 0;
                        f.bounceY = landingY;
                        f.bounceAmp = REDUCED ? 0.05 : 0.16;
                        f.vy = 0;
                        f.vx = (overMouth ? (px.x >= 0 ? -1 : 1) : (px.x > 0 ? -1 : 1)) * (REDUCED ? 0.45 : 0.85);
                        f.group.scale.set(f.baseScale * 1.14, f.baseScale * 0.72, f.baseScale * 1.05);
                        f.phase = 'bounce';
                    } else if (overMouth) {
                        // a full-bowl cracker must rest on top of the grinder, not be consumed:
                        // hand it to the roll phase so the mouth-rest logic can hold it there.
                        if (f.type === 'cracker' && f.holdAbove) { f.phase = 'roll'; f.vx = 0; }
                        else done = true;
                    } else {
                        f.phase = 'roll';
                        f.vx = (px.x > 0 ? -1 : 1) * 0.3; // nudge toward center
                    }
                }
            }
            if (done) {
                fallers.splice(i, 1);
                if (f.hasKey && f.type === 'cracker') { releaseKey(f); f.hasKey = false; }
                if (f.type === 'cracker' && f.jam) {
                    // wedged in the nip — NOT ground yet, so it is not counted as processed.
                    // It stays jammed until the bowl drains, then the grinder resumes (see update()).
                    jamGrinder(f.group, f.color, f.baseScale);
                    continue;
                }
                if (f.type === 'cracker') startShred(f.group, f.color);
                else if (f.hatchOnSlope) startHatch(f);
                else { scene.remove(f.group); hatch(f.color, undefined, f._dbgId); }
                processed++;
                refreshHud();
                checkComplete();
            }
        }

        // crackers being shredded: consume bottom->top with a rising clip plane while
        // squeezing thin between the gears and sinking into the nip
        const _gsm = grindSpeedMult();
        for (let i = shredders.length - 1; i >= 0; i--) {
            const s = shredders[i];
            if (s.phase === 'roll') {
                // roll to the centre gap above the interlock before grinding starts
                s.rollT += (dt * _gsm) / 0.18;
                const rk = Math.min(1, s.rollT);
                const prevX = s.group.position.x;
                const nx = s.rollFrom * (1 - rk);
                s.group.position.x = nx;
                s.group.rotation.z -= (nx - prevX) / 0.28; // spin as it rolls toward centre
                if (rk >= 1) { s.group.position.x = 0; s.phase = 'grind'; if (!s.skipGrind) grind(s.color); }
                continue;
            }
            s.t += (dt * _gsm) / s.dur;
            const k = Math.min(1, s.t);
            // squeeze horizontally to 50% of its width as it slips between the gears
            s.group.scale.x = s.baseSX * (1 - 0.5 * k);
            // sink down through the FIXED interlock line -> mesh vanishes only past the nip
            s.group.position.y = s.baseY - s.sink * k;
            s.group.position.x = s.baseX + Math.sin(performance.now() * 0.05 + i) * 0.012 * (1 - k);
            if (k >= 1) { scene.remove(s.group); shredders.splice(i, 1); }
        }

        // eggshell shards + sparkles from a hatching egg — ballistic arc, spin, fade out
        for (let i = debris.length - 1; i >= 0; i--) {
            const d = debris[i]; d.life += dt;
            const p = d.mesh.position;
            d.vy -= grav * dt;
            p.x += d.vx * dt; p.y += d.vy * dt; p.z += d.vz * dt;
            d.vx *= 0.98; d.vz *= 0.98;
            if (d.rx) d.mesh.rotation.x += d.rx * dt;
            if (d.rz) d.mesh.rotation.z += d.rz * dt;
            const u = d.life / d.max;
            if (u > 0.6) d.mesh.scale.setScalar(d.base * Math.max(0, 1 - (u - 0.6) / 0.4));
            if (d.life >= d.max) { scene.remove(d.mesh); debris.splice(i, 1); }
        }

        // pour queued grains — small queues cascade gently (12/frame); large backlogs drain fast
        // so visual grains don't lag far behind the already-updated game state.
        if (pelletQueue.length) {
            const release = Math.min(pelletQueue.length, pelletQueue.length > 200 ? 80 : pelletQueue.length > 60 ? 30 : 12);
            for (let i = 0; i < release; i++) {
                const q = pelletQueue.shift();
                if (!bowlSlots[q.slotIndex] || bowlSlots[q.slotIndex].color !== q.color) continue; // slot eaten/reused -> skip
                spawnPellet(q.color, q.slotIndex, q.sprayIndex);
            }
        }

        // pellets — each grain flies directly to its own heap spot on a short arc
        for (const p of pellets) {
            if (p.landed) {
                if (p.settleT != null) {
                    p.settleT += dt;
                    const u = Math.min(1, p.settleT / 0.16);
                    const sq = Math.sin(u * Math.PI) * 0.32;
                    p.mesh.scale.set(p.baseGrain * (1 + sq * 0.5), p.baseGrain * (1 - sq), p.baseGrain * (1 + sq * 0.5));
                    if (u >= 1) { p.mesh.scale.setScalar(p.baseGrain); p.settleT = null; }
                }
                continue;
            }
            const pp = p.mesh.position;
            // arc straight to the grain's target heap position (no funnel/slope detour)
            p.t += dt / p.dur;
            const k = p.t >= 1 ? 1 : p.t;
            pp.x = p.sx + (p.tx - p.sx) * k;
            pp.z = p.sz + (p.tz - p.sz) * k;
            pp.y = p.sy + (p.ty - p.sy) * k + Math.sin(Math.PI * k) * p.arc;
            p.mesh.rotation.x += dt * 9; p.mesh.rotation.z += dt * 5;
            if (k >= 1) landPellet(p);
        }

        // birds — think on a fixed cadence (no setInterval; driven by dt)
        birdTick += dt;
        if (birdTick >= 0.24) {
            birdTick = 0;
            for (const b of birds) birdThink(b);
        }
        // birds nibbling a heap: peck grains (two at a time) and clear the heap over EAT_TIME
        for (const b of birds) {
            const e = b.eat; if (!e) continue;
            e.t += dt;
            const k = Math.min(1, e.t / EAT_TIME);
            const dip = Math.abs(Math.sin(k * Math.PI * 10)); // 10 pecks over 6s ≈ one every 0.6s
            b.group.position.y = e.hoverY - (e.hoverY - e.peckY) * dip;
            // Scale beak pitch inversely with bird size: a larger bird needs a shallower pitch
            // because its longer neck/beak already reaches further; 0.72 is the baseline scale.
            b.group.rotation.x = (1.15 * Math.min(1, 0.72 / b.group.scale.x)) * dip;
            const target = Math.floor(e.total * k);          // grains that should be gone by now
            while (e.removed < target && e.removed < e.grains.length) {
                for (let n = 0; n < 2 && e.removed < e.grains.length; n++) { // two grains per peck
                    const g = e.grains[e.removed++];
                    const gi = pellets.indexOf(g); if (gi >= 0) pellets.splice(gi, 1);
                    scene.remove(g.mesh);
                }
            }
            if (k >= 1) {
                for (; e.removed < e.grains.length; e.removed++) {
                    const g = e.grains[e.removed];
                    const gi = pellets.indexOf(g); if (gi >= 0) pellets.splice(gi, 1);
                    scene.remove(g.mesh);
                }
                if (bowlSlots[e.slotIndex]) bowlSlots[e.slotIndex].color = null;
                eatingSlots.delete(e.slotIndex);
                if ((crumbCount[b.color] || 0) > 0) crumbCount[b.color]--;
                b.fill++;
                haptic(6);
                refreshHud();
                updateBirdBar(b);
                b.group.rotation.x = 0;
                b.group.position.y = e.hoverY; b.baseY = e.hoverY;
                b.eat = null; b.busy = false;
                if (b.fill >= b.need) serveBird(b);
            }
        }
        // stall watchdog — rescue any bird frozen mid-move so the level can never hang.
        // Iterate backward: unstickBird may splice a stuck 'leaving' bird out of the array.
        for (let bi = birds.length - 1; bi >= 0; bi--) {
            const b = birds[bi];
            const g = b.group;
            if (b._wx == null) { b._wx = g.position.x; b._wz = g.position.z; }
            const mdx = g.position.x - b._wx, mdz = g.position.z - b._wz;
            b._wx = g.position.x; b._wz = g.position.z;
            const shouldMove = !b.eat && (b.busy || b.status === 'toNest' || b.status === 'toBowl' || b.status === 'leaving');
            if (shouldMove && (mdx * mdx + mdz * mdz) < 1e-7) b._stall = (b._stall || 0) + dt;
            else b._stall = 0;
            if (b._stall > 1.5) unstickBird(b);
        }
        // Resting birds get a subtle idle breathing bob + faint sway (applied below).
        // always face the way they travel; ease back to forward-facing while parked on a nest
        for (const b of birds) {
            const g = b.group;
            if (b._px == null) { b._px = g.position.x; b._pz = g.position.z; }
            const dx = g.position.x - b._px, dz = g.position.z - b._pz;
            b._px = g.position.x; b._pz = g.position.z;
            const moving = b.status === 'toNest' || b.status === 'toBowl' || b.status === 'leaving';
            if (moving && dx * dx + dz * dz > 1e-6) {
                let d = ((Math.atan2(dx, dz) - g.rotation.y + Math.PI) % TAU + TAU) % TAU - Math.PI;
                g.rotation.y += d * 0.35; // smooth turn toward heading
            } else if (b.status === 'nest' && !b.busy) {
                const yawTarget = b._idleYaw || 0; // idle "look-around" nudges the facing off-centre
                let d = ((yawTarget - g.rotation.y + Math.PI) % TAU + TAU) % TAU - Math.PI;
                g.rotation.y += d * 0.12; // settle toward the (possibly turned) idle facing
            }
        }
        // Idle life while a bird is DOCKED (resting on its nest, the lower feeding platform):
        // a constant gentle breathing bob + faint sway, PLUS occasional, per-bird-staggered
        // "actions" — a quick head-bob, a look-around, or a feather ruffle — so the bird reads
        // as alive without fidgeting. Each bird keeps its own phase + action timer, and every
        // action folds away under reduced-motion (only the smaller constant bob/sway remains).
        const IDLE_BOB = REDUCED ? 0.008 : 0.02;    // world-units of vertical breathing
        const IDLE_ROCK = REDUCED ? 0.01 : 0.022;   // radians of gentle side-to-side sway
        for (const b of birds) {
            const g = b.group;
            const resting = b.status === 'nest' && !b.busy && !b.eat;
            if (resting && b.baseY != null) {
                if (b._idlePhase == null) { b._idlePhase = Math.random() * TAU; b._idleNext = t + 1.2 + Math.random() * 2.5; }
                const ph = b._idlePhase;
                let bob = Math.sin(t * 1.9 + ph) * IDLE_BOB;         // breathing
                let rockZ = Math.sin(t * 1.3 + ph * 1.7) * IDLE_ROCK; // gentle sway
                let pitchX = 0;
                // Fire an occasional idle action (never under reduced-motion).
                if (!REDUCED && t >= b._idleNext) {
                    const r = Math.random();
                    if (r < 0.34) { b._nodT = 0.5; }                                                                   // head-bob
                    else if (r < 0.67) { b._idleYaw = (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.18); b._idleYawT = 1.2 + Math.random() * 0.7; } // look-around
                    else { b._ruffleT = 0.5; b._popT = 0.5; }                                                          // feather ruffle (+ body pop)
                    b._idleNext = t + 3 + Math.random() * 3.5;
                }
                // head-bob: a brisk double nod that settles back to level
                if (b._nodT > 0) { b._nodT -= dt; const p = 1 - Math.max(0, b._nodT) / 0.5; pitchX += Math.sin(p * Math.PI * 2) * 0.17 * (1 - p * 0.35); }
                // feather-ruffle body pop (the wing shuffle itself runs in the flap loop via _ruffleT)
                if (b._popT > 0) { b._popT -= dt; const p = 1 - Math.max(0, b._popT) / 0.5; bob += Math.sin(p * Math.PI) * 0.03; rockZ += Math.sin(p * Math.PI * 7) * 0.06 * (1 - p); }
                // release the look-around after its hold; the facing loop then eases back to centre
                if (b._idleYawT > 0) { b._idleYawT -= dt; if (b._idleYawT <= 0) b._idleYaw = 0; }
                g.position.y = b.baseY + bob;
                g.rotation.x = pitchX;
                g.rotation.z = rockZ;
                // "nope" reaction when the player taps a docked bird: a brisk head-shake
                // (yaw wobble) + counter-rock + tiny recoil dip that fades out.
                if (b._rejectT > 0) {
                    b._rejectT -= dt;
                    const p = 1 - Math.max(0, b._rejectT) / BIRD_REJECT_DUR; // 0..1
                    const fade = 1 - p;
                    g.rotation.y += Math.sin(p * Math.PI * 6) * 0.55 * fade;
                    g.rotation.z = rockZ + Math.sin(p * Math.PI * 6) * 0.12 * fade;
                    g.position.y = b.baseY + bob - Math.sin(p * Math.PI) * 0.06;
                }
            } else {
                // left the nest: drop idle actions and ease any residual sway back to 0
                // (but not while 'leaving', whose takeoff tween owns rotation.z).
                if (b.status !== 'leaving' && g.rotation.z !== 0) {
                    g.rotation.z += (0 - g.rotation.z) * Math.min(1, dt * 10);
                    if (Math.abs(g.rotation.z) < 1e-3) g.rotation.z = 0;
                }
                b._idleYaw = 0; b._idleYawT = 0; b._nodT = 0; b._popT = 0; b._ruffleT = 0; b._rejectT = 0;
            }
        }
        // wings beat up/down while flying to a nest or flying away
        const FLAP_SPEED = 36, FLAP_AMP = REDUCED ? 0.4 : 1;
        for (const b of birds) {
            const fd = b.group.userData.flap;
            if (!fd) continue;
            // DEBUG_FLAP forces every bird to beat its wings regardless of state (see "W" key)
            const flying = DEBUG_FLAP || b.status === 'toNest' || b.status === 'leaving';
            const eating = !flying && b.eat != null;
            if (flying) {
                b.flapT = (b.flapT || 0) + dt * FLAP_SPEED;
                const beat = Math.sin(b.flapT); // -1..1
                if (fd.parts) {
                    // real wing beat: hinge each separate wing mesh up/down from the shoulder
                    const angle = 0.7 + beat * 0.7 * FLAP_AMP; // sweep from down (~0) to up (~1.4rad)
                    for (const w of fd.parts) w.rotation.z = w.userData.restZ + w.userData.dir * angle;
                } else if (fd.wings) {
                    // procedural bird: hold wings out in a shallow dihedral, sway gently like a glide
                    for (const w of fd.wings) w.rotation.z = w.userData.dir * (0.7 + beat * 0.12 * FLAP_AMP);
                } else if (fd.node) {
                    // fallback single-mesh model: spread the wingspan wide, breathe subtly
                    const k = 0.16 + beat * 0.04 * FLAP_AMP;
                    fd.node.scale.set(fd.base.x * (1 + k), fd.base.y, fd.base.z);
                }
                b._wasFlying = true;
            } else if (eating) {
                // subtle random wing flutter while pecking — short occasional bursts, not constant
                if (!(b._flutterT > 0) && Math.random() < dt * 0.55) { b._flutterT = 0.35 + Math.random() * 0.4; b._flapE = 0; }
                if (b._flutterT > 0) {
                    b._flutterT -= dt;
                    b._flapE = (b._flapE || 0) + dt * FLAP_SPEED * 0.7;
                    const beat = Math.sin(b._flapE);
                    if (fd.parts) {
                        const angle = 0.3 + beat * 1.0 * FLAP_AMP; // open up and give a livelier flutter
                        for (const w of fd.parts) w.rotation.z = w.userData.restZ + w.userData.dir * angle;
                    } else if (fd.wings) {
                        for (const w of fd.wings) w.rotation.z = w.userData.dir * (0.3 + beat * 0.4 * FLAP_AMP);
                    } else if (fd.node) {
                        const k = 0.06 + beat * 0.05 * FLAP_AMP;
                        fd.node.scale.set(fd.base.x * (1 + k), fd.base.y, fd.base.z);
                    }
                    b._wasFlying = true;
                } else if (b._wasFlying) {
                    if (fd.parts) { for (const w of fd.parts) w.rotation.z = w.userData.restZ; }
                    else if (fd.wings) { for (const w of fd.wings) w.rotation.z = 0; }
                    else if (fd.node) fd.node.scale.copy(fd.base);
                    b._wasFlying = false;
                }
            } else if (b._ruffleT > 0) {
                // idle feather ruffle: a brief, lively wing shuffle while docked on the nest
                b._ruffleT -= dt;
                b._flapE = (b._flapE || 0) + dt * FLAP_SPEED * 0.9;
                const beat = Math.abs(Math.sin(b._flapE));
                if (fd.parts) { const angle = 0.25 + beat * 0.75 * FLAP_AMP; for (const w of fd.parts) w.rotation.z = w.userData.restZ + w.userData.dir * angle; }
                else if (fd.wings) { for (const w of fd.wings) w.rotation.z = w.userData.dir * (0.3 + beat * 0.45 * FLAP_AMP); }
                else if (fd.node) { const k = 0.06 + beat * 0.06 * FLAP_AMP; fd.node.scale.set(fd.base.x * (1 + k), fd.base.y, fd.base.z); }
                b._wasFlying = true;
            } else if (b._wasFlying) {
                if (fd.parts) { for (const w of fd.parts) w.rotation.z = w.userData.restZ; }
                else if (fd.wings) { for (const w of fd.wings) w.rotation.z = 0; }
                else if (fd.node) fd.node.scale.copy(fd.base);
                b._wasFlying = false;
            }
        }
        // occasional eye blink
        for (const b of birds) {
            const bl = b.group.userData.blink;
            if (!bl) continue;
            if (b.blinkAt == null) b.blinkAt = t + 1 + Math.random() * 3;
            if (b.blinkT != null) {
                b.blinkT += dt;
                const close = Math.sin(Math.min(1, b.blinkT / 0.15) * Math.PI); // 0 -> 1 -> 0
                if (bl.eyes) for (const e of bl.eyes) e.scale.y = 1 - close * 0.9;
                if (bl.lids) for (const l of bl.lids) { l.scale.y = 0.001 + close * l.userData.closeY; l.visible = close > 0.03; }
                if (b.blinkT >= 0.15) {
                    b.blinkT = null;
                    b.blinkAt = t + 1.5 + Math.random() * 4;
                    if (bl.eyes) for (const e of bl.eyes) e.scale.y = 1;
                    if (bl.lids) for (const l of bl.lids) { l.scale.y = 0.001; l.visible = false; }
                }
            } else if (t >= b.blinkAt) {
                b.blinkT = 0;
            }
        }

        // Idle hint: nudge a valid item if the player has been inactive for 10 s.
        tickIdleHint(dt);

        // Fail on a hard deadlock: the board can no longer make any progress toward feeding the
        // flock (see canStillProgress). Debounced so only a genuinely stuck, settled board — held
        // for ~2s — trips it, never a transient mid-animation frame.
        if (gameState === STATE.PLAY && !levelDone && fedBirds < totalBirds) {
            if (canStillProgress()) deadlockT = 0;
            else { deadlockT += dt; if (deadlockT > 2) levelFail(); }
        }
    }

    function syncRendererSize() {
        const w = innerWidth, h = innerHeight;
        if (w < 2 || h < 2) return false;
        const el = renderer.domElement;
        if (el.clientWidth !== w || el.clientHeight !== h) { renderer.setSize(w, h); fitCamera(); }
        return true;
    }
    function renderFrame(dt) {
        syncRendererSize();
        update(dt);
        renderer.render(scene, camera);
        updateBirdBarPositions();
        if (coach) positionCoach();   // keep the highlight ring tracking its target
    }
    function animate() {
        requestAnimationFrame(animate);
        renderFrame(Math.min(clock.getDelta(), 0.05));
    }

    // Apply a flock's exact color to the SAME material shared by its pellets, crackers and eggs.
    function applyFlockColor(color, col) {
        sampledPelletColor[color] = col;
        const pmat = matCache['pel_' + color];
        if (pmat) { pmat.color.copy(pelletColor(color)); pmat.needsUpdate = true; } // pellets = palette color (one source of truth with the bird)
        const cmat = matCache[color]; // cracker body material (foodMat)
        if (cmat) { cmat.color.copy(col); if (cmat.sheenColor) cmat.sheenColor.copy(tint(col, SHEEN_LIFT)); cmat.needsUpdate = true; }
        const emat = matCache['egg_' + color]; // egg skin — rebuild texture on the exact color
        if (emat) { emat.map = eggTexture(col); if (emat.sheenColor) emat.sheenColor.copy(tint(col, SHEEN_LIFT)); emat.needsUpdate = true; }
    }
    // BOOT WARM-UP: bake every flock's bird texture up front so birdBodySampled[] holds the
    // exact body albedo, then push that same albedo onto the cached pellet / cracker / egg
    // materials (saturated up via foodColor). Food and bird therefore share one hue and one
    // lighting pass, so they match on screen from the first pellet with no pop after a hatch.
    //
    // This deliberately does NOT sample the rendered canvas. A canvas read is already lit and
    // tone-mapped; feeding it back in as a material colour applies both a second time, which
    // dragged every flock's food 40-60 RGB units darker, collapsed the gap between orange and
    // yellow, and failed outright on brown and teal (the hue window rejected them), leaving
    // those two on the raw palette while the rest had shifted.
    function warmupFlockColors() {
        for (const color of FOOD_KEYS) {
            if (sampledPelletColor[color]) continue;
            birdTintedMap(color);   // populates birdBodySampled[color] off the recoloured texture
            // Model still loading: leave the flock unwarmed so a later call picks it up rather
            // than locking the food onto the palette fallback while the bird uses the texture.
            if (!birdBodySampled[color]) continue;
            applyFlockColor(color, foodColor(color));
        }
    }

    // ========================================================================
    // EVENTS
    // ========================================================================
    addEventListener('pointerdown', onPointerDown, { passive: true });
    // Reset the idle-hint timer on ANY pointer interaction (game board or UI).
    addEventListener('pointerdown', resetIdleHint, { passive: true });
    ui.gear.addEventListener('click', (e) => { e.stopPropagation(); openPause(); });
    ui.shuffleBtn.addEventListener('click', (e) => { e.stopPropagation(); sfx.click(); doShuffleBooster(); });
    // Light tactile tap on EVERY UI button / toggle press (result & pause panels, gear,
    // settings chips, level select, shuffle …). Capture phase so it still fires for handlers
    // that call stopPropagation (gear, shuffle). Other game-specific buzzes fire on top.
    document.addEventListener('click', (e) => {
        if (e.target.closest && e.target.closest('#ui button, #ui .chip')) haptic(HAP.ui);
    }, true);
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitCamera(); });
    let DEBUG_FLAP = false;

    // ========================================================================
    // DEBUG: FOOD MATERIAL INSPECTOR — press "M" in-game to open/close.
    // Shows, per flock color, the bird's actual rendered body color next to the
    // color pellets/crackers/eggs use (birdColor vs foodColor) so any drift is
    // caught visually + numerically. Sliders below live-tune roughness/clearcoat/
    // sheen across ALL cached materials of the selected kind (cracker/egg/pellet),
    // so material params (the "washed out" culprit) can be tuned without editing code.
    // ------------------------------------------------------------------------
    const MATDBG_DEFAULTS = {
        cracker: { roughness: 0.44, clearcoat: 0.45, clearcoatRoughness: 0.3, sheen: SHEEN, sheenRoughness: 0.6 },
        egg:     { roughness: 0.3,  clearcoat: 0.6, clearcoatRoughness: 0.16, sheen: SHEEN, sheenRoughness: 0.5 },
        pellet:  { roughness: 0.7,  metalness: 0 },
    };
    let matDbgOpen = false;
    function hex6(c) { return '#' + c.getHexString(); }
    function matDbgMatsFor(kind) {
        return FOOD_KEYS.map(color => {
            const key = kind === 'cracker' ? color : kind === 'egg' ? 'egg_' + color : 'pel_' + color;
            return matCache[key];
        }).filter(Boolean);
    }
    function renderMatDbgSwatches() {
        const el = document.getElementById('matDbgSwatches');
        if (!el) return;
        el.innerHTML = FOOD_KEYS.map(color => {
            const bird = birdColor(color), food = foodColor(color);
            // Food is intentionally more saturated than the bird, so parity is checked against
            // the live cracker material rather than against the bird body.
            const live = matCache[color] ? matCache[color].color : food;
            const same = hex6(live) === hex6(food);
            return `<div class="md-row md-flock">
                <div class="md-swatch" style="background:${hex6(bird)}"></div>
                <div class="md-swatch" style="background:${hex6(food)}"></div>
                <div class="md-name">${color}</div>
                <div class="md-hex">${hex6(food)}</div>
                <div class="md-diff ${same ? 'ok' : 'bad'}">${same ? 'OK' : 'DIFF'}</div>
            </div>`;
        }).join('');
    }
    function renderMatDbgSliders() {
        const target = document.getElementById('matDbgTarget');
        const kind = target ? target.value : 'cracker';
        const defs = MATDBG_DEFAULTS[kind];
        const mats = matDbgMatsFor(kind);
        const sample = mats[0];
        const el = document.getElementById('matDbgSliders');
        if (!el) return;
        el.innerHTML = Object.keys(defs).map(prop => {
            const cur = sample ? sample[prop] : defs[prop];
            const val = typeof cur === 'number' ? cur : defs[prop];
            return `<div class="md-slab"><span>${prop}</span><span id="matDbgVal_${prop}">${val.toFixed(2)}</span></div>
                <input type="range" min="0" max="${prop.includes('roughness') || prop === 'metalness' ? 1 : 1.5}" step="0.01"
                    value="${val}" data-prop="${prop}">`;
        }).join('');
        el.querySelectorAll('input[type="range"]').forEach(inp => {
            inp.addEventListener('input', () => {
                const prop = inp.dataset.prop;
                const v = parseFloat(inp.value);
                document.getElementById('matDbgVal_' + prop).textContent = v.toFixed(2);
                matDbgMatsFor(kind).forEach(m => { m[prop] = v; m.needsUpdate = true; });
            });
        });
    }
    function toggleMatDbg() {
        matDbgOpen = !matDbgOpen;
        const panel = document.getElementById('matDbg');
        if (!panel) return;
        panel.classList.toggle('hide', !matDbgOpen);
        if (matDbgOpen) { renderMatDbgSwatches(); renderMatDbgSliders(); }
    }


    // ========================================================================
    // BOOT
    // ========================================================================
    function boot() {
        buildMachine();
        fitCamera();
        gameState = STATE.LOADING;
        let p = 0;
        const step = () => {
            p = Math.min(100, p + 7);
            ui.loadfill.style.width = p + '%';
            if (p < 100) requestAnimationFrame(() => setTimeout(step, 40));
            else if (embedded) {
                embeddedReady = true;
                postToParent({ type: 'flock-feast:ready' });
                if (pendingEmbeddedStart) startEmbeddedRun();
            } else setTimeout(showMenu, 220);
        };
        step();
        if (!embedded) animate();
    }

    const embedded = window !== window.parent || new URLSearchParams(location.search).has('embedded');
    let embeddedReady = false;
    let embeddedLevel = 1;
    let embeddedDisplayLevel = 1;
    let pendingEmbeddedStart = false;
    if (embedded) document.body.classList.add('embedded');
    function postToParent(data) {
        // about:srcdoc has an opaque ("null") origin — parent must be addressed with "*"
        try { parent.postMessage(data, '*'); } catch (e) {}
    }
    function postOriginOk(event) {
        if (embedded && event.source === parent) return true;
        if (event.origin === location.origin) return true;
        const nil = (o) => o === 'null' || o === '';
        return nil(event.origin) || (nil(event.origin) && nil(location.origin));
    }
    function startEmbeddedRun() {
        if (!embeddedReady) {
            pendingEmbeddedStart = true;
            return;
        }
        pendingEmbeddedStart = false;
        syncRendererSize();
        startRun(clampLevel(embeddedLevel - 1));
        renderFrame(0);
    }
    addEventListener('message', (event) => {
        if (!postOriginOk(event) || !event.data) return;
        if (event.data.type === 'flock-feast:ping') {
            if (embeddedReady) postToParent({ type: 'flock-feast:ready' });
            return;
        }
        if (event.data.type === 'flock-feast:safe-area') {
            applySafeArea(event.data);
            syncRendererSize();
            fitCamera();
            return;
        }
        if (event.data.type === 'flock-feast:i18n') {
            applyI18n(event.data.dict);
            return;
        }
        if (event.data.type === 'flock-feast:resize') {
            syncRendererSize();
            fitCamera();
            return;
        }
        if (event.data.type === 'flock-feast:start') {
            embeddedLevel = Math.max(1, Number(event.data.level) || 1);
            embeddedDisplayLevel = Number(event.data.displayLevel) || embeddedLevel;
            startEmbeddedRun();
        }
        if (event.data.type === 'flock-feast:playCustom' && event.data.level) {
            const customLv = event.data.level;
            const idx = ACTIVE_LEVELS.length;
            ACTIVE_LEVELS[idx] = customLv;
            syncRendererSize();
            warmupFlockColors();
            hidePanel();
            run = { score: 0 };
            beginLevel(idx);
            renderFrame(0);
            return;
        }
        if (event.data.type === 'flock-feast:requestLevels') {
            const out = ACTIVE_LEVELS.map((lv) => ({
                gameId: String(lv.id),
                id: lv.id,
                layout: lv.layout || [],
            }));
            postToParent({ type: 'flock-feast:levelsData', levels: out });
            return;
        }
        if (embedded && event.data.type === 'flock-feast:tick') {
            renderFrame(Math.min((Number(event.data.dt) || 0) / 1000, 0.05));
        }
    });

    // Ask the parent for the active language dict up front so the loading panel
    // text is localised before the load bar finishes (the ready-time send lands
    // too late to catch it).
    if (embedded) postToParent({ type: 'flock-feast:requestI18n' });

    Promise.race([
        Promise.all([document.fonts.load("800 40px 'Baloo 2'"), document.fonts.load("900 24px 'Nunito'"), nestReady]),
        new Promise(r => setTimeout(r, 3000)),
    ]).then(boot).catch(boot);

    window.game = {
        scene, renderer, camera, LEVELS,
        get state() { return gameState; },
    };
</script>

</body>
</html>
