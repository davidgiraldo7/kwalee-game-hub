    }

    function beginLevel(idx) {
        levelIdx = idx; cfg = ACTIVE_LEVELS[idx];
        clearBoard();
        gameState = STATE.PLAY;
        levelDone = false;
        deadlockT = 0;
        setHud(true);
        resetShuffleBooster();
        resetIdleHint();

        cfg = normalizeLevel(cfg); // flock + mysteryFraction + optional 1:1 layout
        ACTIVE_LEVELS[idx] = cfg;
        crumbCount = {}; cfg.colors.forEach(c => crumbCount[c] = 0);
        resetBowlSlots();
        need = BIRD_CAPACITY;
        totalBirds = cfg.colors.reduce((n, c) => n + cfg.flock[c].eggs, 0);
        fedBirds = 0;
        needQueue = {};
        for (const color of cfg.colors) {
            needQueue[color] = Array.from({ length: cfg.flock[color].eggs }, () => BIRD_CAPACITY);
        }
        clearBirdBars();
        const rng = makeRng((cfg.seed != null ? cfg.seed : (1000 + cfg.id)) | 0);
        let items;
        const useLayout = !!(cfg.layout && cfg.layout.length);
        if (useLayout) {
            // 1:1 video peg order — never reshuffle; flags already baked into each slot.
            items = cfg.layout.map(cloneLayoutItem).filter(Boolean);
        } else {
            // Legacy bag + seeded shuffle (fallback when a level has no layout).
            items = [];
        const CRACKER_SHAPES = ['ring', 'square', 'triangle'];
        for (const color of cfg.colors) {
                const f = cfg.flock[color];
                for (let i = 0; i < f.eggs; i++) items.push({ type: 'egg', color });
                for (let i = 0; i < f.crackers; i++) items.push({ type: 'cracker', color, variant: CRACKER_SHAPES[i % CRACKER_SHAPES.length] });
            }
            const nWood = cfg.woods | 0;
            for (let i = 0; i < nWood; i++) {
                const tilt = (i % 2 === 0 ? -1 : 1) * (0.32 + rng() * 0.45);
                items.push({ type: 'wood', woodShape: 'plank', woodRot: tilt, woodW: 1.05 + rng() * 0.35 });
            }
            if (levelUsesMystery(cfg)) {
            const crackerIdx = [];
            for (let i = 0; i < items.length; i++) if (items[i].type === 'cracker') crackerIdx.push(i);
                shuffleInPlace(crackerIdx, rng);
                const nMystery = Math.round(crackerIdx.length * cfg.mysteryFraction);
            for (let k = 0; k < nMystery; k++) items[crackerIdx[k]].mystery = true;
        }
        {
                const keyable = [], lockable = [];
            for (let i = 0; i < items.length; i++) {
                if (items[i].type === 'cracker' && !items[i].mystery) keyable.push(i);
                else if (items[i].type === 'egg') lockable.push(i);
            }
                shuffleInPlace(keyable, rng); shuffleInPlace(lockable, rng);
            const pairs = lockPairCount(cfg, Math.min(keyable.length, lockable.length));
            for (let p = 0; p < pairs; p++) {
                items[keyable[p]].hasKey = true;
                items[lockable[p]].locked = true;
            }
        }
        }
        totalItems = items.filter(it => it.type === 'egg' || it.type === 'cracker').length;
        processed = 0;
        placeBoard(items, rng, useLayout);
        refreshHud();

        // Freeze board taps for the same delay the coach waits before appearing, so an eager
        // first tap can't sneak in as a normal move and get "spent" before the tutorial shows
        // (which used to force the player to tap a second time to actually advance step one).
        if (idx === 0) { coachPending = true; setTimeout(() => { coachPending = false; startCoach(FTUE_CORE, 'ftueCoreSeen'); }, 700); }
        else if (levelUsesMystery(cfg) && (cfg.id === 4 || cfg.id === MYSTERY_FROM_LEVEL)) { coachPending = true; setTimeout(() => { coachPending = false; startCoach(FTUE_MYSTERY, 'ftueMysterySeen'); }, 700); }
        else if (cfg.id === FIRST_LOCK_LEVEL) { coachPending = true; setTimeout(() => { coachPending = false; startCoach(FTUE_LOCK, 'ftueLockSeen'); }, 700); }
    }

    function placeBoard(items, rng, fixedLayout = false) {
        // fixedLayout (1:1 video): keep item order, zero jitter, no de-clump / lock reordering.
        // Woods are tray protrusions — placed by woodX/woodY (not on food peg slots).
        const rand = rng || Math.random;
        const woods = items.filter(it => it && it.type === 'wood');
        const pegItems = items.filter(it => it && it.type !== 'wood');
        if (cfg && cfg.freeform) {
            for (const it of pegItems) {
                const lx = (it.x != null && isFinite(+it.x)) ? +it.x : 0;
                const ly = (it.y != null && isFinite(+it.y)) ? +it.y : BOARD.anchorY;
                spawnItem(it, lx, ly);
            }
            placeWoods(woods);
            reflowBoard(false);
            return;
        }
        if (!fixedLayout) shuffleInPlace(pegItems, rand);
        const n = pegItems.length;
        const shapeOpts = cfg ? {
            pileShape: cfg.pileShape,
            pileCurve: cfg.pileCurve,
            pileWidths: cfg.pileWidths,
        } : null;
        const slots = pegSlotsForCount(n, shapeOpts);
        if (!fixedLayout) {
            for (const s of slots) {
                s.x += (rand() - 0.5) * 0.16;
                s.y += (rand() - 0.5) * 0.1;
            }
            const typeAt = (i) => pegItems[i] && pegItems[i].type;
        const rowBelow = (row) => slots.filter(s => s.r === row - 1);
        for (const s of slots) {
                if (s.r === 0 || typeAt(s.i) === 'wood') continue;
            const below = rowBelow(s.r);
            if (!below.some(b => Math.abs(b.x - s.x) < 0.7 && typeAt(b.i) === typeAt(s.i))) continue;
                const cand = slots.find(o => o !== s && typeAt(o.i) !== 'wood' && typeAt(o.i) !== typeAt(s.i) &&
                !rowBelow(o.r).some(b => Math.abs(b.x - o.x) < 0.7 && typeAt(b.i) === typeAt(s.i)));
                if (cand) { const tmp = pegItems[s.i]; pegItems[s.i] = pegItems[cand.i]; pegItems[cand.i] = tmp; }
        }
        if (cfg && cfg.id === LOCK_FROM_LEVEL) {
                const bringToFront = (pred, dest) => { const i = pegItems.findIndex(pred); if (i >= 0 && i !== dest) { const t = pegItems[dest]; pegItems[dest] = pegItems[i]; pegItems[i] = t; } };
                bringToFront(it => it.locked, 0);
                bringToFront(it => it.hasKey, 1);
            }
        }
        for (const s of slots) spawnItem(pegItems[s.i], s.x, s.y);
        placeWoods(woods);
        reflowBoard(false);
    }

    // Default tray-protrusion anchors when a wood entry omits woodX/woodY.
    function placeWoods(woods) {
        const defaults = [
            { x: -1.55, y: 3.4 }, { x: 1.55, y: 3.4 },
            { x: -1.9, y: 1.7 }, { x: 1.9, y: 1.7 },
            { x: -1.15, y: 5.2 }, { x: 1.15, y: 5.2 },
        ];
        woods.forEach((w, i) => {
            const d = defaults[i % defaults.length];
            spawnItem(w, w.woodX != null ? +w.woodX : d.x, w.woodY != null ? +w.woodY : d.y);
        });
    }

    function spawnItem(it, lx, ly) {
        const group = it.type === 'wood' ? buildWood(it.woodW || 1.15, it.woodShape || 'plank', { arcSweep: it.woodArcSweep, woodThick: it.woodThick })
            : (it.type === 'egg' ? buildEgg(it.color) : buildCracker(it.color, it.variant, it.mystery));
        const sx = lx * SPREAD;   // spread across the widened cabinet on wide screens (position only)
        // Static + flat against the board, facing the camera (no tilt, no spin).
        // Wood keep a Z-tilt (woodRot) so food can roll along the angled face.
        // Tray woods sit slightly recessed so they read as BG protrusions.
        const z = it.type === 'wood' ? BOARD.z - 0.04 : BOARD.z;
        group.position.set(sx, ly, z);
        group.rotation.set(0, 0, it.type === 'wood' ? (it.woodRot || 0) : 0);
        const peg = it.type === 'wood' ? null : buildPeg(sx, ly, it.type === 'cracker'); // donuts thread onto a snug through-peg
        if (peg) peg.scale.setScalar(ITEM_MULT);
        const sc = unitScale(it.type);
        const rec = {
            group, peg, type: it.type, color: it.color, variant: it.variant, localY: ly, baseLX: lx, scale: sc,
            cr: unitCr(it.type), mystery: !!it.mystery, locked: !!it.locked, hasKey: !!it.hasKey,
            woodRot: it.woodRot || 0,
            woodHalfW: group.userData.woodHalfW || 0.55,
            woodHalfH: group.userData.woodHalfH || 0.14,
            woodSegs: group.userData.woodSegs || null,
            woodShape: group.userData.woodShape || it.woodShape || 'plank',
        };
        // LOCK & KEY visuals — a key riding on the carrier, a padlock over a locked item.
        if (rec.hasKey) {
            const km = buildKeyMesh();
            km.position.set(0.5, 0.52, 0.42);
            km.rotation.z = -0.5;
            group.add(km);
            rec.keyMesh = km;
            rec.keyBaseX = 0.5; rec.keyBaseY = 0.52;
        }
        if (rec.locked) {
            const lm = buildLockMesh();
            group.add(lm);
            rec.lockMesh = lm;
        }
        group.userData.pileRef = rec;
        group.traverse(o => { o.userData.pileRef = rec; });
        if (peg) {
        // tapping the peg counts as tapping its cracker/egg
        peg.userData.pileRef = rec;
        peg.traverse(o => { o.userData.pileRef = rec; });
        boardGroup.add(peg);
        }
        boardGroup.add(group);
        // gentle pop-in
        group.scale.setScalar(0.01);
        tween(group.scale, { x: sc, y: sc, z: sc }, 0.4, { ease: easeOutBack });
        pile.push(rec);
    }

    // Woods are BG protrusions on the tray — they scroll with boardGroup but must
    // NEVER pin the tray. Only food (egg/cracker) sets the scroll floor; woods that
    // pass below the grinder mouth are culled so the tray can keep rising.
    function cullOffscreenWoods(forceAll = false) {
        const cut = BOARD.anchorY - BOARD.rowGap * 0.85;
        for (let i = pile.length - 1; i >= 0; i--) {
            const p = pile[i];
            if (p.type !== 'wood') continue;
            const wy = boardGroup.position.y + (p.group ? p.group.position.y : p.localY);
            if (forceAll || wy < cut) {
                if (p.group && p.group.parent) p.group.parent.remove(p.group);
                pile.splice(i, 1);
            }
        }
    }
    // Woods that have NO food below their line and already sit below where the funnel
    // starts are stranded — the tray can't scroll them off because food above pins it.
    // Slide each such wood down on its own past the grinder mouth, then remove it.
    function slideAwayStrandedWoods() {
        // Lowest food line (board-local). Woods must have nothing edible below them.
        let minFoodY = Infinity;
        for (const p of pile) if (p.type !== 'wood' && p.localY < minFoodY) minFoodY = p.localY;
        for (let i = pile.length - 1; i >= 0; i--) {
            const p = pile[i];
            if (p.type !== 'wood' || p.slidingAway || !p.group) continue;
            const localY = p.group.position.y;
            const worldY = boardGroup.position.y + localY;
            // (1) no crackers/food below this blocker's line and
            // (2) blocker is already below where the funnel starts.
            if (localY < minFoodY && worldY < FUNNEL_EDGE.y0) {
                p.slidingAway = true;
                killTweens(p.group.position);
                tween(p.group.position, { y: localY - (BOARD.rowGap * 3) }, 0.7, {
                    ease: easeInOut,
                    onDone: () => {
                        if (p.group && p.group.parent) p.group.parent.remove(p.group);
                        const idx = pile.indexOf(p);
                        if (idx !== -1) pile.splice(idx, 1);
                    },
                });
            }
        }
    }
    // Slide the tray so the lowest remaining FOOD rests at the anchor, revealing
    // the next rows above. Woods ride the BG downward and are culled off-screen.
    function reflowBoard(animate = true) {
        if (!pile.length) return;
        let minFoodY = Infinity;
        let minWoodY = Infinity;
        for (const p of pile) {
            if (p.type === 'wood') {
                if (p.localY < minWoodY) minWoodY = p.localY;
            } else if (p.localY < minFoodY) {
                minFoodY = p.localY;
            }
        }
        let targetY;
        let forceCullWoods = false;
        if (minFoodY !== Infinity) {
            // Food pins the tray — woods below that floor scroll toward the gears.
            targetY = BOARD.anchorY - minFoodY;
        } else if (minWoodY !== Infinity) {
            // Only woods left: keep scrolling the tray so they leave past the mouth.
            targetY = BOARD.anchorY - minWoodY + BOARD.rowGap * 2.2;
            forceCullWoods = true;
        } else {
            return;
        }
        const after = (skipStranded = false) => { cullOffscreenWoods(forceCullWoods); if (!skipStranded) slideAwayStrandedWoods(); };
        if (animate === false) { boardGroup.position.y = targetY; after(true); return; }
        if (Math.abs(targetY - boardGroup.position.y) < 0.03) { after(); return; }
        killTweens(boardGroup.position);
        tween(boardGroup.position, { y: targetY }, 0.85, { ease: easeInOut, onDone: after });
    }

    // ========================================================================
    // FTUE / COACH MARKS — staged, gated tutorials with a highlight ring, a
    // pointing hand and a text card. Each tutorial is shown once (persisted).
    //   • Core loop  (level 1)  — grind → hatch → match colour → feed
    //   • Mystery "?" (level 11) — hidden-colour crackers
    //   • Lock & Key  (level 21) — padlocked eggs freed by a key-cracker
    //   • Bowl-full / Nests-full — one-line contextual toasts
    // ========================================================================
    let coach = null;   // { steps, i, key, targetRec, hud, obj }
    let coachPending = false;   // true while waiting for a scheduled coach to appear — freezes board taps
    const _coachV = new THREE.Vector3(), _coachW = new THREE.Vector3();

    // Lowest (bottom-most = most visible) pile item matching a predicate.
    function lowestPile(pred) {
        let best = null, by = Infinity;
        for (const p of pile) if (pred(p) && p.localY < by) { by = p.localY; best = p; }
        return best ? { rec: best } : null;
    }
    // ---- Localisation ----------------------------------------------------
    // The host page owns the copy (translations.js) and forwards the active
    // dictionary through the 'flock-feast:i18n' message. The English text kept
    // inline here is only the fallback for running this file standalone.
    let FEED_DICT = {};
    function t(key, fallback) {
        const v = FEED_DICT[key];
        return (typeof v === 'string' && v.length) ? v : fallback;
    }
    // The coach card's two hint lines are CSS ::after content, so they travel
    // through custom properties instead of the DOM.
    function applyI18n(dict) {
        FEED_DICT = dict && typeof dict === 'object' ? dict : {};
        const rs = document.documentElement.style;
        rs.setProperty('--coach-continue', JSON.stringify(t('gameTapToContinue', 'tap to continue')));
        rs.setProperty('--coach-act', JSON.stringify(t('gameYourTurn', 'your turn \u2014 tap the glowing item')));
        const loadingMsgEl = document.getElementById('loadingMsg');
        if (loadingMsgEl) loadingMsgEl.textContent = t('loadingMsg', 'Loading the flock...');
        if (coach) showCoachStep();
    }

    const FTUE_CORE = [
        // Egg-first FTUE: hatch a bird before making food so players see why crackers matter.
        { key: 'ftueCore1', text: 'Tap an <b>egg</b> to<br>hatch a hungry bird!', gate: 'dropEgg', pick: () => lowestPile(p => p.type === 'egg') },
        { key: 'ftueCore2', text: 'The bird is <b>hungry</b>!<br>Tap a <b>cracker</b> to make food.', gate: 'dropCracker', pick: () => lowestPile(p => p.type === 'cracker') },
        { key: 'ftueCore3', text: 'It grinds into <b>food</b>!', gate: 'continue', pick: () => ({ hud: 'bowl' }), noHighlight: true },
        // Points at a hatched bird if there is one, else the progress bar.
        { key: 'ftueCore4', text: 'Birds eat only their <b>own colour</b> \u2014<br>feed the whole flock to <b>win</b>!', gate: 'continue', pick: () => (birds.length ? { obj: birds[0].group } : null), cardPos: 'top', noHighlight: true },
    ];
    const FTUE_MYSTERY = [
        { key: 'ftueMystery1', text: 'New: <b>Mystery crackers</b>!<br>A grey \u201c?\u201d hides its colour until<br>you drop it \u2014 take a gamble!', gate: 'dropCracker', pick: () => lowestPile(p => p.mystery) },
    ];
    const FTUE_LOCK = [
        { key: 'ftueLock1', text: 'New: <b>Locked eggs</b>!<br>This egg is frozen \u2014 you can\u2019t<br>drop it until it\u2019s freed.', gate: 'continue', pick: () => lowestPile(p => p.locked) },
        { key: 'ftueLock2', text: 'Grind the cracker carrying the<br><b>key</b> to unlock the egg!', gate: 'continue', pick: () => lowestPile(p => p.hasKey) },
    ];

    function startCoach(steps, key) {
        if (!steps || !steps.length || gameState !== STATE.PLAY || !pile.length) return;
        coach = { steps, i: 0, key, targetRec: null, hud: null, obj: null };
        gameState = STATE.FTUE;
        ui.coach.hidden = false; ui.coach.classList.add('show');
        showCoachStep();
    }
    function isDropGate(g) { return g === 'dropCracker' || g === 'dropEgg' || g === 'dropAny'; }
    function resolveCoachTarget() {
        coach.targetRec = coach.obj = coach.hud = null;
        const t = coach.steps[coach.i].pick && coach.steps[coach.i].pick();
        if (t) { if (t.rec) coach.targetRec = t.rec; else if (t.obj) coach.obj = t.obj; else if (t.hud) coach.hud = t.hud; }
    }
    function showCoachStep() {
        const step = coach.steps[coach.i];
        resolveCoachTarget();
        ui.coachText.innerHTML = t(step.key, step.text);
        ui.coachCard.classList.toggle('act', isDropGate(step.gate));
        positionCoach();
    }
    function advanceCoach() {
        if (!coach) return;
        coach.i++;
        if (coach.i >= coach.steps.length) endCoach(true);
        else showCoachStep();
    }
    function endCoach(markSeen) {
        if (!coach) return;
        if (markSeen) { save[coach.key] = true; save.ftueSeen = true; persist(); }
        coach = null;
        ui.coach.classList.remove('show'); ui.coach.hidden = true;
        ui.coachRing.classList.remove('on'); ui.coachHand.classList.remove('on');
        ui.coachCard.classList.remove('top');
        ui.coachCard.classList.remove('center');
        if (gameState === STATE.FTUE) gameState = STATE.PLAY;
    }
    // Called from tryDrop the instant an item is committed to falling.
    function coachOnDrop(rec) {
        if (!coach) return;
        const step = coach.steps[coach.i];
        if (!isDropGate(step.gate)) return;
        if (step.gate === 'dropAny' || (step.gate === 'dropCracker' && rec.type === 'cracker') || (step.gate === 'dropEgg' && rec.type === 'egg')) {
            setTimeout(() => { if (coach) advanceCoach(); }, 300);   // let the drop read first
        }
    }
    function handleCoachTap(e) {
        const step = coach.steps[coach.i];
        if (isDropGate(step.gate)) {
            const rec = pickItem(e);
            if (rec && rec === coach.targetRec) tryDrop(rec);   // only the highlighted item is live
            return;
        }
        advanceCoach();   // continue gate: any tap moves on
    }
    // Project the current step's target to screen and park the ring + hand on it.
    function worldToScreen(v) {
        _coachV.copy(v).project(camera);
        const cw = renderer.domElement.clientWidth, ch = renderer.domElement.clientHeight;
        return { x: (_coachV.x * 0.5 + 0.5) * cw, y: (-_coachV.y * 0.5 + 0.5) * ch, behind: _coachV.z > 1 };
    }
    function positionCoach() {
        if (!coach) return;
        // Lazy target acquisition: a step's target may not exist yet when the step begins (e.g. the
        // bird on "Birds eat only their own colour" is still hatching). Keep re-running pick() while
        // unresolved so the ring attaches the instant the target appears.
        if (!coach.targetRec && !coach.obj && !coach.hud) resolveCoachTarget();
        let pos = null;
        if (coach.targetRec && coach.targetRec.group) pos = worldToScreen(coach.targetRec.group.getWorldPosition(_coachW));
        else if (coach.obj) {
            coach.obj.getWorldPosition(_coachW);
            // A bird's group origin sits at its feet — lift the target to the body so the
            // ring encircles the bird instead of centring on the deck below it.
            if (coach.obj.userData && coach.obj.userData.kind === 'bird') _coachW.y += 0.36;
            pos = worldToScreen(_coachW);
        }
        else if (coach.hud === 'bowl') {
            // Big oval dish: size the ring from the bowl radius so it encircles the whole bowl
            // (and its food) instead of ringing the empty middle; scales with any viewport.
            pos = worldToScreen(_coachW.set(BOWL.x, BOWL.y + 0.2, BOWL.z));
            const ex = worldToScreen(_coachW.set(BOWL.x + BOWL.r, BOWL.y + 0.2, BOWL.z));
            const ez = worldToScreen(_coachW.set(BOWL.x, BOWL.y + 0.2, BOWL.z + BOWL.r));
            pos.rw = Math.max(140, Math.abs(ex.x - pos.x) * 2.15);
            pos.rh = Math.max(100, Math.abs(ez.y - pos.y) * 2.15);
        }
        else if (coach.hud === 'bar' && ui.bar) {
            // Target the full track (barwrap), NOT the 0-width fill, and hug it with a wide pill so
            // the whole progress bar is highlighted rather than its far-left tip.
            const el = ui.bar.parentElement || ui.bar;
            const r = el.getBoundingClientRect();
            pos = { x: r.left + r.width * 0.5, y: r.top + r.height * 0.5, behind: false };
            pos.rw = r.width + 34; pos.rh = r.height + 40;
        }
        const ring = ui.coachRing, hand = ui.coachHand;
        if (!coach.steps[coach.i].noHighlight && pos && !pos.behind && pos.x > 0 && pos.y > 0) {
            ring.style.left = pos.x + 'px'; ring.style.top = pos.y + 'px'; ring.classList.add('on');
            hand.style.left = pos.x + 'px'; hand.style.top = pos.y + 'px'; hand.classList.add('on');
            // A big target (bowl / progress bar) carries an explicit size: grow the ring into an
            // oval that encircles it, and drop the tap-hand. Small items keep the 96px CSS circle.
            if (pos.rw) {
                ring.style.width = pos.rw + 'px'; ring.style.height = pos.rh + 'px';
                ring.style.marginLeft = (-pos.rw / 2) + 'px'; ring.style.marginTop = (-pos.rh / 2) + 'px';
                hand.classList.remove('on');
            } else {
                ring.style.width = ''; ring.style.height = ''; ring.style.marginLeft = ''; ring.style.marginTop = '';
            }
        } else { ring.classList.remove('on'); hand.classList.remove('on'); }
        // Adaptive card side: keep the card off whatever it highlights. A low target (the bowl or
        // birds on the deck) floats the card up top; higher targets keep it near the bottom.
        // The 0.55-0.62 hysteresis band stops it flickering when a target sits mid-screen.
        const forcedPos = coach.steps[coach.i].cardPos;
        if (forcedPos === 'center') {
            ui.coachCard.classList.add('center');
            ui.coachCard.classList.remove('top');
        } else if (forcedPos === 'top') {
            // Always pin the card just below the progress bar, regardless of target position.
            ui.coachCard.classList.remove('center');
            ui.coachCard.classList.add('top');
        } else {
            ui.coachCard.classList.remove('center');
            let cardTop = ui.coachCard.classList.contains('top');
            if (!pos || pos.behind) cardTop = false;
            else { const yf = pos.y / renderer.domElement.clientHeight; if (yf > 0.62) cardTop = true; else if (yf < 0.55) cardTop = false; }
            ui.coachCard.classList.toggle('top', cardTop);
        }
    }
    // One-line contextual tip (shown once, auto-hides).
    let toastT = 0;
    function showToast(html, key) {
        if (key) { if (save[key]) return; save[key] = true; persist(); }
        ui.toast.innerHTML = html;
        ui.toast.classList.add('show');
        clearTimeout(toastT);
        toastT = setTimeout(() => ui.toast.classList.remove('show'), 2600);
    }

    // ========================================================================
    // INPUT — raycast tap to drop an item
    // ========================================================================
    const raycaster = new THREE.Raycaster();
    const ptr = new THREE.Vector2();
    // Raycast a pointer event to the pile item it hits (or null).
    function pickItem(e) {
        // Rows waiting to scroll in are parked above the chamber opening, hidden behind the
        // cabinet face and the top bar. Only the visible gameplay area accepts taps.
        if (e.clientY < APERTURE_TOP_PX) return null;
        ptr.x = (e.clientX / innerWidth) * 2 - 1;
        ptr.y = -(e.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(ptr, camera);
        const targets = [];

                const r1 = crackPool.shift(), r2 = crackPool.shift();
                assign.set(r1, c); assign.set(r2, c); cCount[c] += 2;
            }
            // 3) leftover crackers → shore up under-supplied / used colours (avoid stranded colours)
            const leftoverColor = () => {
                for (const c of hungryColors) if (cCount[c] * 2 < Math.max(0, hungryNeed[c] - (bowl0[c] || 0))) return c;
                const under = colors.filter(c => cCount[c] < 2 * eCount[c]);
                if (under.length) { under.sort((a, b) => (2 * eCount[b] - cCount[b]) - (2 * eCount[a] - cCount[a])); return under[0]; }
                const used = colors.filter(c => eCount[c] > 0 || cCount[c] > 0);
                return used.length ? used[rng() * used.length | 0] : colors[0];
            };
            while (crackPool.length) { const c = leftoverColor(); assign.set(crackPool.shift(), c); cCount[c]++; }
            // 4) leftover eggs (crackers ran out) → colour with the most spare crackers
            while (eggPool.length) {
                const c = colors.slice().sort((a, b) => (cCount[b] - 2 * eCount[b]) - (cCount[a] - 2 * eCount[a]))[0];
                assign.set(eggPool.pop(), c); eCount[c]++;
            }

            const res = evalAssign(assign);
            if (res.solvable) { const sc = scoreAssign(assign); if (!best || sc > best.sc) best = { assign, sc }; }
        }
        // Prefer a real (changed) solvable recolour; else fall back to the current colouring if it
        // is itself completable; else null so the shuffle does NOTHING rather than apply a board
        // that can't be finished. This never turns a completable level into an impossible one.
        return best || identityPlan;
    }

    // Rebuild the per-colour appetite queue from the eggs currently on the board
    // (needed because hatch() pulls appetites by colour — see hatch()).
    function rebuildNeedQueueFromBoard() {
        const q = {}; cfg.colors.forEach(c => q[c] = []);
        for (const p of pile) if (p.type === 'egg') { (q[p.color] || (q[p.color] = [])).push(BIRD_CAPACITY); }
        needQueue = q;
    }

    let shuffleCooling = false;
    // One shuffle per level attempt — restocked by beginLevel(), spent by a shuffle
    // that actually recolours something.
    const SHUFFLE_PER_LEVEL = 1;
    let shuffleLeft = SHUFFLE_PER_LEVEL;
    function refreshShuffleBadge() {
        if (ui.shuffleBadge) ui.shuffleBadge.textContent = String(shuffleLeft);
        if (ui.shuffleBtn) ui.shuffleBtn.classList.toggle('spent', shuffleLeft <= 0);
    }
    function resetShuffleBooster() {
        shuffleLeft = SHUFFLE_PER_LEVEL;
        shuffleCooling = false;
        if (ui.shuffleBtn) ui.shuffleBtn.classList.remove('busy', 'spin');
        refreshShuffleBadge();
    }
    function doShuffleBooster() {
        if (gameState !== STATE.PLAY || levelDone) return;
        if (coach) return; // a tutorial owns the board right now
        if (shuffleLeft <= 0) { sfx.locked(); showToast(t('toastShuffleSpent', 'Only one shuffle per level!')); return; }
        if (shuffleCooling) return;
        const plan = planShuffle();
        if (!plan) { sfx.locked(); return; }
        shuffleCooling = true;
        ui.shuffleBtn.classList.add('busy', 'spin');
        setTimeout(() => { shuffleCooling = false; ui.shuffleBtn.classList.remove('busy', 'spin'); }, 650);

        let changed = 0;
        for (const [rec, color] of plan.assign) if (recolorItem(rec, color)) changed++;
        rebuildNeedQueueFromBoard();
        deadlockT = 0; // the board just changed — don't let a mid-debounce fail slip through
        refreshHud();
        // A no-op plan (nothing recoloured) doesn't cost the player their one charge.
        if (changed) { shuffleLeft = Math.max(0, shuffleLeft - 1); refreshShuffleBadge(); sfx.crack(); haptic(18); } else { sfx.click(); }
    }

    // ── LOCK & KEY runtime ────────────────────────────────────────────────
    const keysInFlight = [];
    const _lockScan = new THREE.Vector3();
    // "any key opens the next lock" → target the still-locked item nearest the key.
    function pickNextLock(fromPos) {
        let best = null, bd = Infinity;
        for (const p of pile) {
            if (!p.locked || p.unlocking) continue;
            const d = fromPos ? p.group.getWorldPosition(_lockScan).distanceToSquared(fromPos) : 0;
            if (d < bd) { bd = d; best = p; }
        }
        return best;
    }
    // A key-carrying cracker was ground in the mouth: pop its key out and fly it to a lock.
    function releaseKey(f) {
        if (f.keyMesh && f.keyMesh.parent) f.keyMesh.parent.remove(f.keyMesh);
        f.keyMesh = null;
        const from = f.group.position.clone();
        const KEY_FLY = 1.6;
        const key = buildKeyMesh();
        key.scale.setScalar(KEY_FLY);
        key.position.copy(from);
        scene.add(key);
        keysInFlight.push(key);
        sfx.unlock(); haptic(12);
        spawnGoldBurst(from, 0.6);   // a little sparkle as the key pops out of the mouth
        const target = pickNextLock(from);
        if (!target) {
            // nothing left to open — the key just twirls up out of the mouth and fades away
            tween(key.position, { y: from.y + 1.2 }, 0.6, { ease: easeOutQuad, onUpdate: () => { key.rotation.z += 0.32; }, onDone: () => removeKey(key) });
            return;
        }
        target.unlocking = true;
        const dest = target.group.getWorldPosition(new THREE.Vector3());
        const midLift = 1.5 + Math.random() * 0.4;
        tween(key.position, { x: dest.x, y: dest.y, z: dest.z + 0.5 }, 0.8, {
            ease: easeInOut,
            onUpdate: (e) => {
                key.position.y += Math.sin(e * Math.PI) * midLift;      // arch up and over
                key.rotation.z = -0.5 + e * 7.0;                         // spin as it flies
                key.scale.setScalar(KEY_FLY * (1 + Math.sin(e * Math.PI) * 0.16)); // gentle size bob
            },
            onDone: () => { removeKey(key); unlockItem(target); }
        });
    }
    function removeKey(key) {
        const idx = keysInFlight.indexOf(key);
        if (idx >= 0) keysInFlight.splice(idx, 1);
        scene.remove(key);
    }
    // The key reached the lock: spring the shackle open, vanish the padlock, free the item.
    function unlockItem(rec) {
        rec.unlocking = false;
        rec.locked = false;
        const lock = rec.lockMesh; rec.lockMesh = null;
        sfx.unlock(); haptic(20);
        if (rec.group) spawnGoldBurst(rec.group.getWorldPosition(_tapBurstPos), 1.1);
        if (lock) {
            lock.rotation.z = 0;
            const shackle = lock.userData.shackle;
            if (shackle) {
                // a quick jolt, then the shackle springs up and rotates open
                tween(shackle.position, { y: shackle.position.y + 0.2 }, 0.22, { ease: easeOutBack });
                tween(shackle.rotation, { z: -1.15 }, 0.28, { ease: easeOutBack });
            }
            tween(lock.scale, { x: 1.35, y: 1.35, z: 1.35 }, 0.18, { ease: easeOutBack, onDone: () => {
                tween(lock.scale, { x: 0.01, y: 0.01, z: 0.01 }, 0.22, { ease: easeInOut, onDone: () => { if (lock.parent) lock.parent.remove(lock); } });
            } });
        }
        // a freed item gets a bright pop to invite the tap
        if (rec.group) {
            const base = rec.scale || rec.group.scale.x || ITEM_SCALE;
            killTweens(rec.group.scale);
            rec.group.scale.setScalar(base * 1.22);
            tween(rec.group.scale, { x: base, y: base, z: base }, 0.34, { ease: easeOutBack });
        }
    }

    // ========================================================================
    // GRIND / HATCH / EAT
    // ========================================================================
    function resetBowlSlots() {
        bowlSlots = Array.from({ length: BOWL_CAPACITY }, () => ({ color: null }));
    }
    // Pick up to n free bowl slots that are spread as far apart as possible so the
    // pellets from a single ground cracker land in visibly different spots. First
    // slot is picked at random; each subsequent slot maximises distance from the
    // already-picked slots (and, when placing the very first pellet of a colour,
    // from any existing same-colour slots so new colours seed a fresh patch).
    function pickSpreadSlots(color, n) {
        const free = [];
        for (let i = 0; i < bowlSlots.length; i++) if (!bowlSlots[i].color) free.push(i);
        if (!free.length) return [];
        const same = [];
        for (let i = 0; i < bowlSlots.length; i++) if (bowlSlots[i].color === color) same.push(i);
        const picked = [];
        const distTo = (f, refs) => {
            let dmin = Infinity;
            const a = BOWL_FILL_AREAS[f];
            for (const s of refs) {
                const b = BOWL_FILL_AREAS[s];
                const dx = a.x - b.x, dz = a.z - b.z, d = dx * dx + dz * dz;
                if (d < dmin) dmin = d;
            }
            return dmin;
        };
        // seed: farthest from existing same-colour cluster, else random
        let first;
        if (same.length) {
            let best = free[0], bd = -1;
            for (const f of free) { const d = distTo(f, same); if (d > bd) { bd = d; best = f; } }
            first = best;
        } else {
            first = free[Math.floor(Math.random() * free.length)];
        }
        picked.push(first);
        free.splice(free.indexOf(first), 1);
        // each next pellet: maximise min-distance from already-picked pellets
        while (picked.length < n && free.length) {
            let best = free[0], bd = -1;
            for (const f of free) { const d = distTo(f, picked); if (d > bd) { bd = d; best = f; } }
            picked.push(best);
            free.splice(free.indexOf(best), 1);
        }
        return picked;
    }
    // Effective bowl occupancy: pellets already in the bowl PLUS pellets promised by a cracker
    // that is mid-grind (a shredder in its pre-grind 'roll' phase) but whose grind() has not
    // run yet. Used so a resting cracker doesn't slip into the grinder during that ~0.18s
    // window and get silently swallowed once the bowl is really full.
    function bowlOccupancy() {
        let n = Object.values(crumbCount).reduce((a, b) => a + b, 0);
        // crumbs already promised by a cracker mid-grind (roll-phase shredder) whose grind()
        // has not run yet — so a cracker arriving in that ~0.18s window sees the real room.
        for (const s of shredders) if (s.phase === 'roll') n += CRUMBS_PER;
        return n;
    }
    // Speed multiplier for the grinder when crackers are backlogged.
    // Counts every cracker still in-flight (fallers) or mid-shred (shredders) as "pending
    // work". With 1 cracker the grinder runs at normal pace; each additional cracker in the
    // queue raises speed sharply (1.5× per extra cracker), capped at 6× to keep it readable.
    function grindSpeedMult() {
        let pending = shredders.length;
        for (const f of fallers) if (f.type === 'cracker') pending++;
        return pending <= 1 ? 1 : Math.min(6.0, 1 + (pending - 1) * 1.5);
    }
    // Grind up to `maxCount` pellets of this colour into the bowl, filling only the slots
    // that are actually free. Returns how many pellets were ground (may be < maxCount when
    // the bowl runs out of room mid-cracker).
    function grind(color, maxCount = CRUMBS_PER) {
        sfx.grind(); haptic(HAP.grindPass); postToParent({ type: 'flock-feast:sfx', name: 'grains_grind' });   // positive: a cracker passes through the grinder
        const slots = pickSpreadSlots(color, maxCount);
        for (const slotIndex of slots) {
            bowlSlots[slotIndex].color = color;
            // queue the grains instead of dumping them all this frame -> they pour in over time
            for (let j = 0; j < PELLET_SPRAY_PER_SLOT; j++) pelletQueue.push({ color, slotIndex, sprayIndex: j });
        }
        crumbCount[color] = (crumbCount[color] || 0) + slots.length;
        refreshHud();
        const total = Object.values(crumbCount).reduce((a, b) => a + b, 0);
        if (total >= BOWL_CAPACITY) bowlFullPop();
        return slots.length;
    }
    // A cracker that only PARTLY fits the bowl drops in, grinds what fits (pushing those
    // pellets out to the bowl), then wedges the un-ground remainder between the gear teeth
    // so it stays clearly visible. It sits pinched in the nip (gears frozen, see update())
    // until the bowl drains room, then the remainder grinds through.
    function jamGrinder(group, color, baseScale) {
        const bScale = baseScale || group.scale.x;
        // push whatever fits right now into the bowl's last empty slot(s)
        const ground = grind(color, CRUMBS_PER);
        const remaining = CRUMBS_PER - ground;
        if (remaining <= 0) {
            // room opened up before it landed and the whole cracker fit — shred it away
            // (pellets already ground above, so don't grind again).
            killTweens(group.scale);
            startShred(group, color, true);
            processed++;
            refreshHud();
            checkComplete();
            return;
        }
        grinderJammed = true;
        jammedCracker = { group, color, baseScale: bScale, remaining };
        gearJamBaseL = gearL ? gearL.rotation.z : 0;
        gearJamBaseR = gearR ? gearR.rotation.z : 0;
        // settle it into the interlock gap and pinch it so it reads as stuck between the teeth
        killTweens(group.position); killTweens(group.scale);
        group.position.x = 0;
        tween(group.position, { y: GRIND_Y + unitR('cracker') * 0.5 }, 0.12, { ease: easeInOut });
        tween(group.scale, { x: bScale * 0.62, y: bScale * 1.06, z: bScale }, 0.14, { ease: easeOutBack });
        sfx.jam(); haptic(26);
        bowlFullPop();
    }
    // Once the bowl has room again, grind the wedged remainder. If only part of it fits, it
    // stays wedged with less left; once fully ground the cracker is finally shredded away.
    function releaseJam() {
        if (!grinderJammed || !jammedCracker) return;
        const { group, color, remaining } = jammedCracker;
        const ground = grind(color, remaining);
        const left = remaining - ground;
        if (left > 0) { jammedCracker.remaining = left; return; } // still wedged, less left
        grinderJammed = false;
        jammedCracker = null;
        killTweens(group.scale);
        startShred(group, color, true); // remainder already ground above
        processed++;
        refreshHud();
        checkComplete();
    }
    // Feed a tapped cracker between the gears: squeeze it and shred it away bottom-to-top
    // by sweeping a clip plane upward through the mesh as it sinks into the nip. Pass
    // skipGrind=true when the pellets were already ground (jam/partial paths) so the shred
    // is purely visual and doesn't dump a second batch of pellets.
    function startShred(group, color, skipGrind = false) {
        renderer.localClippingEnabled = true;
        const box = new THREE.Box3().setFromObject(group);
        const botY = box.min.y, topY = box.max.y;
        // clip plane FIXED at the gear interlock line: the mesh only disappears as it sinks past it
        const nipY = botY + 0.02;
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -nipY);
        group.traverse(o => {
            if (o.isMesh && o.material) {
                const m = o.material.clone();
                m.clippingPlanes = [plane];
                m.clipShadows = true;
                o.material = m;
            }
        });
        // first roll the cracker to x=0 (the gap directly above the gear interlock), THEN shred
        shredders.push({ group, plane, color, phase: 'roll', rollT: 0, rollFrom: group.position.x,
            t: 0, dur: 0.6, sink: (topY - botY) + 0.06, skipGrind,
            baseX: 0, baseY: group.position.y, baseSX: group.scale.x });
    }
    let lastFullPop = 0;
    function bowlFullPop() {
        const now = performance.now();
        if (now - lastFullPop < 900) return;
        lastFullPop = now;
        haptic(24); sfx.full();
        showToast(t('toastBowlFull', 'Bowl full! Feed birds to<br>make room to grind more.'), 'ftueBowlSeen');
        const c = ui.counter;
        if (c) { c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
    }
    function spawnPellet(color, slotIndex, sprayIndex) {
        if (pellets.length >= BOWL_CAPACITY * (PELLET_SPRAY_PER_SLOT + 2)) {
            const oldIndex = pellets.findIndex(p => !p.edible);
            const old = pellets.splice(oldIndex >= 0 ? oldIndex : 0, 1)[0];
            if (old) scene.remove(old.mesh);
        }
        const target = BOWL_FILL_TARGETS[slotIndex][sprayIndex % PELLET_SPRAY_PER_SLOT];
        const edible = sprayIndex === 0;
        // per-grain scatter, then clamp strictly inside the rim so nothing spills over it
        let lx = target.x + (Math.random() - 0.5) * 0.15;
        let lz = target.z + (Math.random() - 0.5) * 0.12;
        const rr = Math.hypot(lx / BOWL_INNER_X, lz / BOWL_INNER_Z);
        if (rr > 1) { lx /= rr; lz /= rr; }
        const targetX = BOWL.x + lx;
        const targetZ = BOWL.z + lz;
        const mesh = new THREE.Mesh(pelletGeo, pelletMat(color));
        const grainScale = (edible ? 0.75 : 0.48 + Math.random() * 0.39) * FEEDER_SCALE * 1.15;
        mesh.scale.setScalar(grainScale);
        mesh.rotation.set(Math.random() * TAU, Math.random() * TAU, Math.random() * TAU);
        mesh.castShadow = true;
        // emerge from the gear nip, then fly straight to this grain's own heap spot
        mesh.position.set(BOWL.x + (Math.random() - 0.5) * 0.28, -0.05 + Math.random() * 0.12, 0.14 + Math.random() * 0.05);
        scene.add(mesh);
        const restLift = 0.11 * grainScale + target.lift * Math.pow(Math.random(), 1.4);
        const restY = feedSurfaceY(targetZ) - 0.075 + restLift;
        pellets.push({ mesh, color, slotIndex, edible, phase: 'toHeap', landed: false, baseGrain: grainScale, settleT: null,
            t: 0, dur: 0.24 + Math.random() * 0.22, arc: 0.5 + Math.random() * 0.6,
            sx: mesh.position.x, sy: mesh.position.y, sz: mesh.position.z,
            tx: targetX, tz: targetZ, ty: restY, restLift });
    }
    function landPellet(p) {
        const pp = p.mesh.position;
        pp.x = p.tx;
        pp.z = p.tz;
        pp.y = feedSurfaceY(pp.z) - 0.075 + p.restLift;
        p.landed = true;
        p.settleT = 0; // trigger a quick squash-and-settle on impact
    }

    // ------------------------------------------------------------------
    // EGG HATCHING — an egg dropped onto the slope wobbles, cracks open into
    // two shell halves, sprays shell shards + sparkles, and the bird emerges.
    // ------------------------------------------------------------------
    const EGG_SX = 1.02, EGG_SY = 1.38;                             // matches buildEgg body scale
    // Two interlocking shell halves whose mating edge is a ZIGZAG (triangle wave in the polar
    // angle), so the egg cracks along a jagged eggshell seam instead of a clean flat ring.
    // Both halves share the SAME seam function -> their teeth mesh together exactly.
    function makeShellGeo(isTop, teeth, amp) {
        const uSteps = teeth * 8, vSteps = 18, R = 0.5;
        const pos = [], uv = [], idx = [];
        for (let i = 0; i <= uSteps; i++) {
            const theta = i / uSteps * TAU;
            const tw = Math.abs(((i / uSteps * teeth) % 1) * 2 - 1) * 2 - 1;  // triangle wave -1..1
            const phiSeam = Math.PI * 0.5 + tw * amp;                          // zigzag seam latitude
            const p0 = isTop ? 0 : phiSeam;
            const p1 = isTop ? phiSeam : Math.PI;
            for (let j = 0; j <= vSteps; j++) {
                const v = j / vSteps, phi = p0 + (p1 - p0) * v;
                const sp = Math.sin(phi), cp = Math.cos(phi);
                pos.push(R * sp * Math.cos(theta), R * cp, R * sp * Math.sin(theta));
                uv.push(i / uSteps, phi / Math.PI);
            }
        }
        const row = vSteps + 1;
        for (let i = 0; i < uSteps; i++) for (let j = 0; j < vSteps; j++) {
            const a = i * row + j, b = a + row;
            idx.push(a, b, b + 1, a, b + 1, a + 1);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
        g.setIndex(idx); g.computeVertexNormals();
        return g;
    }
    const topShellGeo = makeShellGeo(true, 9, 0.16);   // upper shell cap (zigzag lower edge)
    const botShellGeo = makeShellGeo(false, 9, 0.16);  // lower shell cup (zigzag upper edge)
    const shardGeo = new THREE.TetrahedronGeometry(0.07, 0);
    const sparkGeo = new THREE.SphereGeometry(0.035, 8, 6);
    // little twig sticks that bounce out of a nest when a bird plops in
    const twigGeo = new THREE.BoxGeometry(0.025, 0.16, 0.025);
    const twigDebrisMat = new THREE.MeshStandardMaterial({ color: 0x8a5a2c, roughness: 0.9 });
    const _plopPos = new THREE.Vector3();
    function spawnTwigBurst(px) {
        const n = REDUCED ? 6 : 14;
        for (let i = 0; i < n; i++) {
            const m = new THREE.Mesh(twigGeo, twigDebrisMat);
            m.position.copy(px); m.position.y += 0.06;
            const s = 0.7 + Math.random() * 0.7; m.scale.setScalar(s);
            m.rotation.set(Math.random() * TAU, Math.random() * TAU, Math.random() * TAU);
            m.castShadow = true; scene.add(m);
            const ang = Math.random() * TAU, sp = 0.8 + Math.random() * 1.6;
            debris.push({ mesh: m, vx: Math.cos(ang) * sp, vz: Math.sin(ang) * sp * 0.7, vy: 1.6 + Math.random() * 1.5,
                rx: (Math.random() - 0.5) * 16, rz: (Math.random() - 0.5) * 16, life: 0, max: 0.6 + Math.random() * 0.4, base: s });
        }
    }
    // A bird plops onto its nest: subtle punch-scale on the nest + a few twigs bounce out.
    function plopNest(n) {
        if (!n) return;
        if (n.mesh) {
            const base = FEEDER_SCALE;
            killTweens(n.mesh.scale);
            n.mesh.scale.setScalar(base * (REDUCED ? 1.05 : 1.1));
            tween(n.mesh.scale, { x: base, y: base, z: base }, 0.3, { ease: easeOutBack });
        }
        spawnTwigBurst(_plopPos.set(n.x, n.y, n.z));
    }
    const flashRingGeo = new THREE.TorusGeometry(0.22, 0.05, 10, 28);
    const thinRingGeo = new THREE.TorusGeometry(0.24, 0.018, 10, 40);   // thin ring for the tap burst
    const sparkMat = new THREE.MeshBasicMaterial({ color: 0xfff2b0 });
    function shellMat(color) { return (matCache['shell_' + color] ||= new THREE.MeshStandardMaterial({ color: tint(FOOD[color], 0.22), roughness: 0.5, side: THREE.DoubleSide })); }
    function shellHalfMat(color) { const m = eggMat(color).clone(); m.side = THREE.DoubleSide; return m; }
    function sparkMatFor(color) { return (matCache['spark_' + color] ||= new THREE.MeshBasicMaterial({ color: tint(FOOD[color], -0.06) })); }
    const _tapBurstPos = new THREE.Vector3();

    // ------------------------------------------------------------------------
    // 2D UI-STYLE CONFETTI — a DOM canvas overlay (not 3D). Colourful streamers,
    // blobs and stars burst out from each nest's on-screen position, flutter under
    // gravity and fade out. Runs its own rAF loop only while particles are alive.
    // ------------------------------------------------------------------------
    const CONFETTI_COLORS = ['#ef6d6d', '#f3a24c', '#ffd24d', '#8ed35c', '#4fb0f2', '#b579ff', '#ff9ecf'];
    const CONFETTI_SHAPES = ['stream', 'stream', 'blob', 'star']; // streamers weighted heavier
    const CONFETTI_MS = 2000;   // longest confetti lifetime — win panel waits this long
    const fxCanvas = document.getElementById('fx');
    const fxCtx = fxCanvas.getContext('2d');
    let fxParts = [], fxRAF = 0, fxLast = 0;
    const _fxV = new THREE.Vector3();
    function fxResize() { fxCanvas.width = Math.round(innerWidth * DPR_CAP); fxCanvas.height = Math.round(innerHeight * DPR_CAP); }
    fxResize();
    addEventListener('resize', fxResize);
    function fxStar(cx, cy, points, outer, inner) {
        fxCtx.beginPath();
        for (let i = 0; i < points * 2; i++) {
            const r = (i % 2 === 0) ? outer : inner;
            const a = (i / (points * 2)) * TAU - Math.PI / 2;
            const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
            if (i === 0) fxCtx.moveTo(x, y); else fxCtx.lineTo(x, y);
        }
        fxCtx.closePath(); fxCtx.fill();
    }
    function fxDraw(p, alpha) {
        const D = DPR_CAP, s = p.size * D;
        fxCtx.save();
        fxCtx.globalAlpha = alpha;
        fxCtx.translate(p.x * D, p.y * D);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        if (p.shape === 'stream') fxCtx.fillRect(-s * 0.28, -s * 1.1, s * 0.56, s * 2.2);
        else if (p.shape === 'blob') { fxCtx.beginPath(); fxCtx.arc(0, 0, s * 0.7, 0, TAU); fxCtx.fill(); }
        else fxStar(0, 0, 5, s * 0.95, s * 0.42);
        // soft warm sheen — a gentle painted-clay highlight, not a hard plastic glint
        fxCtx.globalAlpha = alpha * 0.22;
        fxCtx.fillStyle = '#fff3e0';
        if (p.shape === 'stream') fxCtx.fillRect(-s * 0.2, -s * 0.95, s * 0.16, s * 1.9);
        else if (p.shape === 'blob') { fxCtx.beginPath(); fxCtx.arc(-s * 0.2, -s * 0.22, s * 0.34, 0, TAU); fxCtx.fill(); }
        else { fxCtx.beginPath(); fxCtx.arc(-s * 0.1, -s * 0.16, s * 0.24, 0, TAU); fxCtx.fill(); }
        fxCtx.restore();
    }
    function fxTick(now) {
        const dt = Math.min(0.05, (now - fxLast) / 1000); fxLast = now;
        fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
        const grav = 1050;
        for (let i = fxParts.length - 1; i >= 0; i--) {
            const p = fxParts[i]; p.life += dt;
            if (p.life >= p.max) { fxParts.splice(i, 1); continue; }
            p.vy += grav * dt; p.vx *= 0.992; p.sway += dt * 7;
            p.x += (p.vx + Math.cos(p.sway) * 42) * dt;
            p.y += p.vy * dt;
            p.rot += p.spin * dt;
            const fade = p.max * 0.65;
            const alpha = p.life > fade ? Math.max(0, 1 - (p.life - fade) / (p.max - fade)) : 1;
            fxDraw(p, alpha);
        }
        if (fxParts.length) fxRAF = requestAnimationFrame(fxTick);
        else { fxRAF = 0; fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height); }
    }
    function spawnConfetti() {
        const cw = renderer.domElement.clientWidth, ch = renderer.domElement.clientHeight;
        const per = REDUCED ? 18 : 44;
        for (const n of NESTS) {
            _fxV.set(n.x, n.y + 0.15, n.z).project(camera);
            if (_fxV.z > 1) continue;                       // behind the camera
            const ox = (_fxV.x * 0.5 + 0.5) * cw, oy = (-_fxV.y * 0.5 + 0.5) * ch;
            for (let i = 0; i < per; i++) {
                // burst OUT from the nest centre — upward fan spray
                const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.15;
                const sp = 300 + Math.random() * 560;
                fxParts.push({
                    x: ox, y: oy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    rot: Math.random() * TAU, spin: (Math.random() - 0.5) * 16,
                    size: 6 + Math.random() * 7, sway: Math.random() * TAU,
                    color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
                    shape: CONFETTI_SHAPES[(Math.random() * CONFETTI_SHAPES.length) | 0],
                    life: 0, max: 1.2 + Math.random() * 0.8,
                });
            }
        }
        if (!fxRAF) { fxLast = performance.now(); fxRAF = requestAnimationFrame(fxTick); }
    }

    // Burst of eggshell shards + bright sparkles + an expanding flash ring at the crack point.
    function spawnShellBurst(px, color, noShards) {
        const ring = new THREE.Mesh(noShards ? thinRingGeo : flashRingGeo, new THREE.MeshBasicMaterial({ color: noShards ? tint(FOOD[color], -0.04) : 0xfff4c2, transparent: true, opacity: 0.9 }));
        ring.position.copy(px); ring.scale.setScalar(0.35);
        if (noShards) ring.lookAt(camera.position);   // circular ring facing the camera
        else ring.rotation.x = Math.PI / 2;            // flat ring on the ground at the crack point
        scene.add(ring);
        tween(ring.scale, { x: 2.6, y: 2.6, z: 2.6 }, 0.42, { ease: easeOutQuad });
        tween(ring.material, { opacity: 0 }, 0.42, { ease: easeOutQuad, onDone: () => scene.remove(ring) });

        const nShard = noShards ? 0 : (REDUCED ? 3 : 8);
        for (let i = 0; i < nShard; i++) {
            const m = new THREE.Mesh(shardGeo, shellMat(color));
            m.position.copy(px); m.position.y += 0.04;
            const s = 0.6 + Math.random() * 0.9; m.scale.setScalar(s);
            m.rotation.set(Math.random() * TAU, Math.random() * TAU, Math.random() * TAU);
            m.castShadow = true; scene.add(m);
            const ang = Math.random() * TAU, sp = 1.0 + Math.random() * 1.8;
            debris.push({ mesh: m, vx: Math.cos(ang) * sp, vz: Math.sin(ang) * sp * 0.5, vy: 2.4 + Math.random() * 2.0,
                rx: (Math.random() - 0.5) * 14, rz: (Math.random() - 0.5) * 14, life: 0, max: 0.7 + Math.random() * 0.4, base: s });
        }
        const nSpark = REDUCED ? 5 : 14;
        const sMat = noShards ? sparkMatFor(color) : sparkMat;
        for (let i = 0; i < nSpark; i++) {
            const m = new THREE.Mesh(sparkGeo, sMat);
            m.position.copy(px); m.position.y += 0.1;
            const s = 0.5 + Math.random() * 0.9; m.scale.setScalar(s); scene.add(m);
            const ang = Math.random() * TAU, sp = 1.4 + Math.random() * 2.4;
            debris.push({ mesh: m, vx: Math.cos(ang) * sp, vz: Math.sin(ang) * sp * 0.6, vy: 2.8 + Math.random() * 2.6,
                rx: 0, rz: 0, life: 0, max: 0.45 + Math.random() * 0.35, base: s });
        }
    }

    // Celebratory gold pop for the lock & key — an expanding golden ring + gold sparkles.
    const goldSparkMat = new THREE.MeshBasicMaterial({ color: 0xffe08a });
    function spawnGoldBurst(px, scale = 1) {
        const ring = new THREE.Mesh(flashRingGeo, new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.95 }));
        ring.position.copy(px); ring.scale.setScalar(0.3 * scale); ring.lookAt(camera.position);
        scene.add(ring);
        tween(ring.scale, { x: 2.8 * scale, y: 2.8 * scale, z: 2.8 * scale }, 0.5, { ease: easeOutQuad });
        tween(ring.material, { opacity: 0 }, 0.5, { ease: easeOutQuad, onDone: () => scene.remove(ring) });
        const nSpark = REDUCED ? 6 : Math.round(16 * scale);
        for (let i = 0; i < nSpark; i++) {
            const m = new THREE.Mesh(sparkGeo, goldSparkMat);
            m.position.copy(px); m.position.y += 0.1;
            const s = (0.5 + Math.random() * 1.0) * scale; m.scale.setScalar(s); scene.add(m);
            const ang = Math.random() * TAU, sp = (1.4 + Math.random() * 2.5) * scale;
            debris.push({ mesh: m, vx: Math.cos(ang) * sp, vz: Math.sin(ang) * sp * 0.6, vy: 2.6 + Math.random() * 2.6,
                rx: 0, rz: 0, life: 0, max: 0.45 + Math.random() * 0.4, base: s });
        }
    }

    // Split the egg into two rigid shell halves that fall away, then hatch the bird from the cup.
    function crackOpen(px, color, baseS, dbgId) {
        sfx.crack(); haptic(22); postToParent({ type: 'flock-feast:sfx', name: 'egg_cracked' });
        spawnShellBurst(px, color);
        const sx = baseS * EGG_SX, sy = baseS * EGG_SY;

        const top = new THREE.Mesh(topShellGeo, shellHalfMat(color));
        top.scale.set(sx, sy, sx); top.position.copy(px); top.castShadow = true;
        scene.add(top);
        tween(top.position, { y: px.y + 0.5, x: px.x + 0.22 }, 0.2, { ease: easeOutQuad, onDone: () => {
                tween(top.position, { x: px.x + 0.6, y: px.y - 0.15, z: px.z + 0.05 }, 0.55, { ease: easeInQuad, onDone: () => {
                        tween(top.scale, { x: 0.001, y: 0.001, z: 0.001 }, 0.2, { onDone: () => scene.remove(top) });
                    } });
            } });
        tween(top.rotation, { x: -2.4, z: 0.9 }, 0.75, { ease: easeOutQuad });

        const bot = new THREE.Mesh(botShellGeo, shellHalfMat(color));
        bot.scale.set(sx, sy, sx); bot.position.copy(px); bot.castShadow = true; bot.receiveShadow = true;
        scene.add(bot);
        tween(bot.rotation, { z: 0.12 }, 0.18, { ease: easeInOut, onDone: () => {
                tween(bot.rotation, { z: -0.1 }, 0.3, { ease: easeInOut, onDone: () => {
                        tween(bot.position, { y: px.y - 0.12, x: px.x - 0.35 }, 0.35, { ease: easeInQuad });
                        tween(bot.rotation, { x: 1.1, z: -0.7 }, 0.4, { ease: easeInQuad });
                        tween(bot.scale, { x: 0.001, y: 0.001, z: 0.001 }, 0.35, { onDone: () => scene.remove(bot) });
                    } });
            } });

        hatch(color, { x: px.x, y: px.y, z: px.z }, dbgId);
    }

    // Egg lands on the slope: a single instant squash-pop, then it cracks open right away.
    function startHatch(f) {
        const g = f.group;
        const color = f.color;
        const baseS = f.baseScale || ITEM_SCALE;
        const px = g.position.clone();
        killTweens(g.position); killTweens(g.scale); killTweens(g.rotation);
        g.rotation.set(0, 0, 0);
        // quick impact squash on contact
        g.scale.set(baseS * 1.18, baseS * 0.78, baseS * 1.18);
        const wob = { t: 0 };
        tween(wob, { t: 1 }, 0.09, { ease: easeOutQuad,
            onUpdate: (e) => {
                const s = baseS * (1 + (1 - e) * 0.18);
                g.scale.set(s, baseS * (1 - (1 - e) * 0.22), s);
            },
            onDone: () => { scene.remove(g); crackOpen(px, color, baseS, f._dbgId); } });
    }

    function hatch(color, origin, dbgId) {
        sfx.hatch(); haptic(18);
        if (dbgId) console.log(`[HATCH] id=${dbgId} color=${color}`); // DEBUG: pair with the [TAP] log to catch any color mismatch
        const nest = NESTS.find(s => !s.taken);
        if (nest) nest.taken = true;
        const dx = nest ? nest.x : 0, dy = nest ? nest.y - 0.02 : BOWL.rimY + 0.4, dz = nest ? nest.z : 0;
        const group = buildBird(color);
        const o = origin || { x: 0, y: GRIND_Y + 0.3, z: 0 };
        group.position.set(o.x, o.y, o.z);
        group.scale.setScalar(0.05);
        scene.add(group);
        const q = needQueue[color];
        const birdNeed = (q && q.length) ? q.shift() : need;
        const b = { group, color, need: birdNeed, fill: 0, status: 'toNest', nest, feed: null, phase: Math.random() * TAU, cool: 0, busy: true, hatchSeq: (++hatchSeqCounter) };
        makeBirdBar(b);
        birds.push(b);
        tween(group.scale, { x: 0.9, y: 0.9, z: 0.9 }, 0.32, { ease: easeOutBack });
        if (origin) {
            // emerge UP out of the cracked shell, then fly on
            tween(group.position, { y: o.y + 0.35 }, 0.28, { ease: easeOutQuad, onDone: flyHome });
        } else {
            flyHome();
        }
        // If its food is already waiting on the plate, fly straight to the feeding area;
        // otherwise settle onto the nest first. With 2+ birds, only the feeding leader may start.
        function flyHome() {
            const p = nearestPellet(b.color, group.position);
            if (p && mayStartEating(b)) {
                flyToEat(b, p); // fly right into the eating stance
            } else {
                // fly to just above the nest, then drop in with a squashy PLOP
                tween(group.position, { x: dx, y: dy + 0.4, z: dz }, 0.44, { ease: easeOutQuad, onUpdate: centerArc(group.position), onDone: () => {
                        tween(group.position, { y: dy }, 0.16, { ease: easeInQuad, onDone: () => {
                                b.status = 'nest'; b.busy = false; b.baseY = dy;
                                haptic(10);
                                const s = group.scale.x;
                                killTweens(group.scale);
                                group.scale.set(s * 1.22, s * 0.72, s * 1.22); // squash on impact
                                tween(group.scale, { x: s, y: s, z: s }, 0.32, { ease: easeOutBack });
                                plopNest(nest); // punch the nest + bounce twigs out
                            } });
                    } });
            }
        }
    }

    // ---- per-bird fill progress bars (HTML overlay anchored to each bird) ----
    function cssColor(hex) { return '#' + ('000000' + hex.toString(16)).slice(-6); }
    function makeBirdBar(b) {
        const el = document.createElement('div');
        el.className = 'birdbar';
        const bf = document.createElement('div');
        bf.className = 'bf';
        bf.style.background = cssColor(FOOD[b.color] || 0xffffff);
        el.appendChild(bf);
        el.style.opacity = '0';
        ui.birdbars.appendChild(el);
        b.bar = el; b.barFill = bf;
        updateBirdBar(b);
    }
    function updateBirdBar(b) {
        if (!b.barFill) return;
        const pct = Math.max(0, Math.min(1, b.fill / Math.max(1, b.need)));
        b.barFill.style.width = (pct * 100) + '%';
    }
    function removeBirdBar(b) {
        if (b.bar) { b.bar.remove(); b.bar = null; b.barFill = null; }
    }
    function clearBirdBars() {
        if (ui.birdbars) ui.birdbars.innerHTML = '';
        for (const b of birds) { b.bar = null; b.barFill = null; }
    }
    // Project each bird's head to screen space and park its progress bar just above it.
    const _barV = new THREE.Vector3();
    function updateBirdBarPositions() {
        const inPlay = gameState === STATE.PLAY || gameState === STATE.FTUE;
        const cw = renderer.domElement.clientWidth, ch = renderer.domElement.clientHeight;
        for (const b of birds) {
            if (!b.bar) continue;
            const show = inPlay && b.status !== 'leaving' && b.fill < b.need;
            b.bar.style.opacity = show ? '1' : '0';
            if (!show) continue;
            _barV.copy(b.group.position); _barV.y += 1.1;
            _barV.project(camera);
            if (_barV.z > 1) { b.bar.style.opacity = '0'; continue; }
            const sx = (_barV.x * 0.5 + 0.5) * cw, sy = (-_barV.y * 0.5 + 0.5) * ch;
            b.bar.style.left = sx + 'px';
            b.bar.style.top = sy + 'px';
        }
    }

    // WATCHDOG — rescue a bird stranded in a busy/transit state (e.g. a movement tween that
    // never resolved). Such a bird freezes in place AND keeps canStillProgress() perpetually
    // true, hanging the level with no win and no fail. Park it cleanly on a nest so birdThink
    // can re-plan — or, if the board is genuinely unwinnable, so the deadlock detector can trip
    // and offer RETRY instead of freezing.
    function unstickBird(b) {
        const g = b.group;
        killTweens(g.position); killTweens(g.scale); killTweens(g.rotation);
        b._stall = 0;
        if (b.eat) { eatingSlots.delete(b.eat.slotIndex); }
        if (b.reservedSlot != null) { eatingSlots.delete(b.reservedSlot); b.reservedSlot = null; }
        b.eat = null;
        if (b.status === 'leaving') {           // already tallied as fed — just finish sending it off
            scene.remove(g); removeBirdBar(b);
            const i = birds.indexOf(b); if (i >= 0) birds.splice(i, 1);
            return;
        }
        if (!b.nest) b.nest = NESTS.find(s => !s.taken) || null;
        if (b.nest) {
            b.nest.taken = true;
            g.rotation.set(0, 0, 0);
            g.position.set(b.nest.x, b.nest.y - 0.02, b.nest.z);
            g.scale.setScalar(0.72);
            b.baseY = b.nest.y - 0.02;
            b.status = 'nest';
        } else {
            b.status = 'bowl';
        }
        b.busy = false;
    }

    // Parallel feeding: any hungry bird whose colour has an unclaimed heap
    // in the bowl may eat right now — birds do NOT wait for each other.
    // `nearestPellet` skips heaps already in `eatingSlots`, so two birds
    // never fight over one heap; birds of the same colour with only one
    // matching heap simply take turns as heaps free up.
    let hatchSeqCounter = 0;
    function hungryDockBirds() {
        return birds.filter(b => b.fill < b.need && b.status !== 'leaving');
    }
    function mayStartEating(b) {
        if (!b || b.fill >= b.need) return false;
        // Among same-colour birds that are idle on their nest, flying to food,
        // or actively eating, only the one closest to full (highest fill) may
        // claim the next heap. This keeps the leading bird monopolising cracker
        // pellets until it fills up and flies off, clearing its nest slot first.
        // Ties broken by hatch order (older bird wins).
        const rivals = birds.filter(
            o => o !== b && o.color === b.color && o.fill < o.need &&
                 (o.status === 'nest' && !o.busy ||
                  o.status === 'toBowl' ||
                  o.status === 'bowl')
        );
        for (const o of rivals) {
            if (o.fill > b.fill) return false;
            if (o.fill === b.fill && o.hatchSeq < b.hatchSeq) return false;
        }
        return true;
    }
    function sendBirdToNest(b) {
        if (!b || b.status === 'toNest' || b.status === 'leaving') return;
        b.status = 'toNest'; b.busy = true;
        const dx = b.nest ? b.nest.x : 0, dy = b.nest ? b.nest.y - 0.02 : BOWL.rimY + 0.4, dz = b.nest ? b.nest.z : 0;
        tween(b.group.rotation, { x: 0 }, 0.4, { ease: easeInOut });
        tween(b.group.position, { x: dx, y: dy + 0.4, z: dz }, 0.4, { ease: easeInOut, onUpdate: centerArc(b.group.position), onDone: () => {
                tween(b.group.position, { y: dy }, 0.16, { ease: easeInQuad, onDone: () => {
                        b.status = 'nest'; b.busy = false; b.baseY = dy;
                        haptic(10);
                        const s = b.group.scale.x;
                        killTweens(b.group.scale);
                        b.group.scale.set(s * 1.22, s * 0.72, s * 1.22);
                        tween(b.group.scale, { x: s, y: s, z: s }, 0.32, { ease: easeOutBack });
                        plopNest(b.nest);
                    } });
            } });
    }
    function birdThink(b) {
        if (b.busy || b.status === 'toNest' || b.status === 'toBowl' || b.status === 'leaving') return;
        if (b.fill >= b.need) { serveBird(b); return; }
        if (b.status === 'nest' || b.status === 'bowl') {
            // 2+ birds on dock → only the leader (most eaten) may claim food.
            if (!mayStartEating(b)) {
                if (b.status === 'bowl') sendBirdToNest(b);
                return;
            }
            const p = nearestPellet(b.color, b.group.position);
            if (p) { flyToEat(b, p); return; } // fly straight in and start eating on arrival
            // no food of our colour right now
            if (b.status === 'bowl') sendBirdToNest(b);
        }
    }
    // Hop a bird across to the eating stance beside a heap in little jumps, then begin
    // pecking on arrival (no gliding — it bounces over to the food).
    function flyToEat(b, p) {
        b.status = 'toBowl'; b.busy = true;
        // Raise the standing height proportional to scale so the bird's feet still sit ON the
        // plate at any size. 0.72 is the baseline scale the constant 0.1 was tuned for.
        const hoverY = BOWL.y + 0.1 + Math.max(0, b.group.scale.x - 0.72) * 0.5;
        const px = p.mesh.position.x, pz = p.mesh.position.z;
        const slotIndex = p.slotIndex;
        // Reserve the heap right now so other birds' `nearestPellet` skips it
        // while we hop over. Without this, several birds' birdThink ticks pick
        // the same nearest heap in the same frame and pile up on one target.
        eatingSlots.add(slotIndex);
        b.reservedSlot = slotIndex;
        // stand a little back from the heap, on the side the bird is approaching from
        let nx = b.group.position.x - px, nz = b.group.position.z - pz;
        const nd = Math.hypot(nx, nz);
        if (nd < 1e-3) { nx = 0; nz = 1; } else { nx /= nd; nz /= nd; }
        const STAND = 0.55;
        const tx = px + nx * STAND, tz = pz + nz * STAND;
        tween(b.group.rotation, { x: 0 }, 0.25, { ease: easeInOut }); // level out; yaw follows travel dir
        // break the trip into a handful of little hops (parabolic jumps + a landing squash)
        const sx = b.group.position.x, sz = b.group.position.z;
        const dist = Math.hypot(tx - sx, tz - sz);
        const hops = Math.max(1, Math.round(dist / 0.42));
        let i = 0;
        const doHop = () => {
            i++;
            const f = i / hops;
            const x1 = sx + (tx - sx) * f, z1 = sz + (tz - sz) * f;
            const y0 = b.group.position.y;      // ease vertical from wherever the bird is now
            const arc = 0.26;                    // hop height
            tween(b.group.position, { x: x1, z: z1 }, 0.17, {
                ease: easeInOut,
                onUpdate: (e) => { b.group.position.y = y0 + (hoverY - y0) * e + Math.sin(Math.PI * e) * arc; },
                onDone: () => {
                    const s = b.group.scale.x;       // squash on landing, spring back
                    killTweens(b.group.scale);
                    b.group.scale.set(s * 1.12, s * 0.84, s * 1.12);
                    tween(b.group.scale, { x: s, y: s, z: s }, 0.13, { ease: easeOutBack });
                    if (i >= hops) {
                        b.group.position.y = hoverY;
                        // Snap yaw to face the heap. The per-frame "turn toward heading" only eases the
                        // bird around while it travels, and on short trips (1–2 hops) it can stop before
                        // the turn finishes — leaving it pecking with its back to the food. Force it here.
                        b.group.rotation.y = Math.atan2(px - b.group.position.x, pz - b.group.position.z);
                        b.status = 'bowl'; startEating(b, slotIndex, hoverY);
                    }
                    else doHop();
                },
            });
        };
        doHop();
    }
    // Nearest edible, settled pellet heap of `color` to `pos` — birds home in on it.
    // Heaps already being nibbled by another bird are skipped.
    function nearestPellet(color, pos) {
        let best = null, bd = Infinity;
        for (const p of pellets) {
            if (p.color !== color || !p.edible || !p.landed) continue;
            if (eatingSlots.has(p.slotIndex)) continue;
            const dx = p.mesh.position.x - pos.x, dz = p.mesh.position.z - pos.z, d = dx * dx + dz * dz;
            if (d < bd) { bd = d; best = p; }
        }
        return best;
    }
    // Begin nibbling a heap: the bird pecks grains (two at a time) and the whole heap
    // is cleared over EAT_TIME seconds (see the eating loop in update()).
    const EAT_TIME = 1.5; // fixed value
    function startEating(b, slotIndex, hoverY) {
        // Slot was reserved during flyToEat, so no other bird can be eating it.
        // If the heap disappeared (e.g. a grain purge on level reset), release
        // the reservation and let the bird go idle so birdThink can re-plan.
        const grains = pellets.filter(pp => pp.slotIndex === slotIndex);
        if (!grains.length) {
            if (b.reservedSlot === slotIndex) { eatingSlots.delete(slotIndex); b.reservedSlot = null; }
            b.busy = false; b.baseY = hoverY; return;
        }
        b.reservedSlot = null; // reservation now becomes an active eat claim
        let hy = -Infinity;
        for (const g of grains) if (g.mesh.position.y > hy) hy = g.mesh.position.y;
        // peckY: pivot stays above the grain surface so the body never clips the food pile.
        // The beak reaches the food via rotation.x (see eating loop). Scale above the 0.72
        // baseline lifts the pivot further so a larger body keeps its belly out of the grains.
        const _eatScale = b.group.scale.x;
        b.eat = { slotIndex, grains, total: grains.length, removed: 0, t: 0, hoverY,
            peckY: hy + 0.08 + Math.max(0, _eatScale - 0.72) * 0.45 };
    }

    function serveBird(b) {
        if (b.status === 'leaving') return;
        b.status = 'leaving'; b.busy = true;
        fedBirds++;
        run.score += 100;
        sfx.serve(); haptic(28); postToParent({ type: 'flock-feast:sfx', name: 'bird_fly_away' });
        removeBirdBar(b);
        if (b.nest) b.nest.taken = false;
        if (b.feed) { b.feed.taken = false; b.feed = null; }
        killTweens(b.group.position);
        const g = b.group;
        tween(g.position, { y: g.position.y + 0.4 }, 0.16, { ease: easeOutBack, onDone: () => {
                // happy bird flies off toward the CENTRE of the camera's screen, sweeping toward the
                // viewer. Camera looks at (0, cam.y, 0) down -z, so heading to x=0/y=cam.y keeps the
                // bird on screen centre while moving z toward the camera flies it out toward the player.
                const cam = camera.position;
                tween(g.position, { x: 0, y: cam.y, z: cam.z - 1.5 }, 0.75, { ease: easeInQuad, onUpdate: centerArc(g.position, 0.4, 0.3) });
                tween(g.rotation, { z: (Math.random() - 0.5) * 0.8 }, 0.75);
                tween(g.scale, { x: 1.4, y: 1.4, z: 1.4 }, 0.75, { ease: easeInQuad, onDone: () => { scene.remove(g); const i = birds.indexOf(b); if (i >= 0) birds.splice(i, 1); } });
            } });
        refreshHud();
        checkComplete();
    }

    function checkComplete() {
        if (levelDone) return;
        if (processed >= totalItems && fedBirds >= totalBirds) {
            levelDone = true;
            setTimeout(levelComplete, 700);
        }
    }

    // Can the player still make ANY progress toward feeding the flock? Returns false only in a
    // fully SETTLED, unrecoverable state — e.g. the bowl is full (so nothing can be ground) and
    // no waiting bird can eat any crumb in it, nor can a matching bird be hatched to eat it
    // (nests full / no matching egg left). update() debounces a `false` result before failing.
    function canStillProgress() {
        // a bird actively eating or flying to/from food is progress in motion
        if (eatingSlots.size > 0) return true;
        for (const b of birds) {
            if (b.eat) return true;
            if (b.busy || b.status === 'toBowl' || b.status === 'toNest' || b.status === 'leaving') return true;
        }
        const totalCrumbs = Object.values(crumbCount).reduce((a, b) => a + b, 0);
        const freeBowl = totalCrumbs < BOWL_CAPACITY;          // room to grind fresh crumbs
        const freeNest = NESTS.some(n => !n.taken);            // room to hatch a new bird
        // crackers still grindable (on the board, in flight, or wedged), by colour
        const crackerLeft = {};
        for (const it of pile) if (it.type === 'cracker') crackerLeft[it.color] = (crackerLeft[it.color] || 0) + 1;
        for (const f of fallers) if (f.type === 'cracker') crackerLeft[f.color] = (crackerLeft[f.color] || 0) + 1;
        if (grinderJammed && jammedCracker) crackerLeft[jammedCracker.color] = (crackerLeft[jammedCracker.color] || 0) + 1;
        // a hatched, still-hungry bird can eat crumbs that exist now, or that we can still grind for it
        for (const b of birds) {
            if (b.fill >= b.need) continue;
            if ((crumbCount[b.color] || 0) > 0) return true;
            if (freeBowl && (crackerLeft[b.color] || 0) > 0) return true;
        }
        // an un-hatched bird (egg left) can be brought into a free nest and then fed
        if (freeNest) {
            for (const c in needQueue) {
                if (!needQueue[c] || !needQueue[c].length) continue;
                if ((crumbCount[c] || 0) > 0) return true;
                if (freeBowl && (crackerLeft[c] || 0) > 0) return true;
            }
        }
        return false;
    }

    function levelFail() {
        if (gameState !== STATE.PLAY || levelDone) return;
        levelDone = true;
        gameState = STATE.GAMEOVER;
        setHud(false);
        sfx.jam(); haptic(40);
        // In embedded mode the shell owns the result UI; report and let it handle retry.
        if (embedded) { postToParent({ type: 'flock-feast:failed' }); return; }
        setTimeout(() => {
            buildPanel({
                titleTop: 'BOWL', titleBig: 'JAMMED!',
                msg: 'The bowl is full and no bird can eat what&rsquo;s in it, so nothing more can be ground. Give it another go!',
                score: 'SCORE  ' + run.score,
                buttons: [
                    { label: 'RETRY', action: () => { hidePanel(); beginLevel(levelIdx); } },
                    { label: 'HOME', sec: true, action: () => { hidePanel(); showMenu(); } },
                ],
            });
            lockResultOverlay();   // final fail popup is up — guard it against a back-gesture dismissal
        }, 500);
    }

    function levelComplete() {
        if (gameState === STATE.LEVEL_COMPLETE || gameState === STATE.WIN) return;
        persistBest();
        unlockNext();
        const last = levelIdx >= ACTIVE_LEVELS.length - 1;
        if (last) return win();
        gameState = STATE.LEVEL_COMPLETE;
        setHud(false);
        sfx.level(); haptic(HAP.levelClear);   // celebratory buzz on level complete
        spawnConfetti();
        // In embedded mode the shell owns the result UI; report and let it advance level.
        if (embedded) { postToParent({ type: 'flock-feast:complete' }); return; }
        // let the confetti finish before the clear panel appears
        setTimeout(() => {
            buildPanel({
                titleTop: 'LEVEL ' + cfg.id, titleBig: 'CLEAR!', stars: 3,
                msg: 'The flock is fed!', score: 'SCORE  ' + run.score,
                buttons: [
                    { label: 'NEXT', action: () => { hidePanel(); beginLevel(levelIdx + 1); } },
                    { label: 'HOME', sec: true, action: () => { hidePanel(); showMenu(); } },
                ],
            });
