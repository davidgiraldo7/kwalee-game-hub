<!DOCTYPE html>
<!--
  FLOCK FEAST — single-file H5 game (Three.js, no build step).
  A toylike, soft-rounded 3D remake of the physics feeding puzzle:
   • A little machine holds glossy 3D EGGS and CRACKERS.
   • TAP an egg or cracker -> it drops down into the stone grinder.
   • CRACKER -> ground into CRUMBS of its color that spill into the bowl.
   • EGG -> hatches a rounded toy BIRD of that color that lands on a nest.
   • Birds fly down and EAT crumbs MATCHING their color, fill up, fly away happy.
   • Grind every cracker + feed the whole flock -> the bar fills -> next level.
  Relaxing: no lives, no fail. All art is procedural (soft rounded meshes).
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Flock Feast</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <!-- H5-CHASSIS-BEGIN — mobile chassis. Required block; lint enforces the markers + identifiers. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="../hub-reward.js?v=vis4"></script>
    <script>
        // Chassis identifiers required by lint: GAME_SLUG, DPR_CAP, REDUCED, STATE, buzz, toggleFullscreen, unlockAudio.
        const GAME_SLUG = 'flock-feast';
        const DPR_CAP = Math.min(window.devicePixelRatio || 1, 2);
        const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const STATE = Object.freeze({ BOOT:'boot', LOADING:'loading', MENU:'menu', FTUE:'ftue', PLAY:'play', PAUSE:'pause', GAMEOVER:'gameover', LEVEL_COMPLETE:'level_complete', WIN:'win' });
        const FS_SUPPORTED = !!document.documentElement.requestFullscreen;
        function buzz(ms = 12) { if (!REDUCED && navigator.vibrate) navigator.vibrate(ms); }
        function toggleFullscreen() {
            if (!FS_SUPPORTED) return;
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen().catch(() => {});
        }
        const AUDIO_CTX = new (window.AudioContext || window.webkitAudioContext)();
        function unlockAudio() { if (AUDIO_CTX.state === 'suspended') AUDIO_CTX.resume(); }
        addEventListener('pointerdown', unlockAudio, { once: true });
    </script>
    <!-- H5-CHASSIS-END -->
    <style>
        :root {
            /* Safe-area insets. env() is unreliable inside an iframe (iOS WebKit and the
               Android WebView both report 0 in a subframe), so the parent shell measures
               the real insets and overrides these four vars via 'flock-feast:safe-area'.
               The env() values remain the fallback for standalone / unframed play. */
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --safe-bottom: var(--sab);
            --ink: #fff3e0; --dim: #cbbcef; --accent: #ffd24d; --accentSoft: #d7b8ff;
            --panel-a: #3f2650; --panel-b: #312046; --cta1: #ffe08a; --cta2: #ffc23d; --cta-sh: #c9902a;
            --sec-a: #947dd8; --sec-b: #7966b1; --sec-sh: #584b81;
            --btn-cta-w: 220px; --btn-cta-radius: 999px;
            --btn-sec-w: 200px; --btn-sec-radius: 999px;
            --bar: #7bd66b; --frame: #ac93cc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; background: #241d47;
            overscroll-behavior: none; touch-action: none;
            -webkit-user-select: none; user-select: none;
            font-family: 'Nunito', system-ui, -apple-system, sans-serif; color: var(--ink);
        }
        canvas { display: block; width: 100%; height: 100%; }
        /* 2D confetti overlay — sits above the WebGL canvas, never eats taps */
        #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
        #ui { position: fixed; inset: 0; pointer-events: none;
            padding: var(--sat) var(--sar) var(--sab) var(--sal); }

        #topPanel { display: none; }

        /* top HUD */
        #hud { position: absolute; top: max(-12px, calc(var(--sat) - 6px)); left: 0; right: 0;
            display: flex; align-items: flex-start; justify-content: center; gap: 12px; padding: 2px 16px 0;
            opacity: 0; transform: translateY(-12px); transition: opacity .3s, transform .3s; z-index: 2; }
        #hud.show { opacity: 1; transform: none; }
        .barcol { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; }
        .lvl { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
            font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 13px; letter-spacing: .08em;
            color: #fff3e0; text-shadow: 0 1px 1px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.7); white-space: nowrap;
            padding: 0; background: none; box-shadow: none; pointer-events: none; }
        .barwrap { width: 240px; max-width: calc(100vw - 132px); position: relative; height: 28px; border-radius: 14px; padding: 4px;
            overflow: hidden; border: none; transform-origin: center;
            background: linear-gradient(180deg, #b06a4a, #763e29);
            box-shadow: 0 3px 0 #5c2e1e, 0 6px 12px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.22); }
        .barwrap::before { content: ''; position: absolute; inset: 4px; border-radius: 10px;
            background: linear-gradient(180deg, #2a140f, #3a1c14); box-shadow: inset 0 2px 5px rgba(0,0,0,.6); }
        .barfill { position: relative; z-index: 1; height: 100%; width: 0%; border-radius: 8px;
            background: linear-gradient(180deg, #ffe6b8, #f3a24c);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.5); transition: width .35s ease; }
        .best { display: none; position: absolute; top: 6px; right: 16px; font-family: 'Baloo 2', cursive; font-weight: 800;
            font-size: 15px; color: var(--dim); white-space: nowrap; text-shadow: 0 2px 0 #2b2350; }

        /* corner buttons */
        .icon-btn { position: absolute; pointer-events: auto; width: 40px; height: 40px; border: none;
            border-radius: 15px; background: linear-gradient(180deg, #b06a4a, #763e29);
            display: grid; place-items: center; cursor: pointer;
            box-shadow: 0 4px 0 #5c2e1e, 0 8px 16px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.28);
            transition: transform .1s, box-shadow .1s; z-index: 3; }
        .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #5c2e1e, 0 4px 10px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.28); }
        .icon-btn svg { width: 21px; height: 21px; fill: #ffe6b8; }
        #gearBtn { display: none !important; }

        /* booster strip — lives in the reserved bottom area (see BOOSTER_RESERVE_* / fitCamera) */
        #boosterBar { position: absolute; left: 0; right: 0; bottom: max(14px, calc(var(--sab) + 12px));
            display: flex; justify-content: center; align-items: center; gap: 14px; z-index: 3;
            opacity: 0; transform: translateY(12px); transition: opacity .3s, transform .3s; pointer-events: none; }
        #boosterBar.show { opacity: 1; transform: none; }
        /* Warm amber/honey coin — matches the game's earthy wooden machine palette. */
        .booster-coin { pointer-events: auto; position: relative; width: 64px; height: 64px; padding: 0; border: none;
            cursor: pointer; border-radius: 50%; display: grid; place-items: center;
            background: radial-gradient(circle at 50% 32%, #ffe9a0 0%, #f5c842 34%, #d49a20 68%, #a06c10 100%);
            box-shadow: 0 0 0 4px #b87818, 0 0 0 7px #7a4e0c, 0 6px 12px rgba(0,0,0,.42),
                inset 0 3px 6px rgba(255,255,255,.55), inset 0 -7px 11px rgba(60,30,0,.4);
            transition: transform .1s, filter .15s, opacity .2s; }
        .booster-coin::before { content: ''; position: absolute; left: 12%; top: 8%; width: 62%; height: 40%;
            border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0));
            pointer-events: none; }
        .booster-coin:active { transform: translateY(2px) scale(.96); }
        .booster-coin .coin-glyph { width: 42px; height: 42px; display: block; transform: rotate(-38deg);
            filter: drop-shadow(0 1px 1px rgba(30,10,0,.55)); }
        .booster-coin .arr-g { fill: #5ecb45; stroke: #2f7a25; stroke-width: .55; stroke-linejoin: round; }
        .booster-coin .arr-r { fill: #ec5348; stroke: #9e2a22; stroke-width: .55; stroke-linejoin: round; }
        .booster-coin .coin-badge { position: absolute; right: -5px; bottom: -4px; min-width: 22px; height: 22px;
            padding: 0 5px; display: flex; align-items: center; justify-content: center; border-radius: 11px;
            background: linear-gradient(180deg, #a06a4a, #6e3e28); color: #fff3e0; font-family: 'Baloo 2', cursive;
            font-weight: 800; font-size: 13px; line-height: 1; border: 2px solid #fff3e0;
            box-shadow: 0 2px 4px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35); }
        .booster-coin.busy { opacity: .6; pointer-events: none; }
        /* spent = no charges left this level; stays tappable so it can explain itself */
        .booster-coin.spent { filter: grayscale(1); opacity: .55; }
        @keyframes coinSpin { from { transform: rotate(-38deg); } to { transform: rotate(322deg); } }
        .booster-coin.spin .coin-glyph { animation: coinSpin .6s ease; }

        /* bowl fill counter chip — moved onto the in-scene wooden tablet, so hidden here */
        #counter { display: none; }

        /* per-bird fill progress bars (world-anchored via JS) */
        #birdbars { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
        .birdbar { position: absolute; width: 38px; height: 7px; border-radius: 4px;
            background: rgba(20,15,44,.72); border: 1.5px solid rgba(255,255,255,.5);
            transform: translate(-50%, -50%); box-shadow: 0 2px 6px rgba(0,0,0,.35);
            transition: opacity .2s; overflow: hidden; }
        .birdbar .bf { height: 100%; width: 0%; border-radius: 3px; transition: width .25s ease; }

        /* FTUE hint */
        #ftue { position: absolute; left: 50%; top: 34%; transform: translateX(-50%);
            width: min(360px, calc(100vw - 40px)); text-align: center; font-weight: 900; font-size: 22px;
            color: var(--ink); text-shadow: 0 2px 8px rgba(0,0,0,.6); pointer-events: none;
            opacity: 0; transition: opacity .3s; }
        #ftue.show { opacity: 1; }

        /* tutorial toast (one-line contextual tip) — sits just below the progress bar */
        .toast { position: absolute; left: 50%;
            top: calc(max(22px, var(--sat) + 12px) + 46px);
            transform: translateX(-50%) translateY(-8px);
            width: min(340px, calc(100vw - 40px)); text-align: center; font-weight: 900; font-size: 16.5px;
            color: var(--ink); background: rgba(36,22,64,.9); border: 2px solid var(--frame);
            padding: 12px 18px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
            opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 28; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        /* coach marks: highlight ring + pointing hand + text card */
        #coach { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
        #coachRing { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%;
            border: 4px solid var(--accent); box-shadow: 0 0 0 4px rgba(0,0,0,.25), 0 0 22px var(--accent);
            opacity: 0; transition: opacity .2s; }
        #coachRing.on { opacity: 1; animation: coachPulse 1.2s ease-in-out infinite; }
        @keyframes coachPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
        #coachHand { position: absolute; width: 88px; height: 88px; margin: 10px 0 0 4px; opacity: 0;
            transform-origin: 72% 72%; }
        #coachHand.on { opacity: 1; animation: coachTap 1.05s ease-in-out infinite; }
        #coachHand img { width: 100%; height: 100%; display: block; mix-blend-mode: multiply; }
        @keyframes coachTap {
            0%,100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-12px,-12px) scale(.9); }
        }
        #coachCard { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%);
            width: min(360px, calc(100vw - 36px)); text-align: center; pointer-events: none;
            background: #312046; border: 4px solid #ac93cc;
            border-radius: 20px; padding: 16px 18px 14px; box-shadow: 0 16px 44px rgba(0,0,0,.5);
            opacity: 0; transition: opacity .25s, top .3s ease, bottom .3s ease; }
        #coachCard.top { top: calc(max(22px, var(--sat) + 12px) + 100px); bottom: auto; }
        #coachCard.center { top: 50%; bottom: auto; transform: translate(-50%, -50%); }
        #coach.show #coachCard { opacity: 1; }
        #coachText { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; line-height: 1.35; color: var(--ink); }
        #coachText b { color: var(--accent); }
        /* Hint strings come from the parent's translations.js — JS rewrites these two
           custom properties whenever the language changes. */
        #coachCard::after { content: var(--coach-continue, 'tap to continue'); display: block; margin-top: 8px; font-size: 12px;
            font-weight: 900; letter-spacing: .08em; color: var(--dim); opacity: .8; }
        #coachCard.act::after { content: var(--coach-act, 'your turn — tap the glowing item'); color: var(--accent); opacity: 1; }

        /* overlay + panel */
        #overlay { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; padding: 24px;
            background: rgba(20,15,44,.5); pointer-events: none; opacity: 0; transition: opacity .28s; }
        #overlay.show { opacity: 1; pointer-events: auto; }
        /* When the overlay is hidden its buttons/chips still set pointer-events:auto, which would
           re-enable them over the (invisible) panel and let a centered PLAY/NEXT button steal clicks
           aimed at the gears — restarting the level. Disable their pointer events while hidden.
           .lvlbtn (level-select grid) MUST be included too: those buttons sit over the play area,
           so leaving them live let taps on the board silently jump to another level. */
        #overlay:not(.show) .btn, #overlay:not(.show) .chip, #overlay:not(.show) .lvlbtn { pointer-events: none; }
        /* Android hardware-back softlock safeguard for the standalone (non-embedded) result
           popups (level clear / jammed-fail / win). Some OEM back-gesture handlers dismiss the
           overlay from outside our code while it is the only path back to Retry/Next/Home.
           This element doesn't toggle `display` (it's always laid out, faded via opacity — see
           #overlay above), so the lock forces opacity + pointer-events instead of `display`.
           CSS-only, no JS watches the DOM for this — see lockResultOverlay()/unlockResultOverlay().
           Do NOT reintroduce a MutationObserver/polling/rAF watcher here; that previously caused
           recursive DOM mutations and softlocked the editor/game. */
        #overlay.result-locked { opacity: 1 !important; pointer-events: auto !important; }
        #overlay.result-locked .btn, #overlay.result-locked .chip, #overlay.result-locked .lvlbtn { pointer-events: auto !important; }
        #panel { container-type: inline-size; width: min(430px, calc(100vw - 32px)); padding: 30px 26px 26px; border-radius: 30px;
            text-align: center; background: linear-gradient(180deg, var(--panel-a), var(--panel-b));
            border: 5px solid var(--frame);
            box-shadow: 0 26px 70px rgba(0,0,0,.5), inset 0 2px rgba(255,255,255,.22);
            transform: translateY(14px) scale(.92); opacity: 0;
            transition: opacity .28s, transform .34s cubic-bezier(.2,1.3,.3,1); }
        #overlay.show #panel { transform: none; opacity: 1; }
        /* #panel's own visibility is gated by the #overlay.show ancestor rule above, and a
           parent's opacity can't be escaped by a child's opacity — so the lock needs its own
           #panel override too, or the card would stay invisible even with #overlay forced open. */
        #overlay.result-locked #panel { transform: none !important; opacity: 1 !important; }
        #panel .title { font-family: 'Baloo 2', cursive; font-weight: 800; line-height: 1.1;
            text-shadow: 0 3px 0 #241640; overflow-wrap: break-word; word-break: break-word;
            max-width: 100%; }
        /* 7.5cqi scales font relative to the panel width; clamp prevents it going too small or too large */
        #panel .t-big { font-size: clamp(16px, 7.5cqi, 36px); color: var(--ink); }
        #panel .t-accent { color: var(--accent); }
        #panel .msg { margin: 14px auto 6px; max-width: 330px; font-size: 18px; font-weight: 800;
            color: var(--dim); line-height: 1.4; }
        #panel .score { margin-top: 12px; font-family: 'Baloo 2', cursive; font-weight: 800;
            font-size: 30px; color: var(--accent); text-shadow: 0 2px 0 #241640; }
        .stars { display: flex; justify-content: center; gap: 10px; margin: 16px 0 4px; }
        .stars svg { width: 44px; height: 44px; }
        .btns { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 20px; }
        .btn { pointer-events: auto; appearance: none; border: none; cursor: pointer;
            font-family: 'Baloo 2', cursive; font-weight: 800; color: #5b3c0e;
            border-radius: var(--btn-cta-radius); padding: 15px 30px; min-width: var(--btn-cta-w); font-size: 26px;
            background: linear-gradient(180deg, var(--cta1), var(--cta2));
            box-shadow: 0 8px 0 var(--cta-sh), 0 16px 26px rgba(0,0,0,.3), inset 0 2px rgba(255,255,255,.6);
            transition: transform .1s, box-shadow .1s; }
        .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--cta-sh), 0 8px 16px rgba(0,0,0,.3), inset 0 2px rgba(255,255,255,.5); }
        .btn.sec { min-width: var(--btn-sec-w); border-radius: var(--btn-sec-radius); font-size: 20px; padding: 12px 24px; color: var(--ink);
            background: linear-gradient(180deg, var(--sec-a), var(--sec-b)); box-shadow: 0 7px 0 var(--sec-sh), 0 14px 22px rgba(0,0,0,.3), inset 0 2px rgba(255,255,255,.3); }
        .btn.sec:active { box-shadow: 0 3px 0 var(--sec-sh), 0 8px 14px rgba(0,0,0,.3), inset 0 2px rgba(255,255,255,.25); }
        /* level select grid */
        .lvlgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 18px 0 6px;
            max-height: 44vh; overflow-y: auto; padding: 6px 4px; -webkit-overflow-scrolling: touch; }
        .lvlbtn { pointer-events: auto; cursor: pointer; border: 3px solid #c9902a; border-radius: 16px;
            aspect-ratio: 1; display: grid; place-items: center; font-family: 'Baloo 2', cursive;
            font-weight: 800; font-size: 22px; color: #5b3c0e;
            background: linear-gradient(180deg, var(--cta1), var(--cta2));
            box-shadow: 0 4px 0 #c9902a, inset 0 2px rgba(255,255,255,.5); transition: transform .1s, box-shadow .1s; }
        .lvlbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9902a, inset 0 2px rgba(255,255,255,.4); }
        .lvlbtn.cleared { color: #12421c; border-color: #3da85a;
            background: linear-gradient(180deg, #7dd97f, #4fb85c); box-shadow: 0 4px 0 #3da85a, inset 0 2px rgba(255,255,255,.4); }
        .lvlbtn.locked { pointer-events: none; cursor: default; color: #b7a9cf;
            background: #6a577f; border-color: #4a3d66; box-shadow: none; }
        .lvlbtn.locked svg { width: 22px; height: 22px; }
        /* Level Lab — generator tiles + editor controls */
        .btn[disabled] { opacity: .45; pointer-events: none; filter: grayscale(.3); }
        .llgrid { grid-template-columns: repeat(5, 1fr); }
        .lltile { display: flex; flex-direction: column; justify-content: center; gap: 1px; position: relative; line-height: 1; }
        .lltile .llnum { font-size: 20px; font-weight: 800; }
        .lltile .llmeta { font-size: 10px; font-weight: 800; opacity: .82; }
        .lltile .llband { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
        .llband.band-plain { display: none; }
        .llband.band-mystery { background: #8a8a8a; }
        .llband.band-lock { background: #f6b23a; }
        .lltile.b-E { color: #12421c; border-color: #3da85a; background: linear-gradient(180deg, #7dd97f, #4fb85c); box-shadow: 0 4px 0 #3da85a, inset 0 2px rgba(255,255,255,.4); }
        .lltile.b-M { color: #5b3c0e; border-color: #c9902a; background: linear-gradient(180deg, #ffd36a, #f3b23c); box-shadow: 0 4px 0 #c9902a, inset 0 2px rgba(255,255,255,.5); }
        .lltile.b-H { color: #5a0f0b; border-color: #c23b32; background: linear-gradient(180deg, #ff9090, #e6544a); box-shadow: 0 4px 0 #c23b32, inset 0 2px rgba(255,255,255,.4); }
        .lllegend { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0 2px;
            font-size: 13px; font-weight: 800; color: var(--dim); }
        .lllegend .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-left: 8px; }
        .lllegend .dot.b-E { background: #4fb85c; } .lllegend .dot.b-M { background: #f3b23c; } .lllegend .dot.b-H { background: #e6544a; }
        .llrow { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 12px 0; }
        .llsel { justify-content: space-between; width: min(300px, 80%); margin: 14px auto; }
        .llselbody { text-align: center; }
        .lllvl { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 26px; color: var(--ink); line-height: 1; }
        .llband-txt { font-size: 13px; font-weight: 900; letter-spacing: .03em; margin-top: 2px; }
        .llband-txt.band-plain { color: #9fe0a5; } .llband-txt.band-mystery { color: #cfcfcf; } .llband-txt.band-lock { color: #ffd36a; }
        .lllabel { font-size: 13px; font-weight: 900; letter-spacing: .08em; color: var(--dim); }
        .llcolors { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 8px 0 4px; }
        .llsw { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; background: var(--sw);
            border: 3px solid rgba(255,255,255,.3); opacity: .3; transition: transform .1s, opacity .15s, border-color .15s;
            box-shadow: inset 0 2px rgba(255,255,255,.4); }
        .llsw.on { opacity: 1; border-color: #fff; transform: scale(1.08); box-shadow: 0 3px 8px rgba(0,0,0,.35), inset 0 2px rgba(255,255,255,.5); }
        .llsw:active { transform: scale(.92); }
        .llstepper { display: flex; align-items: center; gap: 12px; }
        .llstep { appearance: none; width: 44px; height: 44px; border-radius: 14px; border: none; cursor: pointer;

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ========================================================================
    // SAVE + SETTINGS
    // ========================================================================
    const SAVE_KEY = `h5_${GAME_SLUG}_v1`;
    const DEFAULTS = { best: 0, level: 1, unlocked: 30, ftueSeen: false, ftueCoreSeen: false, ftueMysterySeen: false, ftueLockSeen: false, ftueBowlSeen: false, ftueNestSeen: false, sfxOn: true, musicOn: false, hapticsOn: true };
    let save = (() => { try { return { ...DEFAULTS, ...(JSON.parse(localStorage.getItem(SAVE_KEY)) || {}) }; } catch { return { ...DEFAULTS }; } })();
    function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} }
    const haptic = (ms) => { if (save.hapticsOn) buzz(ms); };
    // Named haptic patterns so feedback stays consistent. Numbers = a single pulse (ms);
    // arrays = vibrate() patterns [on, off, on, …]. POSITIVE = crisp; NEGATIVE = buzz-gap-buzz.
    const HAP = {
        ui: 10,                              // any UI button / toggle press
        tapItem: 12,                         // tap an egg/cracker → it drops (positive)
        grindPass: 16,                       // a cracker passes through the grinder (positive)
        negative: [16, 40, 16],              // can't-do-that (egg can't drop, tap a bird, locked/wood)
        levelClear: [30, 45, 60, 45, 90],    // level complete celebration
        win: [45, 55, 75, 55, 130],          // full-game win finale
    };

    // 3D asset pipeline: the bird is a real glTF mesh (optimized for mobile —
    // 12.4k tris, 1024 baseColor / 512 normal+roughness textures, ~0.85 MB).
    const loader = new GLTFLoader();
    // bird.glb inlined as a base64 data URI so the game is a single self-contained file.
    const MODEL_DIRECTORY = { bird: 'feed_assets/bird.glb' };
    // Loaded, normalized bird prototype (facing +Z, ~1 unit tall, origin-centered).
    // buildBird() clones this per hatch; falls back to procedural art until it loads.
    let birdProto = null;
    // Nest model — replaces the procedural twig-ring nest once loaded. The torus nests
    // are built immediately as a fallback and swapped for a model clone when it arrives.
    let nestProto = null;
    const nestGroups = [];
    loader.load(MODEL_DIRECTORY.bird, (gltf) => {
        const proto = gltf.scene;
        // normalize: center on origin and scale so its height ≈ 1.15 world units
        const box = new THREE.Box3().setFromObject(proto);
        const size = new THREE.Vector3(); box.getSize(size);
        const center = new THREE.Vector3(); box.getCenter(center);
        const s = 1.15 / (size.y || 1);
        proto.scale.setScalar(s);
        proto.position.set(-center.x * s, -box.min.y * s, -center.z * s); // rest on y=0
        proto.traverse((o) => {
            if (o.isMesh) {
                o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
                if (!birdBaseImage && o.material && o.material.map && o.material.map.image) birdBaseImage = o.material.map.image;
            }
        });
        birdProto = proto;
        // Precompute each flock's recolored body texture + average body color up front, so
        // pellets/crackers/eggs already read as their bird's color the instant they appear.
        for (const k of FOOD_KEYS) birdTintedMap(k);
        // Push those body colours onto any pellet/cracker/egg materials already cached, so a
        // level that started before the model arrived doesn't keep serving palette-coloured food.
        warmupFlockColors();
    }, undefined, () => { birdProto = null; }); // fall back to procedural on load failure

    // Nest model (inlined as a base64 data URI, like the bird). Normalized: centered on
    // origin and scaled so its footprint matches the twig nest. Swapped into each nest group
    // on load; the torus nests stay as a fallback if it can't be decoded. `nestReady` lets
    // boot wait for it so the machine builds the model directly (no torus flash).
    let nestResolve; const nestReady = new Promise((r) => (nestResolve = r));
    loader.load('feed_assets/nest.glb', (gltf) => {
        const proto = gltf.scene;
        const box = new THREE.Box3().setFromObject(proto);
        const size = new THREE.Vector3(); box.getSize(size);
        const center = new THREE.Vector3(); box.getCenter(center);
        const s = 1.15 / (Math.max(size.x, size.z) || 1);
        proto.scale.setScalar(s);
        proto.position.set(-center.x * s, -center.y * s, -center.z * s); // center on origin
        proto.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
        nestProto = proto;
        for (const g of nestGroups) {
            while (g.children.length) g.remove(g.children[0]);
            g.add(nestProto.clone(true));

        function solve(lv) {

            const totalCrackers = colors.reduce((n, c) => n + cfg.flock[c].crackers, 0);

                    if (!hatched && freedCredits > 0) {
                        for (const c of colors) {
                            if (lockedByColor[c] > 0 && (crackLeft[c] > 0 || bowl[c] > 0)) { lockedByColor[c]--; eggsLeft[c]--; freedCredits--; nestFree--; birds.push({ color: c, need: NEED }); hatched = true; break; }
                        }

                if (bowlTotal + PER <= CAP) {

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(DPR_CAP);
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    // Shadows fully disabled game-wide (per request): no cast shadows anywhere, so the grinder
    // area and everything else stay evenly lit. Per-mesh castShadow/receiveShadow flags become
    // no-ops while this is off. Flip back to true to restore dynamic shadows.
    renderer.shadowMap.enabled = false;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    // soft pastel gradient backdrop
    (function () {
        const c = document.createElement('canvas'); c.width = 4; c.height = 256;
        const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256);
        g.addColorStop(0, '#b39572'); g.addColorStop(0.55, '#8a6d49'); g.addColorStop(1, '#4a3924');
        x.fillStyle = g; x.fillRect(0, 0, 4, 256);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
        scene.background = tex;
    })();
    scene.fog = new THREE.Fog(0x3a2f1e, 18, 42);

    const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 200);

    const hemi = new THREE.HemisphereLight(0xf0eadd, 0x5a4a2e, 1.05);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff2d6, 1.7);
    key.position.set(5, 11, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1; key.shadow.camera.far = 40;
    key.shadow.camera.left = -8; key.shadow.camera.right = 8;
    key.shadow.camera.top = 9; key.shadow.camera.bottom = -6;
    key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xccc4b0, 0.6);
    fill.position.set(-7, 4, 5);
    scene.add(fill);
    // front fill aimed straight into the recessed cavity so pinned items read clearly
    const cavityLight = new THREE.DirectionalLight(0xfff4e0, 0.75);
    cavityLight.position.set(0, 2.2, 12);
    cavityLight.target.position.set(0, 2.2, 0);
    scene.add(cavityLight); scene.add(cavityLight.target);

    // ---- Camera framing ---------------------------------------------------
    // fitCamera() anchors the machine FROM THE BOTTOM on every aspect ratio:
    //   • the FEEDER (deck / nests / count tablet) sits a uniform margin above the
    //     bottom edge and fills the width — the natural portrait scale, never cropped;
    //   • the whole rigid CABINET rides with it, so the feeding area + cabinet are
    //     bottom-anchored together.
    // Any empty space this leaves at the TOP on tall screens is simply COVERED by the
    // oversized cabinet wall (extended well past the top of the frame by default), so
    // the gap is always filled — no seam, no background. On wide/short screens we dolly
    // back so the whole drop chamber stays in view AND its opening always sits fully
    // BELOW the top bar — the UI never overlaps the cabinet.
    // FRAME_PAD is the side/bottom margin the camera fit reserves around the widest world
    // points. Set to 0 so the feeder deck + trim lip touch the device edges edge-to-edge on
    // portrait phones (APK), and the wooden cabinet / chamber walls bleed continuously off
    // the sides. The HUD keeps clear via CSS env(safe-area-inset-*) padding on #ui, and the
    // rim-vs-HUD clearance below still uses the DOM HUD's actual bottom to dolly back on
    // wide/short screens so the chamber opening never hides behind the top bar.
    const FRAME_PAD = 0;
    // Bottom strip reserved for power-ups / boosters — the camera frames the machine ABOVE it.
    // Responsive: a fraction of viewport height, clamped to sane px, plus the safe-area inset.
    // Booster band = the coin box plus the two target gaps, kept FIXED so the spacing is
    // exact on every screen (the device safe-area inset is added on top separately).
    const COIN_BOX = 64;    // .booster-coin width/height (px)
    const GAP_BORDER = 5;   // lower border ↔ Shuffle coin
    const GAP_TOP = 3;      // Shuffle coin ↔ base/bowl platform
    const BOOSTER_RESERVE_FRAC = 0;
    const BOOSTER_RESERVE_MIN = COIN_BOX + GAP_BORDER + GAP_TOP;
    const BOOSTER_RESERVE_MAX = COIN_BOX + GAP_BORDER + GAP_TOP;
    // Key world points (each at its true depth). Horizontal fit keeps them all on-screen;
    // the lowest point is anchored to the bottom margin; the highest must stay visible.
    const FRAME_PTS = [
        [ 2.76, -0.70, 2.20], [-2.76, -0.70, 2.20],   // feeding deck / trim lip (widest)
        [ 1.98, -1.09, 3.50], [-1.98, -1.09, 3.50],   // front nests
        [ 0.00, -1.86, 4.39],                          // count tablet (lowest on screen)
        [ 2.65,  7.80, 0.50], [-2.65,  7.80, 0.50],   // drop-chamber opening top (must stay visible)
    ];
    // Topmost point of the cabinet's chamber opening (cream-lined rim) — kept clear of the
    // top bar so the UI never overlaps the machine.
    const CHAMBER_RIM = { y: 8.05, z: 0.50 };
    // Top of the chamber opening — the underside of the cream trim, where the dark lip begins.
    // Matches the FRAME_PTS "drop-chamber opening top" entries above.
    const CHAMBER_OPENING_Y = 7.80;
    // Seam between the cream trim and the dark lip: the level bar's bottom edge rests here so
    // the bar reads as part of the machine on every device instead of floating at the screen top.
    const HUD_SEAM_Y = (CHAMBER_RIM.y + CHAMBER_OPENING_Y) / 2;
    // The bar's own CSS metrics. Used to reserve camera clearance WITHOUT measuring the live
    // element — the bar is repositioned from the camera fit, so reading it back would feed the
    // fit its own output and walk the machine down the screen a little more on every resize.
    const HUD_NOMINAL_H = 30, HUD_TOP_GAP = 14;
    // Top edge of the visible gameplay area in screen px — recomputed by fitCamera() on every
    // resize / safe-area change. Taps above it are ignored (see pickItem / pickBird).
    let APERTURE_TOP_PX = 0;

    // Screen Y (CSS px) of a point on the cabinet's front plane, using the current camera.
    const _projV = new THREE.Vector3();
    function projectScreenY(worldY, worldZ) {
        _projV.set(0, worldY, worldZ).project(camera);
        return (1 - _projV.y) * 0.5 * innerHeight;
    }

    // Safe-area top inset in px. Reads the --sat custom property, which the parent shell
    // overrides with the real device inset (env() is unreliable inside an iframe).
    function safeAreaTopPx() {
        return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
    }

    // Apply device safe-area insets pushed down from the parent shell.
    function applySafeArea(i) {
        const px = (v) => Math.max(0, Number(v) || 0) + 'px';
        const s = document.documentElement.style;
        s.setProperty('--sat', px(i.top));
        s.setProperty('--sab', px(i.bottom));
        s.setProperty('--sal', px(i.left));
        s.setProperty('--sar', px(i.right));
    }

    function fitCamera() {
        const aspect = innerWidth / innerHeight;
        const t = Math.tan(camera.fov * Math.PI / 360);   // tan(fov / 2)
        const padPx = FRAME_PAD * Math.min(innerWidth, innerHeight);
        const gx = (1 - 2 * padPx / innerWidth)  * t * aspect;
        const gy = (1 - 2 * padPx / innerHeight) * t;
        // Reserve a responsive strip at the BOTTOM for power-ups / boosters, so the whole
        // machine frames above it. Scales with viewport height (clamped) + the safe-area
        // inset, keeping the layout consistent across screen sizes and aspect ratios.
        const safeBottom = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-bottom')) || 0;
        const bottomReservePx = Math.min(Math.max(innerHeight * BOOSTER_RESERVE_FRAC, BOOSTER_RESERVE_MIN), BOOSTER_RESERVE_MAX) + safeBottom;
        const gyBottom = (1 - 2 * bottomReservePx / innerHeight) * t;
        // Position the coin so it sits GAP_BORDER above the screen edge; the band height
        // (COIN_BOX + GAP_BORDER + GAP_TOP) then leaves exactly GAP_TOP up to the platform.
        if (ui && ui.boosterBar) {
            ui.boosterBar.style.bottom = (safeBottom + GAP_BORDER + 30) + 'px';
        }

        // Smallest distance that fits every point horizontally within the side margins.
        let dist = 0;
        for (const [x, , z] of FRAME_PTS) dist = Math.max(dist, z + Math.abs(x) / gx);

        // camY anchors the LOWEST projected point to the bottom margin.
        const camYAt   = (d) => { let m =  Infinity; for (const [, y, z] of FRAME_PTS) m = Math.min(m, y + gyBottom * (d - z)); return m; };
        // camY the TOP points still allow before clipping past the top edge.
        const topReqAt = (d) => { let m = -Infinity; for (const [, y, z] of FRAME_PTS) m = Math.max(m, y - gy * (d - z)); return m; };

        // The chamber-rim must project BELOW the top bar (its bottom edge) plus a gap, so the
        // UI never sits over the cabinet. Convert that screen line to an NDC-Y target.
        // The reserve comes from the bar's nominal CSS metrics, not its measured rect: the bar
        // is re-parked onto the trim at the end of this function, so measuring it would feed
        // this fit its own previous output.
        let clearPx = Math.max(padPx, safeAreaTopPx() + HUD_TOP_GAP + HUD_NOMINAL_H + padPx);
        // Corner gear button (#gearBtn) extends slightly below #hud — include it so the
        // camera dollies back far enough that the gear is fully above the chamber opening.
        // Use CSS formula rather than getBoundingClientRect (element may be hidden initially).
        {
            const safeT = safeAreaTopPx();
            const gearBottom = Math.max(12, safeT + 2) + 40;   // top: max(12px, safeT+2px) + height 40px
            clearPx = Math.max(clearPx, gearBottom + padPx);
        }
        const rimTarget = 1 - 2 * clearPx / innerHeight;   // max allowed ndcY for the chamber rim
        const rimNdcAt = (d) => (CHAMBER_RIM.y - camYAt(d)) / ((d - CHAMBER_RIM.z) * t);

        // Dolly back (bottom stays anchored) until BOTH: the whole machine is visible, and the
        // chamber opening clears the top bar.
        let guard = 0;
        while ((camYAt(dist) < topReqAt(dist) - 1e-4 || rimNdcAt(dist) > rimTarget + 1e-4) && guard++ < 600) dist *= 1.012;

        const camY = camYAt(dist);
        camera.position.set(0, camY, dist);
        camera.lookAt(0, camY, 0);
        camera.aspect = aspect;
        camera.updateProjectionMatrix();

        // Park the level bar's bottom edge on the seam between the cream trim and the dark lip,
        // so it reads as part of the cabinet rather than floating at the screen top. Anchoring
        // it to the machine means it lands correctly whatever the device reports for its notch.
        let hudBottomPx = clearPx;
        let hudTopPx = null;
        if (ui && ui.hud) {
            const h = ui.hud.getBoundingClientRect().height || HUD_NOMINAL_H;
            hudBottomPx = projectScreenY(HUD_SEAM_Y, CHAMBER_RIM.z);
            hudTopPx = Math.round(hudBottomPx - h - 30);
            ui.hud.style.top = hudTopPx + 'px';
        }

        // Screen line where the cabinet's chamber opening actually begins — the underside of
        // the dark lip. Everything above it is covered by the cabinet face / bar / notch, so
        // taps there must not reach the queued pile rows parked off the top of the frame, nor
        // the covered upper half of an item straddling the lip (see pickItem/pickBird).
        APERTURE_TOP_PX = Math.max(clearPx, hudBottomPx,
            projectScreenY(CHAMBER_OPENING_Y, CHAMBER_RIM.z));

        // Tell the parent shell where the HUD panel's bottom edge is in screen pixels
        // so it can anchor its own overlay elements (settings button, etc.) inside the panel.
        if (window.parent !== window) {
            window.parent.postMessage({ type: 'flock-feast:hud-bottom', px: clearPx, hudTop: hudTopPx }, '*');
        }

        // The cabinet / drop chamber (play area) stays at PORTRAIT scale on every aspect —
        // just like the feeder deck below it — so it is never stretched horizontally with the
        // screen width. Any extra side room on wide screens is left as margin, not filled by
        // widening the play area.
        const ns = 1;
        if (Math.abs(ns - SPREAD) > 0.002) {
            SPREAD = ns;
            ITEM_MULT = ITEM_BASE * Math.min(SPREAD, 2.0);   // grow the items with the cabinet (capped so rows don't overlap)
            applySpread();
        }
    }

    // Apply the current SPREAD/ITEM_MULT: scale the chamber backdrop in X, re-space the pinned
    // board items + pegs, and grow the items themselves. Item meshes keep uniform (undistorted)
    // scale — only positions spread; the grinder, feeder and nests stay centred and unchanged.
    function applySpread() {
        if (cabinetFaceGroup) cabinetFaceGroup.scale.x = SPREAD;
        for (const rec of pile) {
            if (rec.baseLX == null) continue;
            const sx = rec.baseLX * SPREAD;
            rec.scale = unitScale(rec.type);
            rec.cr = unitCr(rec.type);
            rec.group.position.x = sx;
            killTweens(rec.group.scale);
            rec.group.scale.setScalar(rec.scale);
            if (rec.peg) { rec.peg.position.x = sx; rec.peg.scale.setScalar(ITEM_MULT); }
        }
    }

    // ========================================================================
    // MESH HELPERS — soft, glossy, rounded toylike materials + shared geometry
    // ========================================================================
    const TAU = Math.PI * 2;
    // True egg silhouette with CLEAN UVs: start from a sphere (whose UV wrapping maps textures
    // nicely) and displace its vertices to taper the top / swell the bottom. Because we only
    // move vertices — not re-triangulate — the sphere's UV layout is preserved, so the skin
    // texture wraps without the pole smearing a LatheGeometry produces.
    const eggGeo = new THREE.SphereGeometry(0.5, 48, 36);
    {
        const pos = eggGeo.attributes.position;
        const k = 0.22;
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
            const t = y / 0.5;              // -1 bottom .. +1 top
            const h = 1 - k * t;            // taper the top point, swell the bottom
            pos.setX(i, x * h); pos.setZ(i, z * h);
        }
        pos.needsUpdate = true;
        eggGeo.computeVertexNormals();
    }
    const ringGeo   = new THREE.TorusGeometry(0.4, 0.19, 20, 40);   // round cracker (donut w/ hole)
    const discGeo   = new THREE.SphereGeometry(0.52, 36, 24);        // puffed square cracker (flattened)
    // Square/triangle DONUTS: the SAME donut as the round one — a circular tube (radius 0.19)
    // swept along a rounded square/triangle path whose centre-line sits at 0.4 (exactly the round
    // donut's torus radius). That gives an identical rounded, puffy surface and the same 0.21
    // centre hole, just with a square or triangular outline.
    const roundedPolyCurve = (pts, corner) => {
        const n = pts.length, P = [];
        for (let i = 0; i < n; i++) {
            const prev = pts[(i - 1 + n) % n], cur = pts[i], next = pts[(i + 1) % n];
            const dpx = cur[0] - prev[0], dpy = cur[1] - prev[1], pl = Math.hypot(dpx, dpy) || 1;
            const dnx = next[0] - cur[0], dny = next[1] - cur[1], nl = Math.hypot(dnx, dny) || 1;
            P.push({
                in:   new THREE.Vector3(cur[0] - dpx / pl * corner, cur[1] - dpy / pl * corner, 0),
                ctrl: new THREE.Vector3(cur[0], cur[1], 0),
                out:  new THREE.Vector3(cur[0] + dnx / nl * corner, cur[1] + dny / nl * corner, 0),
            });
        }
        const path = new THREE.CurvePath();
        for (let i = 0; i < n; i++) {
            path.add(new THREE.QuadraticBezierCurve3(P[i].in, P[i].ctrl, P[i].out));
            path.add(new THREE.LineCurve3(P[i].out, P[(i + 1) % n].in));
        }
        return path;
    };
    // ---- Tunable geometry for the square & triangle donuts -----------------------------------
    // Every radius/scale that shapes the square & triangle crackers lives here in one place.
    // rebuildShapeGeo() regenerates the curves and tube geometries from these numbers.
    const SHAPE_DBG = {
        square:   { size: 0.365, corner: 0.065, dockers: 8 },  // half-extent of the square centre-line
        triangle: { size: 0.605, corner: 0.265, dockers: 9 },  // circum-radius of the triangle centre-line
        tube:      0.155,  // cross-section radius (matches the round donut's tube)
        zFlatten:  0.62,   // front-back squash (matches the round donut)
        outlineXY: 1.08,   // toon outline scale in the plane
        outlineZ:  1.14,   // toon outline scale factor through depth
        dockerZ:   0.13,   // height of the docker dimples off the face
    };
    let squareCurve, triangleCurve, squareGeo, triangleGeo;
    function rebuildShapeGeo() {
        if (squareGeo) squareGeo.dispose();
        if (triangleGeo) triangleGeo.dispose();
        const s = SHAPE_DBG.square, t = SHAPE_DBG.triangle;
        squareCurve = roundedPolyCurve([[-s.size, -s.size], [s.size, -s.size], [s.size, s.size], [-s.size, s.size]], s.corner);
        triangleCurve = roundedPolyCurve([0, 1, 2].map(i => { const a = Math.PI / 2 + i * TAU / 3; return [Math.cos(a) * t.size, Math.sin(a) * t.size]; }), t.corner);
        squareGeo = new THREE.TubeGeometry(squareCurve, 132, SHAPE_DBG.tube, 18, true);     // square donut
        triangleGeo = new THREE.TubeGeometry(triangleCurve, 150, SHAPE_DBG.tube, 18, true); // triangle donut
    }
    rebuildShapeGeo();
    const holeGeo   = new THREE.CylinderGeometry(0.12, 0.12, 0.3, 20);
    const dockerGeo = new THREE.SphereGeometry(0.045, 8, 6);
    const pelletGeo = new THREE.SphereGeometry(0.11, 12, 10);
    const birdBodyGeo = new THREE.SphereGeometry(0.5, 32, 24);
    const eyeGeo    = new THREE.SphereGeometry(0.075, 12, 10);
    const eyeHiGeo  = new THREE.SphereGeometry(0.028, 8, 6);
    const lidGeo    = new THREE.SphereGeometry(1, 14, 10); // eyelid disc (flattened in z, grows in y to blink)
    const beakGeo   = new THREE.ConeGeometry(0.11, 0.24, 12);
    const wingGeo   = new THREE.SphereGeometry(0.22, 16, 12);
    const tuftGeo   = new THREE.ConeGeometry(0.05, 0.22, 8);

    function tint(hex, d) {
        const c = new THREE.Color(hex); const h = {}; c.getHSL(h);
        c.setHSL(h.h, h.s, Math.max(0, Math.min(1, h.l + d))); return c;
    }
    // Broad sheen with a lightened sheenColor lays a pale veil over the WHOLE surface, which
    // reads as a big saturation drop next to the bird (a plain non-metallic standard material).
    // Keep just enough sheen for the soft-toy rim and tint it with the body color instead of
    // white, and pull the clearcoat back to a highlight rather than a full gloss coat, so a
    // cracker/egg holds the same saturation as the bird it belongs to.
    const SHEEN = 0.12, SHEEN_LIFT = 0.04;
    function softMat(hex) {
        return new THREE.MeshPhysicalMaterial({
            color: hex, roughness: 0.44, clearcoat: 0.45, clearcoatRoughness: 0.3,
            sheen: SHEEN, sheenColor: tint(hex, SHEEN_LIFT), sheenRoughness: 0.6,
        });
    }
    const matCache = {};
    function foodMat(color) { return (matCache[color] ||= softMat(foodColor(color))); }
    // Egg skin texture: base is the bird's MAIN color with a few soft, rounded LIGHTER spots.
    // Spots are kept in the mid V-band (away from the UV poles) and duplicated across the U-seam
    // so the wrap has no smearing or visible seam. Blobs are drawn wider-than-tall to counter
    // the slight vertical stretch of spherical UVs on the elongated egg.
    function eggTexture(hex) {
        const W = 256, H = 256;
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const g = c.getContext('2d');
        g.fillStyle = new THREE.Color(hex).getStyle(); g.fillRect(0, 0, W, H);
        const blob = tint(hex, 0.10).getStyle();
        const blobHi = tint(hex, 0.20).getStyle();
        // Draw a ROUND spot. Canvas circles are squashed vertically (ky) to counter the egg's
        // vertical stretch + spherical-UV distortion so they read as circles on the mesh.
        const ky = 0.72;
        const drawBlob = (bx, by, r) => {
            const grd = g.createRadialGradient(bx - r * 0.28, by - r * 0.28, r * 0.15, bx, by, r);
            grd.addColorStop(0, blobHi); grd.addColorStop(0.5, blob); grd.addColorStop(1, blob);
            g.fillStyle = grd;
            g.save(); g.translate(bx, by); g.scale(1.0, ky);
            g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); g.restore();
        };
        // Evenly-scattered spots covering the whole circumference (varied sizes, good gaps) so
        // WHICHEVER side faces the camera shows a pleasing few — echoing the reference art.
        const SPOTS = [
            { u: 0.06, v: 0.42, r: 15 },
            { u: 0.18, v: 0.64, r: 11 },
            { u: 0.28, v: 0.33, r: 25 },
            { u: 0.40, v: 0.56, r: 16 },
            { u: 0.50, v: 0.28, r: 12 },
            { u: 0.56, v: 0.69, r: 13 },
            { u: 0.66, v: 0.45, r: 26 },
            { u: 0.76, v: 0.61, r: 12 },
            { u: 0.84, v: 0.36, r: 16 },
            { u: 0.93, v: 0.53, r: 10 },
        ];
        for (const sp of SPOTS) {
            const bx = sp.u * W, by = sp.v * H, r = sp.r;
            drawBlob(bx, by, r);
            if (bx < r)      drawBlob(bx + W, by, r); // wrap across the U seam
            if (bx > W - r)  drawBlob(bx - W, by, r);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
    }
    function eggMat(color) {
        return (matCache['egg_' + color] ||= new THREE.MeshPhysicalMaterial({
            map: eggTexture(foodColor(color)), roughness: 0.3,
            clearcoat: 0.6, clearcoatRoughness: 0.16,
            sheen: SHEEN, sheenColor: tint(foodColor(color), SHEEN_LIFT), sheenRoughness: 0.5,
        }));
    }
    // Pellets/crackers/eggs read as their bird's hue, saturated up. foodColor() starts from the
    // flock's exact rendered body color once it's known (warmed up at boot / sampled live), else a
    // close match via birdColor(). All three share the SAME color so they stay identical.
    const sampledPelletColor = {}; // color -> THREE.Color sampled off the rendered bird body
    // Food is pushed more saturated and a little darker than the bird body so eggs, crackers and
    // pellets read as deep candy colours instead of washing out pale under the cabinet lights.
    const FOOD_SAT_BOOST = 1.35;
    const FOOD_BRIGHTNESS = 0.8;
    function foodColor(color) {
        const c = birdColor(color); const h = {}; c.getHSL(h);
        return c.setHSL(h.h, Math.min(1, h.s * FOOD_SAT_BOOST), h.l * FOOD_BRIGHTNESS);
    }
    // Pellet uses the flock's palette color verbatim — the SAME target the bird texture is
    // tinted toward — so bird and pellet share one source of truth instead of two shades.
    function pelletColor(color) {
        const c = new THREE.Color(FOOD[color]).multiplyScalar(0.7);
        const h = {}; c.getHSL(h);
        return c.setHSL(h.h, Math.min(1, h.s * 1.2), h.l);
    }
    function pelletMat(color) { return (matCache['pel_' + color] ||= new THREE.MeshStandardMaterial({ color: pelletColor(color), roughness: 0.7, metalness: 0 })); }
    const holeMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.9 });
    // black toon outline (inverted hull: back-facing shell, slightly enlarged)
    const outlineMat = new THREE.MeshBasicMaterial({ color: 0x140e20, side: THREE.BackSide });
    const beakMat = new THREE.MeshStandardMaterial({ color: 0xffd21a, roughness: 0.5 });
    const eyeMat  = new THREE.MeshStandardMaterial({ color: 0x2a2533, roughness: 0.3 });
    const eyeHiMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    function dockerMat(color) { return (matCache['dk_' + color] ||= new THREE.MeshStandardMaterial({ color: tint(FOOD[color], -0.22), roughness: 0.7 })); }

    // ---- MYSTERY "?" CRACKER SKIN ----------------------------------------
    // A mystery cracker hides its true colour: its body + docker dimples render as grey
    // "stone" and a white "?" decal sits on the face. buildCracker keeps the real colour
    // materials aside so revealMystery() (fired the instant the player drops it) can swap
    // them back and pop, exactly like the reference video. Grinding always uses the real
    // colour, so the food it makes still matches a bird.

        const d = 0.16;

        const BEVEL = { bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.09, bevelSegments: 4, curveSegments: 12 };

        function makeRoundedRect(w, h, r) {
            const s = new THREE.Shape();

                    ax: Math.cos(t0) * R, ay: Math.sin(t0) * R,

            }

            g.userData.woodHalfW = R;
            g.userData.woodHalfH = tube * 0.5;

                { ax:  hw, ay:  hh, bx:  hw, by: -hh },
                { ax:  hw, ay: -hh, bx: -hw, by: -hh },
                { ax: -hw, ay: -hh, bx: -hw, by:  hh },

            g.userData.woodHalfH = h * 0.45;

        return g;
