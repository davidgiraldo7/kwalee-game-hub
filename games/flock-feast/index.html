<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mobile Game UI</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --ink: #fff3e0;
      --dim: #cbbcef;
      --accent: #ffd24d;
      --panel-a: #3f2650;
      --panel-b: #312046;
      --frame: #ac93cc;
      --cta1: #ffe08a;
      --cta2: #ffc23d;
      --cta-sh: #c9902a;
      --wood-a: #b06a4a;
      --wood-b: #763e29;
      --wood-sh: #5c2e1e;
      --bg-a: #2e2555;
      --bg-b: #241d47;
      --bar: #7bd66b;
      --danger1: #fb6f6f;
      --danger2: #e6544a;
      --danger-sh: #c23b32;
      --sec-a: #947dd8;
      --sec-b: #7966b1;
      --sec-sh: #584b81;
      /* Button styles (saved from Popup DBG) */
      --btn-play-w: 180px;
      --btn-play-radius: 999px;
      --btn-play-1: #85ad14;
      --btn-play-2: #6a8d0a;
      --btn-cta-w: 220px;
      --btn-cta-radius: 999px;
      --btn-sec-w: 200px;
      --btn-sec-radius: 999px;
      --btn-danger-w: 280px;
      --btn-danger-radius: 999px;
      --btn-danger-1: #fb6f6f;
      --btn-danger-2: #e6544a;
      --btn-danger-sh: #c23b32;
      --disp: "Baloo 2", "Fredoka", "Trebuchet MS", system-ui, sans-serif;
      --bodyfont: "Nunito", "Fredoka", system-ui, -apple-system, sans-serif;
    }

    @font-face {
      font-family: "Fredoka";
      src: url("Fredoka-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fredoka";
      src: url("Fredoka-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fredoka";
      src: url("Fredoka-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: var(--bodyfont);
      font-weight: 700;
      background: var(--bg-b);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--ink);
      overflow: hidden;
    }

    /* App fills the entire viewport on all devices */
    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-b);
    }

    /* ---------- Screens ---------- */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity .25s ease;
      visibility: hidden;
      pointer-events: none;
    }

    .screen.active {
      display: flex;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 1;
    }

    /* Keep home above any leftover game compositing */
    #startScreen.active {
      z-index: 2;
    }

    /* Never paint gameplay while the game screen is inactive */
    #gameScreen:not(.active) {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* Warm-up state: render the game screen (so the iframe lays out at full
           size and paints its first frame during the splash) but keep it fully
           offscreen and non-interactive. Overrides the display:none above. */
    #gameScreen.warming:not(.active) {
      display: flex !important;
      visibility: visible !important;
      pointer-events: none !important;
      position: absolute;
      left: -99999px;
      top: 0;
      opacity: 0;
      z-index: -1;
    }

    /* ---------- Start Screen ---------- */
    #startScreen {
      justify-content: center;
      gap: 40px;
      padding: 24px;
      text-align: center;
      background: #f0b64a url("Home_Bg.webp") center center / cover no-repeat;
    }

    /* Tiled scrolling background (disabled — replaced by Home_Bg.png) */
    .bg-scroll {
      display: none;
    }

    .game-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
      z-index: 1;
      top: -22%;
    }

    .game-logo .logo-wrap {
      position: relative;
      width: 94%;
      max-width: 414px;
      margin: 0 auto;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35));
    }

    .game-logo .logo-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Blinking parrot eyes on the title art */
    .eyelid {
      position: absolute;
      width: 4.7%;
      height: 7%;
      background: linear-gradient(180deg, #ab7cdb 0%, #9a67cf 55%, #895ac0 100%);
      border-radius: 50% 50% 48% 48%;
      transform: scaleY(0);
      transform-origin: top center;
      pointer-events: none;
      animation: eyeBlink 4.6s infinite;
    }

    .eyelid.p-right {
      animation-delay: .7s;
    }

    @keyframes eyeBlink {

      0%,
      92% {
        transform: scaleY(0);
      }

      94.5% {
        transform: scaleY(1.05);
      }

      96.5% {
        transform: scaleY(1.05);
      }

      99%,
      100% {
        transform: scaleY(0);
      }
    }

    .game-title {
      font-family: var(--disp);
      font-weight: 800;
      line-height: .9;
      text-align: center;
      text-shadow: 0 4px 0 #241640, 0 8px 18px rgba(0, 0, 0, .4);
    }

    .game-title .t1,
    .game-title .t2 {
      display: block;
      font-size: clamp(52px, 17vw, 92px);
      letter-spacing: .02em;
    }

    .game-title .t1 {
      color: var(--accent);
    }

    .game-title .t2 {
      color: var(--ink);
    }

    .playbtn {
      border: 4px solid var(--wood-b);
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(180deg, var(--btn-play-1) 0%, var(--btn-play-2) 100%);
      font-family: var(--disp);
      font-weight: 800;
      width: var(--btn-play-w);
      height: 64px;
      max-width: 100%;
      border-radius: var(--btn-play-radius);
      box-shadow: 0 7px 0 var(--wood-sh), 0 14px 22px rgba(0, 0, 0, .35), inset 0 2px rgba(255, 255, 255, .4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 15%;
      transform: translateX(-50%);
      text-shadow: 0 2px 0 rgba(0, 0, 0, .28);
      transition: transform .06s ease, box-shadow .06s ease;
    }

    .playbtn:active {
      transform: translateX(-50%) translateY(4px);
      box-shadow: 0 3px 0 var(--wood-sh), 0 8px 16px rgba(0, 0, 0, .35), inset 0 2px rgba(255, 255, 255, .35);
    }

    .playbtn .play-level {
      font-size: 26px;
      letter-spacing: 1px;
    }

    /* ---------- Home Bar (bottom tabs) ---------- */
    .home-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      background: linear-gradient(180deg, var(--wood-a), var(--wood-b));
      border-top: 2px solid rgba(255, 255, 255, .12);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, .35), inset 0 2px 0 rgba(255, 255, 255, .14);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .home-bar .tab {
      flex: 1;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 0 16px;
      color: #e9d4ab;
      transition: transform .06s ease;
    }

    .home-bar .tab:active {
      transform: translateY(1px);
    }

    .home-bar .tab .tab-icon {
      width: 35px;
      height: 35px;
      background-color: currentColor;
      -webkit-mask: var(--icon) no-repeat center / contain;
      mask: var(--icon) no-repeat center / contain;
    }

    /* White home icon on the active tab */
    .home-bar .tab.active .tab-icon {
      background-color: #ffffff;
    }

    .home-bar .tab .tab-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .home-bar .tab.active {
      color: #ffffff;
    }

    .home-bar .tab.locked {
      color: #c4a880;
    }

    /* Locked tabs: icon + label 15% smaller */
    .home-bar .tab.locked .tab-icon {
      width: 29.75px;
      height: 29.75px;
    }

    .home-bar .tab.locked .tab-label {
      font-size: 11.05px;
    }

    /* ---------- Game Screen ---------- */
    #gameScreen {
      justify-content: flex-start;
      background: #b39572;
    }

    /* Header level pill removed — the in-game HUD already shows the level */
    #gameHeader {
      display: none;
    }

    .header {
      margin-top: calc(18px + env(safe-area-inset-top, 0px));
      background: linear-gradient(180deg, var(--wood-a), var(--wood-b));
      color: #ffe6b8;
      border: none;
      padding: 7px 20px;
      border-radius: 999px;
      font-family: var(--disp);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .5px;
      text-shadow: 0 2px 0 var(--wood-sh);
      box-shadow: 0 3px 0 var(--wood-sh), 0 6px 12px rgba(0, 0, 0, .35), inset 0 2px 0 rgba(255, 255, 255, .28);
      animation: headerIn .5s cubic-bezier(.2, 1.4, .35, 1) forwards;
      transition: transform .4s cubic-bezier(.4, 0, 1, 1), opacity .3s ease;
    }

    .header.exit-up {
      animation: none;
      transform: translateY(-80px);
      opacity: 0;
    }

    @keyframes headerIn {
      0% {
        opacity: 0;
        transform: translateY(-26px) scale(.8);
      }

      60% {
        opacity: 1;
        transform: translateY(4px) scale(1.05);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ---------- Flavour text (level complete) ---------- */
    .flavour-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
    }

    .flavour-text span {
      font-size: 52px;
      font-family: var(--disp);
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 4px 12px rgba(255, 210, 77, .4);
      transform: scale(0);
    }

    .flavour-text.show {
      opacity: 1;
    }

    .flavour-text.show span {
      animation: flavourPop .6s cubic-bezier(.2, 1.6, .35, 1) forwards;
    }

    .flavour-text.dismiss span {
      animation: flavourOut .4s ease forwards;
    }

    @keyframes flavourPop {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      50% {
        transform: scale(1.2);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes flavourOut {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 0;
      }
    }

    /* ---------- Fail text (level failed) ---------- */
    .fail-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 12;
      opacity: 0;
    }

    .fail-text span {
      font-size: 46px;
      font-family: var(--disp);
      font-weight: 800;
      color: var(--danger1);
      text-shadow: 0 4px 12px rgba(230, 84, 74, .4);
      opacity: 0;
      transform: translateY(0);
      transition: transform .5s cubic-bezier(.4, 0, .2, 1), opacity .4s ease;
    }

    .fail-text.show {
      opacity: 1;
    }

    .fail-text.show span {
      opacity: 1;
    }

    .fail-text.settle span {
      transform: translateY(-80px);
    }

    .play-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      color: #a09ab4;
      font-size: 15px;
      font-weight: 600;
      /* Slightly visible boundary so the play area reads as a defined
               container on mobile (iframe bleeds edge-to-edge otherwise). */
      border: 2px solid rgba(0, 0, 0, .18);
    }

    .play-area iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--bg-b);
    }


    /* ---------- Debug buttons ---------- */
    .debug {
      position: absolute;
      right: 12px;
      bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      display: none !important;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      z-index: 5;
    }

    .debug-label {
      font-size: 10px;
      letter-spacing: 1px;
      color: #a09ab4;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      background: none;
      padding: 4px 8px;
      font-family: inherit;
    }

    .debug-label::after {
      content: "\25B2";
      margin-left: 4px;
      font-size: 8px;
    }

    .debug.collapsed .debug-label::after {
      content: "\25BC";
    }

    .debug.collapsed .debugbtn,
    .debug.collapsed .debug-skip,
    .debug.collapsed .debug-icon-row,
    .debug.collapsed .mixer-panel {
      display: none;
    }

    .debug-skip {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .debug-skip input {
      width: 48px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      text-align: center;
      outline: none;
    }

    .debug-skip input:focus {
      border-color: #4d9bff;
    }

    .debug-reset {
      background: #ff9f43;
    }

    .debugbtn {
      border: none;
      cursor: pointer;
      color: #fff;
      font-family: inherit;
      font-weight: 500;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .35);
      opacity: .85;
      transition: transform .06s ease, opacity .12s ease;
    }

    .debugbtn:active {
      transform: translateY(2px);
    }

    .debugbtn:hover {
      opacity: 1;
    }

    .debug-win {
      background: #28c76f;
    }

    .debug-fail {
      background: #ff5a5f;
    }

    .debug-lang {
      background: #4d9bff;
    }

    /* ---------- Debug Mixer & Meter ---------- */
    .debug-icon-btn {
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, .12);
      font-size: 16px;
      padding: 6px 10px;
      border-radius: 999px;
      opacity: .85;
      transition: opacity .12s;
    }

    .debug-icon-btn:hover {
      opacity: 1;
    }

    .debug-icon-row {
      display: flex;
      gap: 6px;
    }

    .debug.mixer-open .debugbtn,
    .debug.mixer-open .debug-skip,
    .debug.mixer-open .debug-reset,
    .debug.mixer-open .debug-lang,
    .debug.mixer-open .debug-label {
      display: none !important;
    }

    .mixer-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: rgba(0, 180, 80, .15);
      border-radius: 14px;
      padding: 12px;
      width: 220px;
      max-height: 420px;
      font-size: 11px;
      color: #241a44;
    }

    .debug.mixer-open .mixer-panel {
      display: flex;
    }

    .debug.debug-enabled {
      display: none !important;
    }

    .mixer-section-label {
      font-weight: 700;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #6b6684;
      margin: 4px 0 0;
    }

    .mixer-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mixer-row label {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mixer-row input[type="range"] {
      flex: 2;
      height: 6px;
      accent-color: #28c76f;
      cursor: pointer;
    }

    .mixer-row .mixer-val {
      width: 26px;
      text-align: right;
      font-size: 10px;
      color: #6b6684;
    }

    .mixer-toggles {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .mixer-tog {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      background: #e0dce8;
      color: #6b6684;
      transition: background .12s, color .12s;
    }

    .mixer-tog.active {
      background: #4d9bff;
      color: #fff;
    }

    .mixer-tog.mute-active {
      background: #ff5a5f;
      color: #fff;
    }

    .mixer-channel-tag {
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 4px;
      background: #e8e4f0;
      color: #6b6684;
      font-weight: 600;
    }

    .mixer-sounds-scroll {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .mixer-sounds-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .mixer-sounds-scroll::-webkit-scrollbar-thumb {
      background: #c0bcc8;
      border-radius: 2px;
    }

    .mixer-sound-strip {
      background: rgba(255, 255, 255, .6);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mixer-sound-strip .mixer-row input[type="range"] {
      flex: 3;
    }

    .mixer-save-btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      padding: 8px;
      border-radius: 10px;
      background: #28c76f;
      color: #fff;
      text-align: center;
    }

    /* Loudness Meter Panel */
    .meter-panel {
      display: none;
      position: absolute;
      left: 12px;
      bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      flex-direction: column;
      gap: 6px;
      background: rgba(20, 15, 40, .88);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 11px;
      color: #e0dce8;
      z-index: 5;
      min-width: 170px;
    }

    .meter-panel.show {
      display: flex;
    }

    .meter-panel h4 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .meter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meter-row .meter-label {
      color: #a09ab4;
      font-weight: 500;
    }

    .meter-row .meter-value {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .meter-reset-btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 11px;
      padding: 6px;
      border-radius: 8px;
      background: #4d9bff;
      color: #fff;
      text-align: center;
      margin-top: 4px;
    }

    /* ---------- Result Overlay ---------- */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(20, 15, 44, .78);
      backdrop-filter: blur(3px);
      z-index: 10;
      padding: 24px;
      text-align: center;
    }

    .overlay.show {
      display: flex;
      animation: fade .25s ease;
    }

    /* Android hardware-back softlock safeguard: some OEM back-gesture handlers strip
           the "show" class from the result overlay from outside our code while it is the
           only path back to Continue/Retry. This rule wins the cascade and keeps the
           popup rendered regardless. CSS-only, no JS watches the DOM for this — see
           lockResultOverlay()/unlockResultOverlay() below. Do NOT reintroduce a
           MutationObserver/polling/rAF watcher here; that previously caused recursive
           DOM mutations and softlocked the editor/game. */
    .overlay.result-locked {
      display: flex !important;
    }

    .overlay.backdrop-only .overlay-card {
      opacity: 0 !important;
      transition: none;
      pointer-events: none;
    }

    .overlay.reveal-content .overlay-card {
      opacity: 1 !important;
      transition: opacity .35s ease;
    }

    .overlay .overlay-card .nextbtn.btn-hidden {
      opacity: 0;
      transition: opacity .35s ease;
    }

    .overlay .overlay-card .nextbtn.btn-visible {
      opacity: 1;
      transition: opacity .35s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .overlay-card {
      background: linear-gradient(180deg, var(--panel-a), var(--panel-b));
      border: 5px solid var(--frame);
      box-shadow: 0 26px 70px rgba(0, 0, 0, .5), inset 0 2px rgba(255, 255, 255, .22);
      padding: 48px 28px 34px;
      width: min(420px, calc(100vw - 44px));
      min-height: 320px;
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      z-index: 2;
      animation: pop .35s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .overlay-card h2 {
      margin: 0 0 4px;
      font-family: var(--disp);
      font-size: 44px;
      font-weight: 800;
      text-align: center;
      line-height: 1.05;
      text-shadow: 0 3px 0 #241640;
    }

    .overlay-card.win h2 {
      color: var(--accent);
    }

    .overlay-card.fail h2 {
      color: var(--danger1);
    }

    .overlay-card p {
      margin: 0;
      color: var(--dim);
      font-weight: 800;
      font-size: 20px;
    }

    .nextbtn {
      border: none;
      cursor: pointer;
      color: #5b3c0e;
      font-family: var(--disp);
      font-weight: 800;
      font-size: 20px;
      padding: 13px 36px;
      min-width: var(--btn-cta-w);
      border-radius: var(--btn-cta-radius);
      background: linear-gradient(180deg, var(--cta1), var(--cta2));
      box-shadow: 0 6px 0 var(--cta-sh), 0 12px 22px rgba(0, 0, 0, .3), inset 0 2px rgba(255, 255, 255, .6);
      margin-top: 36px;
    }

    .nextbtn:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0 var(--cta-sh), 0 8px 16px rgba(0, 0, 0, .3), inset 0 2px rgba(255, 255, 255, .5);
    }

    .retrybtn {
      color: var(--ink);
      min-width: var(--btn-sec-w);
      border-radius: var(--btn-sec-radius);
      background: linear-gradient(180deg, var(--sec-a), var(--sec-b));
      box-shadow: 0 6px 0 var(--sec-sh), 0 12px 22px rgba(0, 0, 0, .3), inset 0 2px rgba(255, 255, 255, .3);
    }

    .retrybtn:active {
      box-shadow: 0 3px 0 var(--sec-sh), 0 8px 14px rgba(0, 0, 0, .3), inset 0 2px rgba(255, 255, 255, .25);
    }

    /* ---------- Celebration VFX ---------- */
    /* Per-letter pop-in for the title */
    .overlay-card h2 .ltr {
      display: inline-block;
      white-space: pre;
      opacity: 0;
      transform: translateY(26px) scale(.2) rotate(-15deg);
      animation: letterPop .55s cubic-bezier(.2, 1.6, .35, 1) forwards;
    }

    @keyframes letterPop {
      0% {
        opacity: 0;
        transform: translateY(26px) scale(.2) rotate(-15deg);
      }

      60% {
        opacity: 1;
        transform: translateY(-5px) scale(1.18) rotate(4deg);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    /* Confetti canvas sits above the card */
    .confetti {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    /* Fireworks canvas covers the whole app, above all UI */
    .fireworks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    /* Fade-to-white transition layer */
    .fade-black {
      position: absolute;
      inset: 0;
      background: var(--ink);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity .4s cubic-bezier(.4, 0, .2, 1);
    }

    .fade-black.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Expanding glow burst behind the card */
    .burst {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 320px;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 210, 77, .55) 0%, rgba(255, 210, 77, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }

    .overlay.celebrate .burst {
      animation: burst .7s ease-out forwards;
    }

    @keyframes burst {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: .9;
      }

      70% {
        opacity: .45;
      }

      100% {
        transform: translate(-50%, -50%) scale(1.9);
        opacity: 0;
      }
    }

    /* Intro bounce for the Next Level button */
    .overlay-card.win .nextbtn {
      animation: btnPopIn .5s cubic-bezier(.2, 1.5, .35, 1) both;
      animation-delay: .4s;
    }

    @keyframes btnPopIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      60% {
        transform: scale(1.12);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .settingsbtn {

      top: calc(16px + env(safe-area-inset-top, 0px));
      right: 16px;
      z-index: 6;
      width: 36px;
      height: 36px;
      border: none;
      padding: 0;
      cursor: pointer;
      background: transparent;
      transition: transform .06s ease, opacity .3s ease;
    }

    .settingsbtn:active {
      transform: translateY(2px);
    }

    /* Game-screen settings gear: vertically centered within the wooden HUD panel */
    #settingsBtnGame {
      top: max(20px, calc(env(safe-area-inset-top, 0px) + 12px));
    }

    /* Brown outline around the home-screen settings icon */
    #settingsBtnStart {
      filter:
        drop-shadow(1px 0.5px 0 var(--wood-b)) drop-shadow(0 0.5px 0 var(--wood-b)) drop-shadow(0.5px 1px 0 var(--wood-b)) drop-shadow(0.5px 0 0 var(--wood-b)) drop-shadow(0.85px 0.85px 0 var(--wood-b)) drop-shadow(0.15px 0.15px 0 var(--wood-b)) drop-shadow(0.85px 0.15px 0 var(--wood-b)) drop-shadow(0.15px 0.85px 0 var(--wood-b));
    }

    /* ---------- Settings menu ---------- */
    .settings-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 15, 44, .78);
      backdrop-filter: blur(3px);
      z-index: 20;
      padding: 24px;
    }

    .settings-overlay.show {
      display: flex;
      animation: fade .25s ease;
    }

    .settings-card {
      position: relative;
      width: 100%;
      max-width: 320px;
      background: linear-gradient(180deg, var(--panel-a), var(--panel-b));
      color: var(--ink);
      padding: 26px 24px 24px;
      border-radius: 24px;
      border: 4px solid var(--frame);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .5), inset 0 2px rgba(255, 255, 255, .2);
      animation: pop .35s ease;
    }

    .settings-card.hidden {
      display: none;
    }

    .settings-card h2 {
      margin: 0 0 20px;
      font-family: var(--disp);
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 3px 0 #241640;
    }

    .settings-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      color: var(--ink);
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }

    .settings-close:active {
      transform: scale(.9);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, .12);
    }

    .setting-row:last-of-type {
      border-bottom: none;
    }

    .setting-row span {
      font-size: 16px;
      font-weight: 700;
    }

    /* Slider toggle */
    .toggle {
      position: relative;
      width: 52px;
      height: 30px;
      flex-shrink: 0;
    }

    .toggle input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 2;
    }

    .toggle .track {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .28);
      border-radius: 999px;
      transition: background .18s ease;
    }

    .toggle .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .35);
      transition: transform .18s ease;
    }

    .toggle input:checked~.track {
      background: var(--bar);
    }

    .toggle input:checked~.knob {
      transform: translateX(22px);
    }

    .settings-quit {
      width: min(100%, var(--btn-danger-w));
      margin-top: 22px;
      border: none;
      cursor: pointer;
      color: #fff;
      font-family: var(--disp);
      font-weight: 800;
      font-size: 18px;
      padding: 13px;
      border-radius: var(--btn-danger-radius);
      background: linear-gradient(180deg, var(--btn-danger-1), var(--btn-danger-2));
      box-shadow: 0 5px 0 var(--btn-danger-sh), inset 0 2px rgba(255, 255, 255, .35);
    }

    .settings-quit:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0 var(--btn-danger-sh), inset 0 2px rgba(255, 255, 255, .3);
    }

    /* Secondary text-only links */
    .settings-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 18px;
    }

    .settings-link {
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      color: var(--dim);
      padding: 6px 8px;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .settings-link:active {
      color: var(--ink);
    }

    /* ---------- Quit Confirmation — sibling card, same chrome as Settings ---------- */
    .quit-confirm {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    .quit-confirm.show {
      display: flex;
    }

    .quit-confirm h3 {
      margin: 0 0 8px;
      font-family: var(--disp);
      font-size: 28px;
      font-weight: 800;
      text-shadow: 0 3px 0 #241640;
    }

    .quit-confirm p {
      margin: 0 0 22px;
      font-size: 16px;
      color: var(--dim);
      font-weight: 700;
      line-height: 1.35;
    }

    .quit-confirm-btns {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .quit-confirm-btn {
      flex: 1;
      border: none;
      cursor: pointer;
      font-family: var(--disp);
      font-weight: 800;
      font-size: 18px;
      padding: 13px;
      min-width: 0;
      border-radius: var(--btn-danger-radius);
      color: #fff;
    }

    .quit-yes {
      color: #fff;
      background: linear-gradient(180deg, var(--btn-danger-1), var(--btn-danger-2));
      box-shadow: 0 4px 0 var(--btn-danger-sh), inset 0 2px rgba(255, 255, 255, .35);
    }

    .quit-yes:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--btn-danger-sh), inset 0 2px rgba(255, 255, 255, .3);
    }

    .quit-no {
      color: var(--ink);
      border-radius: var(--btn-sec-radius);
      background: linear-gradient(180deg, var(--sec-a), var(--sec-b));
      box-shadow: 0 4px 0 var(--sec-sh), inset 0 2px rgba(255, 255, 255, .3);
    }

    .quit-no:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--sec-sh), inset 0 2px rgba(255, 255, 255, .25);
    }

    /* ---------- Locked Tab Toast ---------- */
    .locked-toast {
      position: absolute;
      pointer-events: none;
      font-size: 12px;
      font-weight: 800;
      color: var(--dim);
      white-space: nowrap;
      animation: toastFloat 1.8s ease forwards;
      z-index: 10;
    }

    @keyframes toastFloat {
      0% {
        opacity: 1;
        transform: translateY(0);
      }

      70% {
        opacity: 1;
        transform: translateY(-30px);
      }

      100% {
        opacity: 0;
        transform: translateY(-45px);
      }
    }

    /* ---------- Splash Screen ---------- */
    #splashScreen {
      justify-content: center;
      align-items: center;
      background: #3CC3D3;
    }

    .splash-logo {
      width: 50%;
      max-width: 220px;
      height: auto;
      opacity: 0;
      transition: opacity .6s ease;
    }

    .splash-logo.visible {
      opacity: 1;
    }
  </style>

<body>
  <div class="app">

    <!-- ===== Splash Screen ===== -->
    <div class="screen active" id="splashScreen">
      <img src="Graphic-Pocket-Spark-Logo.webp" alt="Pocket Spark" class="splash-logo" id="splashLogo" />
    </div>

    <!-- ===== Start Screen ===== -->
    <div class="screen" id="startScreen">
      <div class="bg-scroll"></div>
      <button class="settingsbtn" id="settingsBtnStart" aria-label="Settings"></button>
      <div class="game-logo" id="gameLogo">
        <div class="logo-wrap">
          <img src="GameTitle.webp" alt="Flock Feast" class="logo-img" />
          <span class="eyelid p-left" style="left:8.8%;top:48.4%;width:4.3%;height:7%"></span>
          <span class="eyelid p-left" style="left:15.6%;top:46%;width:3.7%;height:6.7%"></span>
          <span class="eyelid p-right" style="left:81.8%;top:47.4%;width:4.1%;height:7%"></span>
          <span class="eyelid p-right" style="left:87.7%;top:49.8%;width:4.3%;height:7%"></span>
        </div>
      </div>
      <button class="playbtn" id="playBtn">
        <span class="play-level" id="playLevel">Level 1</span>
      </button>

      <nav class="home-bar">
        <button class="tab locked" aria-label="Locked">
          <span class="tab-icon" style="--icon: url('Icon-Lock.png')"></span>
          <span class="tab-label" data-i18n="tabLocked">Locked</span>
        </button>
        <button class="tab active" aria-current="page">
          <span class="tab-icon" style="--icon: url('Icon-Home.png')"></span>
          <span class="tab-label" data-i18n="tabHome">Home</span>
        </button>
        <button class="tab locked" aria-label="Locked">
          <span class="tab-icon" style="--icon: url('Icon-Lock.png')"></span>
          <span class="tab-label" data-i18n="tabLocked">Locked</span>
        </button>
      </nav>
    </div>

    <!-- ===== Game Screen ===== -->
    <div class="screen" id="gameScreen">
      <button class="settingsbtn" id="settingsBtnGame" aria-label="Settings"></button>
      <div class="header" id="gameHeader">Level 1</div>
      <div class="play-area">
        <!-- Lazy-mounted from inlined Feed payload (srcdoc) — no Feed.html network fetch -->
        <iframe id="feedGame" title="Flock Feast gameplay" src="about:blank" allow="autoplay"></iframe>
      </div>

      <!-- Flavour text (shown briefly on level complete) -->
      <div class="flavour-text" id="flavourText"><span>Well Done!</span></div>

      <!-- Fail text (shown briefly on level failed) -->
      <div class="fail-text" id="failText"><span></span></div>

      <!-- Result overlay -->
      <div class="overlay" id="overlay">
        <div class="burst"></div>
        <div class="overlay-card" id="overlayCard">
          <h2 id="overlayTitle">Level Complete!</h2>
          <p id="overlaySubtitle">Great job.</p>
          <button class="nextbtn" id="overlayBtn">Next Level</button>
        </div>
        <canvas class="confetti" id="confetti"></canvas>
      </div>

      <!-- Debug controls (floating panel — no in-UI toggle; enable manually via devtools) -->
      <div class="debug collapsed" id="debugPanel">

  <script src="translations.js"></script>
  <script>
    (() => {
  "use strict";

  // ════════════════════════════════════════════════════════════════
  // TEMPLATE CONTRACT — See ARCHITECTURE.md
  // Required lifecycle functions: startGame, levelComplete, levelFailed
  // Required state: level (integer, module-scope)
  // The analytics pipeline injects hooks into these functions.
  // DO NOT rename or restructure them.
  //
  // Android back-button softlock guard: the result overlay (#overlay) can be locked
  // open via the CSS-only ".result-locked" class (see lockResultOverlay() /
  // unlockResultOverlay() near hideOverlay()) so an OEM back-gesture can't dismiss
  // Continue/Retry out from under the player. This safeguard is CSS-only and must
  // stay that way — no MutationObserver, polling, rAF loop, or listener may re-add
  // classes; a prior observer-based attempt recursed on its own DOM mutations and
  // softlocked the editor/game.
  // ════════════════════════════════════════════════════════════════

  // Per-game storage namespace. Set GAME_ID_OVERRIDE for an explicit unique id.
  // Fallback derives an id from the page path plus a stable hash.
  const GAME_ID_OVERRIDE = "flockfeast_2026";

  function sanitizeGameId(raw) {
    return String(raw || "").toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "");
  }

  function hash32(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    }
    return Math.abs(h).toString(36);
  }

  function resolveGameId() {
    const override = sanitizeGameId(GAME_ID_OVERRIDE || (window.GAME_ID || ""));
    if (override) return override;
    const path = (location.pathname || "game").toLowerCase();
    const leaf = sanitizeGameId(path.split("/").filter(Boolean).pop() || "game").replace(/\.html$/, "");
    return (leaf || "game") + "-" + hash32(path);
  }

  const GAME_ID = resolveGameId();
  const STORAGE_KEYS = {
    level:    GAME_ID + "_level",
    mixer:    GAME_ID + "_mixer",
    loop:     GAME_ID + "_loop",
    settings: GAME_ID + "_settings",
    lang:     GAME_ID + "_lang",
  };

  const startScreen = document.getElementById("startScreen");
  const gameScreen  = document.getElementById("gameScreen");
  const splashScreen = document.getElementById("splashScreen");
  const splashLogo  = document.getElementById("splashLogo");
  const playBtn     = document.getElementById("playBtn");
  const playLevel   = document.getElementById("playLevel");
  const gameHeader  = document.getElementById("gameHeader");
  const flavourText = document.getElementById("flavourText");
  const failText    = document.getElementById("failText");
    const feedGame    = document.getElementById("feedGame");
    let feedReady = false;
    let feedLoadWait = null;

  function postOriginOk(event) {
    // Trust only our gameplay iframe
    if (feedGame.contentWindow && event.source === feedGame.contentWindow) return true;
    if (event.origin === location.origin) return true;
    const nil = (o) => o === "null" || o === "";
    return nil(event.origin) && nil(location.origin);
  }

  function postToFeed(data) {
    try {
      feedGame.contentWindow?.postMessage(data, "*");
    } catch (e) {}
  }

  function pingFeedGame() {
    if (!isFeedLoaded()) return;
    postToFeed({ type: "flock-feast:ping" });
  }

  function notifyFeedViewport() {
    if (!feedReady) return;
    postToFeed({ type: "flock-feast:resize" });
    sendFeedSafeArea();
  }

  // ---------- Safe-area relay ----------
  // env(safe-area-inset-*) is only reliable in the TOP-LEVEL document. iOS WebKit and the
  // Android WebView resolve it to 0 inside an iframe, which drops the gameplay HUD under
  // the notch. So the shell measures the real insets here and pushes them into the frame,
  // where they are applied as --sat/--sab/--sal/--sar.
  let _insetProbe = null;
  let _pluginInsets = null;

  function readSafeAreaInsets() {
    if (!_insetProbe) {
      _insetProbe = document.createElement("div");
      _insetProbe.setAttribute("aria-hidden", "true");
      _insetProbe.style.cssText =
        "position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
        "padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);" +
        "padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);";
      document.body.appendChild(_insetProbe);
    }
    const cs = getComputedStyle(_insetProbe);
    const px = (v) => Math.max(0, Math.round(parseFloat(v) || 0));
    const insets = {
      top: px(cs.paddingTop),
      bottom: px(cs.paddingBottom),
      left: px(cs.paddingLeft),
      right: px(cs.paddingRight),
    };
    // Some Android WebView configurations report 0 even under a cutout. Fall back to the
    // values a native safe-area plugin gave us, if one is installed.
    if (_pluginInsets) {
      insets.top = Math.max(insets.top, _pluginInsets.top);
      insets.bottom = Math.max(insets.bottom, _pluginInsets.bottom);
      insets.left = Math.max(insets.left, _pluginInsets.left);
      insets.right = Math.max(insets.right, _pluginInsets.right);
    }
    return insets;
  }

  function sendFeedSafeArea() {
    if (!feedReady) return;
    const i = readSafeAreaInsets();
    postToFeed({ type: "flock-feast:safe-area", top: i.top, bottom: i.bottom, left: i.left, right: i.right });
  }

  // Optional native plugin (capacitor-plugin-safe-area). Absent in plain browsers — the
  // CSS probe above already covers those.
  (function loadPluginInsets() {
    const SafeArea = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SafeArea;
    if (!SafeArea || typeof SafeArea.getSafeAreaInsets !== "function") return;
    Promise.resolve(SafeArea.getSafeAreaInsets()).then((res) => {
      const i = (res && res.insets) || res;
      if (!i) return;
      const px = (v) => Math.max(0, Math.round(Number(v) || 0));
      _pluginInsets = { top: px(i.top), bottom: px(i.bottom), left: px(i.left), right: px(i.right) };
      sendFeedSafeArea();
    }).catch(() => {});
  })();

  function isFeedLoaded() {
    return feedGame.src.includes("feed.html");
  }

  function unloadFeed() {
    feedReady = false;
    feedLoadWait = null;
    stopLoop();
    try {
      feedGame.src = "about:blank";
    } catch (e) {}
  }

  function mountFeed() {
    feedGame.src = "feed.html";
  }

  function ensureFeedLoaded() {
    if (feedReady && isFeedLoaded()) return Promise.resolve();
    if (feedLoadWait) return feedLoadWait;
    feedLoadWait = new Promise((resolve) => {
      let settled = false;
      const done = () => {
        if (settled) return;
        settled = true;
        feedLoadWait = null;
        window.removeEventListener("message", onReady);
        resolve();
      };
      const onReady = (event) => {
        if (!postOriginOk(event) || event.source !== feedGame.contentWindow) return;
        if (event.data && event.data.type === "flock-feast:ready") {
          feedReady = true;
          done();
        }
      };
      window.addEventListener("message", onReady);
      // A failed mount (e.g. the inlined payload element not parsed yet) must never be
      // cached as a pending/rejected wait — otherwise every later caller inherits the
      // failure and Play deadlocks. Settle immediately so the next call retries cleanly.
      try {
        if (!isFeedLoaded()) mountFeed();
        else pingFeedGame();
      } catch (e) {
        done();
        return;
      }
      // Safety timeout so a CDN blip never deadlocks Play
      setTimeout(done, 8000);
    });
    return feedLoadWait;
  }

  feedGame.addEventListener("load", () => {
    if (isFeedLoaded()) pingFeedGame();
  });

  const overlay        = document.getElementById("overlay");
  const overlayCard    = document.getElementById("overlayCard");
  const overlayTitle   = document.getElementById("overlayTitle");
  const overlaySubtitle= document.getElementById("overlaySubtitle");
  const overlayBtn     = document.getElementById("overlayBtn");

  const debugWin  = document.getElementById("debugWin");
  const debugFail = document.getElementById("debugFail");
  const debugLang = document.getElementById("debugLang");
  const debugPanel = document.getElementById("debugPanel");
  const debugToggle = document.getElementById("debugToggle");
  const debugLevelInput = document.getElementById("debugLevelInput");
  const debugSkipLevel = document.getElementById("debugSkipLevel");
  const debugReset = document.getElementById("debugReset");
  if (debugPanel) debugPanel.style.display = "none";
  const settingsBtnStart = document.getElementById("settingsBtnStart");
  const settingsBtnGame  = document.getElementById("settingsBtnGame");
  const settingsOverlay  = document.getElementById("settingsOverlay");
  const settingsClose    = document.getElementById("settingsClose");
  const settingsQuit     = document.getElementById("settingsQuit");

  const confettiCanvas = document.getElementById("confetti");
  const cctx = confettiCanvas.getContext("2d");
  let confettiParticles = [];
  let confettiRAF = null;
  let confettiFading = false;

  const fireworksCanvas = document.getElementById("fireworks");
  const fwctx = fireworksCanvas.getContext("2d");
  let fwRockets = [];
  let fwParticles = [];
  let fireworksRAF = null;
  let completeTimer = null;
  let fadeTimer = null;

  const fadeBlack = document.getElementById("fadeBlack");

  // One-time save wipe for this build, so everyone starts from level 1 with the
  // tutorial intact. The gameplay iframe shares this localStorage (same origin),
  // so clearing its keys here also resets the in-game FTUE flags.
  // Runs once per install — the token stops it firing on every launch.
  const RESET_TOKEN = GAME_ID + "_reset_v1_1_2";
  try {
    if (!localStorage.getItem(RESET_TOKEN)) {
      [STORAGE_KEYS.level, STORAGE_KEYS.loop, STORAGE_KEYS.settings, STORAGE_KEYS.lang,
       "kpf_level", "h5_flock-feast_v1"].forEach((k) => localStorage.removeItem(k));
      Object.keys(localStorage)
        .filter((k) => k.indexOf("h5_flock-feast_levellab") === 0)
        .forEach((k) => localStorage.removeItem(k));
      localStorage.setItem(RESET_TOKEN, "1");
    }
  } catch (e) {}

  // One-time migration from the pre-GAME_ID save key used by the v1 KPF shell,
  // so upgrading players don't lose their level progress.
  const _legacyLevel = localStorage.getItem("kpf_level");
  if (_legacyLevel !== null && localStorage.getItem(STORAGE_KEYS.level) === null) {
    localStorage.setItem(STORAGE_KEYS.level, _legacyLevel);
    localStorage.removeItem("kpf_level");
  }

  let level;
  try { level = parseInt(localStorage.getItem(STORAGE_KEYS.level), 10) || 1; } catch(e) { level = 1; }

  // Guards against committing the same win twice (e.g. duplicate complete
  // messages, or a win commit followed by tapping "Continue").
  let _winCommitted = false;

  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEYS.level, level); } catch(e) {}
  }

  // Persist a level win immediately when it happens (not when the player taps
  // "Continue"), so quitting on the win screen still saves progress and the
  // player resumes on the next level rather than replaying the one they beat.
  function commitLevelWin() {
    if (_winCommitted) return;
    _winCommitted = true;
    level++;
    // In loop mode: clear the current level id so startFeedLevel picks the next one.
    if (isInLoopMode()) {
      loopState.currentLevelId = null;
      _saveLoopState();
    }
    saveProgress();
    // Keep the "Play Level X" / header labels in sync with the new level.
    updateLevelLabels();
  }

  // ════════════════════════════════════════════════════════════════
  // POST-CONTENT LEVEL LOOP SYSTEM
  // After the player completes all 25 content levels, levels are
  // served in a repeating E → E → M → M → H sequence.
  // Each difficulty tier uses a shuffled deck so every level in a
  // tier is played once before any repeats.  State is persisted in
  // localStorage so it survives app restarts.
  //
  // FTUE levels (1, 4, 10, 11, 21) and their immediate followup levels
  // (2, 5, 12, 22) are excluded from the pool so players never get
  // coached again post-content. Level 10 is the lock & key tutorial —
  // it is the first board that carries locked eggs.
  //
  // Difficulty zones are based on game-mechanic bands:
  //   Easy   – plain mechanics   – levels 3, 6-9
  //   Medium – mystery crackers  – levels 13-20
  //   Hard   – lock / key        – levels 23-25
  // ════════════════════════════════════════════════════════════════

  const MAX_CONTENT_LEVEL = 25;

  // Levels that must never enter the loop pool.
  const LOOP_EXCLUDED = new Set([1, 2, 4, 5, 10, 11, 12, 21, 22]);

  // Difficulty assignment by mechanic zone (excludes FTUE/followups).
  const LEVEL_DIFFICULTY = {};
  for (let i = 3;  i <= 10; i++) if (!LOOP_EXCLUDED.has(i)) LEVEL_DIFFICULTY[i] = 'E';
  for (let i = 13; i <= 20; i++) if (!LOOP_EXCLUDED.has(i)) LEVEL_DIFFICULTY[i] = 'M';
  for (let i = 23; i <= 25; i++) if (!LOOP_EXCLUDED.has(i)) LEVEL_DIFFICULTY[i] = 'H';

  // Pools keyed by tier letter.
  const LOOP_POOLS = {
    E: Object.entries(LEVEL_DIFFICULTY).filter(([,d]) => d === 'E').map(([id]) => +id).sort((a,b)=>a-b),
    M: Object.entries(LEVEL_DIFFICULTY).filter(([,d]) => d === 'M').map(([id]) => +id).sort((a,b)=>a-b),
    H: Object.entries(LEVEL_DIFFICULTY).filter(([,d]) => d === 'H').map(([id]) => +id).sort((a,b)=>a-b),
  };
  // LOOP_POOLS.E  →  [3, 6, 7, 8, 9]
  // LOOP_POOLS.M  →  [13, 14, 15, 16, 17, 18, 19, 20]
  // LOOP_POOLS.H  →  [23, 24, 25]

  // Presentation order: Easy, Easy, Medium, Medium, Hard (then repeats).
  const LOOP_SEQUENCE = ['E', 'E', 'M', 'M', 'H'];

  function _shuffleArr(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // loopState shape:
  //   slot          – index 0-4 into LOOP_SEQUENCE; next tier to serve
  //   decks         – remaining (unplayed-this-cycle) level ids per tier
  //   currentLevelId – actual level id currently queued/playing in loop mode
  //                   (null means "needs a fresh pick on next start")
  function _initLoopState() {
    return {
      slot: 0,
      decks: {
        E: _shuffleArr([...LOOP_POOLS.E]),
        M: _shuffleArr([...LOOP_POOLS.M]),
        H: _shuffleArr([...LOOP_POOLS.H]),
      },
      currentLevelId: null,
    };
  }

  function _loadLoopState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEYS.loop);
      if (raw) {
        const s = JSON.parse(raw);
        if (
          typeof s.slot === 'number' &&
          s.decks && typeof s.decks === 'object' &&
          Array.isArray(s.decks.E) &&
          Array.isArray(s.decks.M) &&
          Array.isArray(s.decks.H)
        ) {
          // Drop any stale ids that are no longer in the pool (safety guard).
          for (const tier of ['E', 'M', 'H']) {
            s.decks[tier] = s.decks[tier].filter(id => LOOP_POOLS[tier].includes(id));
          }
          s.slot = ((s.slot | 0) + LOOP_SEQUENCE.length) % LOOP_SEQUENCE.length;
          s.currentLevelId = (typeof s.currentLevelId === 'number') ? s.currentLevelId : null;
          return s;
        }
      }
    } catch(e) {}
    return _initLoopState();
  }

  let loopState = _loadLoopState();

  function _saveLoopState() {
    try {
      localStorage.setItem(STORAGE_KEYS.loop, JSON.stringify(loopState));
    } catch(e) {}
  }

  // Draw the next loop level from the appropriate deck and advance the slot.
  // Must only be called once per new loop-level start (not on retries).
  function _advanceLoopLevel() {
    const tier = LOOP_SEQUENCE[loopState.slot];
    // Refill deck if exhausted (all levels in this tier have been played once).
    if (loopState.decks[tier].length === 0) {
      loopState.decks[tier] = _shuffleArr([...LOOP_POOLS[tier]]);
    }
    loopState.currentLevelId = loopState.decks[tier].shift();
    loopState.slot = (loopState.slot + 1) % LOOP_SEQUENCE.length;
    _saveLoopState();
  }

  function _resetLoopState() {
    loopState = _initLoopState();
    _saveLoopState();
  }

  // Returns true when the player has passed all 25 content levels.
  function isInLoopMode() { return level > MAX_CONTENT_LEVEL; }

  // ---------- Capacitor Edge-to-Edge ----------
  // Removes status bar / navigation bar gaps on Android/iOS APK builds.
  // Requires @capacitor/status-bar plugin installed in the Capacitor project.
  // The CSS already uses env(safe-area-inset-*) and viewport-fit=cover to
  // inset content away from notches/home indicators once overlay mode is active.
  (function initEdgeToEdge() {
    if (!window.Capacitor || !window.Capacitor.Plugins) return;
    const { StatusBar } = window.Capacitor.Plugins;
    if (StatusBar) {
      StatusBar.setOverlaysWebView({ overlay: true });
      StatusBar.setBackgroundColor({ color: "#00000000" });
      StatusBar.setStyle({ style: "LIGHT" });
    }
  })();

  // ---------- Haptics ----------
  // Call haptic("tap"|"success"|"error"|"heavy") on any meaningful interaction.
  // Respects the settings toggle. No-ops on unsupported devices.
  // Uses Capacitor Haptics plugin when available (APK builds), falls back to Vibration API.
  const toggleHaptics = document.getElementById("toggleHaptics");
  const HAPTIC_PATTERNS = {
    tap:     [10],
    success: [30, 50, 60, 50, 100],
    error:   [80, 40, 80],
    heavy:   [40]
  };

  // Capacitor Haptics mapping
  const _capHaptics = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
  const _CAP_MAP = {
    tap:     () => _capHaptics.impact({ style: "Light" }),
    success: () => _capHaptics.notification({ type: "SUCCESS" }),
    error:   () => _capHaptics.notification({ type: "ERROR" }),
    heavy:   () => _capHaptics.impact({ style: "Heavy" })
  };

  function haptic(type) {
    if (!toggleHaptics.checked) return;
    if (_capHaptics) {
      (_CAP_MAP[type] || _CAP_MAP.tap)();
      return;
    }
    if (!navigator.vibrate) return;
    navigator.vibrate(HAPTIC_PATTERNS[type] || [10]);
  }

  // ---------- Audio Engine (Web Audio API) ----------
  // Sound registry: add entries as { name: "path/to/file.mp3" }.
  // Routing: filenames containing "bgm" → Music channel; everything else → SFX.
  const AUDIO_FILES = {
    // Key names containing "bgm" route to Music channel; all others route to SFX.
sfx_button:        "AUDIO_FILES/KPF SFX button.mp3",
sfx_toggle:        "AUDIO_FILES/KPF SFX ToggleButton.mp3",
sfx_levelfail:     "AUDIO_FILES/KPF SFX levelFail.mp3",
sfx_welldone:      "AUDIO_FILES/KPF SFX WelldoneTxt.mp3",
sfx_levelcomplete: "AUDIO_FILES/KPF SFX LevelComplete.mp3",
sfx_popup:         "AUDIO_FILES/KPF SFX Popup.mp3",
    sfx_birdflyaway1:  "AUDIO_FILES/H5_FF_BirdFlyAway1.mp3",
    sfx_birdflyaway2:  "AUDIO_FILES/H5_FF_BirdFlyAway2.mp3",
    sfx_eggcracked:    "AUDIO_FILES/H5_FF_EggCracked.mp3",
    sfx_grainsgrind:   "AUDIO_FILES/H5_FF_GrainsGrind.mp3",
  };

  const toggleMusic = document.getElementById("toggleMusic");
  const toggleSound = document.getElementById("toggleSound");

  let _actx = null;
  function getAudioContext() {
    if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
    return _actx;
  }

  // Resume context on first user gesture
  document.addEventListener("pointerdown", () => {
    if (_actx && _actx.state === "suspended") _actx.resume();
  }, { once: false });

  // Decoded buffers cache
  const _buffers = {};

  async function loadAudio(name) {
    if (_buffers[name] !== undefined) return _buffers[name]; // null = failed, skip retry
    _buffers[name] = null; // sentinel: blocks concurrent duplicate fetches
    const ctx = getAudioContext();
    try {
      const resp = await fetch(encodeURI(AUDIO_FILES[name]));
      if (!resp.ok) throw new Error(resp.status + " " + resp.statusText);
      const arrayBuf = await resp.arrayBuffer();
      _buffers[name] = await ctx.decodeAudioData(arrayBuf);
    } catch (e) {
      console.warn("[Audio] Failed to load", name, e);
      _buffers[name] = null; // keep sentinel so we never retry a missing file
      return null;
    }
    return _buffers[name];
  }

  function preloadAllAudio() {
    Object.keys(AUDIO_FILES).forEach(loadAudio);
  }

  // Channel routing: key or path containing "bgm" → music, else → sfx
  function getChannel(name) {
    return (name.includes("bgm") || (AUDIO_FILES[name] && AUDIO_FILES[name].includes("bgm"))) ? "music" : "sfx";
  }

  // Mixer state
  const _mixerDefaults = { master: 100, sfx: 100, music: 100, sfxMute: false, sfxSolo: false, musicMute: false, musicSolo: false, sounds: {} };
  let _mixer = JSON.parse(JSON.stringify(_mixerDefaults));
  const _savedMixer = localStorage.getItem(STORAGE_KEYS.mixer);
  if (_savedMixer) {
    try { Object.assign(_mixer, JSON.parse(_savedMixer)); } catch(e) {}
  }

  // Gain nodes
  let _masterGain = null;
  let _sfxGain = null;
  let _musicGain = null;
  let _meterInput = null; // for loudness meter

  function ensureGainGraph() {
    if (_masterGain) return;
    const ctx = getAudioContext();
    _masterGain = ctx.createGain();
    _sfxGain = ctx.createGain();
    _musicGain = ctx.createGain();
    _sfxGain.connect(_masterGain);
    _musicGain.connect(_masterGain);
    _masterGain.connect(ctx.destination);
    // Meter tap (parallel)
    _meterInput = ctx.createGain();
    _meterInput.gain.value = 1;
    _masterGain.connect(_meterInput);
    applyMixerGains();
  }

  function applyMixerGains() {
    if (!_masterGain) return;
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    _masterGain.gain.setTargetAtTime(_mixer.master / 100, now, 0.02);

    // Solo logic: if any channel is soloed, others are silenced
    const anySolo = _mixer.sfxSolo || _mixer.musicSolo;
    let sfxVol = _mixer.sfxMute ? 0 : _mixer.sfx / 100;
    let musicVol = _mixer.musicMute ? 0 : _mixer.music / 100;
    if (anySolo) {
      if (!_mixer.sfxSolo) sfxVol = 0;
      if (!_mixer.musicSolo) musicVol = 0;
    }
    // Settings toggles
    if (!toggleSound.checked) sfxVol = 0;
    if (!toggleMusic.checked) musicVol = 0;

    _sfxGain.gain.setTargetAtTime(sfxVol, now, 0.02);
    _musicGain.gain.setTargetAtTime(musicVol, now, 0.02);

    // Per-sound gains
    _activeInstances.forEach(inst => {
      if (!inst.gainNode) return;
      const snd = _mixer.sounds[inst.name] || {};
      const sndMute = snd.mute || false;
      const sndSolo = snd.solo || false;
      let vol = (snd.volume !== undefined ? snd.volume : 100) / 100;
      if (sndMute) vol = 0;
      // Per-sound solo: if any in the same channel is soloed, silence non-soloed
      const ch = getChannel(inst.name);
      const channelSounds = Object.keys(AUDIO_FILES).filter(n => getChannel(n) === ch);
      const anySndsolo = channelSounds.some(n => (_mixer.sounds[n] || {}).solo);
      if (anySndsolo && !sndSolo) vol = 0;
      inst.gainNode.gain.setTargetAtTime(vol, now, 0.02);
      // Live loop update
      if (inst.source && inst.source.loop !== undefined) {
        inst.source.loop = snd.loop || false;
      }
    });
  }

  // Active sound instances (for live updates)
  const _activeInstances = [];

  function playSound(name, { loop = false } = {}) {
    if (!AUDIO_FILES[name]) return null;
    const ctx = getAudioContext();
    ensureGainGraph();
    const buffer = _buffers[name];
    if (buffer === null) return null; // failed previously — do not retry
    if (buffer === undefined) { loadAudio(name).then(buf => { if (buf) playSound(name, { loop }); }); return null; }
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const sndSettings = _mixer.sounds[name] || {};
    source.loop = sndSettings.loop !== undefined ? sndSettings.loop : loop;
    const gainNode = ctx.createGain();
    const vol = (sndSettings.volume !== undefined ? sndSettings.volume : 100) / 100;
    gainNode.gain.value = sndSettings.mute ? 0 : vol;
    source.connect(gainNode);
    const ch = getChannel(name);
    gainNode.connect(ch === "music" ? _musicGain : _sfxGain);
    source.start();
    const inst = { name, source, gainNode };
    _activeInstances.push(inst);
    source.onended = () => {
      const idx = _activeInstances.indexOf(inst);
      if (idx !== -1) _activeInstances.splice(idx, 1);
    };
    return inst;
  }

  function stopSound(inst) {
    if (!inst || !inst.source) return;
    try { inst.source.stop(); } catch(e) {}
  }

  // ---------- Background Audio ----------
  let _bgInstances = [];
  let _bgPlaying = false;

  async function playBackgroundAudio() {
    if (_bgPlaying) return;
    _bgPlaying = true;
    const ctx = getAudioContext();
    await ctx.resume();
    ensureGainGraph();
    for (const name of Object.keys(AUDIO_FILES)) {
      if (getChannel(name) === "music") {
        await loadAudio(name);
        if (!_bgPlaying) return;
        const inst = playSound(name, { loop: true });
        if (inst) _bgInstances.push(inst);
      }
    }
  }

  function stopBackgroundAudio() {
    _bgPlaying = false;
    _bgInstances.forEach(stopSound);
    _bgInstances = [];
  }

  toggleHaptics.addEventListener("change", () => { sfxToggle(); _saveSettings(); });

  // ---------- Loudness Meter (ITU-R BS.1770 approx) ----------
  let _meterRAF = null;
  let _meterAnalyser = null;
  let _kWeightHigh = null;
  let _kWeightShelf = null;
  let _meterBuffer = null;
  let _meterShortRing = [];
  let _meterIntegrated = { sum: 0, count: 0 };
  let _meterTruePeak = -Infinity;

  function initMeter() {
    if (_meterAnalyser) return;
    const ctx = getAudioContext();
    ensureGainGraph();

    // K-weighting: high-pass 60Hz + high-shelf 1500Hz +4dB (approx BS.1770)
    _kWeightHigh = ctx.createBiquadFilter();
    _kWeightHigh.type = "highpass";
    _kWeightHigh.frequency.value = 60;
    _kWeightHigh.Q.value = 0.5;

    _kWeightShelf = ctx.createBiquadFilter();
    _kWeightShelf.type = "highshelf";
    _kWeightShelf.frequency.value = 1500;
    _kWeightShelf.gain.value = 4;

    _meterAnalyser = ctx.createAnalyser();
    _meterAnalyser.fftSize = 2048;

    _meterInput.connect(_kWeightHigh);
    _kWeightHigh.connect(_kWeightShelf);
    _kWeightShelf.connect(_meterAnalyser);

    _meterBuffer = new Float32Array(_meterAnalyser.fftSize);
  }

  function meterTick() {
    if (!_meterAnalyser) return;
    _meterAnalyser.getFloatTimeDomainData(_meterBuffer);
    const len = _meterBuffer.length;

    // RMS for this block
    let sumSq = 0;
    let blockPeak = 0;
    for (let i = 0; i < len; i++) {
      const s = _meterBuffer[i];
      sumSq += s * s;
      const abs = Math.abs(s);
      if (abs > blockPeak) blockPeak = abs;
    }
    const rms = Math.sqrt(sumSq / len);

    // 4x oversampled true peak approximation (linear interp between samples)
    for (let i = 0; i < len - 1; i++) {
      const a = _meterBuffer[i], b = _meterBuffer[i + 1];
      for (let j = 1; j <= 3; j++) {
        const interp = Math.abs(a + (b - a) * (j / 4));
        if (interp > blockPeak) blockPeak = interp;
      }
    }

    const dbTP = blockPeak > 0 ? 20 * Math.log10(blockPeak) : -Infinity;
    if (dbTP > _meterTruePeak) _meterTruePeak = dbTP;

    // LUFS = -0.691 + 10*log10(mean_square) (simplified)
    const lufs = rms > 0 ? -0.691 + 10 * Math.log10(rms * rms) : -Infinity;

    // Short-term: trailing 3s ring buffer (~3s of blocks at rAF rate)
    const now = performance.now();
    _meterShortRing.push({ t: now, sq: rms * rms });
    while (_meterShortRing.length && _meterShortRing[0].t < now - 3000) _meterShortRing.shift();
    let shortSum = 0;
    for (const b of _meterShortRing) shortSum += b.sq;
    const shortMean = shortSum / (_meterShortRing.length || 1);
    const shortLUFS = shortMean > 0 ? -0.691 + 10 * Math.log10(shortMean) : -Infinity;

    // Integrated (gated: only blocks > -70 LUFS)
    if (lufs > -70) {
      _meterIntegrated.sum += rms * rms;
      _meterIntegrated.count++;
    }
    const intMean = _meterIntegrated.count > 0 ? _meterIntegrated.sum / _meterIntegrated.count : 0;
    const intLUFS = intMean > 0 ? -0.691 + 10 * Math.log10(intMean) : -Infinity;

    // Update UI
    document.getElementById("meterShort").textContent = isFinite(shortLUFS) ? shortLUFS.toFixed(1) : "—";
    document.getElementById("meterIntegrated").textContent = isFinite(intLUFS) ? intLUFS.toFixed(1) : "—";
    document.getElementById("meterPeak").textContent = isFinite(_meterTruePeak) ? _meterTruePeak.toFixed(1) : "—";
  }

  function startMeter() {
    initMeter();
    if (_meterRAF) return;
    function loop() {
      meterTick();
      _meterRAF = requestAnimationFrame(loop);
    }
    _meterRAF = requestAnimationFrame(loop);
  }

  function stopMeter() {
    if (_meterRAF) { cancelAnimationFrame(_meterRAF); _meterRAF = null; }
  }

  function resetMeter() {
    _meterShortRing = [];
    _meterIntegrated = { sum: 0, count: 0 };
    _meterTruePeak = -Infinity;
    document.getElementById("meterShort").textContent = "—";
    document.getElementById("meterIntegrated").textContent = "—";
    document.getElementById("meterPeak").textContent = "—";
  }

  // ---------- Debug Mixer UI Logic ----------
  function buildMixerUI() {
    const scroll = document.getElementById("mixerSoundsScroll");
    scroll.innerHTML = "";

    if (!names.length) {

    names.forEach(name => {

      const strip = document.createElement("div");

          <button class="mixer-tog${snd.solo ? ' active' : ''}" data-snd="${name}" data-prop="solo">S</button>

    scroll.querySelectorAll('input[type="range"]').forEach(slider => {

        if (prop === "mute") btn.classList.toggle("mute-active");
        else btn.classList.toggle("active");
        applyMixerGains();
      });
    });
  }

  // ---------- Game Loop (60 fps cap) ----------
  // All gameplay rendering/logic goes in updateGame(dt).
  // The loop is started by startGame() and stopped by levelComplete()/levelFailed().
  // On high-refresh-rate displays (90/120 Hz) frames are skipped to hold 60 fps.
  const FRAME_MS = 1000 / 60;
  let _lastFrame = 0;
  let _gameRAF = null;

  function _tick(now) {
    _gameRAF = requestAnimationFrame(_tick);
    const dt = now - _lastFrame;
    if (dt < FRAME_MS) return;
    _lastFrame = now - (dt % FRAME_MS);
    updateGame(dt);
  }

  function startLoop() {
    if (_gameRAF) return;
    _lastFrame = performance.now();
    _gameRAF = requestAnimationFrame(_tick);
  }

  function stopLoop() {
    if (_gameRAF) {
      cancelAnimationFrame(_gameRAF);
      _gameRAF = null;
    }
  }

  // ★ YOUR GAME LOGIC — called at 60 fps with delta time in ms ★
  function updateGame(dt) {
        if (!feedReady || !gameScreen.classList.contains("active") || !feedGame.contentWindow) return;
        postToFeed({ type: "flock-feast:tick", dt });
  }

    function startFeedLevel(){
        if (!feedReady || !feedGame.contentWindow) return;
        // A new level is starting — allow the next win to be committed.
        _winCommitted = false;
        let levelToPlay = level;
        if (isInLoopMode()) {
          // Pick a new loop level only if none is queued (i.e. a fresh start, not a retry).
          if (loopState.currentLevelId === null) _advanceLoopLevel();
          levelToPlay = loopState.currentLevelId;
        }
        postToFeed({ type: "flock-feast:start", level: levelToPlay, displayLevel: level });
        notifyFeedViewport();
    }

    // Forward the active language dict to the gameplay iframe so its tutorials,
    // toasts and HUD text stay in sync with the parent's translations.js.
    function sendFeedLanguage(){
        if (!feedReady || !feedGame.contentWindow) return;
        postToFeed({ type: "flock-feast:i18n", lang, dict: I18N[lang] });
    }

  async function enterGameplay() {

    resetLevelCompleteState();
    updateLevelLabels();
    showScreen(gameScreen);
    notifyFeedViewport();
    await ensureFeedLoaded().catch(() => {});
    // If the first attempt never produced a ready frame, mount once more rather than
    // leaving the player staring at an empty game screen.
    if (!feedReady) await ensureFeedLoaded().catch(() => {});
    sendFeedSafeArea();
    sendFeedLanguage();
    startLoop();
    startFeedLevel();

  // ---------- Localisation ----------
  // Text strings live in translations.js (window.GAME_TEXT). Edit that file to
  // change wording or add new strings / languages.
  const I18N = window.GAME_TEXT;
  const LANGS = window.LANGUAGE_ORDER || Object.keys(I18N);
  const i18nEls = document.querySelectorAll("[data-i18n]");

  // Detects the best-matching supported language from the device/browser
  // locale (matching on the primary subtag, e.g. "pl-PL" -> "pl"), falling
  // back to LANGS[0] when nothing matches.
  function detectDeviceLanguage(){
    const candidates = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language];
    for (const candidate of candidates){
      if (!candidate) continue;
      const primary = candidate.split("-")[0].toLowerCase();
      const match = LANGS.find((l) => l.toLowerCase() === primary);
      if (match) return match;
    }
    return LANGS[0];
  }

  let lang = detectDeviceLanguage();
  // Tracks whether the user has explicitly picked a language via the
  // in-game toggle, so later device locale changes don't override it.
  let langManuallySet = false;
  // Restore persisted language selection.
  try {
    const _savedLang = localStorage.getItem(STORAGE_KEYS.lang);
    if (_savedLang && LANGS.includes(_savedLang)) {
      lang = _savedLang;
      langManuallySet = true;
    }
  } catch(e) {}
  const t = (key) => I18N[lang][key];

  // Keep the language in sync with the device locale while the app is
  // open, unless the user has manually chosen a language.
  window.addEventListener("languagechange", () => {
    if (langManuallySet) return;
    lang = detectDeviceLanguage();
    applyLanguage();
  });

  function applyLanguage(){
    const dict = I18N[lang];
    // Static text nodes flagged with data-i18n
    i18nEls.forEach((el) => {
      const key = el.getAttribute("data-i18n");
      if (dict[key] !== undefined) el.textContent = dict[key];

        overlaySubtitle.textContent = dict.failSubtitle;
        overlayBtn.textContent = dict.retry;
      }
    }
  }

  function toggleLanguage(){
    const i = LANGS.indexOf(lang);

  // Android hardware-back softlock fallback (self-contained, CSS-only — see the
