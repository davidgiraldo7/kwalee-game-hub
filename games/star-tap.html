<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Star Tap</title>
  <link rel="stylesheet" href="play.css">
  <style>
    body { align-items: center; justify-content: center; }
    button.star {
      width: 168px; height: 168px; border: 0; border-radius: 50%;
      background: #ffcb05; color: #1032cf; font-size: 72px; line-height: 1;
      box-shadow: 0 10px 0 #d9a904;
    }
    button.star:active { transform: translateY(6px); box-shadow: 0 4px 0 #d9a904; }
    button.star:disabled { opacity: .55; cursor: default; transform: none; }
  </style>
</head>
<body>
  <div class="stats">
    <div><div class="stat-v info" id="score">0</div><div class="stat-l">Score</div></div>
    <div><div class="stat-v" id="time">10</div><div class="stat-l">Time</div></div>
  </div>
  <button class="star" id="star" type="button" disabled>★</button>
  <button class="primary" id="go" type="button">Start</button>
  <p class="note" id="note">Tap the star for 10 seconds.</p>
<script src="play.js"></script>
<script>
(function () {
  var DURATION = 10;
  var score = 0;
  var left = DURATION;
  var running = false;
  var timer = null;
  var scoreEl = document.getElementById("score");
  var timeEl = document.getElementById("time");
  var star = document.getElementById("star");
  var go = document.getElementById("go");
  var note = document.getElementById("note");

  function finish() {
    running = false;
    clearInterval(timer);
    star.disabled = true;
    go.disabled = false;
    go.textContent = "Play again";
    note.textContent = "Run sent to the hub: " + score;
    Play.sendScore(score);
  }

  go.addEventListener("click", function () {
    if (running) return;
    score = 0;
    left = DURATION;
    running = true;
    scoreEl.textContent = "0";
    timeEl.textContent = String(left);
    star.disabled = false;
    go.disabled = true;
    note.textContent = "Tap the star.";
    timer = setInterval(function () {
      left -= 1;
      timeEl.textContent = String(left);
      if (left <= 0) finish();
    }, 1000);
  });

  star.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (!running) return;
    score += 1;
    scoreEl.textContent = String(score);
  });
})();
</script>
</body>
</html>
