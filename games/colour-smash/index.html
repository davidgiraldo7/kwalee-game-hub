<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Color Smash</title>
    <style>
        @font-face {
            font-family: "Fredoka";
            src: url("Fredoka-Medium.ttf") format("truetype");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Fredoka";
            src: url("Fredoka-SemiBold.ttf") format("truetype");
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Fredoka";
            src: url("Fredoka-Bold.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
            font-weight: 600;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: #fff;
            overflow: hidden;
        }

        /* App fills the entire viewport on all devices */
        .app {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #ffffff;
        }

        /* ---------- Screens ---------- */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity .25s ease;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* ---------- Start Screen ---------- */
        #startScreen {
            justify-content: center;
            gap: 40px;
            padding: 24px;
            text-align: center;
            background: linear-gradient(0deg, #ebf9ff 0%, #ffffff 100%);
        }

        /* Tiled scrolling background */
        .bg-scroll {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-image:
                radial-gradient(circle at 20px 20px, rgba(93, 155, 255, .14) 6px, transparent 7px),
                radial-gradient(circle at 60px 60px, rgba(56, 220, 133, .12) 6px, transparent 7px);
            background-size: 80px 80px;
            animation: bgScroll 7s linear infinite;
        }

        @keyframes bgScroll {
            from {
                background-position: 0 0, 0 0;
            }

            to {
                background-position: 80px 80px, 80px 80px;
            }
        }

        .game-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 1;
            top: -9%;
        }

        .game-logo .logo-img {
            width: 64%;
            max-width: 285px;
            height: auto;
            display: block;
        }

        .playbtn {
            border: none;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(180deg, #38dc85 0%, #28c76f 100%);
            font-family: inherit;
            font-weight: 500;
            width: 180px;
            height: 64px;
            max-width: 100%;
            border-radius: 999px;
            box-shadow: 0 7px 0 #1fa459;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            position: absolute;
            z-index: 1;
            left: 50%;
            bottom: 15%;
            transform: translateX(-50%);
            transition: transform .06s ease, box-shadow .06s ease;
        }

        .playbtn:active {
            transform: translateX(-50%) translateY(4px);
            box-shadow: 0 3px 0 #1fa459;
        }

        .playbtn .play-level {
            font-size: 26px;
            letter-spacing: 1px;
        }

        /* ---------- Home Bar (bottom tabs) ---------- */
        .home-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            display: flex;
            background: #ffffff;
            border-top: 1px solid rgba(0, 0, 0, .08);
            box-shadow: 0 -4px 16px rgba(0, 0, 0, .06);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .home-bar .tab {
            flex: 1;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 0 16px;
            color: #b8c0cc;
            transition: transform .06s ease;
        }

        .home-bar .tab:active {
            transform: translateY(1px);
        }

        .home-bar .tab .tab-icon {
            width: 35px;
            height: 35px;
            background-color: currentColor;
            -webkit-mask: var(--icon) no-repeat center / contain;
            mask: var(--icon) no-repeat center / contain;
        }

        .home-bar .tab .tab-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .home-bar .tab.active {
            color: #4ec1f2;
        }

        .home-bar .tab.locked {
            color: #c4ccd6;
        }

        /* ---------- Game Screen ---------- */
        #gameScreen {
            justify-content: flex-start;
            background: #f8e4c5;
        }

        .header {
            margin-top: calc(18px + env(safe-area-inset-top, 0px));
            background: #d8e4f0;
            color: #241a44;
            border: 1px solid rgba(0, 0, 0, .05);
            padding: 6px 18px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: .5px;
            animation: headerIn .5s cubic-bezier(.2, 1.4, .35, 1) forwards;
            transition: transform var(--cs-outro-move-ms, 400ms) cubic-bezier(.4, 0, 1, 1),
                opacity var(--cs-outro-fade-ms, 300ms) ease;
        }

        .header.exit-up {
            animation: none;
            transform: translateY(-80px);
            opacity: 0;
        }

        #gameScreen .header {
            padding: 7px 22px;
            font-size: 18px;
            letter-spacing: .6px;
        }

        @keyframes headerIn {
            0% {
                opacity: 0;
                transform: translateY(-26px) scale(.8);
            }

            60% {
                opacity: 1;
                transform: translateY(4px) scale(1.05);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ---------- Flavour text (level complete) ---------- */
        .flavour-text {
            --result-text-size: 52px;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 8;
            opacity: 0;
        }

        .flavour-text::before,
        .fail-text::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: calc(var(--result-text-size) * 2.5);
            transform: translateY(-50%);
            background: rgba(58, 64, 74, .52);
            opacity: 0;
            transition: opacity .2s ease;
        }

        .flavour-text span {
            position: relative;
            z-index: 1;
            font-size: var(--result-text-size);
            font-weight: 800;
            color: #38dc85;
            text-shadow: 0 4px 12px rgba(56, 220, 133, .4);
            transform: scale(0);
        }

        .flavour-text.show {
            opacity: 1;
        }

        .flavour-text.show::before,
        .fail-text.show::before {
            opacity: 1;
        }

        .flavour-text.show span {
            animation: flavourPop .6s cubic-bezier(.2, 1.6, .35, 1) forwards;
        }

        .flavour-text.dismiss span {
            animation: flavourOut .4s ease forwards;
        }

        .flavour-text.dismiss::before,
        .fail-text.settle::before {
            opacity: 0;
        }

        @keyframes flavourPop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes flavourOut {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

        /* ---------- Fail text (level failed) ---------- */
        .fail-text {
            --result-text-size: 46px;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 12;
            opacity: 0;
        }

        .fail-text span {
            position: relative;
            z-index: 1;
            font-size: var(--result-text-size);
            font-weight: 800;
            color: #ff6b70;
            text-shadow: 0 4px 12px rgba(255, 90, 95, .35);
            opacity: 0;
            transform: translateY(0);
            transition: transform .5s cubic-bezier(.4, 0, .2, 1), opacity .4s ease;
        }

        .fail-text.show {
            opacity: 1;
        }

        .fail-text.show span {
            opacity: 1;
        }

        .fail-text.settle span {
            transform: translateY(-80px);
        }

        .play-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            color: #a09ab4;
            font-size: 15px;
            font-weight: 600;
        }

        /* ---------- Color Smash HUD ---------- */
        .cs-hud {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            transition: transform var(--cs-outro-move-ms, 400ms) cubic-bezier(.4, 0, 1, 1),
                opacity var(--cs-outro-fade-ms, 300ms) ease;
        }

        .header.exit-up + .cs-hud {
            transform: translateY(-40px);
            opacity: 0;
        }

        .cs-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #eef2f8;
            border: 1px solid rgba(0, 0, 0, .05);
            border-radius: 999px;
            padding: 5px 14px;
            color: #241a44;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(36, 26, 68, .06);
        }

        .cs-pill-label {
            text-transform: uppercase;
            letter-spacing: .5px;
            font-size: 10px;
            color: #8a83a6;
        }

        .cs-pill-value {
            font-size: 15px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .cs-progress {
            width: 62px;
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(36, 26, 68, .16);
            box-shadow: inset 0 1px 2px rgba(36, 26, 68, .16);
        }

        .cs-progress-fill {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #44d87d, #20b95e);
            box-shadow: 0 1px 2px rgba(19, 130, 67, .32);
            transition: width .28s cubic-bezier(.2, .9, .3, 1);
        }

        .cs-pill.warn {
            background: #ffe3e0;
            border-color: rgba(255, 90, 95, .35);
        }

        .cs-pill.warn .cs-pill-value {
            color: #ff5a5f;
        }

        .cs-pill.complete {
            background: #dcf7e7;
            border-color: rgba(40, 199, 111, .35);
        }

        .cs-pill.complete .cs-pill-value {
            color: #28c76f;
        }

        #gameScreen .cs-hud {
            gap: 12px;
            margin-top: 14px;
        }

        #gameScreen .cs-pill {
            gap: 7px;
            border-width: 1.2px;
            padding: 6px 17px;
            font-size: 16px;
        }

        #gameScreen .cs-pill-label {
            letter-spacing: .6px;
            font-size: 12px;
        }

        #gameScreen .cs-pill-value {
            font-size: 18px;
        }

        #gameScreen .cs-progress {
            width: 72px;
            height: 9px;
        }

        .cs-pill.last-move {
            border-color: #ff5a5f;
            box-shadow: 0 0 0 1px rgba(255, 90, 95, .55), 0 0 12px rgba(255, 90, 95, .42);
            animation: lastMovePulse .7s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes lastMovePulse {
            from {
                border-color: #ff5a5f;
                transform: scale(1);
            }

            to {
                border-color: #ff272d;
                transform: scale(1.08);
            }
        }

        #gameScreen.ui-exit-up .header,
        #gameScreen.ui-exit-up .settingsbtn,
        #gameScreen.ui-exit-up .cs-hud {
            transform: translateY(var(--cs-outro-offset-y, -140px));
            opacity: 0;
        }

        #gameScreen .settingsbtn {
            transition: transform var(--cs-outro-move-ms, 400ms) cubic-bezier(.4, 0, 1, 1),
                opacity var(--cs-outro-fade-ms, 300ms) ease;
        }

        @media (prefers-reduced-motion: reduce) {
            .cs-pill.last-move {
                animation: none;
            }
        }

        .cs-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* ---------- Debug buttons ---------- */
        .debug {
            position: absolute;
            right: 12px;
            bottom: calc(72px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
            z-index: 5;
        }

        .debug-label {
            font-size: 10px;
            letter-spacing: 1px;
            color: #a09ab4;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            background: none;
            padding: 4px 8px;
            font-family: inherit;
        }

        .debug-label::after {
            content: "\25B2";
            margin-left: 4px;
            font-size: 8px;
        }

        .debug.collapsed .debug-label::after {
            content: "\25BC";
        }

        .debug.collapsed .debugbtn,
        .debug.collapsed .debug-skip,
        .debug.collapsed .debug-icon-row,
        .debug.collapsed .mixer-panel,
        .debug.collapsed .cs3d-debug-panel {
            display: none;
        }

        .debug-skip {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .debug-skip input {
            width: 48px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            font-family: inherit;
            text-align: center;
            outline: none;
        }

        .debug-skip input:focus {
            border-color: #4d9bff;
        }

        .debug-reset {
            background: #ff9f43;
        }

        .debugbtn {
            border: none;
            cursor: pointer;
            color: #fff;
            font-family: inherit;
            font-weight: 500;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 999px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .35);
            opacity: .85;
            transition: transform .06s ease, opacity .12s ease;
        }

        .debugbtn:active {
            transform: translateY(2px);
        }

        .debugbtn:hover {
            opacity: 1;
        }

        .debug-win {
            background: #28c76f;
        }

        .debug-fail {
            background: #ff5a5f;
        }

        .debug-lang {
            background: #4d9bff;
        }

        /* ---------- Debug Mixer & Meter ---------- */
        .debug-icon-btn {
            border: none;
            cursor: pointer;
            background: rgba(255,255,255,.12);
            font-size: 16px;
            padding: 6px 10px;
            border-radius: 999px;
            opacity: .85;
            transition: opacity .12s;
        }
        .debug-icon-btn:hover { opacity: 1; }
        .debug-icon-row {
            display: flex;
            gap: 6px;
        }

        .debug.mixer-open .debugbtn,
        .debug.mixer-open .debug-skip,
        .debug.mixer-open .debug-reset,
        .debug.mixer-open .debug-lang,
        .debug.mixer-open .debug-label {
            display: none !important;
        }

        .mixer-panel {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 180, 80, .15);
            border-radius: 14px;
            padding: 12px;
            width: 220px;
            max-height: 420px;
            font-size: 11px;
            color: #241a44;
        }
        .debug.mixer-open .mixer-panel { display: flex; }

        .cs3d-debug-panel {
            display: none;
            flex-direction: column;
            gap: 8px;
            width: min(360px, calc(100vw - 28px));
            max-height: calc(50dvh - 14px);
            overflow: auto;
            background: rgba(15, 20, 30, .84);
            color: #eef3ff;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 10px 36px rgba(0,0,0,.36);
            backdrop-filter: blur(6px);
            font: 12px/1.3 "Trebuchet MS", system-ui, sans-serif;
        }
        .debug.cs3d-open {
            top: 14px;
            bottom: auto;
            right: 14px;
            z-index: 15;
        }
        .debug.cs3d-open .debug-label,
        .debug.cs3d-open .debug-icon-row,
        .debug.cs3d-open .debugbtn,
        .debug.cs3d-open .debug-skip,
        .debug.cs3d-open .mixer-panel {
            display: none !important;
        }
        .debug.cs3d-open .cs3d-debug-panel { display: flex; }
        .cs3d-debug-panel h3 { margin: 0; font-size: 13px; }
        .cs3d-tabbar {
            display: flex;
            gap: 4px;
            position: sticky;
            top: 0;
            background: rgba(15, 20, 30, .92);
            padding-bottom: 4px;
            z-index: 1;
        }
        .cs3d-tab {
            flex: 1;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 8px;
            background: rgba(255,255,255,.06);
            color: #b3c8ff;
            padding: 6px 4px;
            cursor: pointer;
            font: 700 11px/1 "Trebuchet MS", system-ui, sans-serif;
        }
        .cs3d-tab.active {
            background: rgba(90, 140, 255, .35);
            color: #fff;
            border-color: rgba(140, 180, 255, .6);
        }
        .cs3d-tabpage {
            flex-direction: column;
            gap: 6px;
        }
        .cs3d-debug-panel .cs3d-section {
            margin-top: 6px;
            color: #b3c8ff;
            font-weight: 700;
            letter-spacing: .2px;
        }
        .cs3d-debug-panel .cs3d-row {
            display: grid;
            grid-template-columns: 112px 1fr 58px;
            gap: 6px;
            align-items: center;
        }
        .cs3d-debug-panel input[type="range"] { width: 100%; }
        .cs3d-debug-panel input[type="number"] {
            width: 100%;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 6px;
            background: rgba(255,255,255,.1);
            color: #eef3ff;
            padding: 3px 5px;
        }
        .cs3d-debug-panel input[type="color"] {
            grid-column: 2 / span 2;
            width: 100%;
            height: 26px;
            border: 0;
            background: transparent;
        }
        .cs3d-debug-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 4px;
        }
        .cs3d-debug-actions button {
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 8px;
            background: rgba(255,255,255,.12);
            color: #f2f6ff;
            padding: 6px 8px;
            cursor: pointer;
            font: inherit;
        }

        .mixer-section-label {
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #6b6684;
            margin: 4px 0 0;
        }

        .mixer-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mixer-row label {
            flex: 1;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mixer-row input[type="range"] {
            flex: 2;
            height: 6px;
            accent-color: #28c76f;
            cursor: pointer;
        }
        .mixer-row .mixer-val {
            width: 26px;
            text-align: right;
            font-size: 10px;
            color: #6b6684;
        }

        .mixer-toggles {
            display: flex;
            gap: 4px;
            margin-top: 2px;
        }
        .mixer-tog {
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 6px;
            background: #e0dce8;
            color: #6b6684;
            transition: background .12s, color .12s;
        }
        .mixer-tog.active { background: #4d9bff; color: #fff; }
        .mixer-tog.mute-active { background: #ff5a5f; color: #fff; }

        .mixer-channel-tag {
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 4px;
            background: #e8e4f0;
            color: #6b6684;
            font-weight: 600;
        }

        .mixer-sounds-scroll {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .mixer-sounds-scroll::-webkit-scrollbar { width: 4px; }
        .mixer-sounds-scroll::-webkit-scrollbar-thumb { background: #c0bcc8; border-radius: 2px; }

        .mixer-sound-strip {
            background: rgba(255,255,255,.6);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mixer-sound-strip .mixer-row input[type="range"] {
            flex: 3;
        }

        .mixer-save-btn {
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 12px;
            padding: 8px;
            border-radius: 10px;
            background: #28c76f;
            color: #fff;
            text-align: center;
        }

        /* Loudness Meter Panel */
        .meter-panel {
            display: none;
            position: absolute;
            left: 12px;
            bottom: calc(72px + env(safe-area-inset-bottom, 0px));
            flex-direction: column;
            gap: 6px;
            background: rgba(20, 15, 40, .88);
            backdrop-filter: blur(4px);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 11px;
            color: #e0dce8;
            z-index: 5;
            min-width: 170px;
        }
        .meter-panel.show { display: flex; }

        .meter-panel h4 {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .meter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .meter-row .meter-label { color: #a09ab4; font-weight: 500; }

        /* ---------- Result Overlay ---------- */

            align-items: center;
            justify-content: center;

            padding: 24px;

        .overlay.show {
            display: flex;
            animation: fade .25s ease;
        }

        .overlay.backdrop-only .overlay-card {
            opacity: 0 !important;
            transition: none;
        }

        .overlay.reveal-content .overlay-card {
            opacity: 1 !important;
            transition: opacity .35s ease;
        }

        .overlay .overlay-card .nextbtn.btn-hidden {
            opacity: 0;
            transition: opacity .35s ease;
        }

        .overlay .overlay-card .nextbtn.btn-visible {
            opacity: 1;
            transition: opacity .35s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .overlay-card {
            background: transparent;
            box-shadow: none;
            padding: 24px;
            width: 100%;
            height: 100%;

            align-items: center;
            justify-content: center;

            z-index: 2;

                transform: translateY(0) scale(1);

            box-shadow: 0 5px 0 #c9393e;
        }

        .retrybtn:active {
            box-shadow: 0 3px 0 #c9393e;
        }

        /* ---------- Celebration VFX ---------- */

        .overlay-card h2 .ltr {

            white-space: pre;
            opacity: 0;
            transform: translateY(26px) scale(.2) rotate(-15deg);
            animation: letterPop .55s cubic-bezier(.2, 1.6, .35, 1) forwards;
        }

        @keyframes letterPop {
            0% {
                opacity: 0;
                transform: translateY(26px) scale(.2) rotate(-15deg);
            }

            60% {
                opacity: 1;
                transform: translateY(-5px) scale(1.18) rotate(4deg);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0);
            }
        }

        /* Confetti stays behind the result text and button. */
        .confetti {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Fireworks canvas covers the whole app, above all UI */
        .fireworks {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }

        /* Fade-to-white transition layer */
        .fade-black {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity .4s cubic-bezier(.4, 0, .2, 1);
        }

        .fade-black.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Expanding glow burst behind the card */
        .burst {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 320px;
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 220, 133, .55) 0%, rgba(56, 220, 133, 0) 65%);
            pointer-events: none;
            z-index: 0;
        }

        .overlay.celebrate .burst {
            animation: burst .7s ease-out forwards;
        }

        @keyframes burst {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: .9;
            }

            70% {
                opacity: .45;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.9);

        }

        /* Secondary text-only links */
        .settings-links {
            display: flex;
            flex-direction: column;

            margin-top: 18px;
        }

        .settings-link {
            border: none;

        }

        .settings-link:active {
            color: #241a44;
        }

        /* ---------- Quit Confirmation ---------- */
        .quit-confirm {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        }

        .quit-confirm-btns {

        .quit-confirm-btn {

            border: none;
            cursor: pointer;
            font-family: inherit;

            font-size: 16px;
            padding: 12px;

        .quit-yes {
            background: #ff5a5f;

            height: auto;
            opacity: 0;
            transition: opacity .6s ease;
        }

        .splash-logo.visible {
            opacity: 1;
        }
    </style>
</head>

  let fadeTimer = null;

  const fadeBlack = document.getElementById("fadeBlack");

  // Per-game storage namespace. Set GAME_ID_OVERRIDE for an explicit unique id.
  // Fallback derives an id from the page path plus a stable hash.
  const GAME_ID_OVERRIDE = "colorsmash";

  function sanitizeGameId(raw) {
    return String(raw || "").toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "");
  }

  function hash32(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    }
    return Math.abs(h).toString(36);
  }

  function resolveGameId() {
    const override = sanitizeGameId(GAME_ID_OVERRIDE || (window.GAME_ID || ""));
    if (override) return override;
    const path = (location.pathname || "game").toLowerCase();
    const leaf = sanitizeGameId(path.split("/").filter(Boolean).pop() || "game").replace(/\.html$/, "");
    return (leaf || "game") + "-" + hash32(path);
  }

  const GAME_ID = resolveGameId();
  const STORAGE_KEYS = {
    level: GAME_ID + "_level",
    mixer: GAME_ID + "_mixer",
  };

  let level = parseInt(localStorage.getItem(STORAGE_KEYS.level), 10) || 1;

  function saveProgress() {
    localStorage.setItem(STORAGE_KEYS.level, level);
  }

  // ---------- Capacitor Edge-to-Edge ----------
  // Removes status bar / navigation bar gaps on Android/iOS APK builds.
  // Requires @capacitor/status-bar plugin installed in the Capacitor project.
  // The CSS already uses env(safe-area-inset-*) and viewport-fit=cover to
  // inset content away from notches/home indicators once overlay mode is active.
  (function initEdgeToEdge() {
    if (!window.Capacitor || !window.Capacitor.Plugins) return;
    const { StatusBar } = window.Capacitor.Plugins;
    if (StatusBar) {
      StatusBar.setOverlaysWebView({ overlay: true });
      StatusBar.setBackgroundColor({ color: "#00000000" });
      StatusBar.setStyle({ style: "LIGHT" });
    }
  })();

  // ---------- Haptics ----------
  // Call haptic("tap"|"success"|"error"|"heavy") on any meaningful interaction.
  // Respects the settings toggle. No-ops on unsupported devices.
  // Uses Capacitor Haptics plugin when available (APK builds), falls back to Vibration API.
  const toggleHaptics = document.getElementById("toggleHaptics");
  const HAPTIC_PATTERNS = {
    tap:     [10],
    success: [30, 50, 60, 50, 100],
    error:   [80, 40, 80],
    heavy:   [40]
  };

  // Capacitor Haptics mapping
  const _capHaptics = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
  const _CAP_MAP = {
    tap:     () => _capHaptics.impact({ style: "Light" }),
    success: () => _capHaptics.notification({ type: "SUCCESS" }),
    error:   () => _capHaptics.notification({ type: "ERROR" }),
    heavy:   () => _capHaptics.impact({ style: "Heavy" })
  };

  function haptic(type) {
    if (!toggleHaptics.checked) return;
    if (_capHaptics) {
      (_CAP_MAP[type] || _CAP_MAP.tap)();
      return;
    }
    if (!navigator.vibrate) return;
    navigator.vibrate(HAPTIC_PATTERNS[type] || [10]);
  }

  // ---------- Audio Engine (Web Audio API) ----------
  // Sound registry: add entries as { name: "path/to/file.mp3" }.
  // Routing: filenames containing "bgm" → Music channel; everything else → SFX.
  const AUDIO_FILES = {
    // Key names containing "bgm" route to Music channel; all others route to SFX.
    sfx_button:        "AUDIO_FILES/KPF SFX button.wav",
    sfx_toggle:        "AUDIO_FILES/KPF SFX ToggleButton.wav",
    sfx_levelfail:     "AUDIO_FILES/KPF SFX levelFail.wav",
    sfx_welldone:      "AUDIO_FILES/KPF SFX WelldoneTxt.wav",
    sfx_levelcomplete: "AUDIO_FILES/KPF SFX LevelComplete.wav",
    sfx_popup:         "AUDIO_FILES/KPF SFX Popup.wav",
  };

  const toggleMusic = document.getElementById("toggleMusic");
  const toggleSound = document.getElementById("toggleSound");

  let _actx = null;
  function getAudioContext() {
    if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
    return _actx;
  }

  // Resume context on first user gesture
  document.addEventListener("pointerdown", () => {
    if (_actx && _actx.state === "suspended") _actx.resume();
  }, { once: false });

  // Decoded buffers cache
  const _buffers = {};

  async function loadAudio(name) {
    if (_buffers[name] !== undefined) return _buffers[name]; // null = failed, skip retry
    _buffers[name] = null; // sentinel: blocks concurrent duplicate fetches
    const ctx = getAudioContext();
    try {
      const resp = await fetch(encodeURI(AUDIO_FILES[name]));
      if (!resp.ok) throw new Error(resp.status + " " + resp.statusText);
      const arrayBuf = await resp.arrayBuffer();
      _buffers[name] = await ctx.decodeAudioData(arrayBuf);
    } catch (e) {
      console.warn("[Audio] Failed to load", name, e);
      _buffers[name] = null; // keep sentinel so we never retry a missing file
      return null;
    }
    return _buffers[name];
  }

  function preloadAllAudio() {
    Object.keys(AUDIO_FILES).forEach(loadAudio);
  }

  // Channel routing: key or path containing "bgm" → music, else → sfx
  function getChannel(name) {
    return (name.includes("bgm") || (AUDIO_FILES[name] && AUDIO_FILES[name].includes("bgm"))) ? "music" : "sfx";
  }

  // Mixer state
  const _mixerDefaults = { master: 100, sfx: 100, music: 100, sfxMute: false, sfxSolo: false, musicMute: false, musicSolo: false, sounds: {} };
  let _mixer = JSON.parse(JSON.stringify(_mixerDefaults));
  const _savedMixer = localStorage.getItem(STORAGE_KEYS.mixer);
  if (_savedMixer) {
    try { Object.assign(_mixer, JSON.parse(_savedMixer)); } catch(e) {}
  }

  // Gain nodes
  let _masterGain = null;
  let _sfxGain = null;
  let _musicGain = null;
  let _meterInput = null; // for loudness meter

  function ensureGainGraph() {
    if (_masterGain) return;
    const ctx = getAudioContext();
    _masterGain = ctx.createGain();
    _sfxGain = ctx.createGain();
    _musicGain = ctx.createGain();
    _sfxGain.connect(_masterGain);
    _musicGain.connect(_masterGain);
    _masterGain.connect(ctx.destination);
    // Meter tap (parallel)
    _meterInput = ctx.createGain();
    _meterInput.gain.value = 1;
    _masterGain.connect(_meterInput);
    applyMixerGains();
  }

  function applyMixerGains() {
    if (!_masterGain) return;
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    _masterGain.gain.setTargetAtTime(_mixer.master / 100, now, 0.02);

    // Solo logic: if any channel is soloed, others are silenced
    const anySolo = _mixer.sfxSolo || _mixer.musicSolo;
    let sfxVol = _mixer.sfxMute ? 0 : _mixer.sfx / 100;
    let musicVol = _mixer.musicMute ? 0 : _mixer.music / 100;
    if (anySolo) {
      if (!_mixer.sfxSolo) sfxVol = 0;
      if (!_mixer.musicSolo) musicVol = 0;
    }
    // Settings toggles
    if (!toggleSound.checked) sfxVol = 0;
    if (!toggleMusic.checked) musicVol = 0;

    _sfxGain.gain.setTargetAtTime(sfxVol, now, 0.02);
    _musicGain.gain.setTargetAtTime(musicVol, now, 0.02);

    // Per-sound gains
    _activeInstances.forEach(inst => {
      if (!inst.gainNode) return;
      const snd = _mixer.sounds[inst.name] || {};
      const sndMute = snd.mute || false;
      const sndSolo = snd.solo || false;
      let vol = (snd.volume !== undefined ? snd.volume : 100) / 100;
      if (sndMute) vol = 0;
      // Per-sound solo: if any in the same channel is soloed, silence non-soloed
      const ch = getChannel(inst.name);
      const channelSounds = Object.keys(AUDIO_FILES).filter(n => getChannel(n) === ch);
      const anySndsolo = channelSounds.some(n => (_mixer.sounds[n] || {}).solo);
      if (anySndsolo && !sndSolo) vol = 0;
      inst.gainNode.gain.setTargetAtTime(vol, now, 0.02);
      // Live loop update
      if (inst.source && inst.source.loop !== undefined) {
        inst.source.loop = snd.loop || false;
      }
    });
  }

  // Active sound instances (for live updates)
  const _activeInstances = [];

  function playSound(name, { loop = false } = {}) {
    if (!AUDIO_FILES[name]) return null;
    const ctx = getAudioContext();
    ensureGainGraph();
    const buffer = _buffers[name];
    if (buffer === null) return null; // failed previously — do not retry
    if (buffer === undefined) { loadAudio(name).then(buf => { if (buf) playSound(name, { loop }); }); return null; }
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const sndSettings = _mixer.sounds[name] || {};
    source.loop = sndSettings.loop !== undefined ? sndSettings.loop : loop;
    const gainNode = ctx.createGain();
    const vol = (sndSettings.volume !== undefined ? sndSettings.volume : 100) / 100;
    gainNode.gain.value = sndSettings.mute ? 0 : vol;
    source.connect(gainNode);
    const ch = getChannel(name);
    gainNode.connect(ch === "music" ? _musicGain : _sfxGain);
    source.start();
    const inst = { name, source, gainNode };
    _activeInstances.push(inst);
    source.onended = () => {
      const idx = _activeInstances.indexOf(inst);
      if (idx !== -1) _activeInstances.splice(idx, 1);
    };
    return inst;
  }

  function stopSound(inst) {
    if (!inst || !inst.source) return;
    try { inst.source.stop(); } catch(e) {}
  }

  // ---------- Background Audio ----------
  let _bgInstances = [];
  let _bgPlaying = false;

  async function playBackgroundAudio() {
    if (_bgPlaying) return;
    _bgPlaying = true;
    const ctx = getAudioContext();
    await ctx.resume();
    ensureGainGraph();
    for (const name of Object.keys(AUDIO_FILES)) {
      if (getChannel(name) === "music") {
        await loadAudio(name);
        if (!_bgPlaying) return;
        const inst = playSound(name, { loop: true });
        if (inst) _bgInstances.push(inst);
      }
    }
  }

  function stopBackgroundAudio() {
    _bgPlaying = false;
    _bgInstances.forEach(stopSound);
    _bgInstances = [];
  }

  // ---------- Sound Effects ----------
  // sfxClick  → normal UI button click
  // sfxToggle → toggle-style switches
  // sfxPopup  → a popup opening. If a popup is ALREADY open, falls back to the
  //             click sound so stacked popups don't double-trigger the popup SFX.
  // (Debug panel / mixer / meter controls intentionally call none of these.)
  function sfxClick(){ playSound("sfx_button"); }
  function sfxToggle(){ playSound("sfx_toggle"); }
  function sfxPopup(){
    const popupOpen =
      settingsOverlay.classList.contains("show") ||
      document.getElementById("quitConfirm").classList.contains("show");
    if (popupOpen) sfxClick();
    else playSound("sfx_popup");
  }

  // Satisfying mechanical-keyboard click for piece expand / drag-drop.
  // Synthesized so each play can subtly shift pitch for variety; routes through
  // the SFX bus so mute/mixer settings still apply.
  function sfxPieceClick() {
    const ctx = getAudioContext();
    ensureGainGraph();
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    // Subtle pitch variety each time (±~12%), plus a tiny volume wobble.
    // Base sits a touch deeper than a bright switch tick.
    const pitch = 0.78 + Math.random() * 0.2;
    const vol = 0.9 + Math.random() * 0.2;

    // Ultra-short bright noise spike — the "click" transient.
    const noiseDur = 0.012 + Math.random() * 0.006;
    const nBuf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * noiseDur), ctx.sampleRate);
    const nData = nBuf.getChannelData(0);
    for (let i = 0; i < nData.length; i++) {
      nData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (nData.length * 0.12));
    }
    const noise = ctx.createBufferSource();
    noise.buffer = nBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = (2400 + Math.random() * 1000) * pitch;
    bp.Q.value = 0.9 + Math.random() * 0.4;
    const hpNoise = ctx.createBiquadFilter();
    hpNoise.type = "highpass";
    hpNoise.frequency.value = 1200 * pitch;
    const nGain = ctx.createGain();
    nGain.gain.setValueAtTime(0.55 * vol, now);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + noiseDur);
    noise.connect(hpNoise);
    hpNoise.connect(bp);
    bp.connect(nGain);
    nGain.connect(_sfxGain);
    noise.start(now);
    noise.stop(now + noiseDur);

    // Sharp high tick — mechanical switch snap.
    const osc = ctx.createOscillator();
    osc.type = "square";
    const fClick = (2200 + Math.random() * 900) * pitch;
    osc.frequency.setValueAtTime(fClick, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(320, fClick * 0.55), now + 0.01);
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 900 * pitch;
    const cGain = ctx.createGain();
    cGain.gain.setValueAtTime(0.22 * vol, now);
    cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.014);
    osc.connect(hp);
    hp.connect(cGain);
    cGain.connect(_sfxGain);
    osc.start(now);
    osc.stop(now + 0.016);

    // Tiny mid ping for body, kept short so it stays clicky not thocky.
    const ping = ctx.createOscillator();
    ping.type = "triangle";
    ping.frequency.setValueAtTime((650 + Math.random() * 200) * pitch, now);
    const pGain = ctx.createGain();
    pGain.gain.setValueAtTime(0.08 * vol, now);
    pGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
    ping.connect(pGain);
    pGain.connect(_sfxGain);
    ping.start(now);
    ping.stop(now + 0.022);
  }

  // Inverse of sfxPieceClick for shrinking: same clicky character, but pitch
  // rises instead of falling and the noise sits a touch lighter.
  function sfxPieceShrink() {
    const ctx = getAudioContext();
    ensureGainGraph();
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    const pitch = 0.78 + Math.random() * 0.2;
    const vol = 0.85 + Math.random() * 0.2;

    const noiseDur = 0.012 + Math.random() * 0.006;
    const nBuf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * noiseDur), ctx.sampleRate);
    const nData = nBuf.getChannelData(0);
    for (let i = 0; i < nData.length; i++) {
      nData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (nData.length * 0.12));
    }
    const noise = ctx.createBufferSource();
    noise.buffer = nBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = (2000 + Math.random() * 900) * pitch;
    bp.Q.value = 0.9 + Math.random() * 0.4;
    const hpNoise = ctx.createBiquadFilter();
    hpNoise.type = "highpass";
    hpNoise.frequency.value = 1100 * pitch;
    const nGain = ctx.createGain();
    nGain.gain.setValueAtTime(0.45 * vol, now);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + noiseDur);
    noise.connect(hpNoise);
    hpNoise.connect(bp);
    bp.connect(nGain);
    nGain.connect(_sfxGain);
    noise.start(now);
    noise.stop(now + noiseDur);

    // Rising tick — inverse of the expand snap.
    const osc = ctx.createOscillator();
    osc.type = "square";
    const fStart = (1200 + Math.random() * 500) * pitch;
    const fEnd = fStart * (1.7 + Math.random() * 0.35);
    osc.frequency.setValueAtTime(fStart, now);
    osc.frequency.exponentialRampToValueAtTime(fEnd, now + 0.012);
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 800 * pitch;
    const cGain = ctx.createGain();
    cGain.gain.setValueAtTime(0.18 * vol, now);
    cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.016);
    osc.connect(hp);
    hp.connect(cGain);
    cGain.connect(_sfxGain);
    osc.start(now);
    osc.stop(now + 0.018);

    const ping = ctx.createOscillator();
    ping.type = "triangle";
    const pStart = (480 + Math.random() * 140) * pitch;
    ping.frequency.setValueAtTime(pStart, now);
    ping.frequency.exponentialRampToValueAtTime(pStart * 1.55, now + 0.018);
    const pGain = ctx.createGain();
    pGain.gain.setValueAtTime(0.07 * vol, now);
    pGain.gain.exponentialRampToValueAtTime(0.001, now + 0.022);
    ping.connect(pGain);
    pGain.connect(_sfxGain);
    ping.start(now);
    ping.stop(now + 0.024);
  }

  // Listen to settings toggles for live mute
  toggleMusic.addEventListener("change", () => { sfxToggle(); applyMixerGains(); });
  toggleSound.addEventListener("change", () => { sfxToggle(); applyMixerGains(); });
  toggleHaptics.addEventListener("change", sfxToggle);

  // ---------- Loudness Meter (ITU-R BS.1770 approx) ----------
  let _meterRAF = null;
  let _meterAnalyser = null;
  let _kWeightHigh = null;
  let _kWeightShelf = null;
  let _meterBuffer = null;
  let _meterShortRing = [];
  let _meterIntegrated = { sum: 0, count: 0 };
  let _meterTruePeak = -Infinity;

  function initMeter() {
    if (_meterAnalyser) return;
    const ctx = getAudioContext();
    ensureGainGraph();

    // K-weighting: high-pass 60Hz + high-shelf 1500Hz +4dB (approx BS.1770)
    _kWeightHigh = ctx.createBiquadFilter();
    _kWeightHigh.type = "highpass";
    _kWeightHigh.frequency.value = 60;
    _kWeightHigh.Q.value = 0.5;

    _kWeightShelf = ctx.createBiquadFilter();
    _kWeightShelf.type = "highshelf";
    _kWeightShelf.frequency.value = 1500;
    _kWeightShelf.gain.value = 4;

    _meterAnalyser = ctx.createAnalyser();
    _meterAnalyser.fftSize = 2048;

    _meterInput.connect(_kWeightHigh);
    _kWeightHigh.connect(_kWeightShelf);
    _kWeightShelf.connect(_meterAnalyser);

    _meterBuffer = new Float32Array(_meterAnalyser.fftSize);
  }

  function meterTick() {
    if (!_meterAnalyser) return;
    _meterAnalyser.getFloatTimeDomainData(_meterBuffer);
    const len = _meterBuffer.length;

    // RMS for this block
    let sumSq = 0;
    let blockPeak = 0;
    for (let i = 0; i < len; i++) {
      const s = _meterBuffer[i];
      sumSq += s * s;
      const abs = Math.abs(s);
      if (abs > blockPeak) blockPeak = abs;
    }
    const rms = Math.sqrt(sumSq / len);

    // 4x oversampled true peak approximation (linear interp between samples)
    for (let i = 0; i < len - 1; i++) {
      const a = _meterBuffer[i], b = _meterBuffer[i + 1];
      for (let j = 1; j <= 3; j++) {
        const interp = Math.abs(a + (b - a) * (j / 4));
        if (interp > blockPeak) blockPeak = interp;
      }
    }

    const dbTP = blockPeak > 0 ? 20 * Math.log10(blockPeak) : -Infinity;
    if (dbTP > _meterTruePeak) _meterTruePeak = dbTP;

    // LUFS = -0.691 + 10*log10(mean_square) (simplified)
    const lufs = rms > 0 ? -0.691 + 10 * Math.log10(rms * rms) : -Infinity;

    // Short-term: trailing 3s ring buffer (~3s of blocks at rAF rate)
    const now = performance.now();
    _meterShortRing.push({ t: now, sq: rms * rms });
    while (_meterShortRing.length && _meterShortRing[0].t < now - 3000) _meterShortRing.shift();
    let shortSum = 0;
    for (const b of _meterShortRing) shortSum += b.sq;
    const shortMean = shortSum / (_meterShortRing.length || 1);
    const shortLUFS = shortMean > 0 ? -0.691 + 10 * Math.log10(shortMean) : -Infinity;

    // Integrated (gated: only blocks > -70 LUFS)
    if (lufs > -70) {
      _meterIntegrated.sum += rms * rms;
      _meterIntegrated.count++;
    }
    const intMean = _meterIntegrated.count > 0 ? _meterIntegrated.sum / _meterIntegrated.count : 0;
    const intLUFS = intMean > 0 ? -0.691 + 10 * Math.log10(intMean) : -Infinity;

    // Update UI
    document.getElementById("meterShort").textContent = isFinite(shortLUFS) ? shortLUFS.toFixed(1) : "—";
    document.getElementById("meterIntegrated").textContent = isFinite(intLUFS) ? intLUFS.toFixed(1) : "—";
    document.getElementById("meterPeak").textContent = isFinite(_meterTruePeak) ? _meterTruePeak.toFixed(1) : "—";
  }

  function startMeter() {
    initMeter();
    if (_meterRAF) return;
    function loop() {
      meterTick();
      _meterRAF = requestAnimationFrame(loop);
    }
    _meterRAF = requestAnimationFrame(loop);
  }

  function stopMeter() {
    if (_meterRAF) { cancelAnimationFrame(_meterRAF); _meterRAF = null; }
  }

  function resetMeter() {
    _meterShortRing = [];
    _meterIntegrated = { sum: 0, count: 0 };
    _meterTruePeak = -Infinity;
    document.getElementById("meterShort").textContent = "—";
    document.getElementById("meterIntegrated").textContent = "—";
    document.getElementById("meterPeak").textContent = "—";
  }

  // ---------- Debug Mixer UI Logic ----------
  function buildMixerUI() {
    const scroll = document.getElementById("mixerSoundsScroll");
    scroll.innerHTML = "";
    const names = Object.keys(AUDIO_FILES);
    if (!names.length) {
      scroll.innerHTML = '<span style="color:#6b6684;font-size:10px;">No sounds registered</span>';
      return;
    }
    names.forEach(name => {
      const snd = _mixer.sounds[name] || { volume: 100, mute: false, solo: false, loop: false };
      _mixer.sounds[name] = snd;
      const ch = getChannel(name);
      const strip = document.createElement("div");
      strip.className = "mixer-sound-strip";
      strip.innerHTML = `
        <div class="mixer-row">
          <label>${name}</label>
          <span class="mixer-channel-tag">${ch.toUpperCase()}</span>
        </div>
        <div class="mixer-row">
          <input type="range" min="0" max="100" value="${snd.volume}" data-snd="${name}" data-prop="volume" />
          <span class="mixer-val">${snd.volume}</span>
        </div>
        <div class="mixer-toggles">
          <button class="mixer-tog${snd.loop ? ' active' : ''}" data-snd="${name}" data-prop="loop">Loop</button>
          <button class="mixer-tog${snd.mute ? ' mute-active' : ''}" data-snd="${name}" data-prop="mute">M</button>
          <button class="mixer-tog${snd.solo ? ' active' : ''}" data-snd="${name}" data-prop="solo">S</button>
        </div>`;
      scroll.appendChild(strip);
    });

    // Bind events
    scroll.querySelectorAll('input[type="range"]').forEach(slider => {
      slider.addEventListener("input", () => {
        const name = slider.dataset.snd;
        _mixer.sounds[name].volume = parseInt(slider.value, 10);
        slider.nextElementSibling.textContent = slider.value;
        applyMixerGains();
      });
    });
    scroll.querySelectorAll(".mixer-tog").forEach(btn => {
      btn.addEventListener("click", () => {
        const name = btn.dataset.snd;
        const prop = btn.dataset.prop;
        _mixer.sounds[name][prop] = !_mixer.sounds[name][prop];
        if (prop === "mute") btn.classList.toggle("mute-active");
        else btn.classList.toggle("active");
        applyMixerGains();
      });
    });
  }

  function initMixerControls() {
    const masterSlider = document.getElementById("mixerMaster");
    const sfxSlider = document.getElementById("mixerSFX");
    const musicSlider = document.getElementById("mixerMusic");

    masterSlider.value = _mixer.master;
    sfxSlider.value = _mixer.sfx;
    musicSlider.value = _mixer.music;

      slider.addEventListener("input", () => {

        document.getElementById(valId).textContent = slider.value;
        applyMixerGains();
      });

    bindSlider(sfxSlider, "sfx", "mixerSFXVal");

    const musicSolo = document.getElementById("mixerMusicSolo");

    sfxSolo.classList.toggle("active", _mixer.sfxSolo);
    musicMute.classList.toggle("mute-active", _mixer.musicMute);
    musicSolo.classList.toggle("active", _mixer.musicSolo);

    sfxMute.addEventListener("click", () => { _mixer.sfxMute = !_mixer.sfxMute; sfxMute.classList.toggle("mute-active"); applyMixerGains(); });
    sfxSolo.addEventListener("click", () => { _mixer.sfxSolo = !_mixer.sfxSolo; sfxSolo.classList.toggle("active"); applyMixerGains(); });
    musicMute.addEventListener("click", () => { _mixer.musicMute = !_mixer.musicMute; musicMute.classList.toggle("mute-active"); applyMixerGains(); });
    musicSolo.addEventListener("click", () => { _mixer.musicSolo = !_mixer.musicSolo; musicSolo.classList.toggle("active"); applyMixerGains(); });

  // ---------- Game Loop (60 fps cap) ----------
  // All gameplay rendering/logic goes in updateGame(dt).
  // The loop is started by startGame() and stopped by levelComplete()/levelFailed().
  // On high-refresh-rate displays (90/120 Hz) frames are skipped to hold 60 fps.
  const FRAME_MS = 1000 / 60;
  let _lastFrame = 0;
  let _gameRAF = null;

  function _tick(now) {
    _gameRAF = requestAnimationFrame(_tick);
    const dt = now - _lastFrame;
    if (dt < FRAME_MS) return;
    _lastFrame = now - (dt % FRAME_MS);
    updateGame(dt);
  }

  function startLoop() {
    if (_gameRAF) return;
    _lastFrame = performance.now();
    _gameRAF = requestAnimationFrame(_tick);
  }

  function stopLoop() {
    if (_gameRAF) {
      cancelAnimationFrame(_gameRAF);
      _gameRAF = null;
    }
  }

  // Normalise authoring data into origin + relative cells + bounding box.
  // Accepts `cells` (absolute) or legacy x/y/(w/h) rectangles.
  function normalizeBlockSpec(spec) {
    let abs = [];
    if (Array.isArray(spec.cells) && spec.cells.length) {
      for (const p of spec.cells) {
        if (Array.isArray(p)) abs.push([p[0] | 0, p[1] | 0]);
        else abs.push([p.x | 0, p.y | 0]);
      }
    } else {
      const w = (spec.w | 0) || 2, h = (spec.h | 0) || 2;
      const x = spec.x | 0, y = spec.y | 0;
      for (let r = 0; r < h; r++)
        for (let c = 0; c < w; c++) abs.push([x + c, y + r]);
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const seen = new Set();
    const uniq = [];
    for (const [c, r] of abs) {
      const k = c + "," + r;
      if (seen.has(k)) continue;
      seen.add(k);
      uniq.push([c, r]);
      if (c < minX) minX = c; if (r < minY) minY = r;
      if (c > maxX) maxX = c; if (r > maxY) maxY = r;
    }
    const cells = uniq.map(([c, r]) => [c - minX, r - minY]);
    return {
      x: minX, y: minY,
      w: maxX - minX + 1, h: maxY - minY + 1,
      cells,
    };
  }

    pill.style.transform = "";
    const rect = pill.getBoundingClientRect();
    const dx = window.innerWidth / 2 - (rect.left + rect.width / 2);
    const dy = window.innerHeight / 2 - (rect.top + rect.height / 2);
    pill.style.willChange = "transform, opacity";
    pill.style.transform =
      `translate(${dx}px, ${dy}px) scale(${CS_INTRO.MOVE_START_SCALE})`;
    // eslint-disable-next-line no-unused-expressions
    pill.offsetHeight; // reflow with the centred/hidden state
    // Fade the enlarged, centred pill in.
    pill.style.transition = `opacity ${CS_INTRO.MOVE_FADE_MS}ms ease`;
    pill.style.opacity = "1";

    // After a static hold, blocks have settled and the departing pill no longer
    // obscures the board, so play can begin while it returns to the HUD.
    csIntroTimers.push(setTimeout(() => {
      csInputLocked = false;
      pill.style.transition =
        `transform ${CS_INTRO.MOVE_LERP_MS}ms cubic-bezier(.2,.8,.25,1), opacity ${CS_INTRO.MOVE_LERP_MS}ms ease`;
      pill.style.transform = `translate(0px, 0px) scale(${CS_INTRO.MOVE_END_SCALE})`;
    }, CS_INTRO.MOVE_HOLD_MS));

    // Once it lands, clear the remaining intro presentation state.
    csIntroTimers.push(setTimeout(clearIntro, CS_INTRO.MOVE_HOLD_MS + CS_INTRO.MOVE_LERP_MS));
  }

  function introBounceScale(start, end, bounce, progress) {
    const peakAt = CS_INTRO.BOUNCE_AT;
    if (progress <= peakAt) {
      const p = progress / peakAt;
      const eased = 1 - Math.pow(1 - p, 3);
      return start + (bounce - start) * eased;
    }
    const p = (progress - peakAt) / (1 - peakAt);
    const eased = 1 - Math.pow(1 - p, 3);
    return bounce + (end - bounce) * eased;
  }

  // Ease-out with a satisfying overshoot for the spawn scale-up.
  function easeOutBack(t, overshoot) {
    const c1 = overshoot == null ? 1.35 : overshoot;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // Per-block spawn staging: appear straight above the board and scale up.
  // Tiny sideways lean drifts in slowly as ambient inertia from the pop (with a
  // slight random forward/back companion), then the slam flattens and drops.
  function sampleBlockIntro(p, pitchSign, tiltSign, tiltMul) {
    p = clampCS(p, 0, 1);
    const liftH = CS_INTRO.SPAWN_LIFT;
    const pitch0 = (pitchSign || 1) * CS_INTRO.SPAWN_PITCH_DEG * Math.PI / 180;
    const tilt0 = (tiltSign || 1) * (tiltMul == null ? 1 : tiltMul) *
      CS_INTRO.SPAWN_TILT_DEG * Math.PI / 180;
    const tScale = CS_INTRO.SPAWN_SCALE_END;
    const tHold = CS_INTRO.SPAWN_HOLD_END;
    const tDrop = CS_INTRO.SPAWN_DROP_END;
    // Lean builds across almost the whole hover — much slower than the scale pop.
    const tLeanPeak = tHold * 0.88;

    if (p <= 0) return { scale: 0, lift: liftH, pitch: 0, tilt: 0 };

    let scale = 1;
    if (p < tScale) {
      scale = Math.max(0, easeOutBack(p / tScale, 1.22));
    }

    let lean = 0;
    if (p < tLeanPeak) {
      const u = p / tLeanPeak;
      // Very slow ease-in: stays near straight early, drifts to the tiny lean late.
      const s = u * u * u * (u * (u * 6 - 15) + 10); // smootherstep
      lean = Math.pow(s, 1.35);
    } else if (p < tDrop) {
      // Hold the lean through the hover beat and the whole slam — only pop
      // flush on impact (handled in the bounce phase below).
      if (p < tHold) {
        const u = (p - tLeanPeak) / Math.max(0.0001, tHold - tLeanPeak);
        const soft = u * u * (3 - 2 * u);
        lean = 1 - 0.12 * soft;
      } else {
        lean = 1 - 0.12;
      }
    }
    // p >= tDrop: lean stays 0 after impact (pop flush on land)

    let lift;
    if (p < tHold) {
      lift = liftH;
    } else if (p < tDrop) {
      const u = (p - tHold) / Math.max(0.0001, tDrop - tHold);
      const fall = u * u * u * u;
      lift = liftH * (1 - fall);
    } else {
      const u = (p - tDrop) / Math.max(0.0001, 1 - tDrop);
      lift = CS_INTRO.SPAWN_BOUNCE * Math.sin(u * Math.PI) * (1 - u);
    }

    // On impact, angle pops straight immediately (kept through the fall above).
    const angled = p < tDrop;
    return {
      scale,
      lift,
      pitch: angled ? pitch0 * lean : 0,
      tilt: angled ? tilt0 * lean : 0,
    };
  }

  function csResize(force) {
    if (!csCanvas || !CS3D.ok) return;
    const rect = csCanvas.getBoundingClientRect();
    const cssW = Math.round(rect.width), cssH = Math.round(rect.height);
    if (cssW <= 0 || cssH <= 0) return;
    if (!force && cssW === csCssW && cssH === csCssH) return;
    csCssW = cssW; csCssH = cssH;
    cs3dResize(cssW, cssH);
  }

  // ---- validity gate: the single authority for legal placement ----
  function isSpaceValid(x, y, w, h, ignore) {
    if (x < 0 || y < 0 || x + w > gridCols || y + h > gridRows) return false;
    for (let r = y; r < y + h; r++)
      for (let c = x; c < x + w; c++)
        if (grid[r][c] === 0) return false;
    for (const b of blocks) {
      if (b === ignore) continue;
      // Cell-accurate when the other piece is a polyomino (or any cell mask).
      if (b.cells && b.cells.length) {
        for (const [dx, dy] of b.cells) {
          const c = b.x + dx, r = b.y + dy;
          if (c >= x && c < x + w && r >= y && r < y + h) return false;
        }
      } else if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) {
        return false;
      }
    }
    return true;
  }

  // Place block `b` with origin at integer (x,y). Uses the piece's cell mask.
  function canPlaceBlock(b, x, y, ignore) {
    if (!b || !b.cells) return isSpaceValid(x, y, b.w, b.h, ignore);
    for (const [dx, dy] of b.cells) {
      const c = x + dx, r = y + dy;
      if (c < 0 || r < 0 || c >= gridCols || r >= gridRows) return false;
      if (grid[r][c] === 0) return false;
    }
    const mine = blockCellSet(b, x, y);
    for (const o of blocks) {
      if (o === ignore || o === b) continue;
      for (const [dx, dy] of o.cells) {
        if (mine.has((o.x + dx) + "," + (o.y + dy))) return false;
      }
    }
    return true;
  }

  // ---- hit testing: raycast pointer against the block slabs ----
  function getBlockAt(px, py) {
    if (!CS3D.ok) return null;
    const rect = csCanvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    CS3D.ndc.set((px / rect.width) * 2 - 1, -(py / rect.height) * 2 + 1);
    CS3D.ray.setFromCamera(CS3D.ndc, CS3D.camera);
    const hits = CS3D.ray.intersectObjects(CS3D.blockMeshes, true);
    for (const h of hits) {
      let obj = h.object;
      while (obj && !(obj.userData && obj.userData.block)) obj = obj.parent;
      const b = obj && obj.userData.block;
      if (b) return b;
    }
    return null;
  }

  // Color Smash: pieces are always "full" 2×2 slabs — used only by decals/corners.
  function isFull(b) { return true; }

  // Starting piece count for the level (HUD progress baseline).
  let csLevelPieceCount = 0;

  // ---- move accounting ----
  function registerMove() {
    movesUsed++;
    updateHUD();
  }

  function updateHUD() {
    csMovesValue.textContent = String(movesUsed);
    const left = blocks.length;
    const total = csLevelPieceCount || left;
    csFullValue.textContent = String(left);
    const cleared = Math.max(0, total - left);
    const progress = total ? (cleared / total) * 100 : 100;
    csFullProgressFill.style.width = `${progress}%`;
    csFullProgress.setAttribute("aria-valuemax", String(total));
    csFullProgress.setAttribute("aria-valuenow", String(cleared));
    csFullPill.classList.toggle("complete", left === 0 && total > 0);
    csMovesPill.classList.remove("warn", "last-move");
  }

  function maybeGameOver() {
    // No move-limit fail in Color Smash — clear the board to win.
  }

  function checkWin() {
    if (csLevelDone || csGameOver) return;
    if (blocks.length === 0 && !(CS3D.debris && CS3D.debris.length)) {
      csLevelDone = true;
      updateHUD();
      beginWinCelebration();
    }
  }

  function beginWinCelebration() {
    csSheen = { active: true, t: 0 };
    const data = LEVELS[(level - 1) % LEVELS.length];
    csWinArt = {
      active: true,
      t: 0,
      pattern: (data && data.winArt) || CS_WIN_ART_DEFAULT,
    };
    startOutro(startLevelCompleteFlow);
  }

  // Resolve a win-art cell to a THREE.Color (or null to keep the warm tile).
  function winArtCellColor(cell) {
    if (cell == null || cell === "" || cell === ".") return null;
    const hex = PALETTE[cell] || cell;
    return cs3dColor(hex);
  }

  // Ease tiles toward their pixel-art colours; stagger radiates from centre.
  // Void / blocked cells start hidden and pop in as they take on art colours.
  function cs3dUpdateWinArt() {
    if (!CS3D.ok || !csWinArt.active || !CS3D.tiles.length) return;
    const pattern = csWinArt.pattern;
    if (!pattern || !pattern.length) return;
    const tMs = csWinArt.t;
    const cx = (gridCols - 1) * 0.5;
    const cy = (gridRows - 1) * 0.5;
    const pad = CS3D_CFG.TILE_PAD;
    const baseScale = 1 - 2 * pad;
    CS3D.cA.copy(cs3dColor(CS3D_CFG.TILE_COLOR));
    CS3D.cB.copy(cs3dColor(CS3D_CFG.PILLAR_COLOR));
    for (const m of CS3D.tiles) {
      const r = m.userData.cell[0], c = m.userData.cell[1];
      const isVoid = !!m.userData.void;
      const row = pattern[r];
      let target = winArtCellColor(row && row[c]);
      // Void cells with no art colour still fill so blocked holes light up.
      if (!target && isVoid) target = cs3dColor(PALETTE.purple);
      const dist = Math.hypot(c - cx, r - cy);
      const start = CS_WIN.ART_DELAY_MS + dist * CS_WIN.ART_STAGGER_MS;
      const p = clampCS((tMs - start) / CS_WIN.ART_FILL_MS, 0, 1);
      const eased = p * p * (3 - 2 * p); // smoothstep
      const from = isVoid ? CS3D.cB : CS3D.cA;
      if (target) {
        m.material.color.copy(from).lerp(target, eased);
      } else if (!isVoid) {
        m.material.color.copy(CS3D.cA);
      }
      m.visible = true;
      // Tiny pop as the paint lands, then settle flush.
      const pop = Math.sin(Math.PI * eased) * CS_WIN.ART_POP;
      m.scale.set(baseScale * (1 + pop), 1, baseScale * (1 + pop));
    }
  }

  // ---- same-colour smash ----
  // Hold-to-smash: while dragging, same-colour pieces that press together for
  // a brief beat smash without waiting for release.
  const CS_SMASH = {
    HOLD_MS: 130,          // push-together time before mid-drag smash
    CONTACT_GAP: 0.1,      // how close floats must be to count as touching
    PRESS_MIN: 0.018,      // min slime-press toward the partner
    TARGET_PUSH: 0.05,     // min finger overshoot (cells) toward the partner
  };
  let smashContact = null;   // { a, b, tMs } while pressing a same-colour pair
  let smashConsumedDrag = false; // mid-drag smash already counted this press

  // Two pieces share an edge (not just a corner) via any pair of cells.
  function blocksEdgeTouch(a, b) {
    if (!a || !b) return false;
    return collectEdgeContacts(a, b).length > 0;
  }

  const SMASH_DIR_DELTA = {
    E: [1, 0], W: [-1, 0], S: [0, 1], N: [0, -1],
  };
  const SMASH_DIR_OPP = { E: "W", W: "E", S: "N", N: "S" };

  // Unit-edge contacts between two polyominoes (absolute cells + relative dirs).
  function collectEdgeContacts(a, b) {
    if (!a || !b || !a.cells || !b.cells) return [];
    const setB = blockCellSet(b);
    const out = [];
    for (const [dx, dy] of a.cells) {
      const ax = a.x + dx, ay = a.y + dy;
      for (const dir of ["E", "W", "S", "N"]) {
        const [ox, oy] = SMASH_DIR_DELTA[dir];
        const bx = ax + ox, by = ay + oy;
        if (!setB.has(bx + "," + by)) continue;
        out.push({
          ax, ay, dirA: dir, adx: dx, ady: dy,
          bx, by, dirB: SMASH_DIR_OPP[dir],
          bdx: bx - b.x, bdy: by - b.y,
        });
      }
    }
    return out;
  }

  function normalizeSmashEdges(spec, norm) {
    // Accept relative {dx,dy,dir} or absolute {x,y,dir} against the normalised origin.
    const raw = Array.isArray(spec && spec.smashEdges) ? spec.smashEdges : [];
    const cellSet = new Set(norm.cells.map(([x, y]) => x + "," + y));
    const out = [];
    const seen = new Set();
    for (const e of raw) {
      if (!e || !e.dir) continue;
      const dir = String(e.dir).toUpperCase();
      if (!SMASH_DIR_DELTA[dir]) continue;
      let dx, dy;
      if (typeof e.dx === "number" && typeof e.dy === "number") {
        dx = e.dx | 0; dy = e.dy | 0;
      } else if (typeof e.x === "number" && typeof e.y === "number") {
        dx = (e.x | 0) - norm.x; dy = (e.y | 0) - norm.y;
      } else continue;
      if (!cellSet.has(dx + "," + dy)) continue;
      // Must face outward (no sibling cell that way).
      const [ox, oy] = SMASH_DIR_DELTA[dir];
      if (cellSet.has((dx + ox) + "," + (dy + oy))) continue;
      const key = dx + "," + dy + "," + dir;
      if (seen.has(key)) continue;
      seen.add(key);
      out.push({ dx, dy, dir });
    }
    return out;
  }

  // Optional smashEdges on a piece: that piece may only smash when contact uses
  // one of its marked edges. Pieces with no smashEdges keep the free rule.
  function smashEdgesSatisfied(block, contacts, side) {
    const req = block.smashEdges;
    if (!req || !req.length) return true;
    const want = new Set(req.map((e) => e.dx + "," + e.dy + "," + e.dir));
    for (const c of contacts) {
      if (side === "A") {
        if (want.has(c.adx + "," + c.ady + "," + c.dirA)) return true;
      } else if (want.has(c.bdx + "," + c.bdy + "," + c.dirB)) {
        return true;
      }
    }
    return false;
  }

  function canSmashTogether(a, b) {
    if (!a || !b || a.color !== b.color) return false;
    const contacts = collectEdgeContacts(a, b);
    if (!contacts.length) return false;
    return smashEdgesSatisfied(a, contacts, "A") && smashEdgesSatisfied(b, contacts, "B");
  }

  // Map a push dir {dx,dy} onto a cardinal face name.
  function pushDirName(dir) {
    if (!dir) return null;
    if (dir.dx > 0) return "E";
    if (dir.dx < 0) return "W";
    if (dir.dy > 0) return "S";
    if (dir.dy < 0) return "N";
    return null;
  }

  // Float-space edge contact between polyomino footprints (allows a tiny gap).
  function contactPushDir(fx, fy, fw, fh, o, gap) {
    // Prefer cell-accurate contact when both pieces expose cells.
    if (o && o.cells && activeBlock && activeBlock.cells &&
        activeBlock.w === fw && activeBlock.h === fh) {
      const moving = activeBlock;
      for (const [dx, dy] of moving.cells) {
        const mx = fx + dx, my = fy + dy;
        for (const [ox, oy] of o.cells) {
          const cx = o.x + ox, cy = o.y + oy;
          const overlapY = Math.min(my + 1, cy + 1) - Math.max(my, cy);
          const overlapX = Math.min(mx + 1, cx + 1) - Math.max(mx, cx);
          if (overlapY > 0.05) {
            if (Math.abs((mx + 1) - cx) <= gap) return { dx: 1, dy: 0 };
            if (Math.abs((cx + 1) - mx) <= gap) return { dx: -1, dy: 0 };
          }
          if (overlapX > 0.05) {
            if (Math.abs((my + 1) - cy) <= gap) return { dx: 0, dy: 1 };
            if (Math.abs((cy + 1) - my) <= gap) return { dx: 0, dy: -1 };
          }
        }
      }
      return null;
    }
    const overlapY = Math.min(fy + fh, o.y + o.h) - Math.max(fy, o.y);
    const overlapX = Math.min(fx + fw, o.x + o.w) - Math.max(fx, o.x);
    if (overlapY > 0.05) {
      if (Math.abs((fx + fw) - o.x) <= gap) return { dx: 1, dy: 0 };
      if (Math.abs((o.x + o.w) - fx) <= gap) return { dx: -1, dy: 0 };
    }
    if (overlapX > 0.05) {
      if (Math.abs((fy + fh) - o.y) <= gap) return { dx: 0, dy: 1 };
      if (Math.abs((o.y + o.h) - fy) <= gap) return { dx: 0, dy: -1 };
    }
    return null;
  }

  function isPushingInto(dir) {
    if (!dir) return false;
    if (dir.dx > 0) {
      return dragPressX > CS_SMASH.PRESS_MIN ||
        (dragTargetX - dragFloatX) > CS_SMASH.TARGET_PUSH;
    }
    if (dir.dx < 0) {
      return dragPressX < -CS_SMASH.PRESS_MIN ||
        (dragTargetX - dragFloatX) < -CS_SMASH.TARGET_PUSH;
    }
    if (dir.dy > 0) {
      return dragPressY > CS_SMASH.PRESS_MIN ||
        (dragTargetY - dragFloatY) > CS_SMASH.TARGET_PUSH;
    }
    if (dir.dy < 0) {
      return dragPressY < -CS_SMASH.PRESS_MIN ||
        (dragTargetY - dragFloatY) < -CS_SMASH.TARGET_PUSH;
    }
    return false;
  }

  function findSameColorNeighbor(b) {
    for (const o of blocks) {
      if (o === b || o.smashing) continue;
      if (canSmashTogether(b, o)) return o;
    }
    return null;
  }

  function findDragSmashPartner(b, fx, fy) {
    const gap = CS_SMASH.CONTACT_GAP;
    const freeEdge = (p) => !p.smashEdges || !p.smashEdges.length;
    for (const o of blocks) {
      if (o === b || o.smashing || o.color !== b.color) continue;
      const dir = contactPushDir(fx, fy, b.w, b.h, o, gap);
      let allowed = canSmashTogether(b, o);
      if (!allowed) {
        const ix = Math.round(fx), iy = Math.round(fy);
        if (ix !== b.x || iy !== b.y) {
          const sx = b.x, sy = b.y;
          b.x = ix; b.y = iy;
          allowed = canSmashTogether(b, o);
          b.x = sx; b.y = sy;
        }
      }
      // Unmarked pieces: float jam is enough. Marked pieces must meet edge rules.
      if (!allowed && !(freeEdge(b) && freeEdge(o) && dir)) continue;
      if (dir && isPushingInto(dir)) return o;
      if (allowed) {
        const idir = contactPushDir(b.x, b.y, b.w, b.h, o, gap) || dir;
        if (idir && isPushingInto(idir)) return o;
      }
    }
    return null;
  }

  // While a piece is held: if it presses into a same-colour neighbour for a
  // short beat, smash immediately (don't wait for release).
  function updateDragSmash(b, dtSec) {
    if (!b || b.smashing || !isDragging) {
      smashContact = null;
      return;
    }
    const partner = findDragSmashPartner(b, dragFloatX, dragFloatY);
    if (!partner) {
      smashContact = null;
      return;
    }
    if (!smashContact || smashContact.a !== b || smashContact.b !== partner) {
      smashContact = { a: b, b: partner, tMs: 0 };
    }
    smashContact.tMs += dtSec * 1000;
    if (smashContact.tMs < CS_SMASH.HOLD_MS) return;

    const a = smashContact.a, p = smashContact.b;
    smashContact = null;
    smashConsumedDrag = true;
    dragMoved = true;
    registerMove();
    // Drop the held state so the rubble isn't still "dragged".
    isDragging = false;
    activeBlock = null;
    dragPressX = 0; dragPressY = 0;
    smashPair(a, p);
    checkWin();
  }

  function clearDebris() {
    if (!CS3D.debris) { CS3D.debris = []; return; }
    for (const d of CS3D.debris) {
      if (!d.mesh) continue;
      if (d.mesh.parent) d.mesh.parent.remove(d.mesh);
      if (d.mesh.geometry && d.mesh.geometry.dispose) d.mesh.geometry.dispose();
      if (d.mesh.material && d.mesh.material.dispose) d.mesh.material.dispose();
    }
    CS3D.debris.length = 0;
  }

  function removeBlockFromPlay(b) {
    b.smashing = true;
    const idx = blocks.indexOf(b);
    if (idx >= 0) blocks.splice(idx, 1);
    if (b._mesh) {
      const mi = CS3D.blockMeshes.indexOf(b._mesh);
      if (mi >= 0) CS3D.blockMeshes.splice(mi, 1);
      if (b._mesh.parent) b._mesh.parent.remove(b._mesh);
      if (b._decalTex && b._decalTex.dispose) b._decalTex.dispose();
      if (b._mesh.geometry && b._mesh.geometry.dispose) b._mesh.geometry.dispose();
      if (b._mesh.material && b._mesh.material.dispose) b._mesh.material.dispose();
      b._mesh = null;
    }
  }

  // Spawn chunky rubble that tumbles off the board when a piece smashes.
  function spawnSmashDebris(b) {
    if (!CS3D.ok) return;
    const T = window.THREE;
    if (!CS3D.debris) CS3D.debris = [];
    const cx = b.renderX + b.renderW / 2 - gridCols / 2;
    const cz = b.renderY + b.renderH / 2 - gridRows / 2;
    const baseY = CS3D_CFG.BLOCK_BASE_Y + CS3D_CFG.BLOCK_H * 0.55;
    const count = 10;
    for (let i = 0; i < count; i++) {
      const s = 0.28 + Math.random() * 0.42;
      const mesh = new T.Mesh(
        new T.BoxGeometry(s, s * (0.7 + Math.random() * 0.6), s),
        new T.MeshStandardMaterial({
          color: cs3dColor(b.color),
          roughness: Math.max(0.2, CS3D_CFG.BLOCK_ROUGHNESS),
          metalness: CS3D_CFG.BLOCK_METALNESS,
          flatShading: true,
        })
      );
      mesh.castShadow = true;
      mesh.position.set(
        cx + (Math.random() - 0.5) * b.renderW * 0.85,
        baseY + Math.random() * 0.35,
        cz + (Math.random() - 0.5) * b.renderH * 0.85
      );
      mesh.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
      CS3D.boardGroup.add(mesh);
      CS3D.debris.push({
        mesh,
        vx: (Math.random() - 0.5) * 5.5,
        vy: 2.2 + Math.random() * 3.4,
        vz: (Math.random() - 0.5) * 5.5,
        wx: (Math.random() - 0.5) * 12,
        wy: (Math.random() - 0.5) * 12,
        wz: (Math.random() - 0.5) * 12,
        age: 0,
      });
    }
  }

  function smashPair(a, b) {
    if (!a || !b || a.smashing || b.smashing) return;
    spawnSmashDebris(a);
    spawnSmashDebris(b);
    removeBlockFromPlay(a);
    removeBlockFromPlay(b);
    haptic("heavy");
    sfxPieceClick();
    updateHUD();
  }

  function trySmashAfterMove(moved) {
    if (!moved || moved.smashing) return;
    const partner = findSameColorNeighbor(moved);
    if (partner) smashPair(moved, partner);
  }

  function updateDebris(dtSec) {
    if (!CS3D.debris || !CS3D.debris.length) return;
    const g = 18;
    for (let i = CS3D.debris.length - 1; i >= 0; i--) {
      const d = CS3D.debris[i];
      d.age += dtSec;
      d.vy -= g * dtSec;
      d.mesh.position.x += d.vx * dtSec;
      d.mesh.position.y += d.vy * dtSec;
      d.mesh.position.z += d.vz * dtSec;
      d.mesh.rotation.x += d.wx * dtSec;
      d.mesh.rotation.y += d.wy * dtSec;
      d.mesh.rotation.z += d.wz * dtSec;
      // Fade as they fall away.
      if (d.mesh.material) {
        d.mesh.material.transparent = true;
        d.mesh.material.opacity = Math.max(0, 1 - d.age / 1.35);
      }
      if (d.mesh.position.y < -6 || d.age > 1.6) {
        if (d.mesh.parent) d.mesh.parent.remove(d.mesh);
        if (d.mesh.geometry) d.mesh.geometry.dispose();
        if (d.mesh.material) d.mesh.material.dispose();
        CS3D.debris.splice(i, 1);
      }
    }
  }

  // ---- expansion: fill N cells as the widest rectangle that fits ----
  // Candidate rectangles (w,h) with w*h === n, ordered widest-first so a block
  // always fills as much horizontal space as it can before wrapping to another
  // row — the most intuitive, predictable growth. e.g. n=12 → 12×1, 6×2, 4×3,
  // 3×4, 2×6, 1×12.
  function targetShapes(n) {
    const shapes = [];
    for (let w = 1; w <= n; w++) {
      if (n % w === 0) shapes.push([w, n / w]);
    }
    shapes.sort((a, b) => b[0] - a[0]); // widest (most horizontal) first
    return shapes;
  }

  function orderedOffsets(extra) {
    const mid = extra / 2;
    const arr = [];
    for (let i = 0; i <= extra; i++) arr.push(i);
    arr.sort((a, b) => Math.abs(a - mid) - Math.abs(b - mid));
    return arr;
  }

  // Grow the block to cover `n` cells: try each candidate rectangle shape in
  // preference order, and for each place it centre-out (leaning to fill space)
  // while still covering the current footprint. First valid placement wins.
  function placeGrown(b, n) {
    for (const [tw, th] of targetShapes(n)) {
      if (tw < b.w || th < b.h) continue;
      const extraX = tw - b.w, extraY = th - b.h;
      for (const ox of orderedOffsets(extraX)) {
        for (const oy of orderedOffsets(extraY)) {
          const nx = b.x - ox, ny = b.y - oy;
          // placement must still cover the current footprint
          if (nx > b.x || ny > b.y || nx + tw < b.x + b.w || ny + th < b.y + b.h) continue;
          if (isSpaceValid(nx, ny, tw, th, b)) {
            b.initialOffsetX = b.x - nx;
            b.initialOffsetY = b.y - ny;
            b.x = nx; b.y = ny; b.w = tw; b.h = th;
            return true;
          }
        }
      }
    }
    return false;
  }

  function shrinkBlock(b) {
