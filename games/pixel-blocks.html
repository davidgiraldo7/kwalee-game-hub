<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Pixel Blocks</title>
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
<script src="arcade.js"></script>
<script>
(function () {
  var PAL = ["#ef4444", "#3b82f6", "#eab308", "#a855f7", "#f8fafc", "#111827"];
  var LEVELS = [
    { cols: 6, rows: 7, colors: 4 },
    { cols: 7, rows: 8, colors: 5 },
    { cols: 8, rows: 9, colors: 6 },
    { cols: 8, rows: 9, colors: 6 }
  ];

  function makeBoard(L) {
    var grid = [];
    var r, c, i, n, color, q, cr, cc, k, dirs;
    for (r = 0; r < L.rows; r++) {
      grid[r] = [];
      for (c = 0; c < L.cols; c++) grid[r][c] = -1;
    }
    var cells = L.cols * L.rows;
    var painted = 0;
    while (painted < cells) {
      color = Math.floor(Math.random() * L.colors);
      n = 2 + Math.floor(Math.random() * 3);
      cr = Math.floor(Math.random() * L.rows);
      cc = Math.floor(Math.random() * L.cols);
      for (k = 0; k < n && painted < cells; k++) {
        if (grid[cr][cc] === -1) {
          grid[cr][cc] = color;
          painted += 1;
        }
        dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]].sort(function () { return Math.random() - 0.5; });
        var moved = false;
        for (i = 0; i < dirs.length; i++) {
          var nr = cr + dirs[i][0];
          var nc = cc + dirs[i][1];
          if (nr >= 0 && nc >= 0 && nr < L.rows && nc < L.cols && grid[nr][nc] === -1) {
            cr = nr; cc = nc; moved = true; break;
          }
        }
        if (!moved) break;
      }
    }
    for (r = 0; r < L.rows; r++) {
      for (c = 0; c < L.cols; c++) if (grid[r][c] < 0) grid[r][c] = Math.floor(Math.random() * L.colors);
    }
    return grid;
  }

  Arcade.boot({
    title: "Pixel Blocks",
    theme: "grass",
    hint: "Tap a group of 2+ matching cubes to clear them.",
    levelCount: LEVELS.length,
    start: function (index, api) {
      var L = LEVELS[index];
      var grid = makeBoard(L);
      var history = [];
      var canvas = Arcade.el("canvas", { className: "stage" });
      api.board.appendChild(canvas);
      var ctx = canvas.getContext("2d");

      function metrics() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = api.board.clientWidth;
        var h = api.board.clientHeight;
        canvas.width = Math.max(1, Math.round(w * dpr));
        canvas.height = Math.max(1, Math.round(h * dpr));
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var size = Math.min((w - 24) / L.cols, (h - 24) / L.rows);
        return { size: size, x: (w - size * L.cols) / 2, y: (h - size * L.rows) / 2, w: w, h: h };
      }

      function at(pt, m) {
        var c = Math.floor((pt.x - m.x) / m.size);
        var r = Math.floor((pt.y - m.y) / m.size);
        if (r < 0 || c < 0 || r >= L.rows || c >= L.cols) return null;
        return { r: r, c: c };
      }

      function group(r, c) {
        var color = grid[r][c];
        if (color < 0) return [];
        var seen = {};
        var stack = [{ r: r, c: c }];
        var out = [];
        while (stack.length) {
          var cur = stack.pop();
          var key = cur.r + "," + cur.c;
          if (seen[key]) continue;
          if (cur.r < 0 || cur.c < 0 || cur.r >= L.rows || cur.c >= L.cols) continue;
          if (grid[cur.r][cur.c] !== color) continue;
          seen[key] = true;
          out.push(cur);
          stack.push({ r: cur.r + 1, c: cur.c }, { r: cur.r - 1, c: cur.c }, { r: cur.r, c: cur.c + 1 }, { r: cur.r, c: cur.c - 1 });
        }
        return out;
      }

      function gravity() {
        var c, r, write;
        for (c = 0; c < L.cols; c++) {
          write = L.rows - 1;
          for (r = L.rows - 1; r >= 0; r--) {
            if (grid[r][c] >= 0) {
              var val = grid[r][c];
              grid[r][c] = -1;
              grid[write][c] = val;
              write -= 1;
            }
          }
        }
      }

      function leftoverMatches() {
        var r, c, seen = {};
        for (r = 0; r < L.rows; r++) {
          for (c = 0; c < L.cols; c++) {
            if (grid[r][c] < 0 || seen[r + "," + c]) continue;
            var g = group(r, c);
            g.forEach(function (cell) { seen[cell.r + "," + cell.c] = true; });
            if (g.length >= 2) return true;
          }
        }
        return false;
      }

      function empty() {
        var r, c;
        for (r = 0; r < L.rows; r++) for (c = 0; c < L.cols; c++) if (grid[r][c] >= 0) return false;
        return true;
      }

      function drawCube(x, y, s, color) {
        var t = s * 0.18;
        ctx.fillStyle = Arcade.shade(color, -50);
        ctx.beginPath();
        ctx.moveTo(x, y + s - t);
        ctx.lineTo(x + s, y + s - t);
        ctx.lineTo(x + s, y + s);
        ctx.lineTo(x, y + s);
        ctx.fill();
        ctx.fillStyle = color;
        Arcade.roundRect(ctx, x, y, s, s - t, 6);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.28)";
        Arcade.roundRect(ctx, x + 3, y + 3, s * 0.42, s * 0.28, 4);
        ctx.fill();
      }

      function draw() {
        var m = metrics();
        ctx.clearRect(0, 0, m.w, m.h);
        var grd = ctx.createLinearGradient(0, 0, 0, m.h);
        grd.addColorStop(0, "#7bc55a");
        grd.addColorStop(1, "#3f8f32");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, m.w, m.h);
        var r, c;
        for (r = 0; r < L.rows; r++) {
          for (c = 0; c < L.cols; c++) {
            if (grid[r][c] < 0) continue;
            drawCube(m.x + c * m.size + 3, m.y + r * m.size + 3, m.size - 6, PAL[grid[r][c]]);
          }
        }
      }

      Arcade.pointer(canvas, {
        down: function (pt) {
          var cell = at(pt, metrics());
          if (!cell || grid[cell.r][cell.c] < 0) return;
          var g = group(cell.r, cell.c);
          if (g.length < 2) return;
          history.push(JSON.stringify(grid));
          g.forEach(function (p) { grid[p.r][p.c] = -1; });
          gravity();
          draw();
          if (empty()) api.win(150);
          else if (!leftoverMatches()) api.fail("No matching cubes left. Restart the wall.");
        }
      });

      api.onUndo(function () {
        if (!history.length) return;
        grid = JSON.parse(history.pop());
        draw();
      });
      window.addEventListener("resize", draw);
      draw();
    }
  });
})();
</script>
</body>
</html>
