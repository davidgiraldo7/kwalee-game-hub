<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Link Flow</title>
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
<script src="arcade.js"></script>
<script>
(function () {
  var COLORS = {
    R: "#ef476f",
    G: "#06d6a0",
    B: "#118ab2",
    Y: "#ffd166",
    P: "#9b5de5",
    O: "#f77f00"
  };
  var LEVELS = [
    ["R..R", ".G..", "...G", "B..B"],
    ["R...G", ".B.Y.", ".....", ".B.Y.", "R...G"],
    ["R....R", ".G..G.", "..BB..", "Y....Y", ".P..P.", "O....O"],
    ["RG....", "......", "B.Y...", "......", "P.O...", "RGBYPO"]
  ];

  Arcade.boot({
    title: "Link Flow",
    theme: "pink",
    hint: "Connect matching colors. Paths cannot cross.",
    levelCount: LEVELS.length,
    start: function (index, api) {
      var rows = LEVELS[index];
      var H = rows.length;
      var W = rows[0].length;
      var heads = {};
      var grid = [];
      var r, c;
      for (r = 0; r < H; r++) {
        grid[r] = [];
        for (c = 0; c < W; c++) {
          var ch = rows[r].charAt(c);
          grid[r][c] = ch === "." ? null : ch;
          if (ch !== ".") {
            if (!heads[ch]) heads[ch] = [];
            heads[ch].push({ r: r, c: c });
          }
        }
      }
      var paths = {};
      Object.keys(heads).forEach(function (k) { paths[k] = [heads[k][0]]; });
      var drag = null;
      var history = [];
      var canvas = Arcade.el("canvas", { className: "stage" });
      api.board.appendChild(canvas);
      var ctx = canvas.getContext("2d");

      function clonePaths() {
        var out = {};
        Object.keys(paths).forEach(function (k) {
          out[k] = paths[k].map(function (p) { return { r: p.r, c: p.c }; });
        });
        return out;
      }

      function cellOwner(r, c) {
        var k;
        for (k in paths) {
          if (!paths[k]) continue;
          for (var i = 0; i < paths[k].length; i++) {
            if (paths[k][i].r === r && paths[k][i].c === c) return k;
          }
        }
        return grid[r][c];
      }

      function isHead(r, c, color) {
        var pair = heads[color];
        return pair.some(function (p) { return p.r === r && p.c === c; });
      }

      function metrics() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = api.board.clientWidth;
        var h = api.board.clientHeight;
        canvas.width = Math.max(1, Math.round(w * dpr));
        canvas.height = Math.max(1, Math.round(h * dpr));
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var size = Math.min((w - 20) / W, (h - 20) / H);
        return { size: size, x: (w - size * W) / 2, y: (h - size * H) / 2, w: w, h: h };
      }

      function at(pt, m) {
        var c = Math.floor((pt.x - m.x) / m.size);
        var r = Math.floor((pt.y - m.y) / m.size);
        if (r < 0 || c < 0 || r >= H || c >= W) return null;
        return { r: r, c: c };
      }

      function adj(a, b) {
        return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
      }

      function complete(color) {
        var p = paths[color];
        if (!p.length) return false;
        var last = p[p.length - 1];
        var start = p[0];
        var other = heads[color][0].r === start.r && heads[color][0].c === start.c ? heads[color][1] : heads[color][0];
        return last.r === other.r && last.c === other.c;
      }

      function won() {
        return Object.keys(heads).every(complete) && Object.keys(heads).every(function (k) {
          return paths[k].length >= 2;
        });
      }

      function draw() {
        var m = metrics();
        ctx.clearRect(0, 0, m.w, m.h);
        Arcade.roundRect(ctx, m.x - 8, m.y - 8, W * m.size + 16, H * m.size + 16, 22);
        ctx.fillStyle = "#fff";
        ctx.fill();
        var r, c;
        for (r = 0; r < H; r++) {
          for (c = 0; c < W; c++) {
            Arcade.roundRect(ctx, m.x + c * m.size + 5, m.y + r * m.size + 5, m.size - 10, m.size - 10, 12);
            ctx.fillStyle = "#f4e8ef";
            ctx.fill();
          }
        }
        Object.keys(paths).forEach(function (k) {
          var p = paths[k];
          if (p.length < 2) return;
          ctx.strokeStyle = COLORS[k];
          ctx.lineWidth = m.size * 0.38;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          p.forEach(function (cell, i) {
            var x = m.x + (cell.c + 0.5) * m.size;
            var y = m.y + (cell.r + 0.5) * m.size;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        });
        Object.keys(heads).forEach(function (k) {
          heads[k].forEach(function (cell) {
            var x = m.x + (cell.c + 0.5) * m.size;
            var y = m.y + (cell.r + 0.5) * m.size;
            ctx.beginPath();
            ctx.arc(x, y, m.size * 0.28, 0, Math.PI * 2);
            ctx.fillStyle = COLORS[k];
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#fff";
            ctx.stroke();
          });
        });
      }

      function startPath(color, cell) {
        history.push(clonePaths());
        paths[color] = [{ r: cell.r, c: cell.c }];
        drag = { color: color };
      }

      Arcade.pointer(canvas, {
        down: function (pt) {
          var cell = at(pt, metrics());
          if (!cell) return;
          var color = grid[cell.r][cell.c];
          if (color) {
            startPath(color, cell);
            draw();
            return;
          }
          var owner = cellOwner(cell.r, cell.c);
          if (!owner || !paths[owner]) return;
          var p = paths[owner];
          var last = p[p.length - 1];
          if (last.r === cell.r && last.c === cell.c) drag = { color: owner };
        },
        move: function (pt) {
          if (!drag) return;
          var cell = at(pt, metrics());
          if (!cell) return;
          var p = paths[drag.color];
          var last = p[p.length - 1];
          if (last.r === cell.r && last.c === cell.c) return;
          if (p.length >= 2 && p[p.length - 2].r === cell.r && p[p.length - 2].c === cell.c) {
            p.pop();
            draw();
            return;
          }
          if (!adj(last, cell)) return;
          if (complete(drag.color)) return;
          var g = grid[cell.r][cell.c];
          if (g && g !== drag.color) return;
          if (g === drag.color && isHead(cell.r, cell.c, drag.color)) {
            var start = p[0];
            if (cell.r === start.r && cell.c === start.c) return;
            p.push({ r: cell.r, c: cell.c });
            draw();
            if (won()) api.win(140);
            return;
          }
          if (cellOwner(cell.r, cell.c)) return;
          p.push({ r: cell.r, c: cell.c });
          draw();
        },
        up: function () { drag = null; }
      });

      api.onUndo(function () {
        if (!history.length) return;
        paths = history.pop();
        drag = null;
        draw();
      });
      window.addEventListener("resize", draw);
      draw();
    }
  });
})();
</script>
</body>
</html>
